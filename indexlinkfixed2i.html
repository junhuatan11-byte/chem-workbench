/* ---------------- 出门测成绩 自动同步到学生档案 ---------------- */
/* 由 scoreSheets（登分表）聚合每位学生的出门测成绩历史，按姓名 upsert 进 students[].exitScores；
   姓名在档案中不存在时自动建档。删除登分表后，对应记录自动消失（整表重算）。 */
function syncExitScoresToStudents() {
  if (!Store.state) return;
  var byName = {};
  Store.state.students.forEach(function (s) { if (!s.exitScores) s.exitScores = []; byName[s.name] = s; });
  var desired = {}; /* sheetId|name -> 成绩记录 */
  Store.state.scoreSheets.forEach(function (ss) {
    var full = (ss.questions || []).reduce(function (a, q) { return a + num(q.score); }, 0);
    (ss.students || []).forEach(function (st) {
      var name = (st.name || '').trim(); if (!name) return;
      var scores = (st.scores || []).map(function (x) { return num(x); });
      var tot = scores.reduce(function (a, b) { return a + num(b); }, 0);
      var d = ss.date || (ss.updatedAt ? toDateStr(new Date(ss.updatedAt)) : '');
      desired[ss.id + '|' + name] = {
        sheetId: ss.id, sheetTitle: ss.title || '', lecture: ss.lecture || '',
        name: name, date: d, total: tot, full: full, rate: full ? tot / full : 0, scores: scores
      };
    });
  });
  /* 先为缺失姓名自动建档，避免重复创建 */
  Object.keys(desired).forEach(function (k) {
    var d = desired[k];
    if (!byName[d.name]) {
      var ns = { id: uid(), name: d.name, createdAt: Date.now(), updatedAt: Date.now(), exitScores: [] };
      Store.state.students.push(ns); byName[d.name] = ns;
    }
  });
  /* 按姓名重建每位学生的 exitScores（删除的登分表自然不再出现） */
  Store.state.students.forEach(function (s) {
    var entries = [];
    Object.keys(desired).forEach(function (k) {
      if (desired[k].name === s.name) entries.push(clone(desired[k]));
    });
    entries.sort(function (a, b) { return (a.date || '').localeCompare(b.date || '') || (a.lecture || '').localeCompare(b.lecture || ''); });
    s.exitScores = entries;
  });
  Store.save('students');
}

/* 出门测得分率走势折线图（内联 SVG，可直接渲染在 DOM 中） */
function svgExitCurve(entries, opts) {
  opts = opts || {};
  var W = opts.w || 320, H = opts.h || 150, mini = !!opts.mini;
  var padL = mini ? 0 : 32, padR = mini ? 0 : 10, padT = mini ? 4 : 16, padB = mini ? 4 : 26;
  var iw = W - padL - padR, ih = H - padT - padB;
  var arr = (entries || []).slice().sort(function (a, b) { return (a.date || '').localeCompare(b.date || '') || (a.lecture || '').localeCompare(b.lecture || ''); });
  if (!arr.length) return mini ? '' : '<div class="text-xs text-m">暂无出门测成绩</div>';
  var n = arr.length;
  function X(i) { return padL + (n === 1 ? iw / 2 : iw * i / (n - 1)); }
  function Y(v) { return padT + ih * (1 - v / 100); }
  var pts = arr.map(function (e, i) { return [X(i), Y(num(e.rate) * 100)]; });
  var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  var dots = pts.map(function (p) { return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (mini ? 2 : 3.4) + '" fill="var(--brand)"/>'; }).join('');
  var labels = mini ? '' : arr.map(function (e, i) {
    var lab = (e.lecture || mdOf(e.date) || ('#' + (i + 1))).slice(0, 6);
    return '<text x="' + X(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + (i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle') + '" font-size="10" fill="var(--muted)">' + esc(lab) + '</text>';
  }).join('');
  var grid = mini ? '' : [0, 50, 100].map(function (g) {
    var y = Y(g);
    return '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) + '" stroke="var(--line-soft)" stroke-width="1"/>' +
      '<text x="' + (padL - 4) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end" font-size="10" fill="var(--muted)">' + g + '%</text>';
  }).join('');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" style="' + (mini ? 'width:120px;height:34px;display:block' : 'width:100%') + '">' + grid +
    '<path d="' + d + '" fill="none" stroke="var(--brand)" stroke-width="' + (mini ? 1.6 : 2.4) + '" stroke-linejoin="round" stroke-linecap="round"/>' + dots + labels + '</svg>';
}

/* 学生档案内「出门测成绩走势」弹窗 */
var etTrendTab = 'total';  /* 'total' | 'kp' */
function renderExitTrend(studentId) {
  var s = byId(Store.state.students, studentId);
  if (!s) return;
  var exits = sortBy(s.exitScores || [], 'date', false);
  var h = '';
  h += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">' +
    '<div style="width:38px;height:38px;border-radius:11px;background:var(--brand-soft);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;font-weight:700">' + esc((s.name || '?').slice(0, 1)) + '</div>' +
    '<div style="flex:1"><div style="font-weight:700;font-size:16px">' + esc(s.name) + ' · 出门测成绩走势</div>' +
    '<div class="text-s text-m">' + esc([s.grade, s.school].filter(Boolean).join(' · ')) + '</div></div>' +
    '<div class="tabs" style="margin:0">' +
    '<button class="tab' + (etTrendTab === 'total' ? ' on' : '') + '" data-act="et-tab" data-tab="total">总分走势</button>' +
    '<button class="tab' + (etTrendTab === 'kp' ? ' on' : '') + '" data-act="et-tab" data-tab="kp">知识点拆分</button>' +
    '</div></div>';

  if (!exits.length) {
    h += '<div class="card mt12"><div class="card-b">' + emptyBox('该学生还没有出门测（登分表）记录', 'i-quiz') + '</div></div>';
  } else if (etTrendTab === 'total') {
    var avg = exits.reduce(function (a, b) { return a + num(b.rate); }, 0) / exits.length;
    var last = exits[exits.length - 1];
    h += '<div class="card mt12"><div class="card-b">' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">' +
      '<span class="chip b">共 ' + exits.length + ' 次出门测</span>' +
      '<span class="chip">平均得分率 ' + (avg * 100).toFixed(0) + '%</span>' +
      '<span class="chip">最近 ' + (num(last.rate) * 100).toFixed(0) + '%</span></div>' +
      svgExitCurve(exits, { w: 560, h: 200 }) + '</div></div>';
    h += '<div class="card mt12"><div class="card-b"><div class="sub" style="margin-bottom:6px">每次出门测明细</div><table class="tbl"><thead><tr><th>讲次 / 日期</th><th>标题</th><th>总分</th><th>得分率</th></tr></thead><tbody>' +
      exits.map(function (e) {
        return '<tr><td>' + esc(e.lecture || '-') + (e.date ? '<div class="text-xs text-m">' + esc(e.date) + '</div>' : '') + '</td>' +
          '<td>' + esc(e.sheetTitle || '') + '</td>' +
          '<td class="num">' + num(e.total) + ' / ' + num(e.full) + '</td>' +
          '<td class="num">' + (num(e.rate) * 100).toFixed(0) + '%</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  } else {
    /* 知识点拆分 */
    /* 从原始 scoreSheets 重算：每个 KP 在所有讲次的得分率走势 */
    var kpSeries = {};  /* kp -> [{lecture,date,score,full,rate,count}] */
    var sheets = sortBy(Store.state.scoreSheets, 'date', false);
    sheets.forEach(function (sh) {
      var stu = (sh.students || []).filter(function (x) { return x.name === s.name; })[0];
      if (!stu) return;
      (sh.questions || []).forEach(function (q, qi) {
        var kp = (q.kp || '').trim();
        if (!kp) return;
        if (!kpSeries[kp]) kpSeries[kp] = [];
        kpSeries[kp].push({
          sheetId: sh.id, lecture: sh.lecture || '', date: sh.date || '',
          title: sh.title || '', score: num(stu.scores[qi]),
          full: num(q.score), rate: num(q.score) > 0 ? num(stu.scores[qi]) / num(q.score) : 0
        });
      });
    });
    var kps = Object.keys(kpSeries);
    if (!kps.length) {
      h += '<div class="card mt12"><div class="card-b">' + emptyBox('该学生还没有可拆分的知识点记录', 'i-quiz') + '</div></div>';
    } else {
      /* 汇总：每个 KP 总得分/满分/得分率 + 出现次数 */
      var kpAgg = kps.map(function (kp) {
        var items = kpSeries[kp];
        var sc = items.reduce(function (a, b) { return a + b.score; }, 0);
        var fu = items.reduce(function (a, b) { return a + b.full; }, 0);
        return { kp: kp, score: sc, full: fu, rate: fu > 0 ? sc / fu : 0, count: items.length, last: items[items.length - 1] };
      }).sort(function (a, b) { return a.rate - b.rate; });  /* 弱→强 */

      /* 薄弱 Top 5（得分率最低） */
      var weak5 = kpAgg.slice(0, 5);
      h += '<div class="card mt12"><div class="card-b"><div class="sub" style="margin-bottom:6px">薄弱知识点 Top ' + Math.min(5, weak5.length) + '</div>' +
        '<div style="display:flex;flex-direction:column;gap:6px">' +
        weak5.map(function (k) {
          var pct = (k.rate * 100).toFixed(0);
          var color = k.rate < 0.6 ? '#D2544F' : (k.rate < 0.8 ? '#E58A3A' : '#3E8E5A');
          return '<div>' +
            '<div style="display:flex;justify-content:space-between;font-size:13px"><span><b>' + esc(k.kp) + '</b> <span class="text-s text-m">共 ' + k.count + ' 题 · 累计得分 ' + k.score + '/' + k.full + '</span></span>' +
            '<span style="color:' + color + ';font-weight:600">' + pct + '%</span></div>' +
            '<div style="height:8px;border-radius:4px;background:var(--line-soft);overflow:hidden;margin-top:3px">' +
            '<div style="width:' + pct + '%;height:100%;background:' + color + '"></div></div>' +
            '</div>';
        }).join('') +
        '</div></div></div>';

      /* 单个 KP 走势选择器 */
      var defaultKp = weak5[0].kp;
      h += '<div class="card mt12"><div class="card-b">' +
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">' +
        '<span class="text-s text-m">单知识点走势</span>' +
        '<select class="select" id="etKpSel" style="min-width:160px" data-act="et-kp-sel">' +
        kps.map(function (k) { return '<option value="' + esc(k) + '"' + (k === defaultKp ? ' selected' : '') + '>' + esc(k) + ' (' + kpAgg.filter(function (a) { return a.kp === k; })[0].count + ' 题)</option>'; }).join('') +
        '</select></div>';
      var arr = kpSeries[defaultKp] || [];
      h += svgExitCurve(arr.map(function (e) { return { lecture: e.lecture, date: e.date, rate: e.rate }; }), { w: 560, h: 180 });
      h += '<table class="tbl mt12"><thead><tr><th>讲次</th><th>日期</th><th>标题</th><th>得分</th><th>得分率</th></tr></thead><tbody>' +
        arr.map(function (e) {
          return '<tr><td>' + esc(e.lecture || '-') + '</td><td class="text-s">' + esc(e.date || '-') + '</td><td>' + esc(e.title || '') + '</td>' +
            '<td class="num">' + e.score + '/' + e.full + '</td><td class="num">' + (e.rate * 100).toFixed(0) + '%</td></tr>';
        }).join('') +
        '</tbody></table></div></div>';

      /* 全知识点汇总表 */
      h += '<div class="card mt12"><div class="card-b"><div class="sub" style="margin-bottom:6px">全部知识点汇总</div><table class="tbl"><thead><tr><th>知识点</th><th>题数</th><th>得分 / 满分</th><th>综合得分率</th></tr></thead><tbody>' +
        kpAgg.map(function (k) {
          var pct = (k.rate * 100).toFixed(0);
          var color = k.rate < 0.6 ? '#D2544F' : (k.rate < 0.8 ? '#E58A3A' : '#3E8E5A');
          return '<tr><td>' + esc(k.kp) + '</td><td class="num">' + k.count + '</td><td class="num">' + k.score + ' / ' + k.full + '</td>' +
            '<td class="num" style="color:' + color + ';font-weight:600">' + pct + '%</td></tr>';
        }).join('') +
        '</tbody></table></div></div>';
    }
  }
  var box = $('#etCurveBody'); if (box) { box.innerHTML = h; box.setAttribute('data-sid', studentId); }
  UI.openMask('#maskExitTrend');
}

    h += '<div class="card"><div class="card-b">' +

      '<span class="chip">最近 ' + esc(last.examName || '考试') + '</span>' +
      '</div>';
    /* 趋势折线（按时间正序，展示得分率走势） */
    var ser = withFull.slice().reverse().map(function (e) {
      return { lecture: e.examName || '考试', date: e.date, rate: num(e.full) > 0 ? num(e.score) / num(e.full) : 0 };
    });
    if (ser.length >= 2) h += svgExitCurve(ser, { w: 560, h: 170 });
    else if (ser.length === 1) h += '<div class="text-s text-m">再录入一次考试即可生成得分率走势。</div>';
    h += '</div></div>';

    /* 明细表 */
    h += '<div class="card mt12"><div class="card-b"><div class="sub" style="margin-bottom:6px">成绩明细</div>' +
      '<div style="overflow:auto"><table class="tbl"><thead><tr><th>考试名称</th><th>日期</th><th>科目</th><th>得分 / 满分</th><th>得分率</th><th>排名</th></tr></thead><tbody>' +
      list.map(function (e) {
        var f = num(e.full), sc = num(e.score), r = f > 0 ? sc / f : 0;
        var color = f === 0 ? 'inherit' : (r < 0.6 ? '#D2544F' : (r < 0.8 ? '#E58A3A' : '#3E8E5A'));
        return '<tr><td>' + esc(e.examName || '-') + '</td><td class="text-s">' + esc(e.date || '-') + '</td>' +
          '<td>' + esc(e.subject || '-') + '</td>' +
          '<td class="num">' + esc(e.score) + (e.full ? ' / ' + esc(e.full) : '') + '</td>' +
          '<td class="num" style="color:' + color + ';font-weight:600">' + (f > 0 ? (r * 100).toFixed(0) + '%' : '-') + '</td>' +
          '<td class="num">' + (e.rank ? esc(e.rank) + (e.total ? ' / ' + esc(e.total) : '') : '-') + '</td></tr>';
      }).join('') +
      '</tbody></table></div></div></div>';
  }

  h += '<div class="card mt12"><div class="card-b"><div class="sub" style="margin-bottom:6px">新增一条成绩</div>' +
    '<div class="grid g3" style="align-items:end">' +
    '<div class="field"><label>考试名称</label><input class="input" id="semName" placeholder="如 9月月考"></div>' +
    '<div class="field"><label>日期</label><input class="input" type="date" id="semDate" value="' + todayStr() + '"></div>' +
    '<div class="field"><label>科目</label><input class="input" id="semSubject" value="化学"></div>' +
    '<div class="field"><label>得分</label><input class="input" type="number" id="semScore" placeholder="86"></div>' +
    '<div class="field"><label>满分</label><input class="input" type="number" id="semFull" value="100"></div>' +
    '<div class="field"><label>排名</label><input class="input" type="number" id="semRank" placeholder="选填"></div>' +
    '</div>' +
    '<div class="mt8" style="display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="btn btn-primary" data-act="sem-save" data-id="' + s.id + '"><svg><use href="#i-check"/></svg>保存成绩</button>' +
    '<button class="btn" data-act="sem-cancel">关闭</button>' +

  var box = $('#semBody'); if (box) { box.innerHTML = h; box.setAttribute('data-sid', studentId); }

}

  return '<div class="card" style="margin:0" data-f="' + esc(search) + '" data-grade="' + esc(s.grade || '') + '">' +
    '<div class="card-b">' +

    '<div style="width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;font-weight:650;flex:0 0 40px">' +
    esc((s.name || '?').slice(0, 1)) + '</div>' +
    '<div style="flex:1;min-width:0"><div style="font-weight:650;font-size:16px">' + esc(s.name || '未命名') + '</div>' +
    '<div class="text-s text-m">' + esc([s.school, s.grade, s.klass].filter(Boolean).join(' · ') || '未填写学校班级') + '</div></div>' +
    rowActs('students', s.id) + '</div>' +
    ((s.tags && s.tags.length) ? '<div class="mt8" style="display:flex;gap:4px;flex-wrap:wrap">' + s.tags.map(function (t) { return '<span class="chip b">' + esc(t) + '</span>'; }).join('') + '</div>' : '') +
    (s.parent || s.phone ? '<div class="text-xs text-m mt8">' + (s.phone ? '学生 ' + esc(s.phone) : '') + (s.phone && s.parent ? ' · ' : '') + (s.parent ? '家长 ' + esc(s.parent) : '') + '</div>' : '') +
    (s.note ? '<div class="text-s text-m mt8" style="white-space:pre-wrap">' + esc(s.note) + '</div>' : '') +
    '<div class="mt8" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line-soft);padding-top:9px">' +
    (last ? '<span class="chip">最近 ' + esc(last.examName || '考试') + ' ' + esc(last.score) + (last.full ? '/' + esc(last.full) : '') + (last.rank ? ' · 第' + esc(last.rank) + '名' : '') + '</span>'
      : '<span class="text-xs text-m">暂无成绩记录</span>') +
    '<span class="text-xs text-m">成绩 ' + exams.length + ' 条</span>' +
    '<span style="flex:1"></span>' +
    '<button class="btn btn-sm" data-act="stu-exams" data-id="' + s.id + '">考试成绩</button>' +
    '<button class="btn btn-sm" data-act="stu-followups" data-id="' + s.id + '">家长回访</button>' +
    '<button class="btn btn-sm" data-act="et-student" data-id="' + s.id + '">出门测</button>' +
    '</div>' +
    (function () {
      var exits = s.exitScores || [];
      if (!exits.length) return '';
      var exLast = sortBy(exits, 'date', true)[0];
      var avg = exits.reduce(function (a, b) { return a + num(b.rate); }, 0) / exits.length;
      return '<div class="mt8" style="border-top:1px solid var(--line-soft);padding-top:9px">' +
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
        '<span class="chip b">出门测 ' + exits.length + ' 次</span>' +
        '<span class="chip">最近得分率 ' + (num(exLast.rate) * 100).toFixed(0) + '%</span>' +
        '<span class="chip">平均 ' + (avg * 100).toFixed(0) + '%</span>' +
        svgExitCurve(exits, { mini: true }) +
        '<span style="flex:1"></span>' +
        '<button class="btn btn-sm" data-act="stu-exitcurve-kp" data-id="' + s.id + '">知识点拆分</button>' +
        '<button class="btn btn-sm" data-act="stu-exitcurve" data-id="' + s.id + '">出门测曲线</button>' +
        '</div></div>';
    })() +
    followupBlocks(s) +
    '</div></div>';

/* 学生档案内的「个性化反馈安排 / 电访安排」两块：频次 + 内容 + 下次时间 */
function followupBlocks(s) {
  var fus = Store.state.followups.filter(function (x) { return x.studentId === s.id; });
  var lastFb = sortBy(fus.filter(function (x) { return x.type === '个性化反馈'; }), 'date', true)[0];
  var fbContent = lastFb && lastFb.content ? lastFb.content : '';
  var lastCall = sortBy(fus.filter(function (x) { return x.type === '电访' && x.done; }), 'date', true)[0];
  var fbNext = fuNext(s, '个性化反馈');
  var callNext = fuNext(s, '电访');

  function st(date) {
    if (!date) return '<span style="color:var(--muted);font-size:12.5px">未安排（点「家长回访」生成计划）</span>';
    var d = diffDays(date, todayStr()); /* = 今天 − 目标日 */
    if (d > 0) return '<span class="chip r">逾期 ' + d + ' 天</span>';
    if (d === 0) return '<span class="chip r">今天</span>';
    var remain = -d; /* 目标日在未来，剩余天数 */
    if (remain <= 3) return '<span class="chip r">还剩 ' + remain + ' 天</span>';
    return '<span style="font-size:13px">' + mdOf(date) + '</span>';
  }
  function kv(k, v) {
    return '<div style="display:flex;gap:8px;font-size:13px;margin-top:5px"><span style="color:var(--muted);flex:0 0 30px">' + k + '</span><span style="flex:1;min-width:0;word-break:break-word">' + v + '</span></div>';
  }

  var h = '<div style="border-top:1px solid var(--line-soft);padding-top:9px;margin-top:8px">';
  h += '<div style="background:var(--brand-soft);border-radius:10px;padding:9px 11px">' +
    '<div style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--brand-dark)">' +
    '<svg style="width:15px;height:15px"><use href="#i-edit"/></svg>个性化反馈安排' +
    '<span class="chip b" style="margin-left:auto">每两周 1 次</span></div>' +
    kv('内容', fbContent ? esc(fbContent) : '<span style="color:var(--muted);font-size:12.5px">暂无反馈内容</span>') +
    kv('下次', st(fbNext)) + '</div>';
  h += '<div style="background:var(--amber-soft);border-radius:10px;padding:9px 11px;margin-top:8px">' +
    '<div style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--amber)">' +
    '<svg style="width:15px;height:15px"><use href="#i-link"/></svg>电访安排' +
    '<span class="chip a" style="margin-left:auto">每月 1 次</span></div>' +
    kv('上次', lastCall ? esc(mdOf(lastCall.date) + (lastCall.content ? ' · ' + lastCall.content : '')) : '<span style="color:var(--muted);font-size:12.5px">暂无电访</span>') +
    kv('下次', st(callNext)) + '</div>';
  h += '</div>';
  return h;
}

/* 计算某学生某类回访的「下次时间」：优先取未完成的计划项；否则按上次完成日 + 频次推算 */
function fuNext(s, type) {
  var arr = Store.state.followups.filter(function (x) { return x.studentId === s.id && x.type === type; });
  var undone = sortBy(arr.filter(function (x) { return !x.done; }), 'date', false)[0];
  if (undone) return undone.date;
  var last = sortBy(arr.filter(function (x) { return x.done; }), 'date', true)[0];
  return last ? addDays(last.date, FOLLOWUP_CADENCE[type]) : null;
}

function examTrendPane() {

    '<div class="filters"><select class="select" id="trendWho" data-act="trend-who" style="min-width:180px;flex:1">' +
    '<option value="">选择学生…</option>' +

    '</select><select class="select" id="trendSubject" data-act="trend-subject"><option value="">全部科目</option>' +
    SUBJECTS.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join('') + '</select></div>' +

function bindTrend() {
  var sel = $('#trendWho');
  if (sel && App.trendWho) sel.value = App.trendWho;
  var sub = $('#trendSubject');
  if (sub && App.trendSubject) sub.value = App.trendSubject;
  renderTrend();
}

function renderTrend() {
  var box = $('#trendBox');
  if (!box) return;
  var who = App.trendWho || '';
  if (!who) { box.innerHTML = emptyBox('请选择一名学生查看趋势', 'i-chart'); return; }
  var subject = App.trendSubject || '';
  var list = Store.state.exams.filter(function (e) {
    var okWho = who.indexOf('name:') === 0 ? (e.studentName === who.slice(5)) : (e.studentId === who || e.studentName === (byId(Store.state.students, who) || {}).name);
    var okSub = !subject || e.subject === subject;
    return okWho && okSub;
  });
  list = sortBy(list, 'date', false);
  if (!list.length) { box.innerHTML = emptyBox('这名学生还没有成绩记录', 'i-chart'); return; }
  var pts = list.map(function (e) { return { label: mdOf(e.date).replace('月', '/').replace('日', ''), value: num(e.score) }; });
  var ranks = list.filter(function (e) { return num(e.rank) > 0; })
    .map(function (e) { return { label: mdOf(e.date).replace('月', '/').replace('日', ''), value: num(e.rank) }; });
  var first = list[0], last = list[list.length - 1];
  var delta = num(last.score) - num(first.score);
  var h = '<div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))">' +
    statCard('首次', first.score, mdOf(first.date)) +
    statCard('最近', last.score, mdOf(last.date), delta > 0 ? 'up' : (delta < 0 ? 'down' : '')) +
    statCard('变化', (delta > 0 ? '+' : '') + delta.toFixed(0), (delta > 0 ? '进步' : delta < 0 ? '退步' : '持平'), delta > 0 ? 'up' : (delta < 0 ? 'down' : '')) +
    '</div>';
  h += '<div class="mt16"><div class="text-s text-m mb8">分数趋势</div>' + svgLine(pts) + '</div>';
  if (ranks.length > 1) h += '<div class="mt16"><div class="text-s text-m mb8">排名趋势（数值越小越靠前）</div>' + svgLine(ranks, { invert: true }) + '</div>';
  h += '<div class="mt16"><div class="text-s text-m mb8">成绩明细</div><div class="list">' +
    list.slice().reverse().map(function (e) {
      return '<div class="row"><div class="main-c"><div class="t">' + esc(e.examName || '考试') + ' · ' + esc(e.subject || '') + '</div>' +
        '<div class="s">' + mdOf(e.date) + (e.rank ? ' · 第 ' + esc(e.rank) + ' 名' : '') + '</div></div>' +
        '<div style="font-weight:650">' + esc(e.score) + (e.full ? '<span class="text-s text-m">/' + esc(e.full) + '</span>' : '') + '</div>' +
        rowActs('exams', e.id) + '</div>';
    }).join('') + '</div></div>';
  box.innerHTML = h;
}

function examRisePane() {
  var exams = Store.state.exams.filter(function (e) { return num(e.rank) > 0 && e.studentName; });
  if (exams.length < 2) return '<div class="card"><div class="card-b">' + emptyBox('至少要有两次带排名的考试才能生成进步榜', 'i-chart') + '</div></div>';
  var byExam = {};
  exams.forEach(function (e) { (byExam[e.examName || e.date] = byExam[e.examName || e.date] || []).push(e); });
  var keys = Object.keys(byExam).sort(function (a, b) {
    var da = byExam[a][0].date || '', db = byExam[b][0].date || '';
    return da < db ? -1 : da > db ? 1 : 0;
  });
  if (keys.length < 2) return '<div class="card"><div class="card-b">' + emptyBox('需要至少两场不同的考试', 'i-chart') + '</div></div>';
  var prevK = keys[keys.length - 2], curK = keys[keys.length - 1];
  var prevMap = {}, curMap = {};
  byExam[prevK].forEach(function (e) { prevMap[(e.studentName || '') + '|' + (e.subject || '')] = e; });
  byExam[curK].forEach(function (e) { curMap[(e.studentName || '') + '|' + (e.subject || '')] = e; });
  var rows = [];
  Object.keys(curMap).forEach(function (k) {
    var c = curMap[k], p = prevMap[k];
    if (!p) return;
    var dRank = num(p.rank) - num(c.rank);
    var dScore = num(c.score) - num(p.score);
    rows.push({ name: c.studentName, subject: c.subject || '', dRank: dRank, dScore: dScore, from: p.rank, to: c.rank });
  });
  rows.sort(function (a, b) { return b.dRank - a.dRank; });
  var risers = rows.filter(function (r) { return r.dRank > 0; });
  var h = '<div class="card"><div class="card-h"><h3>排名进步榜</h3><span class="sp"></span>' +
    '<span class="text-xs text-m">' + esc(prevK) + ' → ' + esc(curK) + '</span></div><div class="card-b">';
  if (!risers.length) h += emptyBox('这次没有同学排名上升', 'i-chart');
  else {
    h += '<div class="list">' + risers.slice(0, 20).map(function (r, i) {
      var medal = i === 0 ? '<span class="chip a">最佳进步</span>' : '<span class="chip">第' + (i + 1) + '</span>';
      return '<div class="row"><div style="width:26px;text-align:center;font-weight:650;color:var(--brand)">' + (i + 1) + '</div>' +
        '<div class="main-c"><div class="t">' + esc(r.name) + ' <span class="text-s text-m">' + esc(r.subject) + '</span></div>' +
        '<div class="s">排名 ' + esc(r.from) + ' → ' + esc(r.to) + '</div></div>' + medal +
        '<div class="right" style="min-width:96px"><div class="up" style="font-weight:650">↑ ' + r.dRank + ' 名</div>' +
        '<div class="text-xs ' + (r.dScore >= 0 ? 'up' : 'down') + '">' + (r.dScore >= 0 ? '+' : '') + r.dScore.toFixed(0) + ' 分</div></div></div>';
    }).join('') + '</div>';
    h += '<div class="mt16">' + svgBars(risers.slice(0, 10).map(function (r) {
      return { label: r.name.slice(0, 3), value: r.dRank };
    })) + '</div>';
  }
  var falls = rows.filter(function (r) { return r.dRank < 0; }).sort(function (a, b) { return a.dRank - b.dRank; });
  if (falls.length) {
    h += '<div class="mt16"><div class="text-s text-m mb8">需要关注（排名下滑）</div><div class="list">' +
      falls.slice(0, 10).map(function (r) {
        return '<div class="row"><div class="main-c"><div class="t">' + esc(r.name) + ' <span class="text-s text-m">' + esc(r.subject) + '</span></div>' +
          '<div class="s">排名 ' + esc(r.from) + ' → ' + esc(r.to) + '</div></div>' +
          '<div class="down" style="font-weight:650">↓ ' + Math.abs(r.dRank) + ' 名</div></div>';
      }).join('') + '</div></div>';
  }
  h += '</div></div>';
  return h;
}

/* =========================================================
 * 知识点标签规则维护（设置与数据 → 知识点标签规则）
 * 规则存 profile.kpRules，随 JSON 备份与云同步一起走；点「恢复内置」就删掉自建规则。
 * 编辑时直接改 KpRules.draft：输入框改动只回写数据、不重渲染（否则每敲一个字就丢焦点），
 * 只有增删分类 / 考点、上下移这类结构变化才整块重画。
 * =======================================================*/
var KpRules = {
  draft: null,
  custom: false,
  out: '',
  tryText: '',
  show: {},

  open: function () {
    var raw = (Store.state.profile && Store.state.profile.kpRules) || null;
    KpRules.custom = !!(raw && raw.cats && raw.cats.length);
    KpRules.draft = wqKpNormalize(KpRules.custom ? raw : WQ_KP_DEFAULT);
    KpRules.out = '';
    /* 35 个分类全展开太长（约 16 万字符 DOM），默认只展开第一个 */
    KpRules.show = {};
    KpRules.show[0] = true;
    KpRules.render();
    UI.openMask('#maskKp');
  },

  isOpen: function (ci) { return !!KpRules.show[ci]; },
  toggle: function (ci) { KpRules.show[ci] = !KpRules.show[ci]; KpRules.render(); },
  expandAll: function (on) {
    KpRules.show = {};
    if (on) (KpRules.draft.cats || []).forEach(function (_, i) { KpRules.show[i] = true; });
    KpRules.render();
  },

  numField: function (label, f, v, step) {
    return '<div><label class="text-s text-m">' + esc(label) + '</label>' +
      '<input class="input kp-num" data-f="' + f + '" type="number" step="' + step + '" min="0" value="' + esc(v) + '" style="width:104px"></div>';
  },

  render: function () {
    var t = KpRules.draft;
    if (!t) return;
    var nPt = 0, nWord = 0;
    t.cats.forEach(function (c) {
      c.pts.forEach(function (p) { nPt++; nWord += p.strong.length + p.weak.length; });
    });
    var h = '';
    h += '<div class="note" style="background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-dark)">' +
      '导入题目、批量补全知识点时，按这份规则给每道题打「分类·考点」标签。<br>' +
      '<b>强特征词</b>＝学科专有名词（原电池 / 同分异构），命中一次就很可信（权重 3）；' +
      '<b>弱特征词</b>＝「溶液 / 用途 / 装置」这类泛词，要多条一起出现才够分（权重 1）。' +
      '证据凑不够就宁可不标 —— 这是不被误标的关键。多个词用顿号、逗号或换行分隔。</div>';

    h += '<div class="mt12" style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">' +
      KpRules.numField('主知识点门槛', 'minMid', t.minMid, '0.2') +
      KpRules.numField('「高」置信门槛', 'minHigh', t.minHigh, '0.2') +
      KpRules.numField('标注门槛（低于不标）', 'minLow', t.minLow, '0.2') +
      KpRules.numField('次知识点比例', 'gapRatio', t.gapRatio, '0.05') +
      '<label class="checkrow"><input type="checkbox" data-act="kp-chapter"' + (t.useChapter ? ' checked' : '') +
      '><span>章节标题参与打分</span></label></div>';

    h += '<div class="mt12"><label class="text-s text-m">停用词（写在任何分类里都不参与匹配；一行一个。专治「学习 / 因果」这类没有辨识度的词）</label>' +
      '<textarea class="textarea kp-stop" style="min-height:52px" placeholder="学习&#10;因果">' + esc(t.stop.join('\n')) + '</textarea></div>';

    h += '<div class="mt12"><label class="text-s text-m">通用词（本身是学科术语，但各类题都会出现；某个考点若<b>只</b>靠这些词命中就丢弃，不标。一行一个）</label>' +
      '<textarea class="textarea kp-generic" style="min-height:52px" placeholder="物质的量&#10;实验操作">' + esc(t.generic.join('\n')) + '</textarea></div>';

    h += '<div class="mt16" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
      '<b style="font-size:14px">分类与考点</b>' +
      '<span class="chip b">' + t.cats.length + ' 个分类</span>' +
      '<span class="chip">' + nPt + ' 个考点</span>' +
      '<span class="chip">' + nWord + ' 个特征词</span>' +
      '<span style="flex:1"></span>' +
      '<button class="btn btn-sm btn-ghost" data-act="kp-expand" data-v="1">全部展开</button>' +
      '<button class="btn btn-sm btn-ghost" data-act="kp-expand" data-v="">全部收起</button>' +
      '<button class="btn btn-sm" data-act="kp-add-cat"><svg><use href="#i-plus"/></svg>新增分类</button></div>';

    h += '<div class="mt8">' + t.cats.map(function (c, ci) { return KpRules.catHtml(c, ci); }).join('') + '</div>';

    h += '<div class="card mt16" style="margin-bottom:0"><div class="card-b">' +
      '<b style="font-size:14px">试算</b>' +
      '<div class="text-s text-m" style="margin:4px 0 8px">粘贴一段题干（带上选项 / 答案 / 解析更准），点「试算」看看会被标成什么。改完规则先在这里验证，再去重标题库。</div>' +
      '<textarea class="textarea kp-try" id="kpTry" style="min-height:78px" placeholder="例：用如图所示装置制备氯气，并检验其性质">' + esc(KpRules.tryText) + '</textarea>' +
      '<div class="mt8"><button class="btn btn-sm btn-primary" data-act="kp-test">试算</button>' +
      '<button class="btn btn-sm btn-ghost" data-act="kp-clear-try" style="margin-left:6px">清空</button></div>' +
      '<div id="kpOut" class="mt8">' + KpRules.out + '</div></div></div>';

    $('#kpBody').innerHTML = h;
  },

  catHtml: function (c, ci) {
    var open = KpRules.isOpen(ci);
    var head = '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;cursor:pointer" data-act="kp-toggle" data-ci="' + ci + '">' +
      '<span style="width:12px;color:var(--muted);font-size:11px">' + (open ? '▼' : '▶') + '</span>' +
      '<input class="input kp-cat" data-ci="' + ci + '" value="' + esc(c.cat) + '" placeholder="分类名，如 化学平衡" style="flex:1;min-width:170px;font-weight:600">' +
      '<span class="chip">' + c.pts.length + ' 个考点</span>' +
      '<button class="btn btn-sm" data-act="kp-add-pt" data-ci="' + ci + '">+ 考点</button>' +
      '<button class="btn btn-sm btn-danger" data-act="kp-del-cat" data-ci="' + ci + '" title="删除整个分类">删分类</button></div>';
    if (!open) return '<div class="card" style="margin:0 0 8px"><div class="card-b">' + head + '</div></div>';
    return '<div class="card" style="margin:0 0 10px"><div class="card-b">' + head +
      '<div class="tblwrap mt8"><table class="tbl" style="min-width:660px"><thead><tr>' +
      '<th style="width:150px">考点</th><th>强特征词（权重 3）</th><th>弱特征词（权重 1）</th><th style="width:96px"></th>' +
      '</tr></thead><tbody>' +
      c.pts.map(function (p, pi) { return KpRules.ptRow(ci, p, pi); }).join('') +
      '</tbody></table></div></div></div>';
  },

  ptRow: function (ci, p, pi) {
    var btn = function (act, txt, title) {
      return '<button class="btn btn-sm" data-act="' + act + '" data-ci="' + ci + '" data-pi="' + pi + '" title="' + esc(title) + '">' + txt + '</button>';
    };
    return '<tr>' +
      '<td><input class="input kp-pt" data-ci="' + ci + '" data-pi="' + pi + '" value="' + esc(p.k) + '" placeholder="考点名"></td>' +
      '<td><textarea class="textarea kp-s" data-ci="' + ci + '" data-pi="' + pi + '" style="min-height:52px" placeholder="原电池、盐桥">' + esc(p.strong.join('、')) + '</textarea></td>' +
      '<td><textarea class="textarea kp-w" data-ci="' + ci + '" data-pi="' + pi + '" style="min-height:52px" placeholder="电极">' + esc(p.weak.join('、')) + '</textarea></td>' +
      '<td><div style="display:flex;gap:3px">' +
      btn('kp-up-pt', '↑', '上移') + btn('kp-down-pt', '↓', '下移') + btn('kp-del-pt', '×', '删除这个考点') +
      '</div></td></tr>';
  },

  /* 结构变化：增删分类 / 考点、上下移 —— 改完要整块重画 */
  mutate: function (op, ci, pi) {
    var t = KpRules.draft;
    if (!t) return;
    var c = t.cats[ci];
    if (op === 'add-cat') {
      t.cats.push({ cat: '新分类', pts: [{ k: '新考点', strong: [], weak: [] }] });
    } else if (op === 'del-cat') {
      if (!c) return;
      if (t.cats.length <= 1) { UI.toast('至少要保留一个分类', 'err'); return; }
      t.cats.splice(ci, 1);
    } else if (op === 'add-pt') {
      if (!c) return;
      c.pts.push({ k: '新考点', strong: [], weak: [] });
    } else if (op === 'del-pt') {
      if (!c || !c.pts[pi]) return;
      if (c.pts.length <= 1) { UI.toast('每个分类至少要留一个考点', 'err'); return; }
      c.pts.splice(pi, 1);
    } else if (op === 'up-pt' || op === 'down-pt') {
      if (!c) return;
      var j = op === 'up-pt' ? pi - 1 : pi + 1;
      if (j < 0 || j >= c.pts.length) return;
      var tmp = c.pts[pi]; c.pts[pi] = c.pts[j]; c.pts[j] = tmp;
    }
    KpRules.render();
  },

  /* 输入即回写（不重渲染，避免丢焦点） */
  input: function (el) {
    var t = KpRules.draft;
    if (!t) return;
    var cls = el.classList;
    if (cls.contains('kp-try')) { KpRules.tryText = el.value; return; }
    if (cls.contains('kp-stop')) {
      t.stop = KpRules.splitWords(el.value);
      return;
    }
    if (cls.contains('kp-generic')) {
      t.generic = KpRules.splitWords(el.value);
      return;
    }
    if (cls.contains('kp-num')) {
      var f = el.getAttribute('data-f'), v = parseFloat(el.value);
      if (f && isFinite(v) && v >= 0) t[f] = v;
      return;
    }
    var ci = +el.getAttribute('data-ci'), pi = +el.getAttribute('data-pi');
    var c = t.cats[ci];
    if (cls.contains('kp-cat')) { if (c) c.cat = el.value; return; }
    if (!c || !c.pts[pi]) return;
    if (cls.contains('kp-pt')) c.pts[pi].k = el.value;
    else if (cls.contains('kp-s')) c.pts[pi].strong = KpRules.splitWords(el.value);
    else if (cls.contains('kp-w')) c.pts[pi].weak = KpRules.splitWords(el.value);
  },

  splitWords: function (s) {
    var out = [], seen = {};
    String(s == null ? '' : s).split(/[、,，;；\n\r\t]+/).forEach(function (x) {
      x = String(x).trim();
      if (!x || seen[x]) return;
      seen[x] = 1; out.push(x);
    });
    return out;
  },

  /* 用「当前草稿」试算，还没保存也能看到效果 */
  test: function () {
    var box = $('#kpTry');
    var txt = box ? String(box.value || '') : KpRules.tryText;
    KpRules.tryText = txt;
    if (!String(txt).trim()) { UI.toast('先粘贴一段题干', 'err'); return; }
    var t = wqKpNormalize(KpRules.draft);
    if (!t.cats.length) { UI.toast('规则还是空的：先加分类和考点', 'err'); return; }
    _kpOverride = t;
    var kp;
    try { kp = wqTagKnowledge({ stem: txt }); }
    finally { _kpOverride = null; }

    var out = '';
    if (!kp.point) {
      out = '<div class="banner"><svg><use href="#i-alert"/></svg><div><b>证据不足，不标知识点。</b>' +
        (kp.ranked && kp.ranked.length
          ? '最接近的是「' + esc(kp.ranked[0].label) + '」，只有 ' + kp.ranked[0].score + ' 分，没到标注门槛 ' + t.minLow + ' 分。'
          : '这段文字里没有任何特征词命中。') +
        '</div></div>';
    } else {
      var cls = kp.conf === '高' ? 'g' : (kp.conf === '中' ? 'b' : 'a');
      out = '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">' +
        '<span class="chip ' + cls + '">主知识点 ' + esc(kp.point) + '</span>' +
        '<span class="chip">置信度 ' + esc(kp.conf) + ' · ' + kp.score + ' 分</span>' +
        kp.alts.map(function (a) { return '<span class="chip">次知识点 ' + esc(a) + '</span>'; }).join('') +
        '</div>' +
        '<div class="text-s text-m mt8">命中依据：' + esc(kp.why || '—') + '</div>';
    }
    if (kp.ranked && kp.ranked.length) {
      out += '<div class="text-s text-m mt8">候选排名：' + kp.ranked.map(function (r) {
        return esc(r.label) + '（' + r.score + ' 分）';
      }).join('　·　') + '</div>';
    }
    KpRules.out = out;
    var o = $('#kpOut');
    if (o) o.innerHTML = out; else KpRules.render();
  },

  save: function () {
    var t = wqKpNormalize(KpRules.draft);
    if (!t.cats.length) { UI.toast('至少要有一个分类，且分类名、考点名不能为空', 'err'); return; }
    var nPt = 0, nWord = 0;
    t.cats.forEach(function (c) {
      c.pts.forEach(function (p) { nPt++; nWord += p.strong.length + p.weak.length; });
    });
    if (!nWord) { UI.toast('至少给一个考点填上特征词，否则永远匹配不到', 'err'); return; }
    Store.state.profile.kpRules = t;
    Store.save('profile');
    _kpCache = { key: '', words: [], index: {} };   /* 规则变了，特征词索引要重建 */
    UI.closeMask('#maskKp');
    UI.toast('已保存知识点规则：' + t.cats.length + ' 个分类 · ' + nPt + ' 个考点 · ' + nWord + ' 个特征词', 'ok');
    /* 顺手把导入预览里那批题重标一遍，老师马上能看到效果 */
    if (WordQuiz.items.length) {
      WordQuiz.items.forEach(function (it) { if (!it.kpManual) wqApplyKp(it); });
      WordQuiz.render();
    }
    App.refresh();
  },

  restoreDefault: function () {
    UI.confirm('恢复内置知识点规则',
      '会丢掉你自建的全部分类与特征词，回到内置的化学考点库。<br>' +
      '<span class="text-s text-m">如果你之前改过、想留个底，先取消，到上面「备份与恢复」里导出一次 JSON 全量备份。</span>',
      function () {
        delete Store.state.profile.kpRules;
        Store.save('profile');
        _kpCache = { key: '', words: [], index: {} };
        UI.closeAll();
        KpRules.open();
        UI.toast('已恢复内置知识点规则', 'ok');
        App.refresh();
      }, '恢复内置');
  }
};

/* =========================================================
 * 出门测（课堂出门测 / 知识点掌握度）
 * =======================================================*/
function levelColor(level) {
  if (level === '掌握') return { bg: '#EAF5EE', fg: '#3E8E5A' };
  if (level === '待巩固') return { bg: '#FDF4E3', fg: '#D99421' };
  if (level === '薄弱') return { bg: '#FDECEB', fg: '#D2544F' };
  return { bg: '#F0F4F8', fg: '#6B7C8E' };
}

/* 掌握情况表格行（学生子标题 + 各知识点），均用内联样式，modal 与 xls 通用 */
function masteryRows(studentId) {
  var students = studentId
    ? [byId(Store.state.students, studentId)].filter(Boolean)
    : Store.state.students.filter(function (s) { return masteryOf(s.id).length; });
  if (!students.length) return '';
  var rows = '';
  students.forEach(function (s) {
    var ms = masteryOf(s.id);
    if (!ms.length) return;
    rows += '<tr><td colspan="4" style="background:#E9F3F1;color:#245F56;font-weight:700;padding:6px 10px">' +
      esc(s.name) + (s.school ? ' · ' + esc(s.school) : '') + '</td></tr>';
    ms.forEach(function (m) {
      var c = levelColor(m.level);
      rows += '<tr>' +
        '<td style="padding:6px 10px;border-bottom:1px solid #EEF2F6">' + esc(m.kp) + '</td>' +
        '<td style="padding:6px 10px;border-bottom:1px solid #EEF2F6;text-align:center">' + m.n + '</td>' +
        '<td style="padding:6px 10px;border-bottom:1px solid #EEF2F6;text-align:center">' + Math.round(m.rate * 100) + '%</td>' +
        '<td style="padding:6px 10px;border-bottom:1px solid #EEF2F6;text-align:center;background:' + c.bg + ';color:' + c.fg + ';font-weight:600">' + m.level + '</td>' +
        '</tr>';
    });
  });
  return rows;
}

function masteryReportHTML(studentId) {
  var rows = masteryRows(studentId);

    '<button class="btn btn-sm" data-act="stu-exitcurve-kp" data-id="' + studentId + '"><svg><use href="#i-quiz"/></svg>按知识点拆分</button>' +

  h += '<div class="card mt12"><div class="card-b"><div class="sub" style="margin-bottom:6px">每次登分表明细（点「展开」看每题得分）</div><table class="tbl">' +
    '<thead><tr><th>讲次 / 日期</th><th>标题</th><th>总分</th><th>得分率</th><th style="width:80px"></th></tr></thead><tbody>' +
    list.map(function (x, i) {
      var pct = (x.rate * 100).toFixed(0);
      var color = x.rate < 0.6 ? '#D2544F' : (x.rate < 0.8 ? '#E58A3A' : '#3E8E5A');
      var detail = '<div id="qd-' + i + '" class="hidden" style="padding:8px 0"><table class="tbl" style="font-size:12px"><thead><tr><th>题号</th><th>知识点</th><th>得分 / 分值</th></tr></thead><tbody>' +
        (x.sh.questions || []).map(function (q, qi) {
          var sc = num(x.stu.scores[qi]), f = num(q.score);
          var c2 = f > 0 && sc / f < 0.6 ? '#D2544F' : (f > 0 && sc / f < 1 ? '#E58A3A' : '#3E8E5A');
          return '<tr><td class="num">' + (qi + 1) + '</td><td>' + esc(q.kp || '-') + '</td>' +
            '<td class="num" style="color:' + c2 + ';font-weight:600">' + sc + ' / ' + f + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      return '<tr><td>' + esc(x.sh.lecture || '-') + (x.sh.date ? '<div class="text-xs text-m">' + esc(x.sh.date) + '</div>' : '') + '</td>' +
        '<td>' + esc(x.sh.title || '') + '</td>' +

/* ---------------- 学情报告（图片导出） ---------------- */
var RR_FONT = '"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif';

function scoreRatesOf(studentId) {
  var st = byId(Store.state.students, studentId);
  if (!st) return [];
  var out = [];
  Store.state.exams.forEach(function (e) {
    if (e.studentId && e.studentId !== studentId) return;
    if (!e.studentId && e.studentName !== st.name) return;
    var full = num(e.full), sc = num(e.score);
    out.push({ name: e.examName || '考试', score: sc, full: full, rate: full > 0 ? sc / full : 0, date: e.date || '' });
  });
  out.sort(function (a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
  return out;
}

function downloadDataURL(filename, dataURL) {
  /* 走 OutBox → 托管在资料库的 iframe 里也能真的保存到本地（缺 allow-downloads 时
     页面内部的 <a download> 会被浏览器静默丢弃） */
  OutBox.saveBlob(filename, Files.dataURLtoBlob(dataURL));
  UI.toast('已导出：' + filename, 'ok');
}

function rrRoundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function rrWrap(ctx, text, x, y, maxW, lh, maxLines) {
  var lines = [], cur = '';
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (ch === '\n') { lines.push(cur); cur = ''; continue; }
    var t = cur + ch;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = ch; }
    else cur = t;
  }
  if (cur) lines.push(cur);
  if (maxLines && lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    var last = lines[maxLines - 1];
    lines[maxLines - 1] = last.length > 1 ? last.slice(0, -1) + '…' : last;
  }
  for (var k = 0; k < lines.length; k++) { ctx.fillText(lines[k], x, y); y += lh; }
  return y;
}

function rrDrawRing(ctx, cx, cy, r, rate) {
  ctx.lineWidth = 14; ctx.strokeStyle = '#E3EAEE';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  var col = rate >= 0.8 ? '#3E8E5A' : (rate >= 0.6 ? '#D99421' : '#D2544F');
  ctx.strokeStyle = col;
  ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * rate); ctx.stroke();
  ctx.fillStyle = col; ctx.textAlign = 'center';
  ctx.font = '700 28px ' + RR_FONT; ctx.fillText(Math.round(rate * 100) + '%', cx, cy + 2);
  ctx.font = '400 12px ' + RR_FONT; ctx.fillStyle = '#6B7C8E'; ctx.fillText('综合得分率', cx, cy + 24);
  ctx.textAlign = 'left';
}

function rrDrawRadar(ctx, cx, cy, R, data) {
  var n = data.length; if (!n) return;
  ctx.lineWidth = 1; ctx.strokeStyle = '#D9E2E8';
  [0.25, 0.5, 0.75, 1].forEach(function (g) {
    ctx.beginPath();
    for (var i = 0; i < n; i++) {
      var a = -Math.PI / 2 + i * 2 * Math.PI / n;
      var px = cx + Math.cos(a) * R * g, py = cy + Math.sin(a) * R * g;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.stroke();
  });
  data.forEach(function (d, i) {
    var a = -Math.PI / 2 + i * 2 * Math.PI / n;
    var px = cx + Math.cos(a) * R, py = cy + Math.sin(a) * R;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, py); ctx.strokeStyle = '#E3EAEE'; ctx.stroke();
    ctx.fillStyle = '#6B7C8E'; ctx.font = '400 12px ' + RR_FONT; ctx.textAlign = 'center';
    var lab = d.kp.length > 6 ? d.kp.slice(0, 6) + '…' : d.kp;
    ctx.fillText(lab, cx + Math.cos(a) * (R + 14), cy + Math.sin(a) * (R + 14) + 4);
  });
  ctx.beginPath();
  data.forEach(function (d, i) {
    var a = -Math.PI / 2 + i * 2 * Math.PI / n;
    var rr = R * Math.max(0.05, d.rate);
    var px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  });
  ctx.closePath();
  ctx.fillStyle = 'rgba(47,122,110,0.22)'; ctx.fill();
  ctx.strokeStyle = '#2F7A6E'; ctx.lineWidth = 2; ctx.stroke();
  data.forEach(function (d, i) {
    var a = -Math.PI / 2 + i * 2 * Math.PI / n;
    var rr = R * Math.max(0.05, d.rate);
    var px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
    ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI * 2); ctx.fillStyle = '#2F7A6E'; ctx.fill();
  });
  ctx.textAlign = 'left';
}

function rrReview(s, rates, mastery) {
  var name = s ? s.name : '该生';
  var avg = rates.length ? rates.reduce(function (a, b) { return a + b.rate; }, 0) / rates.length : 0;
  var weak = mastery.filter(function (m) { return m.level === '薄弱' || m.level === '待巩固'; });
  var strong = mastery.filter(function (m) { return m.level === '掌握'; });
  var L = [];
  L.push(name + '同学化学综合得分率约 ' + Math.round(avg * 100) + '%' + (rates.length ? ('（基于 ' + rates.length + ' 次考试成绩）') : '') + '。');
  if (strong.length) L.push('优势模块：' + strong.slice(0, 3).map(function (m) { return m.kp; }).join('、') + '，掌握较扎实，可适度提升难度、拓展综合题。');
  if (weak.length) L.push('需重点突破：' + weak.slice(0, 3).map(function (m) { return m.kp + '（' + (m.level === '薄弱' ? '薄弱' : '待巩固') + '）'; }).join('、') + '，建议结合出门测错题做针对性加练。');
  L.push('下一步建议：保持每周一次出门测跟踪，优先补齐薄弱知识点，稳步提升综合得分率。');
  return L.join('\n');
}

function exportReportImage(studentId) {
  var st = byId(Store.state.students, studentId);
  if (!st) { UI.toast('未找到该学生', 'err'); return; }
  var rates = scoreRatesOf(studentId);
  var mastery = masteryOf(studentId);
  var teacher = (Store.user && Store.user.user) ? Store.user.user : '化学老师';

  var W = 720, PAD = 36, CW = W - PAD * 2;
  var headerH = 112, gap = 16;
  var hA = 96;
  var examsShow = rates.slice(0, 7);
  var hB = Math.max(150, 46 + examsShow.length * 30 + (rates.length > 7 ? 24 : 0));
  var kps = mastery.slice();
  if (kps.length > 8) kps = kps.slice(0, 8);
  var hC = mastery.length >= 3 ? 268 : (44 + Math.max(1, mastery.length) * 30);
  var review = rrReview(st, rates, mastery);
  var approxChars = Math.floor((CW - 40) / 14);
  var reviewLines = 0;
  review.split('\n').forEach(function (para) { reviewLines += Math.max(1, Math.ceil(para.length / approxChars)); });
  var hD = 60 + reviewLines * 22 + 12;

  var H = headerH + gap + hA + gap + hB + gap + hC + gap + hD + 24;
  var scale = 2;
  var canvas = document.createElement('canvas');
  canvas.width = W * scale; canvas.height = H * scale;
  var ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  function secTitle(t, yy) {
    ctx.fillStyle = '#2F7A6E'; rrRoundRect(ctx, PAD, yy, 4, 18, 2); ctx.fill();
    ctx.fillStyle = '#1E2A36'; ctx.font = '700 16px ' + RR_FONT; ctx.textAlign = 'left';
    ctx.fillText(t, PAD + 14, yy + 15);
  }

  // background
  ctx.fillStyle = '#F4F7F9'; ctx.fillRect(0, 0, W, H);

  // header
  var grad = ctx.createLinearGradient(0, 0, W, headerH);
  grad.addColorStop(0, '#2F7A6E'); grad.addColorStop(1, '#3E9C8C');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, headerH);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
  ctx.font = '700 26px ' + RR_FONT; ctx.fillText(st.name + ' 同学学情报告', PAD, 50);
  ctx.font = '400 13px ' + RR_FONT; ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText('化学 · 学情诊断报告    教师：' + teacher + '    生成日期：' + todayStr(), PAD, 80);

  var y = headerH + gap;

  // Card A: 学生信息
  ctx.fillStyle = '#fff'; rrRoundRect(ctx, PAD, y, CW, hA, 14); ctx.fill();
  ctx.strokeStyle = '#E3EAEE'; ctx.lineWidth = 1; rrRoundRect(ctx, PAD, y, CW, hA, 14); ctx.stroke();
  ctx.fillStyle = '#1E2A36'; ctx.font = '700 22px ' + RR_FONT; ctx.textAlign = 'left';
  ctx.fillText(st.name, PAD + 20, y + 38);
  ctx.font = '400 14px ' + RR_FONT; ctx.fillStyle = '#6B7C8E';
  ctx.fillText([st.grade, st.school].filter(Boolean).join(' · ') || '—', PAD + 20, y + 64);
  if (st.tags && st.tags.length) {
    var tx = PAD + 20;
    ctx.font = '400 12px ' + RR_FONT;
    st.tags.slice(0, 4).forEach(function (tg) {
      var w = ctx.measureText(tg).width + 18;
      ctx.fillStyle = '#E9F3F1'; rrRoundRect(ctx, tx, y + 76, w, 20, 10); ctx.fill();
      ctx.fillStyle = '#2F7A6E'; ctx.fillText(tg, tx + 9, y + 90);
      tx += w + 8;
    });
  }
  var avgRate = rates.length ? rates.reduce(function (a, b) { return a + b.rate; }, 0) / rates.length : 0;
  ctx.textAlign = 'right'; ctx.fillStyle = '#2F7A6E'; ctx.font = '700 20px ' + RR_FONT;
  ctx.fillText(rates.length ? (Math.round(avgRate * 100) + '%') : '—', PAD + CW - 20, y + 40);
  ctx.font = '400 12px ' + RR_FONT; ctx.fillStyle = '#6B7C8E';
  ctx.fillText('综合得分率', PAD + CW - 20, y + 60);
  ctx.textAlign = 'left';
  y += hA + gap;

  // Card B: 成绩（得分率）
  secTitle('成绩（得分率）', y);
  var cardBy = y + 26;
  ctx.fillStyle = '#fff'; rrRoundRect(ctx, PAD, cardBy, CW, hB, 14); ctx.fill();
  ctx.strokeStyle = '#E3EAEE'; rrRoundRect(ctx, PAD, cardBy, CW, hB, 14); ctx.stroke();
  var ringR = 52, rcx = PAD + 26 + ringR, rcy = cardBy + hB / 2 - 6;
  rrDrawRing(ctx, rcx, rcy, ringR, avgRate);
  var lx = PAD + 26 + ringR * 2 + 44;
  var lw = PAD + CW - 24 - lx;
  ctx.textAlign = 'left';
  if (!rates.length) {
    ctx.fillStyle = '#6B7C8E'; ctx.font = '400 13px ' + RR_FONT;
    ctx.fillText('暂无考试成绩记录', lx, cardBy + hB / 2);
  } else {
    var ly = cardBy + 26;
    examsShow.forEach(function (e) {
      ctx.fillStyle = '#1E2A36'; ctx.font = '600 13px ' + RR_FONT;
      ctx.fillText((e.name || '考试') + '  ' + (e.score != null ? e.score : '—') + '/' + (e.full || '—'), lx, ly);
      var bx = lx + lw - 120, bw = 110;
      ctx.fillStyle = '#E3EAEE'; rrRoundRect(ctx, bx, ly - 10, bw, 8, 4); ctx.fill();
      var col = e.rate >= 0.8 ? '#3E8E5A' : (e.rate >= 0.6 ? '#D99421' : '#D2544F');
      ctx.fillStyle = col; rrRoundRect(ctx, bx, ly - 10, Math.max(4, bw * e.rate), 8, 4); ctx.fill();
      ctx.fillStyle = col; ctx.font = '400 12px ' + RR_FONT; ctx.textAlign = 'right';
      ctx.fillText(Math.round(e.rate * 100) + '%', lx + lw, ly + 2);
      ctx.textAlign = 'left';
      ly += 30;
    });
    if (rates.length > 7) { ctx.fillStyle = '#6B7C8E'; ctx.font = '400 12px ' + RR_FONT; ctx.fillText('… 等共 ' + rates.length + ' 次考试', lx, ly); }
  }
  y = cardBy + hB + gap;

  // Card C: 知识点掌握情况
  secTitle('知识点掌握情况（雷达图）', y);
  var cardCy = y + 26;
  ctx.fillStyle = '#fff'; rrRoundRect(ctx, PAD, cardCy, CW, hC, 14); ctx.fill();
  ctx.strokeStyle = '#E3EAEE'; rrRoundRect(ctx, PAD, cardCy, CW, hC, 14); ctx.stroke();
  if (mastery.length >= 3) {
    var R = 92, ccx = PAD + 30 + R, ccy = cardCy + hC / 2 - 6;
    rrDrawRadar(ctx, ccx, ccy, R, kps);
    var lgx = ccx + R + 36, lgy = cardCy + 22;
    kps.forEach(function (m) {
      var col = m.level === '掌握' ? '#3E8E5A' : (m.level === '待巩固' ? '#D99421' : '#D2544F');
      ctx.fillStyle = col; rrRoundRect(ctx, lgx, lgy - 10, 10, 10, 3); ctx.fill();
      ctx.fillStyle = '#1E2A36'; ctx.font = '500 13px ' + RR_FONT; ctx.textAlign = 'left';
      ctx.fillText(m.kp, lgx + 16, lgy);
      ctx.fillStyle = col; ctx.font = '400 12px ' + RR_FONT; ctx.textAlign = 'right';
      ctx.fillText(m.level + ' ' + Math.round(m.rate * 100) + '%', PAD + CW - 24, lgy);
      ctx.textAlign = 'left';
      lgy += 26;
    });
  } else if (mastery.length) {
    var bx0 = PAD + 24, by = cardCy + 24;
    mastery.forEach(function (m) {
      ctx.fillStyle = '#1E2A36'; ctx.font = '500 13px ' + RR_FONT; ctx.textAlign = 'left';
      ctx.fillText(m.kp, bx0, by);
      ctx.fillStyle = '#E3EAEE'; rrRoundRect(ctx, bx0, by + 6, CW - 48, 8, 4); ctx.fill();
      var col = m.level === '掌握' ? '#3E8E5A' : (m.level === '待巩固' ? '#D99421' : '#D2544F');
      ctx.fillStyle = col; rrRoundRect(ctx, bx0, by + 6, Math.max(4, (CW - 48) * m.rate), 8, 4); ctx.fill();
      ctx.fillStyle = col; ctx.font = '400 12px ' + RR_FONT; ctx.textAlign = 'right';
      ctx.fillText(m.level + ' ' + Math.round(m.rate * 100) + '%', PAD + CW - 24, by);
      ctx.textAlign = 'left';
      by += 30;
    });
  } else {
    ctx.fillStyle = '#6B7C8E'; ctx.font = '400 13px ' + RR_FONT; ctx.textAlign = 'left';
    ctx.fillText('暂无出门测记录，可在「出门测」中录入后生成', PAD + 24, cardCy + hC / 2);
  }
  y = cardCy + hC + gap;

  // Card D: 点评话术
  secTitle('点评话术', y);
  var cardDy = y + 26;
  ctx.fillStyle = '#FBFCFC'; rrRoundRect(ctx, PAD, cardDy, CW, hD, 14); ctx.fill();
  ctx.strokeStyle = '#E3EAEE'; rrRoundRect(ctx, PAD, cardDy, CW, hD, 14); ctx.stroke();
  ctx.fillStyle = '#33424D'; ctx.font = '400 14px ' + RR_FONT; ctx.textAlign = 'left';
  rrWrap(ctx, review, PAD + 20, cardDy + 28, CW - 40, 22);

  var url = canvas.toDataURL('image/png');
  downloadDataURL(st.name + '_学情报告_' + todayStr() + '.png', url);
}

/* ===== 42-sheets.js ===== */

/* =========================================================
 * 出门测 · 登分表（得分模板）

 * 零外部依赖，复用 Files.parseTable / Files.buildXlsx
 * =======================================================*/
var exitTab = 'sheets';
var ssEdit = null; /* 编辑器工作副本 */

/* ---------------- 列表 ---------------- */
function renderScoreSheets() {

function scoreSheetCard(ss) {
  var qs = ss.questions || [], stus = ss.students || [];
  var nQ = qs.length, nS = stus.length;
  var full = qs.reduce(function (a, q) { return a + num(q.score); }, 0);
  var avg = nS ? stus.reduce(function (a, s) { return a + s.scores.reduce(function (x, y) { return x + num(y); }, 0); }, 0) / nS : 0;
  var rate = full ? avg / full : 0;

    '<div class="card-b">' +

    '</div><div class="rowacts">' +
    '<button class="iconbtn" data-act="ss-view" data-id="' + ss.id + '"><svg><use href="#i-edit"/></svg></button>' +

    '</div></div>' +

    '<span style="flex:1"></span>' +
    '</div></div></div>';
}

/* ---------------- Excel 模板解析 ---------------- */
function parseScoreSheetRows(rows, sheetName) {
  if (!rows || rows.length < 4) return null;
  var title = (rows[0] && rows[0][0] != null) ? String(rows[0][0]).trim() : (sheetName || '');
  var r1 = rows[1] || [];
  var idxTotal = -1;
  for (var j = 0; j < r1.length; j++) { if (String(r1[j]).trim() === '总分') { idxTotal = j; break; } }
  if (idxTotal < 0) idxTotal = r1.length;
  var qn = idxTotal - 1; /* 第 0 列为"题号" */
  if (qn <= 0) return null;
  var r2 = rows[2] || [], r3 = rows[3] || [];
  var questions = [];
  for (var i = 1; i <= qn; i++) questions.push({ no: i, kp: r2[i] != null ? String(r2[i]).trim() : '', score: num(r3[i]) });
  var students = [];
  for (var ri = 4; ri < rows.length; ri++) {
    var row = rows[ri];
    if (!row || !row.length) continue;
    var nm = (row[0] != null ? String(row[0]).trim() : '');
    if (nm === '' || nm === '平均分' || nm === '题号' || nm === '知识点' || nm === '分值') continue;
    var sc = [];
    for (var qi = 1; qi <= qn; qi++) sc.push(num(row[qi]));
    students.push({ name: nm, scores: sc });
  }
  if (!students.length) return null;
  return { title: title, lecture: sheetName || '', questions: questions, students: students };
}

function importScoreSheetFile() {
  Files.pick('.xlsx,.csv', function (f) {
    Files.parseTable(f).then(function (res) {
      var added = 0;
      (res.sheets || []).forEach(function (sh) {
        if (!sh.rows || sh.rows.length < 4) return;
        var ss = parseScoreSheetRows(sh.rows, sh.name);
        if (ss && ss.questions.length && ss.students.length) {
          Store.add('scoreSheets', { id: uid(), title: ss.title || sh.name, lecture: ss.lecture, date: todayStr(), questions: ss.questions, students: ss.students, createdAt: Date.now(), updatedAt: Date.now(), _demo: false });
          added++;
        }
      });
      if (!added) { UI.toast('未识别到有效登分表（需含 题号/知识点/分值/学生得分）', 'err'); return; }
      syncExitScoresToStudents();
      UI.toast('已导入 ' + added + ' 份登分表并同步到学生档案', 'ok');
      App.go('exitTests');
    }).catch(function (err) { UI.toast('导入失败：' + (err && err.message ? err.message : err), 'err'); });
  });
}

  $('#ssBody').innerHTML = h;
  ssEditRecalc();

function ssEditRecalc() {
  var qs = ssEdit.questions, stus = ssEdit.students;
  var full = qs.reduce(function (a, q) { return a + num(q.score); }, 0);
  var tbl = $('#ssTable'); if (!tbl) return;
  stus.forEach(function (s, si) {
    var tr = tbl.querySelector('tbody tr[data-si="' + si + '"]'); if (!tr) return;
    var tot = s.scores.reduce(function (a, b) { return a + num(b); }, 0);
    var rate = full ? tot / full : 0;
    var tt = tr.querySelector('.ss-total'); if (tt) tt.textContent = tot;
    var rt = tr.querySelector('.ss-rate'); if (rt) rt.textContent = (rate * 100).toFixed(0) + '%';
  });
  var n = stus.length;
  var f = tbl.querySelector('tfoot tr'); if (!f) return;
  qs.forEach(function (q, qi) {
    var sum = 0; stus.forEach(function (s) { sum += num(s.scores[qi]); });
    var cell = f.querySelector('td[data-avg-qi="' + qi + '"]'); if (cell) cell.textContent = n ? (sum / n).toFixed(1) : '0';
  });
  var grand = 0; stus.forEach(function (s) { grand += s.scores.reduce(function (a, b) { return a + num(b); }, 0); });
  var totCell = f.querySelector('td[data-avg-tot]'); if (totCell) totCell.textContent = n ? (grand / n).toFixed(1) : '0';
  var rateCell = f.querySelector('td[data-avg-rate]'); if (rateCell) rateCell.textContent = (full && n) ? ((grand / n / full) * 100).toFixed(0) + '%' : '';
}

function saveScoreSheet(id) {

/* ---------------- 导出同款 Excel ---------------- */
function exportScoreSheet(id) {
  var ss = byId(Store.state.scoreSheets, id); if (!ss) return;
  var qs = ss.questions || [], stus = ss.students || [];
  var full = qs.reduce(function (a, q) { return a + num(q.score); }, 0);
  var rows = [];
  rows.push([ss.title || '出门测登分表']);
  var head = ['题号']; qs.forEach(function (q, i) { head.push(i + 1); }); head.push('总分'); head.push('得分率');
  rows.push(head);
  var kp = ['知识点']; qs.forEach(function (q) { kp.push(q.kp || ''); }); kp.push(''); kp.push('');
  rows.push(kp);
  var sc = ['分值']; qs.forEach(function (q) { sc.push(num(q.score)); }); sc.push(full); sc.push(1);
  rows.push(sc);
  stus.forEach(function (s) {
    var r = [s.name || '']; qs.forEach(function (q, qi) { r.push(num((s.scores || [])[qi])); });
    var tot = (s.scores || []).reduce(function (a, b) { return a + num(b); }, 0);
    r.push(tot); r.push(full ? +(tot / full).toFixed(2) : 0);
    rows.push(r);
  });
  if (stus.length) {
    var avg = ['平均分'];
    qs.forEach(function (q, qi) { var sum = 0; stus.forEach(function (s) { sum += num((s.scores || [])[qi]); }); avg.push(+(sum / stus.length).toFixed(2)); });
    var t2 = stus.reduce(function (a, s) { return a + s.scores.reduce(function (x, y) { return x + num(y); }, 0); }, 0);
    avg.push(+(t2 / stus.length).toFixed(1)); avg.push(full ? +(t2 / stus.length / full).toFixed(2) : 0);
    rows.push(avg);
  }
  Files.downloadXlsx((ss.title || '出门测登分表') + '_' + todayStr() + '.xlsx', [{ name: ss.lecture || '出门测', rows: rows }]);
}

/* ---------------- 学情报告（图片） ---------------- */
function openSsReportPicker(sheetId) {
  var ss = byId(Store.state.scoreSheets, sheetId); if (!ss) return;

  });
  if (!items.length) { UI.toast('该登分表没有学生', 'err'); return; }
  UI.sheet(items);
}

function rrReviewSheet(name, rate, mastery, qn) {
  var weak = mastery.filter(function (m) { return m.level === '薄弱' || m.level === '待巩固'; });
  var strong = mastery.filter(function (m) { return m.level === '掌握'; });
  var L = [];
  L.push(name + '同学本次出门测综合得分率约 ' + Math.round(rate * 100) + '%（共 ' + qn + ' 题）。');
  if (strong.length) L.push('表现较好：' + strong.slice(0, 3).map(function (m) { return m.kp; }).join('、') + '，掌握扎实，可适当提高难度。');
  if (weak.length) L.push('需重点巩固：' + weak.slice(0, 3).map(function (m) { return m.kp + '（' + (m.level === '薄弱' ? '薄弱' : '待巩固') + '）'; }).join('、') + '，建议结合错题针对性加练。');
  L.push('下一步建议：保持每讲一次出门测跟踪，优先补齐薄弱知识点，稳步提升得分率。');
  return L.join('\n');
}

function exportSheetReportImage(sheetId, studentName) {
  var ss = byId(Store.state.scoreSheets, sheetId); if (!ss) return;
  var stu = null; (ss.students || []).forEach(function (s) { if (s.name === studentName) stu = s; });
  if (!stu) { UI.toast('未找到该学生', 'err'); return; }
  var qs = ss.questions || [];
  var full = qs.reduce(function (a, q) { return a + num(q.score); }, 0);
  var got = (stu.scores || []).reduce(function (a, b) { return a + num(b); }, 0);
  var rate = full ? got / full : 0;
  var kpMap = {};
  qs.forEach(function (q, qi) {
    var k = q.kp || '未分类'; if (!kpMap[k]) kpMap[k] = { earn: 0, tot: 0 };
    kpMap[k].tot += num(q.score); kpMap[k].earn += num((stu.scores || [])[qi]);
  });
  var mastery = Object.keys(kpMap).map(function (k) {
    var m = kpMap[k], r = m.tot ? m.earn / m.tot : 0;
    return { kp: k, rate: r, level: r >= 0.8 ? '掌握' : (r >= 0.5 ? '待巩固' : '薄弱') };
  });
  mastery.sort(function (a, b) { return a.rate - b.rate; });
  var teacher = (Store.user && Store.user.user) ? Store.user.user : '化学老师';

  var W = 720, PAD = 36, CW = W - PAD * 2;
  var headerH = 112, gap = 16, hA = 96;
  var qn = qs.length;
  var hB = Math.max(150, 46 + qn * 30);
  var kps = mastery.slice(); if (kps.length > 8) kps = kps.slice(0, 8);
  var hC = mastery.length >= 3 ? 268 : (44 + Math.max(1, mastery.length) * 30);
  var review = rrReviewSheet(studentName, rate, mastery, qn);
  var approxChars = Math.floor((CW - 40) / 14);
  var reviewLines = 0; review.split('\n').forEach(function (p) { reviewLines += Math.max(1, Math.ceil(p.length / approxChars)); });
  var hD = 60 + reviewLines * 22 + 12;
  var H = headerH + gap + hA + gap + hB + gap + hC + gap + hD + 24;
  var scale = 2;
  var canvas = document.createElement('canvas');
  canvas.width = W * scale; canvas.height = H * scale;
  var ctx = canvas.getContext('2d'); ctx.scale(scale, scale);

  function secTitle(t, yy) {
    ctx.fillStyle = '#2F7A6E'; rrRoundRect(ctx, PAD, yy, 4, 18, 2); ctx.fill();
    ctx.fillStyle = '#1E2A36'; ctx.font = '700 16px ' + RR_FONT; ctx.textAlign = 'left';
    ctx.fillText(t, PAD + 14, yy + 15);
  }

  ctx.fillStyle = '#F4F7F9'; ctx.fillRect(0, 0, W, H);
  var grad = ctx.createLinearGradient(0, 0, W, headerH);
  grad.addColorStop(0, '#2F7A6E'); grad.addColorStop(1, '#3E9C8C');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, headerH);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
  ctx.font = '700 26px ' + RR_FONT; ctx.fillText(studentName + ' 同学学情报告', PAD, 50);
  ctx.font = '400 13px ' + RR_FONT; ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText('化学 · 出门测学情诊断    ' + (ss.lecture || '') + '    教师：' + teacher + '    生成日期：' + todayStr(), PAD, 80);

  var y = headerH + gap;
  ctx.fillStyle = '#fff'; rrRoundRect(ctx, PAD, y, CW, hA, 14); ctx.fill();

/* ===== 43-questions.js ===== */

/* =========================================================
 * 题库视图（题目 / 答案 / 解析 / 知识点标签）
 * 数据集合 questions 由 core 层 SCHEMA 定义，天然进 JSON 备份与云同步
 * 铁律：渲染函数之间严禁互调，统一由 App.refresh 调度
 * =======================================================*/

/* 难度配色统一走 levelChip()（5 档星级 lv1–lv5，旧数据 易/中/难 自动兼容），此处不再维护旧映射 */
/* 筛选条件（本次会话内记忆，切换视图后不丢） */
var QFilter = { q: '', chapter: '', point: '', qtype: '', level: '' };
/* 题库排序（不在 QFilter 里：和筛选是两条线，正交、互不干扰） */
var QSort = { mode: 'default' };
/* 题库分页：列表不再一次性渲染全部题目（5500 道时一次性拼 HTML + 建几千 DOM 节点会撑爆内存），
   改为只渲染当前页的卡片，#qList 里始终只有一页的题目。 */
var QView = { page: 0, pageSize: 100, list: [], total: 0 };
var QSearchTimer = null;
/* 排序键值映射：mode → 取值函数（返回值小者排前面；负数表示倒序） */
var QSORT_MODES = [
  ['default', '默认顺序'],
  ['addedNew', '添加时间（新→旧）'],
  ['addedOld', '添加时间（旧→新）'],
  ['updatedNew', '最近更新'],
  ['lvEasy', '难度（基础→压轴）'],
  ['lvHard', '难度（压轴→基础）'],
  ['codeAsc', '题号升序']
];
/* 题号自然排序：把数字段补零到 8 位（「典例1」「典例10」「典例2」按 1/2/10 而不是 1/10/2） */
function qCodeSortKey(code) {
  return String(code || '').replace(/(\d+)/g, function (m) { return m.padStart(8, '0'); });
}
function qSortKey(mode) {
  switch (mode) {
    case 'addedNew': return function (q) { return -(q.createdAt || 0); };
    case 'addedOld': return function (q) { return q.createdAt || 0; };
    case 'updatedNew': return function (q) { return -(q.updatedAt || 0); };
    case 'lvEasy': return function (q) { var i = levelIndex(q.level); return i < 0 ? 999 : i; };
    case 'lvHard': return function (q) { var i = levelIndex(q.level); return i < 0 ? -1 : -i; };
    case 'codeAsc': return function (q) { return qCodeSortKey(q.code); };
    default: return null;
  }
}
/* 「默认顺序」按题库里实际存的下标来排序（导入顺序、增删顺序），其它模式整体重排 */
function qApplySort() {
  /* 分页后排序不再重排 DOM，而是重算（过滤+排序）后的数组并重渲染当前页 */
  qComputeList();
  qRenderPage();
}
/* 排序下拉：和 qSel 风格一致，但 value 用英文 mode key 而不是中文显示文本 */
function qSortSel() {
  var h = '<select class="select" data-act="q-sort" title="按选中方式给题目排序，不影响筛选结果">';
  QSORT_MODES.forEach(function (m) {
    var sel = QSort.mode === m[0] ? ' selected' : '';
    h += '<option value="' + esc(m[0]) + '"' + sel + '>' + esc(m[1]) + '</option>';
  });
  return h + '</select>';
}
/* 批量管理：勾选若干道题后一次性删除 */
var QBatch = { on: false, sel: {} };
function qbCount() { return Object.keys(QBatch.sel).length; }

/* ---------------------------------------------------------
 * 题目「编辑状态」分类
 *   todo = 待编辑：导入时发现有公式缺失（MathType 矢量图转不出来），需要老师手工补
 *   done = 已编辑：可直接使用
 * 老题库没有这个字段，一律按「已编辑」处理（不打扰已有数据）。
 * doneAt 有值 = 老师点过「完成编辑」亲自确认过。
 * -------------------------------------------------------*/
function qEditState(q) { return (q && q.editState === 'todo') ? 'todo' : 'done'; }
/* 「编辑状态」列的中文值 → 内部标记（认不出来返回空） */
function qEditDecl(v) {
  var s = String(v == null ? '' : v).trim();
  if (!s) return '';
  if (/待编辑|待修|待补|未完成|未编辑|todo/i.test(s)) return 'todo';
  if (/已编辑|已完成|已确认|可用|done/i.test(s)) return 'done';
  return '';
}
function qEditCounts() {
  var todo = 0, done = 0;
  (Store.state.questions || []).forEach(function (q) {
    if (qEditState(q) === 'todo') todo++; else done++;
  });
  return { todo: todo, done: done, all: todo + done };
}
/* 分类按钮（带题数标注） */
function qSegBtn(v, label, n, extra) {
  var on = String(QFilter.edit || '') === v;
  return '<button data-act="q-edit" data-v="' + v + '" class="' + (extra || '') + (on ? ' on' : '') + '">' +
    esc(label) + ' <b id="qSegN-' + (v || 'all') + '">' + n + '</b></button>';
}
/* 分类题数 / 顶部统计随数据实时刷新（不整页重绘，滚动位置不跳） */
function qSegSync() {
  var c = qEditCounts();
  [['all', c.all], ['todo', c.todo], ['done', c.done]].forEach(function (kv) {
    var el = document.getElementById('qSegN-' + kv[0]);
    if (el) el.textContent = kv[1];
  });
  var a = document.getElementById('qStatAll'); if (a) a.textContent = c.all;
  var t = document.getElementById('qStatTodo'); if (t) t.textContent = c.todo;
  var d = document.getElementById('qStatDone'); if (d) d.textContent = c.done;
  var bn = document.getElementById('qTodoBanner');
  if (bn) {
    var n = document.getElementById('qTodoN'); if (n) n.textContent = c.todo;
    bn.classList.toggle('hidden', !c.todo || String(QFilter.edit || '') === 'todo');
  }
}
/* 单题改状态：写库 + 就地刷新卡片（不整页重绘，滚动位置不跳） */
function qSetEdit(id, state) {
  var q = byId(Store.state.questions, id);
  if (!q) { UI.toast('题目不存在', 'err'); return; }
  if (qEditState(q) === state) return;
  q.editState = state;
  q.doneAt = state === 'done' ? Date.now() : '';
  q.updatedAt = Date.now();
  Store.save('questions');
  qCardSync(id);
  if (QBatch.on) qbSync();
  applyQFilter();
  var c = qEditCounts();
  if (state === 'done') {
    UI.toast('已移入「已编辑」' + (c.todo ? '，还剩 ' + c.todo + ' 道待编辑' : '，待编辑已清空'), 'ok');
  } else {
    UI.toast('已退回「待编辑」（待编辑 ' + c.todo + ' 道）', 'ok');
  }
}
/* 卡片局部刷新：状态标记 / 按钮 / 左侧色条 */
function qCardSync(id) {
  var q = byId(Store.state.questions, id);
  if (!q) return;
  var card = document.querySelector('#qList > [data-qid="' + id + '"]');
  if (!card) return;
  var st = qEditState(q);
  card.setAttribute('data-edit', st);
  card.classList.toggle('qtodo', st === 'todo');
  card.classList.toggle('qdone', st === 'done');
  var c = document.getElementById('qc-' + id);
  if (c) c.innerHTML = qChipsInner(q);
  var f = document.getElementById('qf-' + id);
  if (f) f.innerHTML = qFootInner(q);
  if (st !== 'todo') delete QBatch.sel[id];
}

/* ---------------------------------------------------------
 * 单张 / 若干张题卡就地重绘
 *   题库上千道题、每题还带插图时，一次「保存」若整列表重绘，
 *   光是拼 HTML 就是十几 MB，浏览器还要重新解析 + 重新解码所有图片，
 *   改一道题要等好几秒。改一道题只重建这一张卡，成本可以忽略。
 *   返回 true = 已就地处理完（调用方不要再去 App.refresh()）。
 * -------------------------------------------------------*/
/* 筛选下拉（章节 / 知识点 / 题型）的候选值随数据变化：
   只重建这几个 select 的选项，不整页重绘；当前选中的值没了就回到「全部」。 */
function qKpOptsSync() {
  var arr = Store.state.questions || [];
  [['q-chapter', '全部章节', 'chapter'], ['q-point', '全部知识点', 'point'], ['q-qtype', '全部题型', 'qtype']]
    .forEach(function (spec) {
      var el = document.querySelector('#view-questions select[data-act="' + spec[0] + '"]');
      if (!el) return;
      var vals = uniqSorted(arr.map(function (q) { return q[spec[2]]; }));
      var cur = String(QFilter[spec[2]] || '');
      if (cur && vals.indexOf(cur) < 0) cur = '';
      QFilter[spec[2]] = cur;
      el.innerHTML = '<option value="">' + esc(spec[1]) + '</option>' + vals.map(function (o) {
        return '<option value="' + esc(o) + '"' + (String(o) === cur ? ' selected' : '') + '>' + esc(o) + '</option>';
      }).join('');
    });
}
/* 传入被改动的题目 id 列表；列表里确实有卡片被替换过才返回 true */
function qCardsRefresh(ids) {
  var host = document.getElementById('qList');
  if (!host || !ids || !ids.length) return false;
  var byQid = {};
  Array.prototype.forEach.call(host.children, function (c) {
    var k = c.getAttribute && c.getAttribute('data-qid');
    if (k) byQid[k] = c;
  });
  var tmp = document.createElement('div'), n = 0;
  ids.forEach(function (id) {
    var card = byQid[id];
    if (!card) return;
    var q = byId(Store.state.questions, id);
    if (!q) return;
    tmp.innerHTML = questionCard(q);
    var next = tmp.firstElementChild;      /* 取出新卡片，剩下的容器内容随后被覆盖 */
    if (!next) return;
    card.parentNode.replaceChild(next, card);
    n++;
  });
  if (!n) return false;
  qKpOptsSync();
  applyQFilter();
  qSegSync();
  if (QSort.mode !== 'default') qApplySort();   /* 改动的题可能换了排序位置 */
  qbSync();
  return true;
}

/* 删掉一张题卡（同样不整列表重绘） */
function qCardDrop(id) {
  var host = document.getElementById('qList');
  if (!host || !id) return false;
  var kids = host.children;
  for (var i = 0; i < kids.length; i++) {
    if (kids[i].getAttribute('data-qid') === id) {
      host.removeChild(kids[i]);
      /* 删光了就走整页刷新，让空状态提示正常出来 */
      if (!host.children.length) return false;
      qKpOptsSync();
      applyQFilter();
      qSegSync();
      qbSync();
      return true;
    }
  }
  return false;
}

/* 勾选状态写回卡片（不整页重绘，避免滚动位置跳掉） */
function qbSetCard(c, on) {
  var ck = c.querySelector('[data-act="qb-pick"]');
  if (!ck) return;
  ck.checked = !!on;
  var id = ck.getAttribute('data-id');
  if (on) QBatch.sel[id] = 1; else delete QBatch.sel[id];
  c.classList.toggle('qsel', !!on);
}
function qbSync() {
  var box = $('#qbCount');
  if (box) box.textContent = String(qbCount());
  var del = $('[data-act="qb-del"]');
  if (del) del.disabled = !qbCount();
}

function uniqSorted(list) {
  var seen = {}, out = [];
  list.forEach(function (v) {
    v = String(v == null ? '' : v).trim();
    if (!v || seen[v]) return;
    seen[v] = 1; out.push(v);
  });
  out.sort(function (a, b) {
    try { return a.localeCompare(b, 'zh'); } catch (e) { return a > b ? 1 : (a < b ? -1 : 0); }
  });
  return out;
}

function qSel(act, allLabel, options, cur) {
  return '<select class="select" data-act="' + act + '"><option value="">' + esc(allLabel) + '</option>' +
    options.map(function (o) {
      return '<option value="' + esc(o) + '"' + (String(o) === String(cur) ? ' selected' : '') + '>' + esc(o) + '</option>';
    }).join('') + '</select>';
}

/* ---------------- 题库：按当前规则批量重标知识点 ----------------
 * overwrite=false 只补空白的，true 连已填写的也重算。
 * 识别到的次知识点会追加到标签里，所以重标前会先把上一轮自动写进去的考点撤掉。 */
function retagBank(overwrite) {
  var arr = Store.state.questions || [];
  if (!arr.length) { UI.toast('题库还是空的，先导入题目', 'err'); return; }
  var todo = arr.filter(function (q) { return overwrite || !String(q.point || '').trim(); });
  if (!todo.length) {
    UI.toast('没有空知识点了。想连已填写的一起重标，用旁边的「重标全部」', 'ok');
    return;
  }
  var body = '将对 <b>' + todo.length + '</b> 道题按当前规则重新识别知识点：' +
    (overwrite ? '已填写过的知识点也会被算法结果覆盖。' : '已填写过的知识点不动，只补空白的。') +
    ' 识别到的次知识点会追加到「标签」里。<br>' +
    '<span class="text-s text-m">规则可在「设置与数据 → 知识点标签规则」里调；识别不准时先改规则再重标，比逐题手改省事。</span>';
  UI.confirm(overwrite ? '重标全部知识点' : '补全空知识点', body, function () {
    Import.snapshot();
    var filled = 0, emptied = 0;
    todo.forEach(function (q) {
      var before = String(q.point || '').trim();
      var kp = wqApplyKp(q);
      q.kpSrc = kp.chapterFallback ? 'chapter' : 'auto';
      if (kp.point) filled++;
      else if (before) emptied++;
      q.updatedAt = Date.now();
    });
    Store.save('questions');
    UI.closeAll();
    UI.toast('已重标 ' + todo.length + ' 道题：' + filled + ' 道有明确知识点' +
      (emptied ? '，' + emptied + ' 道证据不足留空' : ''), 'ok');
    /* 只重建被重标的那些卡片，别把整个题库列表再拼一遍 */
    if (!qCardsRefresh(todo.map(function (q) { return q.id; }))) App.refresh();
  }, overwrite ? '全部重标' : '补全');
}

function renderQuestions() {
  var arr = Store.state.questions;

  /* 编辑状态分类：待编辑（导入时缺公式）/ 已编辑（可直接用） */
  var ec = qEditCounts();
  var h = '';

  h += '<div class="mhead"><div><h2>题库</h2><div class="sub">共 ' + arr.length + ' 道题 · 按章节 / 知识点 / 题型 / 难度归档，可整表导入导出</div></div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +

    '<button class="btn btn-primary" data-act="imp-word"><svg><use href="#i-file"/></svg>导入 Word</button>' +
    '<button class="btn" data-act="new" data-col="questions"><svg><use href="#i-plus"/></svg>新增题目</button>' +
    '<button class="btn' + (QBatch.on ? ' btn-primary' : '') + '" data-act="qb-toggle"><svg><use href="#i-check"/></svg>' +
    (QBatch.on ? '退出批量' : '批量管理') + '</button></div></div>';

  h += '<div class="stats">' + statCard('题目总数', arr.length, '道', '', 'qStatAll') +
    statCard('待编辑', ec.todo, '道', ec.todo ? 'qstat-todo' : '', 'qStatTodo') +
    statCard('已编辑', ec.done, '道', 'qstat-done', 'qStatDone') +
    statCard('已配解析', withAnalysis, '道') + '</div>';

  h += '<div class="card mt12"><div class="card-b">' +
    '<div class="qsegrow">' +
    '<div class="seg" id="qSeg">' +
    qSegBtn('', '全部', ec.all) +
