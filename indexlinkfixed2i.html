    } else {
      var withAns = 0, withAna = 0, withImg = 0, imgN = 0, bytes = 0, lostTotal = 0;
      var poolSeen = [];
      WordQuiz.items.forEach(function (it) {
        if (String(it.answer || '').trim()) withAns++;
        if (String(it.analysis || '').trim()) withAna++;
        if ((it.imgs || []).length) { withImg++; imgN += it.imgs.length; }
        lostTotal += (it.lost || 0);
        /* 只统计真正被题目引用到的图，去重后算体积 */
        (it.imgs || []).forEach(function (p) {
          if (poolSeen.indexOf(p) < 0) { poolSeen.push(p); bytes += String(p.uri || '').length; }
        });
      });
      WordQuiz.imgBytes = bytes;
      var chapters = uniqSorted(WordQuiz.items.map(function (it) { return it.chapter; }));
      var bI = WordQuiz.batch;
      h += '<div class="mt12" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">' +
        (bI ? '<span class="chip b">' + bI.total + ' 份文件</span>' : '') +
        '<span class="chip b">识别到 ' + WordQuiz.items.length + ' 道大题</span>' +
        '<span class="chip">含 ' + (function () { var n = 0; WordQuiz.items.forEach(function (it) { n += it.subs || 0; }); return n; })() + ' 个小问</span>' +
        '<span class="chip">有答案 ' + withAns + '</span>' +
        '<span class="chip">有解析 ' + withAna + '</span>' +
        (imgN ? '<span class="chip a">含图 ' + withImg + ' 道 · ' + imgN + ' 张 · 约 ' + (bytes / 1048576).toFixed(1) + ' MB</span>' : '') +
        (WordQuiz.formulas ? '<span class="chip g">已还原公式 ' + WordQuiz.formulas + ' 处</span>' : '') +
        (lostTotal ? '<span class="chip r">缺公式 ' + lostTotal + ' 处</span>' : '') +
        '<span class="chip">章节 ' + chapters.length + ' 个</span>' +
        (bI && bI.dup ? '<span class="chip a">自动跳过重题 ' + bI.dup + ' 道</span>' : '') +
        '<span class="chip b" id="wqSelCount">已选 ' + WordQuiz.selCount() + ' 道</span></div>';
      if (WordQuiz.skippedImgs || lostTotal) {
        h += '<div class="banner mt12"><svg><use href="#i-alert"/></svg><div>' +
          (lostTotal ? '有 <b>' + lostTotal + '</b> 处公式没能自动还原成文字（少数特殊的 MathType / 矢量图格式），' +
            '已在这几道题上标出「缺 N 处公式」，需要你手动补。' : '') +
          (lostTotal && WordQuiz.skippedImgs ? ' ' : '') +
          (WordQuiz.skippedImgs ? '文档里有 <b>' + WordQuiz.skippedImgs + '</b> 个矢量图/非常见格式图片（EMF / WMF / TIFF）被跳过（多为公式预览图）。' : '') +
          '</div></div>';
      }
      if (bytes > 1572864) {
        h += '<div class="banner mt12"><svg><use href="#i-alert"/></svg><div>图片总量约 ' +
          (bytes / 1048576).toFixed(1) + ' MB，偏大。数据变大会影响同步速度，建议分批导入，或只勾选确实需要的题目。</div></div>';
      }
      h += '<div class="filters mt12"><button class="btn btn-sm" data-act="wq-all">全选</button>' +
        '<button class="btn btn-sm" data-act="wq-none">全不选</button>' +
        '<button class="btn btn-sm" data-act="wq-dedup-stem">清除重复题干</button>' +
        '<span class="text-xs text-m">识别不准的可以取消勾选，或点「并入上一题」把被切开的题合起来</span></div>';
      if (bI && bI.files.length) {
        h += '<div class="mt12"><div class="text-xs text-m" style="margin-bottom:2px">各文件解析情况（' +
          bI.errs.length + ' 份失败）</div>' + bI.files.map(wqFileRow).join('') + '</div>';
      }
      h += '<div class="list mt12" id="wqList" style="max-height:48vh;overflow-y:auto">' +
        WordQuiz.items.map(wqCard).join('') + '</div>';
    }
    $('#wqBody').innerHTML = h;
    WordQuiz.syncBtn();
  },

  syncBtn: function () {
    var b = document.querySelector('#maskWord [data-act="wq-import"]');
    if (!b) return;
    b.disabled = WordQuiz.busy || !WordQuiz.items.length;
    if (WordQuiz.busy) { b.textContent = '正在导入…'; return; }
    b.textContent = WordQuiz.items.length ? ('导入选中的 ' + WordQuiz.selCount() + ' 道题') : '导入题目';
  },

  selCount: function () {
    var n = 0;
    WordQuiz.items.forEach(function (_, i) { if (WordQuiz.sel[i]) n++; });
    return n;
  },

  /* 纯解析：段落 → 题目（含图片压缩与挂载）。不改动全局状态，批量导入时逐份调用 */
  parseItems: function (paras, srcName) {
    var poolIn = (paras && paras.imgs) || [];
    var jobs = poolIn.map(function (p) {
      return Files.shrinkImage(p.uri, 1000, 1400).then(function (r) {
        return {
          n: p.n, uri: r.uri, w: r.w || p.w || 0, h: r.h || p.h || 0,
          dispW: num(p.dispW) || 0, dispH: num(p.dispH) || 0,
          block: (p.block === undefined ? undefined : !!p.block)
        };
      });
    });
    return Promise.all(jobs).then(function (pool) {
      var items = wqAttachImgs(wqAttachTbls(wqParsePaper(paras, srcName), paras), pool);
      return { items: items, pool: pool, paras: paras };
    });
  },

  /* 解析段落 → 题目（单文件模式：写全局状态并渲染） */
  build: function (paras, srcName) {
    WordQuiz.skippedImgs = (paras && paras.skippedImgs) || 0;
    WordQuiz.formulas = (paras && paras.formulas) || 0;
    return WordQuiz.parseItems(paras, srcName).then(function (r) {
      WordQuiz.pool = r.pool;
      WordQuiz.paras = r.paras;
      WordQuiz.items = r.items;
      WordQuiz.sel = {};
      r.items.forEach(function (_, i) { WordQuiz.sel[i] = true; });
      WordQuiz.busy = false;   /* 解析已结束：先复位再重绘，否则导入按钮会一直停在「正在导入…」的禁用态 */
      WordQuiz.render();
      return r.items;
    });
  },

  /* 文件 → 段落（docx 走 ZIP 解析，txt/md 按行切段） */
  parasOf: function (f) {
    var lower = String(f.name || '').toLowerCase();
    return /\.docx$/.test(lower)
      ? Files.parseDocx(f)
      : Files.readText(f).then(function (t) {
          return String(t || '').split(/\r?\n/).map(function (x) { return { level: 0, text: x }; });
        });
  },

  /* ================= 批量导入 ================= */
  pickMulti: function () {
    if (WordQuiz.busy) return;
    Files.pickMulti('.docx,.txt,.md', function (files) { WordQuiz.runBatch(files); });
  },

  pickDir: function () {
    if (WordQuiz.busy) return;
    Files.pickMulti('.docx,.txt,.md', function (files) { WordQuiz.runBatch(files); }, true);
  },

  /* 整份文件列表 → 逐份解析 → 合并成一个待入库列表 */
  runBatch: function (files) {
    files = (files || []).filter(function (f) { return /\.(docx|txt|md)$/i.test(f.name || ''); });
    if (!files.length) { UI.toast('没有找到 Word / 文本文件（.docx / .txt / .md）', 'err'); return; }
    files.sort(function (a, b) { return wqNatural(a.name, b.name); });
    if (files.length > 80) {
      files = files.slice(0, 80);
      UI.toast('一次最多处理 80 份，已取前 80 份（按文件名顺序）', 'err');
    }

    WordQuiz.items = []; WordQuiz.sel = {}; WordQuiz.pool = []; WordQuiz.paras = [];
    WordQuiz.skippedImgs = 0; WordQuiz.formulas = 0; WordQuiz.imgBytes = 0;
    WordQuiz.err = ''; WordQuiz.pasteMode = false;
    WordQuiz.srcName = '共 ' + files.length + ' 份文件（批量导入）';
    WordQuiz.batch = { total: files.length, done: 0, cur: files[0].name, files: [], errs: [], dup: 0 };
    WordQuiz.busy = true;
    WordQuiz.render();

    var seen = {};            /* 跨文件去重：qKey → 在 acc 里的下标 */
    var acc = [];
    var chain = Promise.resolve();
    files.forEach(function (f) {
      chain = chain.then(function () {
        WordQuiz.batch.cur = f.name;
        WordQuiz.render();
        return WordQuiz.parasOf(f).then(function (paras) {
          return WordQuiz.parseItems(paras, f.name).then(function (r) {
            var rec = {
              name: f.name, n: 0, imgs: 0, lost: 0,
              skip: (paras.skippedImgs || 0), formula: (paras.formulas || 0)
            };
            var usedIm = {};
            r.items.forEach(function (it) {
              it.fromFile = f.name;
              rec.lost += (it.lost || 0);
              var k = qKey(it);
              if (seen[k] !== undefined) {
                WordQuiz.batch.dup++;
                /* 同一道题重复出现（最常见：同一份卷子的「原卷版 + 解析版」一起导）：
                   保留信息更全的那份 —— 原卷版先到、解析版后到时，绝不能让
                   「没答案没解析」的原卷版把解析版顶掉。 */
                if (wqItemWeight(it) > wqItemWeight(acc[seen[k]])) acc[seen[k]] = it;
                return;
              }
              seen[k] = acc.length;
              rec.n++;
              acc.push(it);
              (it.imgs || []).forEach(function (im) { usedIm[im.n] = 1; });
            });
            rec.imgs = Object.keys(usedIm).length;
            /* 图片池每份文件只并入一次；全部被去重的文件不并入，避免体积虚高 */
            if (rec.n) WordQuiz.pool = WordQuiz.pool.concat(r.pool || []);
            WordQuiz.skippedImgs += rec.skip;
            WordQuiz.formulas += rec.formula;
            WordQuiz.batch.files.push(rec);
          });
        }).catch(function (e) {
          WordQuiz.batch.errs.push(f.name);
          WordQuiz.batch.files.push({
            name: f.name, n: 0, imgs: 0, skip: 0, formula: 0,
            err: (e && e.message) ? e.message : '解析失败'
          });
        });
      }).then(function () {
        WordQuiz.batch.done++;
        if (WordQuiz.batch.done % 3 === 0) WordQuiz.render();   /* 别每份都重绘，长列表会卡 */
      });
    });

    chain.then(function () {
      WordQuiz.busy = false;
      WordQuiz.items = acc;
      WordQuiz.sel = {};
      acc.forEach(function (_, i) { WordQuiz.sel[i] = true; });
      WordQuiz.render();
      var m = acc.length;
      UI.toast('批量导入完成：' + files.length + ' 份文件 → ' + m + ' 道题' +
        (WordQuiz.batch.dup ? '（跳过重题 ' + WordQuiz.batch.dup + ' 道）' : '') +
        (WordQuiz.batch.errs.length ? '，' + WordQuiz.batch.errs.length + ' 份解析失败' : ''), 'ok');
    });
  },

  /* 清除「题干相同、题号不同」的重复题（保留信息更全的那道） */
  clearDupStem: function () {
    var out = [], seen = {}, removed = 0;
    function fp(it) {
      return String(it.stem || '').replace(/⟦[图表]\d+⟧/g, '').replace(/\s+/g, '').replace(/[，。、；：""''（）()【】\[\]．.]/g, '').slice(0, 30);
    }
    function score(it) {
      return (String(it.answer || '').trim() ? 2 : 0) + (String(it.analysis || '').trim() ? 1 : 0) +
        Math.min((it.imgs || []).length, 3) + Math.min((it.subs || 0) > 1 ? 2 : 0, 2) * 0.5;
    }
    WordQuiz.items.forEach(function (it) {
      var k = fp(it);
      if (k && seen[k] !== undefined) {
        var prev = out[seen[k]];
        if (score(it) > score(prev)) { out[seen[k]] = it; }
        removed++;
        return;
      }
      if (k) seen[k] = out.length;
      out.push(it);
    });
    if (!removed) { UI.toast('没有发现题干重复的题', 'ok'); return; }
    WordQuiz.items = out;
    WordQuiz.sel = {};
    out.forEach(function (_, i) { WordQuiz.sel[i] = true; });
    WordQuiz.render();
    UI.toast('已清除 ' + removed + ' 道重复题，剩 ' + out.length + ' 道', 'ok');
  },

  /* 拖拽：文件 / 整个文件夹 */
  bindDrop: function () {
    if (WordQuiz._dropBound) return;
    var mask = document.querySelector('#maskWord');
    if (!mask) return;
    WordQuiz._dropBound = true;
    ['dragenter', 'dragover'].forEach(function (t) {
      mask.addEventListener(t, function (e) { e.preventDefault(); e.stopPropagation(); mask.classList.add('wq-over'); });
    });
    mask.addEventListener('dragleave', function (e) {
      if (!mask.contains(e.relatedTarget)) mask.classList.remove('wq-over');
    });
    mask.addEventListener('drop', function (e) {
      e.preventDefault(); e.stopPropagation();
      mask.classList.remove('wq-over');
      if (WordQuiz.busy) return;
      WordQuiz.fromDrop(e.dataTransfer).then(function (files) {
        files = (files || []).filter(function (f) { return /\.(docx|txt|md)$/i.test(f.name || ''); });
        if (!files.length) { UI.toast('拖进来的内容里没有 .docx / .txt 文件', 'err'); return; }
        if (files.length === 1) {
          var f = files[0];
          WordQuiz.srcName = f.name; WordQuiz.err = ''; WordQuiz.batch = null;
          WordQuiz.items = []; WordQuiz.busy = true; WordQuiz.render();
          WordQuiz.parasOf(f).then(function (p) { return WordQuiz.build(p, f.name); }).then(function (items) {
            WordQuiz.busy = false;
            if (!items.length) UI.toast('没有识别到题目，可以试试「粘贴文字」或检查文档格式', 'err');
            else UI.toast('识别到 ' + items.length + ' 道题', 'ok');
          }).catch(function (err) {
            WordQuiz.busy = false;
            WordQuiz.err = (err && err.message) ? err.message : '解析失败';
            WordQuiz.render();
          });
          return;
        }
        WordQuiz.runBatch(files);
      });
    });
  },

  /* DataTransfer → File[]（递归展开文件夹，最多 3 层） */
  fromDrop: function (dt) {
    if (!dt) return Promise.resolve([]);
    var entries = [], items = dt.items;
    if (items && items.length) {
      for (var i = 0; i < items.length; i++) {
        if (items[i].kind !== 'file') continue;
        var en = items[i].webkitGetAsEntry ? items[i].webkitGetAsEntry() : null;
        if (en) entries.push(en);
      }
    }
    if (!entries.length) return Promise.resolve([].slice.call(dt.files || []));
    function walk(en, depth) {
      return new Promise(function (res) {
        if (!en) return res([]);
        if (en.isFile) { en.file(function (f) { res([f]); }, function () { res([]); }); return; }
        if (en.isDirectory && depth < 3) {
          var rd = en.createReader(), all = [];
          var read = function () {
            rd.readEntries(function (ents) {
              if (!ents.length) {
                Promise.all(all.map(function (x) { return walk(x, depth + 1); }))
                  .then(function (arrs) { res([].concat.apply([], arrs)); });
                return;
              }
              all = all.concat([].slice.call(ents));
              read();
            }, function () { res([]); });
          };
          read();
          return;
        }
        res([]);
      });
    }
    return Promise.all(entries.map(function (en) { return walk(en, 0); }))
      .then(function (arrs) { return [].concat.apply([], arrs); });
  },

  pick: function () {
    if (WordQuiz.busy) return;
    Files.pick('.docx,.txt,.md', function (f) { WordQuiz.acceptFile(f); });
  },

  /* 单文件解析入口：本弹窗选择 / 表格导入弹窗转交，都走这里 */
  acceptFile: function (f) {
    if (!f) return;
    WordQuiz.busy = true;
    WordQuiz.srcName = f.name; WordQuiz.err = ''; WordQuiz.pasteMode = false;
    WordQuiz.batch = null;
    WordQuiz.items = []; WordQuiz.render();
    WordQuiz.parasOf(f).then(function (paras) {
      return WordQuiz.build(paras, f.name);
    }).then(function (items) {
      WordQuiz.busy = false;
      if (!items || !items.length) {
        UI.toast('没有识别到题目，可以试试「粘贴文字」或检查文档格式', 'err');
      } else {
        UI.toast('识别到 ' + items.length + ' 道题' + (WordQuiz.pool.length ? '，含 ' + WordQuiz.pool.length + ' 张插图' : ''), 'ok');
        if (items.__totalNote) UI.toast(items.__totalNote, /不一致/.test(items.__totalNote) ? 'err' : 'ok');
      }
    }).catch(function (err) {
      WordQuiz.busy = false;
      WordQuiz.err = (err && err.message) ? err.message : '解析失败';
      WordQuiz.items = [];
      WordQuiz.render();
    });
  },

  usePaste: function () {
    var t = WordQuiz.pasteText || '';
    if (!t.trim()) { UI.toast('请先粘贴内容', 'err'); return; }
    WordQuiz.srcName = '粘贴的内容';
    WordQuiz.err = '';
    WordQuiz.build(String(t).split(/\r?\n/).map(function (x) { return { level: 0, text: x }; })).then(function (items) {
      if (!items.length) UI.toast('没有识别到题目', 'err');
      else UI.toast('识别到 ' + items.length + ' 道题', 'ok');
    });
  },

  /* 换一种识别方式重切一遍（图片不用再压一次） */
  reparse: function () {
    if (!WordQuiz.paras || !WordQuiz.paras.length) return;
    var items = wqAttachImgs(wqAttachTbls(wqParsePaper(WordQuiz.paras, WordQuiz.srcName), WordQuiz.paras), WordQuiz.pool);
    WordQuiz.items = items;
    WordQuiz.sel = {};
    items.forEach(function (_, i) { WordQuiz.sel[i] = true; });
    WordQuiz.render();
    UI.toast('已按新设置重新识别，共 ' + items.length + ' 道题', 'ok');
  },

  setSel: function (i, on) {
    WordQuiz.sel[i] = !!on;
    var cards = $$('#wqList > .card');
    if (cards[i]) cards[i].style.opacity = on ? '' : '.5';
    var c = $('#wqSelCount');
    if (c) c.textContent = '已选 ' + WordQuiz.selCount() + ' 道';
    WordQuiz.syncBtn();
  },

  /* 点预览卡上的知识点标签：在「主知识点 → 次知识点 → 留空」之间轮换。
     轮换过的题打上 kpManual，后面的「重新识别知识点」不会再覆盖它。 */
  cyclePoint: function (i) {
    var it = WordQuiz.items[i];
    if (!it) return;
    var list = [];
    if (it.point) list.push(it.point);
    (it.kpAlts || []).forEach(function (a) { if (list.indexOf(a) < 0) list.push(a); });
    /* 没备选（或本来就没标出来）时，把算法给的候选排名也接进来，
       保证点一下总能切到一个「具体的知识点」，不会卡在空白上 */
    if (list.length < 2) {
      ((wqTagKnowledge(it).ranked) || []).forEach(function (r) {
        if (list.indexOf(r.label) < 0) list.push(r.label);
      });
    }
    list.push('');
    var cur = list.indexOf(it.point);
    if (cur < 0) cur = 0;
    var next = list[(cur + 1) % list.length];

    it.tags = it.tags || [];
    /* 撤销上一轮自动写入标签的考点 */
    (it.kpAdded || []).forEach(function (a) {
      var k = it.tags.indexOf(a);
      if (k >= 0) it.tags.splice(k, 1);
    });
    it.kpAdded = [];
    it.point = next;
    it.kpManual = true;
    if (!it.tags.length && it.point) it.tags = [it.point];
    if (next) {
      (it.kpAlts || []).forEach(function (a) {
        if (a !== next && it.tags.indexOf(a) < 0) { it.tags.push(a); it.kpAdded.push(a); }
      });
    }
    WordQuiz.render();
  },

  /* 按当前规则把这一批题的知识点全部重算一遍（老师手点改过的不动） */
  retagAll: function () {
    var n = 0, kept = 0;
    WordQuiz.items.forEach(function (it) {
      if (it.kpManual) { kept++; return; }
      wqApplyKp(it);
      n++;
    });
    WordQuiz.render();
    UI.toast('已重新识别 ' + n + ' 道题的知识点' + (kept ? '（' + kept + ' 道你手动改过的保持不动）' : ''), 'ok');
  },

  merge: function (i) {
    var a = WordQuiz.items[i - 1], b = WordQuiz.items[i];
    if (!a || !b) return;
    a.stem = wqJoin(a.stem, b.stem);
    if (b.options) a.options = wqJoin(a.options, b.options);
    if (b.answer) a.answer = wqJoin(a.answer, b.answer);
    if (b.analysis) a.analysis = wqJoin(a.analysis, b.analysis);
    /* 标签先并起来去重（知识点那几个由下面的重算统一收口） */
    a.tags = (a.tags || []).concat(b.tags || []).filter(function (x, k, arr) { return arr.indexOf(x) === k; });
    /* 题干变了，知识点跟着重算一遍（老师手点改过的保持不动） */
    if (WQ_KP_AUTO && !a.kpManual && !b.kpManual) wqApplyKp(a);
    if (!a.level && b.level) a.level = b.level;
    if (!a.source && b.source) a.source = b.source;
    if (!a.qtype && b.qtype) a.qtype = b.qtype;
    a.imgs = (a.imgs || []).concat(b.imgs || []);
    WordQuiz.items.splice(i, 1);
    var old = WordQuiz.sel, ns = {};
    WordQuiz.items.forEach(function (_, k) {
      if (k === i - 1) ns[k] = (old[i - 1] !== false) || (old[i] !== false);
      else ns[k] = old[k < i ? k : k + 1];
    });
    WordQuiz.sel = ns;
    WordQuiz.render();
  },

  run: function () {
    var picked = [];
    WordQuiz.items.forEach(function (it, i) { if (WordQuiz.sel[i]) picked.push(it); });
    if (!picked.length) { UI.toast('请至少勾选一道题', 'err'); return; }
    var rows = picked.map(function (it) {
      var seenN = {}, imgs = [];
      (it.imgs || []).forEach(function (im) {
        if (!im || seenN[im.n]) return;
        seenN[im.n] = 1;
        imgs.push({
          n: im.n, uri: im.uri, w: im.w || 0, h: im.h || 0,
          dispW: num(im.dispW) || 0, dispH: num(im.dispH) || 0, block: im.block
        });
      });
      return {
        code: it.code, chapter: it.chapter, point: it.point, qtype: it.qtype, level: it.level,
        score: num(it.score) || 0,                 /* 大题分值（来自「共X分」） */
        stem: it.stem, options: it.options, answer: it.answer, analysis: it.analysis,
        tags: (it.tags || []).join(','), source: it.source, images: imgs,
        /* 读不出来的公式（MathType 矢量图）处数：>0 的题入库后归入「待编辑」 */
        lost: num(it.lost) || 0,
        /* 表格：与图片同样按 ⟦表N⟧ 引用，结构化存下来，渲染时还原成真表格 */
        tables: (it.tables || []).map(function (t) {
          return { n: t.n, rows: (t.rows || []).map(function (r) {
            return (r || []).map(function (c) {
              var o = { t: (c && c.t) || '', cs: (c && c.cs) || 1, rs: (c && c.rs) || 1, head: !!(c && c.head) };
              if (c && c.vc) o.vc = 1;
              return o;
            });
          }) };
        })
      };
    });
    Import.snapshot();
    var res;
    try { res = Commit.questions(rows); }
    catch (e) { UI.toast('导入失败：' + (e && e.message ? e.message : '未知错误'), 'err'); return; }
    Store.persist();
    UI.closeMask('#maskWord');
    var imgN = 0;
    picked.forEach(function (it) { imgN += (it.imgs || []).length; });
    UI.toast('导入完成：新增 ' + res.added + '，更新 ' + res.updated + '，跳过 ' + res.skipped +
      (imgN ? '，图片 ' + imgN + ' 张' : '') +
      (res.todo ? '；' + res.todo + ' 道缺公式已归入「待编辑」' : ''), 'ok');
    /* 有缺公式的题就直接把题库切到「待编辑」，老师接着补就行 */
    if (res.todo) QFilter.edit = 'todo';
    App.refresh();
  }
};

/* 批量导入：文件名自然排序（1.docx < 2.docx < 10.docx） */
function wqNatural(a, b) {
  var ax = String(a || '').match(/(\d+|\D+)/g) || [], bx = String(b || '').match(/(\d+|\D+)/g) || [];
  var n = Math.max(ax.length, bx.length);
  for (var i = 0; i < n; i++) {
    var x = ax[i], y = bx[i];
    if (x === undefined) return -1;
    if (y === undefined) return 1;
    var nx = /^\d+$/.test(x), ny = /^\d+$/.test(y);
    if (nx && ny) { if (+x !== +y) return (+x) - (+y); }
    else if (x !== y) return x < y ? -1 : 1;
  }
  return 0;
}

/* 批量导入：单个文件的解析结果行 */
function wqFileRow(r) {
  var st = r.err ? ('失败：' + r.err)
    : (r.n + ' 题' + (r.imgs ? ' · 图 ' + r.imgs : '') +
       (r.formula ? ' · 公式 ' + r.formula : '') + (r.lost ? ' · 缺公式 ' + r.lost : ''));
  return '<div class="wqrow' + (r.err ? ' err' : '') + '">' +
    '<span class="nm" title="' + esc(r.name) + '">' + esc(r.name) + '</span>' +
    '<span class="st">' + esc(st) + '</span></div>';
}

/* 按当前规则重算一道题的知识点，并同步标签里那几个自动写入的「分类·考点」。
 * 老师在预览里手点改过（kpManual）的不动 —— 人工判断优先于算法。 */
function wqApplyKp(it) {
  if (!it) return null;
  it.tags = it.tags || [];
  var kp = wqTagKnowledge(it);
  /* 上一轮自动写进标签的考点先撤掉，免得越积越多 */
  (it.kpAdded || []).forEach(function (a) {
    var k = it.tags.indexOf(a);
    if (k >= 0) it.tags.splice(k, 1);
  });
  it.kpAdded = [];
  it.point = kp.point;
  it.kpConf = kp.conf;
  it.kpWhy = kp.why;
  it.kpAlts = (kp.alts || []).slice();
  /* chapterFallback=true 表示这道题是按「章节标题」粗定位的（证据偏弱），单独标记，
     导入预览和题卡上会给一个「章」角标，提醒老师核对具体考点 */
  it.kpSrc = kp.chapterFallback ? 'chapter' : 'auto';
  if (!it.tags.length && it.point) it.tags = [it.point];
  (kp.alts || []).forEach(function (a) {
    if (it.tags.indexOf(a) < 0) { it.tags.push(a); it.kpAdded.push(a); }
  });
  return kp;
}

/* 导入预览里的知识点标签：
 *   颜色 = 置信度（绿 高 / 蓝 中 / 橙 低），悬停能看到命中了哪些特征词；
 *   点一下可以在「主知识点 → 次知识点 → 留空」之间轮换，临场就能纠正。 */
function kpChip(point, conf, why, i, src) {
  var chap = src === 'chapter';
  var cls = conf === '高' ? 'g' : (conf === '中' ? 'b' : (conf === '低' ? 'a' : ''));
  var tip = '知识点：' + point +
    (conf ? '（置信度 ' + conf + '）' : '') +
    (chap ? '（按章节标题推断，建议核对具体考点）' : '') +
    (why ? '\n命中依据：' + why : '') +
    '\n点击可在 主知识点 / 次知识点 / 留空 之间切换';
  var badge = chap ? ' 章' : (conf === '低' ? ' ?' : '');
  return '<span class="chip ' + cls + '" data-act="wq-kp" data-i="' + i + '" style="cursor:pointer" title="' + esc(tip) + '">' +
    esc(point) + badge + '</span>';
}

    (imgs.length ? '<span class="chip a">图 ' + imgs.length + ' 张</span>' : '') +

    (String(it.analysis || '').trim() ? '<span class="chip g">有解析</span>' : '') +

    (imgs.length ? '<div class="wqthumb">' + imgs.map(function (im) {
      var tw = qImgWidth(im);
      return '<img src="' + esc(im.uri) + '" alt="插图" data-act="q-img"' +
        (tw ? ' style="width:' + Math.min(tw, 240) + 'px;max-width:100%;height:auto;max-height:none"' : '') + '>';
    }).join('') + '</div>' : '') +
    (optN ? '<div class="text-xs text-m mt8">选项 ' + optN + ' 项</div>' : '') +
    '</div>' +
    (i > 0 ? '<div><button class="btn btn-sm" data-act="wq-merge" data-i="' + i + '">并入上一题</button></div>' : '') +
    '</div></div></div>';
  return h;
}

/* ===== 45-paper.js ===== */

/* =========================================================
 * 组卷：从题库里挑题拼成一套新试卷（可导出 Word / 打印 PDF）
 * 试卷记录 papers: { id, title, subtitle, date, duration, note,
 *                    items:[{qid,score}], showAnswer }
 * 纯函数 paperResolve / paperStats / paperAutoPick / paperToText 便于单独测试
 * =======================================================*/

/* 试卷条目 → 解析出对应的题库记录（题目被删掉时给出占位，不静默丢弃） */
function paperResolve(rec) {
  var out = [];
  ((rec && rec.items) || []).forEach(function (it, i) {
    var q = (it && it.qid) ? byId(Store.state.questions, it.qid) : null;
    out.push({ no: i + 1, q: q, qid: (it && it.qid) || '', score: num(it && it.score), missing: !q });
  });
  return out;
}

function paperStats(rec) {
  var list = paperResolve(rec);
  var total = list.reduce(function (a, b) { return a + num(b.score); }, 0);
  var chapters = uniqSorted(list.map(function (r) { return r.q && r.q.chapter; }));
  var miss = list.filter(function (r) { return r.missing; }).length;
  return { n: list.length, total: total, chapters: chapters, missing: miss };
}

/* 每道题被组进过几次 —— 智能组卷优先挑还没怎么用过的题 */
function paperUsage() {
  var use = {};
  (Store.state.papers || []).forEach(function (p) {
    (p.items || []).forEach(function (it) { if (it && it.qid) use[it.qid] = (use[it.qid] || 0) + 1; });
  });
  return use;
}

function paperDefaultScore(q) {
  if (!q) return 0;
  if (q.qtype === '选择题') return 5;
  if (q.qtype === '填空题') return 4;
  return 8;
}

function paperFileName(rec) {
  var t = String((rec && rec.title) || '试卷').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40);
  return t + '_' + ((rec && rec.date) || todayStr()) + '.docx';
}

/* 智能组卷（纯函数：题库由 opts.qs 注入，便于测试）
 * opts: { qs, n, levels:{基础/较易/中等/较难/压轴}, perScore, chapter, point, qtype, keyword, exclude:[qid], used:{qid:次数} } */
function paperAutoPick(opts) {
  opts = opts || {};
  var bank = opts.qs || [], exclude = {}, used = opts.used || {};
  (opts.exclude || []).forEach(function (id) { exclude[id] = 1; });
  var kw = String(opts.keyword || '').trim().toLowerCase();
  var pool = bank.filter(function (q) {
    if (!q || !q.id || exclude[q.id]) return false;
    if (opts.chapter && (q.chapter || '') !== opts.chapter) return false;
    if (opts.point && (q.point || '') !== opts.point) return false;
    if (opts.qtype && (q.qtype || '') !== opts.qtype) return false;
    if (kw) {
      var hay = [q.code, q.chapter, q.point, q.qtype, q.stem, q.options, (q.tags || []).join(' '), q.source].join(' ').toLowerCase();
      if (hay.indexOf(kw) < 0) return false;
    }
    return true;
  });
  /* 用得少的排前面，同档随机 */
  pool = pool.map(function (q) { return { q: q, u: used[q.id] || 0, r: Math.random() }; })
    .sort(function (a, b) { return (a.u - b.u) || (a.r - b.r); })
    .map(function (x) { return x.q; });

  var lv = opts.levels || {};
  var want = {};
  LEVELS.forEach(function (L) { want[L] = num(lv[L]); });
  var lvSum = LEVELS.reduce(function (a, L) { return a + (want[L] || 0); }, 0);
  var picks = [];
  if (lvSum > 0) {
    /* 指定了难度配比：先按等级分桶各取所需，不够再用剩下的补足 */
    var byLv = {}; LEVELS.forEach(function (L) { byLv[L] = []; }); byLv[''] = [];
    pool.forEach(function (q) {
      var k = (LEVELS.indexOf(q.level) >= 0) ? q.level : '';
      byLv[k].push(q);
    });
    LEVELS.forEach(function (k) {
      for (var i = 0; i < want[k] && byLv[k].length; i++) picks.push(byLv[k].shift());
    });
    var rest = []; LEVELS.forEach(function (L) { rest = rest.concat(byLv[L]); }); rest = rest.concat(byLv['']);
    while (picks.length < lvSum && rest.length) picks.push(rest.shift());
  } else {
    /* 没指定难度：直接沿用上面的排序（用得少的题优先），不要按等级打乱 */
    picks = pool.slice(0, num(opts.n, 10));
  }
  return picks.map(function (q) {
    return { qid: q.id, score: opts.perScore ? num(opts.perScore) : paperDefaultScore(q) };
  });
}

/* 试卷 → 纯文本（复制到微信 / 文档） */
function paperToText(rec, withAnswer) {
  var list = paperResolve(rec), st = paperStats(rec), L = [];
  L.push(rec.title || '试卷');
  var meta = [rec.subtitle, rec.date, rec.duration ? '时间：' + rec.duration : '', '满分：' + st.total + '分']
    .filter(function (x) { return String(x || '').trim(); });
  if (meta.length) L.push(meta.join('　'));
  L.push('');
  list.forEach(function (r) {
    if (!r.q) { L.push(r.no + '．（' + r.score + '分）（此题已从题库删除）'); return; }
    L.push(r.no + '．（' + r.score + '分）' + qPlainQ(r.q.stem, r.q).trim());
    var optP = qOpts(r.q);
    if (optP) L.push(qPlainQ(optP, r.q).trim());
  });
  if (withAnswer) {
    L.push('');
    L.push('【参考答案与解析】');
    list.forEach(function (r) {
      if (!r.q) return;
      L.push('');
      L.push(r.no + '．' + (qPlainQ(r.q.answer, r.q).trim() || '（未填答案）'));
      if (String(r.q.analysis || '').trim()) L.push('解析：' + qPlainQ(r.q.analysis, r.q).trim());
    });
  }
  return L.join('\n');
}

/* 试卷 → 排好版的 HTML（预览与打印共用同一份内容） */
function paperBodyHtml(rec, withAnswer) {
  var list = paperResolve(rec), st = paperStats(rec), h = '';
  h += '<h1>' + esc(rec.title || '试卷') + '</h1>';
  var meta = [rec.subtitle, rec.date, rec.duration ? '时间：' + rec.duration : '', '满分：' + st.total + '分']
    .filter(function (x) { return String(x || '').trim(); });
  if (meta.length) h += '<div class="pm">' + esc(meta.join('　|　')) + '</div>';
  h += '<div class="pm">姓名：____________　　班级：____________　　得分：__________</div>';
  list.forEach(function (r) {
    if (!r.q) { h += '<div class="pq"><div class="ph qtext">' + r.no + '．（' + r.score + '分）（此题已从题库删除）</div></div>'; return; }
    h += '<div class="pq"><div class="ph qtext">' + r.no + '．（' + r.score + '分）' + qStemHtml(r.q) + '</div>';
    var optsH = qOpts(r.q);
    if (optsH) h += '<div class="po qtext">' + qRichText(optsH, r.q) + '</div>';
    h += '</div>';
  });
  if (withAnswer) {
    h += '<div class="ans"><h2>参考答案与解析</h2>';
    list.forEach(function (r) {
      if (!r.q) return;
      h += '<div class="pq"><div class="ph qtext">' + r.no + '．' + (qRichText(r.q.answer, r.q) || '（未填答案）') + '</div>';
      if (String(r.q.analysis || '').trim()) h += '<div class="po qtext">解析：' + qRichText(r.q.analysis, r.q) + '</div>';
      h += '</div>';
    });
    h += '</div>';
  }
  return h;
}

/* 打印 / PDF：
   托管在资料库里时页面外面裹着一层 sandbox iframe（不含 allow-downloads，
   部分嵌套场景连沙箱内的 print 也不放行），所以统一交给 OutBox，
   在一个脱离沙箱的独立窗口里渲染并拉起浏览器打印（→「另存为 PDF」）。
   独立打开时退回原来的隐藏 iframe 打印，不多开窗口。 */
function printHTML(html) {
  OutBox.printHtml(html);
}

/* 导出 / 打印的兜底：任一步出错都明确报出来，
   避免「点了按钮，界面没反应、也不知道为什么」 */
function exportGuard(what, fn) {
  try { fn(); }
  catch (e) {
    UI.toast(what + '失败：' + (e && e.message ? e.message : String(e)), 'err');
    try { console.error('[export] ' + what, e); } catch (x) { }
  }
}

/* ============ 片段序列 → Word 块（与 HTML 渲染同源，图表位置 / 尺寸完全一致） ============
   · 文字      → 段落里的 run（\n 换成换行符）
   · 行内图    → 直接嵌进当前段落的 runs，跟文字同一行（跟 HTML 的 inline-block 一致）
   · 独占一行图 → 单独成段、居中（跟 HTML 的 .qimg-block 一致）
   · 表格      → 真正的 Word 表格（body 级元素，只能单独成块） */
function docxTblBlock(tb) {
  return {
    t: 'table',
    rows: ((tb && tb.rows) || []).map(function (r) {
      return (r || []).map(function (c) {
        var o = { t: qPlain((c && c.t) || ''), cs: (c && c.cs) || 1, rs: (c && c.rs) || 1, head: !!(c && c.head) };
        if (c && c.vc) o.vc = 1;
        return o;
      });
    })
  };
}
function docxSegs(out, segs, q, after, lead) {
  var runs = [];
  function pushText(s) {
    String(s == null ? '' : s).split('\n').forEach(function (ln, i) {
      if (i) runs.push({ k: 'br' });
      if (ln) runs.push({ k: 'tx', s: ln });
    });
  }
  function flush() {
    if (!runs.length) return;
    out.push({ t: 'para', runs: runs, align: 'both', size: 21, spacing: { after: after || 60 } });
    runs = [];
  }
  if (lead) pushText(lead);
  (segs || []).forEach(function (sg) {
    if (sg.k === 't') { pushText(sg.s); return; }
    if (sg.k === 'img') {
      if (!sg.im || !sg.im.uri) { pushText('〔插图〕'); return; }
      var d = Files.dataUrlBytes(sg.im.uri);
      if (!d) return;
      var img = { n: sg.im.n, bytes: d.bytes, mime: d.mime, w: num(sg.im.w), h: num(sg.im.h), px: qImgWidth(sg.im) };
      if (qImgBlock(sg.im)) { flush(); out.push({ t: 'img', img: img, align: 'center' }); }
      else runs.push({ k: 'img', img: img });
      return;
    }
    if (sg.k === 'tbl') { flush(); out.push(docxTblBlock(sg.t)); }
  });
  flush();
}
/* 一段文字（含图表标记）→ Word 块 */
function docxRich(out, s, q, after) { docxSegs(out, qSegs(s, q), q, after); }
/* 题干 → Word 块；lead 是前缀（如「1．（6 分）」），未引用到的图表会补在末尾（防丢图） */
function docxStem(out, lead, q, after) { docxSegs(out, qStemSegs(q), q, after, lead); }

/* 试卷 → Word 文档块（含插图）。段落间距与 HTML 预览的 CSS 一一对应：
   .paper h1 / .paper .pm 都是 6px 下边距，.pq 之间 11px、题干与选项之间 2px */
function paperDocxBlocks(rec, withAnswer) {
  var list = paperResolve(rec), st = paperStats(rec), out = [];
  out.push({ text: rec.title || '试卷', align: 'center', bold: true, size: 36, spacing: { after: 90 } });
  var meta = [rec.subtitle, rec.date, rec.duration ? '时间：' + rec.duration : '', '满分：' + st.total + '分']
    .filter(function (x) { return String(x || '').trim(); });
  if (meta.length) out.push({ text: meta.join('　　'), align: 'center', size: 21, spacing: { after: 90 } });
  out.push({ text: '姓名：______________　　班级：______________　　得分：__________', size: 21, spacing: { after: 90 } });
  /* 与 HTML 预览（paperBodyHtml）逐步对齐：题号+分值+题干 → 选项 → 答案 → 解析 */
  list.forEach(function (r) {
    var st0 = out.length;
    if (!r.q) { out.push({ text: r.no + '．（' + r.score + '分）（此题已从题库删除）', spacing: { after: 170 } }); return; }
    docxStem(out, r.no + '．（' + r.score + '分）', r.q, 30);
    var opts = qOpts(r.q);
    if (opts) docxRich(out, opts, r.q, 170);
    /* 一道题的段落尽量不跨页断开（对应 HTML 的 page-break-inside:avoid）：
       除本題最后一个块外，都标记「与下一段同页」 */
    for (var bi = st0; bi < out.length - 1; bi++) out[bi].keepNext = true;
  });
  if (withAnswer) {
    out.push({ text: '' });
    /* 对应 HTML 的 .ans{border-top:1px dashed} */
    out.push({ text: '参考答案与解析', align: 'center', bold: true, size: 28, spacing: { after: 120 }, borderTop: true });
    list.forEach(function (r) {
      var st1 = out.length;
      if (!r.q) return;
      docxRich(out, r.no + '．' + (String(r.q.answer || '').trim() || '（未填答案）'), r.q, 30);
      if (String(r.q.analysis || '').trim()) docxRich(out, '解析：' + r.q.analysis, r.q, 170);
      for (var bi2 = st1; bi2 < out.length - 1; bi2++) out[bi2].keepNext = true;
    });
  }
  return out;
}

function applyPaperFilter() {
  var q = '';
  var el = $('#paperQ');
  if (el) q = String(el.value || '').trim().toLowerCase();
  var cards = $$('#paperList > [data-f]');
  var shown = 0;
  cards.forEach(function (c) {
    var ok = !q || (c.getAttribute('data-f') || '').indexOf(q) >= 0;
    c.classList.toggle('hidden', !ok);
    if (ok) shown++;
  });
  var box = $('#paperCount');
  if (box) box.textContent = cards.length ? ('显示 ' + shown + ' / ' + cards.length + ' 套试卷') : '';
  var tip = $('#paperEmpty');
  if (tip) tip.classList.toggle('hidden', !(cards.length && !shown));
}

/* ---------------- 组卷编辑器 ---------------- */
var PaperB = {
  id: '', title: '', subtitle: '', date: '', duration: '', note: '',
  items: [], showAnswer: true,
  pickN: 10, pickLv: [0, 0, 0, 0, 0],
  filt: { kw: '', chapter: '', point: '', qtype: '', level: '' },
  prevRec: null,

  open: function (id) {
    var rec = id ? byId(Store.state.papers, id) : null;
    PaperB.id = id || '';
    PaperB.title = rec ? (rec.title || '') : '';
    PaperB.subtitle = rec ? (rec.subtitle || '') : '';
    PaperB.date = rec ? (rec.date || todayStr()) : todayStr();
    PaperB.duration = rec ? (rec.duration || '') : '';
    PaperB.note = rec ? (rec.note || '') : '';
    PaperB.showAnswer = rec ? rec.showAnswer !== false : true;
    PaperB.items = ((rec && rec.items) || []).map(function (it) { return { qid: it.qid, score: num(it.score) }; });
    PaperB.filt = { kw: '', chapter: '', point: '', qtype: '', level: '' };
    PaperB.pickN = 10; PaperB.pickLv = [0, 0, 0, 0, 0];
    PaperB.render();
    if ($('#pbTitle')) $('#pbTitle').textContent = id ? '编辑试卷' : '新建试卷';
    if ($('#pbDel')) $('#pbDel').classList.toggle('hidden', !id);
    UI.openMask('#maskPaper');
  },

  has: function (qid) {
    for (var i = 0; i < PaperB.items.length; i++) if (PaperB.items[i].qid === qid) return true;
    return false;
  },

  add: function (qid) {
    if (PaperB.has(qid)) return;
    var q = byId(Store.state.questions, qid);
    PaperB.items.push({ qid: qid, score: paperDefaultScore(q) });
  },

  toggle: function (qid) {
    if (PaperB.has(qid)) {
      PaperB.items = PaperB.items.filter(function (it) { return it.qid !== qid; });
    } else PaperB.add(qid);
    PaperB.renderBank(); PaperB.renderSel();
  },

  render: function () {
    var bank = Store.state.questions || [];
    var h = '';
    h += '<div class="note">从题库挑题组成新试卷：左边点题目加入，右边调顺序和分值，然后导出 Word 或打印。' +
      '「智能组卷」按题量和难度自动挑一批题，优先挑还没被组过的。</div>';
    h += '<div class="frow mt12">' +
      '<div class="field"><label>试卷名称 <span class="req">*</span></label><input class="input" data-act="pb-f-title" value="' + esc(PaperB.title) + '" placeholder="如 化学平衡专题测试"></div>' +
      '<div class="field"><label>年级 / 班级</label><input class="input" data-act="pb-f-subtitle" value="' + esc(PaperB.subtitle) + '" placeholder="如 初三（3）班"></div>' +
      '</div>';
    h += '<div class="frow">' +
      '<div class="field"><label>日期</label><input class="input" type="date" data-act="pb-f-date" value="' + esc(PaperB.date) + '"></div>' +
      '<div class="field"><label>建议时长</label><input class="input" data-act="pb-f-duration" value="' + esc(PaperB.duration) + '" placeholder="如 45 分钟"></div>' +
      '</div>';

    h += '<div class="pgrid">';
    h += '<div class="card" style="margin:0"><div class="card-h"><h3>题库</h3><span class="sp"></span><span class="text-xs text-m" id="pbBankN"></span></div><div class="card-b">';
    h += '<div class="filters">' +
      '<input class="input" data-act="pb-f-kw" value="' + esc(PaperB.filt.kw) + '" placeholder="搜索题干 / 标签 / 来源" style="flex:1;min-width:120px">' +
      qSel('pb-f-chapter', '全部章节', uniqSorted(bank.map(function (q) { return q.chapter; })), PaperB.filt.chapter) +
      qSel('pb-f-point', '全部知识点', uniqSorted(bank.map(function (q) { return q.point; })), PaperB.filt.point) +
      qSel('pb-f-qtype', '全部题型', uniqSorted(bank.map(function (q) { return q.qtype; })), PaperB.filt.qtype) +
      qSel('pb-f-level', '全部难度', LEVELS, PaperB.filt.level) +
      '</div>';
    h += '<div class="filters mt8">' +
      '<span class="text-xs text-m">智能组卷</span>' +
      '<input class="input" type="number" min="1" data-act="pb-n" value="' + PaperB.pickN + '" style="width:64px" title="题量">' +
      '<span class="text-xs text-m">题</span>' +
      LEVELS.map(function (L, i) {
        return '<span class="text-xs text-m">' + esc(L) + '</span><input class="input" type="number" min="0" data-act="pb-lv" data-i="' + i + '" value="' + (PaperB.pickLv[i] || 0) + '" style="width:44px">';
      }).join('') +
      '<button class="btn btn-sm" data-act="pb-auto"><svg><use href="#i-sync"/></svg>智能组卷</button>' +
      '</div>';
    h += '<div class="picklist mt8" id="pbBank"></div><div class="pbpager" id="pbPager" style="position:sticky;bottom:8px;z-index:6;background:var(--card,#fff);border:1px solid var(--line-soft);border-radius:10px;margin-top:10px"></div></div></div>';

    h += '<div class="card" style="margin:0"><div class="card-h"><h3>已选题目</h3><span class="sp"></span>' +
      '<span class="chip b" id="pbCount">0 道</span>' +
      '<button class="btn btn-sm btn-ghost" data-act="pb-clear">清空</button></div>' +
      '<div class="card-b"><div class="selist" id="pbSel"></div>' +
      '<div class="mt8 text-xs text-m" id="pbMeta"></div></div></div>';
    h += '</div>';

    $('#pbBody').innerHTML = h;
    PaperB.renderBank(); PaperB.renderSel();
  },

  renderBank: function () {
    var box = $('#pbBank');
    if (!box) return;
    if (typeof PaperB.bankPage !== 'number') PaperB.bankPage = 0;
    if (!PaperB.bankSize) PaperB.bankSize = 100;
    var f = PaperB.filt, kw = String(f.kw || '').trim().toLowerCase();
    var all = Store.state.questions || [];
    var list = all.filter(function (q) {
      if (f.chapter && (q.chapter || '') !== f.chapter) return false;
      if (f.point && (q.point || '') !== f.point) return false;
      if (f.qtype && (q.qtype || '') !== f.qtype) return false;
      if (f.level && (q.level || '') !== f.level) return false;
      if (kw) {
        var hay = [q.code, q.chapter, q.point, q.qtype, q.stem, q.options, (q.tags || []).join(' '), q.source].join(' ').toLowerCase();
        if (hay.indexOf(kw) < 0) return false;
      }
      return true;
    });
    /* 过滤条件没变就保留当前页；变了则回到第一页（避免翻到空页） */
    var sig = JSON.stringify([f.chapter, f.point, f.qtype, f.level, kw, all.length]);
    if (sig !== PaperB._bankSig) { PaperB.bankPage = 0; PaperB._bankSig = sig; }
    PaperB._bankList = list;
    var totalPages = list.length ? Math.max(1, Math.ceil(list.length / PaperB.bankSize)) : 1;
    if (PaperB.bankPage < 0) PaperB.bankPage = 0;
    if (PaperB.bankPage >= totalPages) PaperB.bankPage = totalPages - 1;
    var start = PaperB.bankPage * PaperB.bankSize;
    var slice = list.slice(start, start + PaperB.bankSize);
    box.innerHTML = slice.length ? slice.map(pbBankRow).join('')
      : emptyBox(all.length ? '没有符合条件的题目，试试放宽筛选' : '题库还是空的，先到「题库」导入试卷', 'i-book');
    var n = $('#pbBankN');
    if (n) n.textContent = (list.length === all.length) ? ('共 ' + all.length + ' 道') : ('显示 ' + list.length + ' / ' + all.length + ' 道');
    PaperB.renderBankPager();
  },
  renderBankPager: function () {
    var p = $('#pbPager');
    if (!p) return;
    var list = PaperB._bankList || [];
    if (!list.length) { p.innerHTML = ''; return; }
    var size = PaperB.bankSize || 100;
    var totalPages = Math.max(1, Math.ceil(list.length / size));
    var sizes = [50, 100, 200, 500];
    var sizeOpts = sizes.map(function (s) { return '<option value="' + s + '"' + (s === size ? ' selected' : '') + '>' + s + ' 条/页</option>'; }).join('');
    p.innerHTML = '<div class="qpager-inner" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;padding:10px">' +
      '<button class="btn btn-sm" data-act="pb-prev"' + (PaperB.bankPage <= 0 ? ' disabled' : '') + '>‹ 上一页</button>' +
      '<span class="qpage-info">第 ' + (PaperB.bankPage + 1) + ' / ' + totalPages + ' 页</span>' +
      '<button class="btn btn-sm" data-act="pb-next"' + (PaperB.bankPage >= totalPages - 1 ? ' disabled' : '') + '>下一页 ›</button>' +
      '<select class="select select-sm" data-act="pb-pagesize">' + sizeOpts + '</select>' +
      '<span class="text-xs text-m">每页 ' + size + ' 条 · 共 ' + list.length + ' 道</span>' +
      '</div>';
  },

  renderSel: function () {
    var box = $('#pbSel');
    if (!box) return;
    box.innerHTML = PaperB.items.length ? PaperB.items.map(pbSelRow).join('')
      : '<div class="text-s text-m" style="padding:8px 0">还没选题。在左边点题目加入，或点「智能组卷」自动挑一批。</div>';
    var c = $('#pbCount');
    if (c) c.textContent = PaperB.items.length + ' 道';
    PaperB.syncMeta();
  },

  syncMeta: function () {
    var m = $('#pbMeta');
    if (!m) return;
    var st = paperStats({ items: PaperB.items });
    m.textContent = '共 ' + st.n + ' 道 · 总分 ' + st.total + ' 分' +
      (st.chapters.length ? ' · 覆盖 ' + st.chapters.length + ' 个章节' : '') +
      (st.missing ? ' · 有 ' + st.missing + ' 道题已从题库删除' : '');
  },

  auto: function () {
    var lv = {}; LEVELS.forEach(function (L, i) { lv[L] = num(PaperB.pickLv[i]); });
    var hasLv = LEVELS.reduce(function (a, L) { return a + lv[L]; }, 0) > 0;
    if (!hasLv && num(PaperB.pickN) <= 0) { UI.toast('请填写题量，或按难度分别填数量', 'err'); return; }
    var picks = paperAutoPick({
      qs: Store.state.questions,
      n: num(PaperB.pickN, 10),
      levels: lv,
      chapter: PaperB.filt.chapter, point: PaperB.filt.point, qtype: PaperB.filt.qtype,
      keyword: PaperB.filt.kw,
      exclude: PaperB.items.map(function (it) { return it.qid; }),
      used: paperUsage()
    });
    if (!picks.length) {
      UI.toast(hasLv ? '按当前筛选和难度没找到题，试试放宽条件' : '题库里没有符合条件的题', 'err');
      return;
    }
    PaperB.items = PaperB.items.concat(picks);
    PaperB.renderBank(); PaperB.renderSel();
    var want = hasLv ? (lv['易'] + lv['中'] + lv['难']) : num(PaperB.pickN, 10);
    UI.toast('已挑入 ' + picks.length + ' 道题' + (picks.length < want ? '（题库里够条件的只有这些）' : ''), 'ok');
  },

  collect: function () {
    return {
      title: wqClean(PaperB.title), subtitle: wqClean(PaperB.subtitle), date: PaperB.date,
      duration: wqClean(PaperB.duration), note: PaperB.note,
      items: PaperB.items.map(function (it) { return { qid: it.qid, score: num(it.score) }; }),
      showAnswer: PaperB.showAnswer
    };
  },

  save: function () {
    if (!wqClean(PaperB.title)) { UI.toast('请先填试卷名称', 'err'); return null; }
    if (!PaperB.items.length) { UI.toast('至少选一道题', 'err'); return null; }
    var rec = PaperB.collect();
    if (PaperB.id) {
      var old = byId(Store.state.papers, PaperB.id);
      if (old) {
        Object.keys(rec).forEach(function (k) { old[k] = rec[k]; });
        old.updatedAt = Date.now();
        Store.save('papers');
      }
    } else {
      var nr = Object.assign({}, rec, { id: uid(), createdAt: Date.now(), updatedAt: Date.now() });
      Store.state.papers.push(nr);
      Store.save('papers');
      PaperB.id = nr.id;
      if ($('#pbTitle')) $('#pbTitle').textContent = '编辑试卷';
      if ($('#pbDel')) $('#pbDel').classList.remove('hidden');
    }
    UI.toast('已保存试卷', 'ok');
    App.refresh();
    return rec;
  },

  showPreview: function (rec, withAnswer) {
    if (!rec) return;

function pbBankRow(q) {

  if (qEditState(q) === 'todo') meta += (meta ? ' · ' : '') + '待编辑' + ((num(q.lost) || 0) ? '（缺 ' + (num(q.lost) || 0) + ' 处公式）' : '');

    '</div></div>';
}

function pbSelRow(en, i) {

/* =========================================================
 * 通用记录编辑器 + 导入向导（列映射 / 主键匹配 / 不覆盖历史）
 * =======================================================*/

var Editor = {
  col: '', id: '', tags: {},

  open: function (col, id, preset) {
    var sc = SCHEMA[col];
    if (!sc) return;
    Editor.col = col; Editor.id = id || ''; Editor.tags = {};
    var rec = id ? byId(Store.state[col], id) : null;
    $('#edTitle').textContent = (id ? '编辑' : '新增') + sc.title;
    if ($('#edDel')) $('#edDel').classList.toggle('hidden', !id);
    var h = '';
    sc.fields.forEach(function (f) {
      var v = rec ? rec[f.k] : (preset && preset[f.k] !== undefined ? preset[f.k] : '');
      if (f.type === 'tags') {
        var arr = Array.isArray(v) ? v.slice() : (v ? String(v).split(/[,，;；]/).filter(Boolean) : []);
        Editor.tags[f.k] = arr;
        h += '<div class="field"><label>' + esc(f.label) + '</label><div class="taginput" data-tagbox="' + f.k + '">' +
          arr.map(function (t, i) { return '<span class="pill">' + esc(t) + '<b data-act="tag-del" data-k="' + f.k + '" data-i="' + i + '">×</b></span>'; }).join('') +
          '<input data-act="tag-input" data-k="' + f.k + '" placeholder="' + esc(f.ph || '回车添加') + '"></div></div>';
        return;
      }
      if (f.type === 'check') {
        h += '<div class="field"><label class="checkrow"><input type="checkbox" data-fk="' + f.k + '"' + (v ? ' checked' : '') + '><span>' + esc(f.label) + '</span></label></div>';
        return;
      }
      if (f.type === 'select') {
        h += '<div class="field"><label>' + esc(f.label) + (f.req ? ' <span class="req">*</span>' : '') + '</label><select class="select" data-fk="' + f.k + '">' +
          '<option value="">—</option>' + f.options.map(function (o) { return '<option' + (String(v) === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select></div>';
        return;
      }
      if (f.type === 'textarea') {
        h += '<div class="field"><label>' + esc(f.label) + (f.req ? ' <span class="req">*</span>' : '') + '</label>' +
          '<textarea class="textarea" data-fk="' + f.k + '" placeholder="' + esc(f.ph || '') + '">' + esc(v == null ? '' : v) + '</textarea></div>';
        return;
      }
      var type = f.type === 'number' ? 'number' : (f.type === 'date' ? 'date' : (f.type === 'time' ? 'text' : 'text'));
      h += '<div class="field"><label>' + esc(f.label) + (f.req ? ' <span class="req">*</span>' : '') + '</label>' +
        '<input class="input" type="' + type + '" data-fk="' + f.k + '" value="' + esc(v == null ? '' : v) + '" placeholder="' + esc(f.ph || '') + '"></div>';
    });
    $('#edBody').innerHTML = h;
    UI.openMask('#maskEditor');
  },

  collect: function () {
    var sc = SCHEMA[Editor.col], out = {}, miss = [];
    sc.fields.forEach(function (f) {
      if (f.type === 'tags') { out[f.k] = Editor.tags[f.k] || []; return; }
      var el = $('[data-fk="' + f.k + '"]', $('#edBody'));
      if (!el) { out[f.k] = ''; return; }
      if (f.type === 'check') { out[f.k] = !!el.checked; return; }
      var v = String(el.value || '').trim();
      if (f.type === 'number') v = v === '' ? '' : num(v);
      if (f.type === 'date') v = normDate(v);
      out[f.k] = v;
      if (f.req && v === '') miss.push(f.label);
    });
    /* 题目：手录的题也按同一套版式整理（全角标点 + 选择题末尾作答括号） */
    if (Editor.col === 'questions') {
      ['stem', 'options', 'answer', 'analysis'].forEach(function (k) {
        if (out[k]) out[k] = wqFullPunct(out[k]);
      });
      if (out.qtype === '选择题') out.stem = wqChoiceBlank(out.stem);
      /* 难度留空时按学到的标准自动分级；已有星级不改动 */
      if (!out.level) out.level = wqAutoLevel(out);
    }
    return { data: out, miss: miss };
  },

  save: function () {
    var r = Editor.collect();
    if (r.miss.length) { UI.toast('请填写：' + r.miss.join('、'), 'err'); return; }
    var isQ = Editor.col === 'questions', savedId = Editor.id;
    if (savedId) {
      Store.update(Editor.col, Editor.id, r.data);
      UI.toast('已保存', 'ok');
    } else {
      var rec = Store.add(Editor.col, r.data);
      savedId = (rec && rec.id) || '';
      UI.toast('已新增', 'ok');
    }
    UI.closeMask('#maskEditor');
    /* 题库：改一道题只就地重建这一张卡（新题没有卡片，会落到下面的整页刷新） */
    if (isQ && savedId && qCardsRefresh([savedId])) return;
    App.refresh();
  },

  remove: function () {
    var col = Editor.col, id = Editor.id;
    UI.confirm('删除确认', '确定删除这条' + SCHEMA[col].title + '记录吗？删除后不可恢复。', function () {
      Store.remove(col, id);
      UI.closeAll();
      UI.toast('已删除');
      /* 题库：只摘掉这一张卡，不整列表重绘 */
      if (col === 'questions' && qCardDrop(id)) return;
      App.refresh();
    }, '删除');
  }
};

var Import = {
  cfg: null, col: '', parsed: null, sheetIdx: 0, map: {}, hasHeader: true, fileName: '',

  open: function (col) {
    var cfg = IMPORT_CFGS[col];
    if (!cfg) return;
    Import.col = col; Import.cfg = cfg; Import.parsed = null; Import.sheetIdx = 0; Import.map = {}; Import.hasHeader = true; Import.fileName = '';
    $('#impTitle').textContent = cfg.title;
    Import.render();
    Import.bindDrop();
    UI.openMask('#maskImport');
  },

  render: function () {
    var h = '';
    h += '<div class="note" style="background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-dark)">' + esc(Import.cfg.tip) + '</div>';
    h += '<div class="mt12" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
      '<button class="btn btn-primary" data-act="imp-pick"><svg><use href="#i-up"/></svg>选择文件</button>' +
      '<button class="btn" data-act="imp-tmpl">下载模板</button>' +
      '<button class="btn" data-act="imp-paste">粘贴表格</button>' +
      '<span class="text-s text-m" id="impFile">' + (Import.fileName ? esc(Import.fileName) : '未选择文件') + '</span></div>';

    if (!Import.parsed) {
      h += '<div class="mt16 text-s text-m">支持 .xlsx / .csv / .txt（逗号或制表符分隔）。也可以直接从 Excel 复制一片区域后点「粘贴表格」。</div>';
    } else {
      var sheets = Import.parsed.sheets;
      if (sheets.length > 1) {
        h += '<div class="field mt16"><label>工作表</label><select class="select" data-act="imp-sheet">' +
          sheets.map(function (s, i) { return '<option value="' + i + '"' + (i === Import.sheetIdx ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('') +
          '</select></div>';
      }
      var rows = sheets[Import.sheetIdx].rows;
      var head = Import.hasHeader ? (rows[0] || []) : [];
      h += '<div class="field mt12"><label class="checkrow"><input type="checkbox" data-act="imp-header"' + (Import.hasHeader ? ' checked' : '') + '><span>第一行是表头</span></label></div>';
      h += '<div class="mt12"><div class="text-s text-m mb8">列映射（左侧是系统字段，右侧选择你表格里的对应列）</div><div class="grid g2">';
      Import.cfg.fields.forEach(function (f) {
        h += '<div class="field" style="margin-bottom:8px"><label>' + esc(f.label) + (f.req ? ' <span class="req">*</span>' : '') + '</label>' +
          '<select class="select" data-act="imp-map" data-key="' + f.key + '"><option value="-1">— 不使用 —</option>' +
          head.map(function (hd, i) {
            var t = String(hd || '').trim() || ('第' + (i + 1) + '列');
            return '<option value="' + i + '"' + (String(Import.map[f.key]) === String(i) ? ' selected' : '') + '>' + esc(t) + '</option>';
          }).join('') + '</select></div>';
      });
      h += '</div></div>';
      var body = Import.hasHeader ? rows.slice(1) : rows;
      var valid = body.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });
      h += '<div class="mt12"><div class="text-s text-m mb8">预览（共 ' + valid.length + ' 行有效数据，前 3 行）</div><div class="tblwrap"><table class="tbl"><thead><tr>' +
        Import.cfg.fields.filter(function (f) { return Import.map[f.key] >= 0; }).map(function (f) { return '<th>' + esc(f.label) + '</th>'; }).join('') +
        '</tr></thead><tbody>' +
        valid.slice(0, 3).map(function (r) {
          return '<tr>' + Import.cfg.fields.filter(function (f) { return Import.map[f.key] >= 0; }).map(function (f) {
            return '<td>' + esc(String(r[Import.map[f.key]] || '').slice(0, 40)) + '</td>';
          }).join('') + '</tr>';
        }).join('') + '</tbody></table></div></div>';
    }
    $('#impBody').innerHTML = h;
  },

  guess: function () {
    var rows = Import.parsed.sheets[Import.sheetIdx].rows;
    var head = (rows[0] || []).map(function (x) { return String(x || '').trim().toLowerCase(); });
    Import.map = {};
    Import.cfg.fields.forEach(function (f) {
      var best = -1, bestScore = 0;
      head.forEach(function (hd, i) {
        if (!hd) return;
        var score = 0;
        if (hd === f.label.toLowerCase()) score = 100;
        else (f.aliases || []).forEach(function (a) {
          var al = a.toLowerCase();
          if (hd === al) score = Math.max(score, 95);
          else if (hd.indexOf(al) >= 0) score = Math.max(score, 70);
          else if (al.indexOf(hd) >= 0 && hd.length >= 2) score = Math.max(score, 55);
        });
        if (score > bestScore) { bestScore = score; best = i; }
      });
      if (best >= 0 && bestScore >= 55) Import.map[f.key] = best;
    });
  },

  /* 拖进来 / 选中的文件按类型路由：表格走本弹窗，Word / 文本试卷自动转交「Word 导入」 */
  routeFile: function (f) {
    if (!f) return;
    var lower = String(f.name || '').toLowerCase();
    if (/\.(docx|txt|md)$/.test(lower)) {
      UI.closeMask('#maskImport');
      WordQuiz.open();
      WordQuiz.acceptFile(f);
    } else {
      Import.useFile(f);
    }
  },

  /* 表格导入弹窗也支持直接拖文件进来（docx 会自动转到 Word 导入） */
  bindDrop: function () {
    if (Import._dropBound) return;
    var mask = document.querySelector('#maskImport');
    if (!mask) return;
    Import._dropBound = true;
    ['dragenter', 'dragover'].forEach(function (t) {
      mask.addEventListener(t, function (e) { e.preventDefault(); e.stopPropagation(); mask.classList.add('wq-over'); });
    });
    mask.addEventListener('dragleave', function (e) {
      if (!mask.contains(e.relatedTarget)) mask.classList.remove('wq-over');
    });
    mask.addEventListener('drop', function (e) {
      e.preventDefault(); e.stopPropagation();
      mask.classList.remove('wq-over');
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (!f) { UI.toast('拖进来的内容里没有文件', 'err'); return; }
      Import.routeFile(f);
    });
  },

  useFile: function (file) {
    Import.fileName = file.name;
    Import.render();
    Files.parseTable(file).then(function (res) {
      Import.parsed = res;
      Import.sheetIdx = 0;
      Import.guess();
      Import.render();
      UI.toast('已解析 ' + res.sheets[0].rows.length + ' 行', 'ok');
    }).catch(function (err) {
      Import.parsed = null;
      Import.render();
      UI.toast(err.message || '解析失败', 'err');
    });
  },

  useText: function (text) {
    var rows = Files.parseCsv(text);
    if (!rows.length) { UI.toast('没有识别到数据', 'err'); return; }
    Import.parsed = { sheets: [{ name: '粘贴内容', rows: rows }] };
    Import.sheetIdx = 0;
    Import.fileName = '粘贴的表格';
    Import.guess();
    Import.render();
  },

  /* 导入前的回滚点。只存文本：图片 base64 仍在 IndexedDB 里，靠 ik 引用，
     否则几份卷子下来 5 份快照就能吃掉几十 MB，把 localStorage 直接撑爆。 */
  snapshot: function () {
    try {
      var k = 'wbchem.snap.' + Store.spaceKeyValue + '.' + Date.now();
      var text = Store.serialize({ at: Date.now(), data: Store.state }, null, false);
      localStorage.setItem(k, text);
      var idx = [];
      try { idx = JSON.parse(localStorage.getItem('wbchem.snaps') || '[]'); } catch (e) { }
      idx.push(k);
      while (idx.length > 3) { var old = idx.shift(); try { localStorage.removeItem(old); } catch (e2) { } }
      localStorage.setItem('wbchem.snaps', JSON.stringify(idx));
    } catch (e) {
      /* 快照写不进去就别硬撑——清掉历史快照，把配额让给真正的数据 */
      try { Store.dropSnapshots(); } catch (e3) { }
    }
  },

  /* 抽取映射后的行对象 */
  mapped: function () {
    var rows = Import.parsed.sheets[Import.sheetIdx].rows;
    var body = Import.hasHeader ? rows.slice(1) : rows;
    var out = [];
    body.forEach(function (r) {
      var o = {}, any = false;
      Import.cfg.fields.forEach(function (f) {
        var i = Import.map[f.key];
        if (i === undefined || i < 0) return;
        var v = String(r[i] == null ? '' : r[i]).trim();
        if (v) any = true;
        o[f.key] = v;
      });
      if (any) out.push(o);
    });
    return out;
  },

  run: function () {
    if (!Import.parsed) { UI.toast('请先选择文件', 'err'); return; }
    var miss = Import.cfg.fields.filter(function (f) { return f.req && (Import.map[f.key] === undefined || Import.map[f.key] < 0); });
    if (miss.length) { UI.toast('请先映射必填字段：' + miss.map(function (f) { return f.label; }).join('、'), 'err'); return; }
    var rows = Import.mapped();
    if (!rows.length) { UI.toast('没有可导入的有效数据', 'err'); return; }
    Import.snapshot();
    var res;
    try { res = Commit[Import.col](rows); }
    catch (e) { UI.toast('导入失败：' + e.message, 'err'); return; }
    Store.persist();
    UI.closeMask('#maskImport');
    UI.toast('导入完成：新增 ' + res.added + '，更新 ' + res.updated + '，跳过 ' + res.skipped, 'ok');

  }
};

/* =========================================================
 * 各数据集的入库逻辑（主键匹配，不覆盖为空，不破坏关联）
 * =======================================================*/
var Commit = {
  mergeKeep: function (oldRec, patch) {
    Object.keys(patch).forEach(function (k) {
      var v = patch[k];
      if (v === '' || v === null || v === undefined) return;   // 空值不覆盖历史
      if (Array.isArray(v) && !v.length) return;
      oldRec[k] = v;
    });
    oldRec.updatedAt = Date.now();
    return oldRec;
  },

  calendar: function (rows) {
    var added = 0, updated = 0, skipped = 0;
    var idx = {};
    Store.state.calendar.forEach(function (r, i) { idx[(r.date || '') + '|' + (r.title || '')] = i; });
    rows.forEach(function (o) {
      var date = normDate(o.date);
      var title = (o.title || '').trim();
      if (!title) { skipped++; return; }
      if (!date) date = todayStr();
      var key = date + '|' + title;
      if (idx[key] !== undefined) {
        Commit.mergeKeep(Store.state.calendar[idx[key]], { date: date, title: title, time: o.time, type: o.type, place: o.place, note: o.note });
        updated++;
      } else {
        var rec = { id: uid(), date: date, title: title, time: o.time || '', type: o.type || '', place: o.place || '', note: o.note || '', done: false, createdAt: Date.now(), updatedAt: Date.now() };
        Store.state.calendar.push(rec);
        idx[key] = Store.state.calendar.length - 1;
        added++;
      }
    });
    Store.touch('calendar');
    return { added: added, updated: updated, skipped: skipped };
  },

  students: function (rows) {
    var added = 0, updated = 0, skipped = 0;
    var arr = Store.state.students;
    var byNS = {}, byName = {};
    arr.forEach(function (s, i) {
      if (s.name) {
        byNS[s.name.trim() + '|' + (s.school || '').trim()] = i;
        if (byName[s.name.trim()] === undefined) byName[s.name.trim()] = i; else byName[s.name.trim()] = -1; // 重名不唯一
      }
    });
    rows.forEach(function (o) {
      var name = (o.name || '').trim();
      if (!name) { skipped++; return; }
      var school = (o.school || '').trim();
      var i = byNS[name + '|' + school];
      if (i === undefined) {
        var j = byName[name];
        i = (j !== undefined && j >= 0 && !school) ? j : undefined;
      }
      if (i !== undefined) {
        Commit.mergeKeep(arr[i], {
          name: name, school: school, grade: o.grade, klass: o.klass, phone: o.phone, parent: o.parent,
          tags: o.tags ? String(o.tags).split(/[,，;；\s]+/).filter(Boolean) : [], note: o.note
        });
        updated++;
      } else {
        var rec = {
          id: uid(), name: name, school: school, grade: o.grade || '', klass: o.klass || '',
          phone: o.phone || '', parent: o.parent || '',
          tags: o.tags ? String(o.tags).split(/[,，;；\s]+/).filter(Boolean) : [],
          note: o.note || '', createdAt: Date.now(), updatedAt: Date.now()
        };
        arr.push(rec);
        byNS[name + '|' + school] = arr.length - 1;
        added++;
      }
    });
    Store.touch('students');
    return { added: added, updated: updated, skipped: skipped };
  },

  exams: function (rows) {
    var added = 0, updated = 0, skipped = 0;
    var arr = Store.state.exams;
    var idx = {};
    arr.forEach(function (e, i) { idx[(e.examName || '') + '|' + (e.subject || '') + '|' + (e.studentName || '')] = i; });
    var stuByName = {}, stuByNameSchool = {};
    Store.state.students.forEach(function (s) {
      if (!s.name) return;
      stuByNameSchool[s.name.trim() + '|' + (s.school || '').trim()] = s.id;
      if (stuByName[s.name.trim()] === undefined) stuByName[s.name.trim()] = s.id; else stuByName[s.name.trim()] = '';
    });
    rows.forEach(function (o) {
      var nm = (o.studentName || '').trim();
      var exam = (o.examName || '').trim();
      if (!nm || !exam) { skipped++; return; }
      var school = (o.school || '').trim();
      var sid = stuByNameSchool[nm + '|' + school] || stuByName[nm] || '';
      var key = exam + '|' + (o.subject || '') + '|' + nm;
      var patch = {
        examName: exam, date: normDate(o.date) || todayStr(), subject: o.subject || '', studentName: nm,
        school: school, grade: o.grade || '',
        score: o.score === '' ? '' : num(o.score), full: o.full === '' ? '' : num(o.full),
        rank: o.rank === '' ? '' : num(o.rank), total: o.total === '' ? '' : num(o.total),
        note: o.note || ''
      };
      if (sid) patch.studentId = sid;
      if (idx[key] !== undefined) { Commit.mergeKeep(arr[idx[key]], patch); updated++; }
      else {
        var rec = Object.assign({ id: uid(), studentId: sid, createdAt: Date.now(), updatedAt: Date.now() }, patch);
        arr.push(rec); idx[key] = arr.length - 1; added++;
      }
    });
    Store.touch('exams');
    return { added: added, updated: updated, skipped: skipped };
  },


  questions: function (rows) {
    var added = 0, updated = 0, skipped = 0, todo = 0;
    var arr = Store.state.questions;
    var idx = {};
    /* 同时登记新键与旧键：老师此前已入库的题目是按旧键（带来源标注的前 20 字）去重的，
       保留旧键映射，重新导入同一份卷子时才不会整批变成"新增"而重复一遍。 */
    arr.forEach(function (q, i) {
      idx[qKey(q)] = i;
      var lk = qKeyLegacy(q);
      if (idx[lk] === undefined) idx[lk] = i;
    });
    rows.forEach(function (o) {
      var stem = (o.stem || '').trim();
      if (!stem) { skipped++; return; }
      var rec = {
        code: (o.code || '').trim(), chapter: (o.chapter || '').trim(), point: (o.point || '').trim(),
        qtype: (o.qtype || '').trim(), level: wqLevel(o.level || '') || (o.level || '').trim(), stem: stem,
        options: o.options || '', answer: o.answer || '', analysis: o.analysis || '',
        tags: o.tags ? String(o.tags).split(/[,，;；\s]+/).filter(Boolean) : [], source: (o.source || '').trim(),
        images: Array.isArray(o.images) ? o.images.filter(function (im) { return im && im.uri; }) : [],
        tables: Array.isArray(o.tables) ? o.tables.filter(function (t) { return t && t.rows && t.rows.length; }) : []
      };
      /* 「编辑状态」分类：导入时公式缺失（lost>0）→ 待编辑，其余 → 可直接用的已编辑。
         Excel 导入表里若写了「编辑状态」列，以它为准。 */
      var lost = num(o.lost) || 0;
      var decl = qEditDecl(o.editState);
      var k = qKey(rec);
      var _hit = idx[k];
      if (_hit === undefined) _hit = idx[qKeyLegacy(rec)];   /* 兼容旧键：老库里的同题不重复新增 */
      if (_hit !== undefined) {
        var old = arr[_hit];
        /* 已有题目不改星级：导入的难度只补空，不覆盖老师已确认的星级 */
        var _oldLevel = old.level;
        Commit.mergeKeep(old, rec);
        if (_oldLevel) old.level = _oldLevel;
        else if (!old.level) old.level = rec.level || wqAutoLevel(old);
        /* 老师已确认完成的题不因重新导入退回「待编辑」；只有仍缺公式且未确认的才留在待编辑。
           反过来：重新导入时公式已经能解出来了（比如 MathType 支持后），自动转「已编辑」。 */
        if (decl) old.editState = decl;
        else if (lost > 0) {
          if (old.editState !== 'done') old.editState = 'todo';
        } else {
          old.editState = 'done';
        }
        old.lost = lost > 0 ? Math.max(num(old.lost) || 0, lost) : 0;
        if (qEditState(old) === 'todo') todo++;
        updated++;
      } else {
        var nr = Object.assign({ id: uid(), createdAt: Date.now(), updatedAt: Date.now() }, rec);
        /* 新题统合学到的分级标准：导入没写难度时按考点交叉/题型/空数自动分五档星级 */
        if (!nr.level) nr.level = wqAutoLevel(nr);
        nr.lost = lost;
        nr.editState = decl || (lost > 0 ? 'todo' : 'done');
        if (nr.editState === 'todo') todo++; else nr.doneAt = '';
        arr.push(nr);
        idx[k] = arr.length - 1; added++;
      }
    });
    Store.touch('questions');
    return { added: added, updated: updated, skipped: skipped, todo: todo };
  },

  exitTests: function (rows) {
    var added = 0, updated = 0, skipped = 0;
    var stuByName = {}, stuByNameSchool = {};
    Store.state.students.forEach(function (s) {
      if (!s.name) return;
      stuByNameSchool[s.name.trim() + '|' + (s.school || '').trim()] = s.id;
      if (stuByName[s.name.trim()] === undefined) stuByName[s.name.trim()] = s.id; else stuByName[s.name.trim()] = '';
    });
    var groups = {};
    rows.forEach(function (o) {
      var nm = (o.studentName || '').trim();
      var kp = (o.kp || '').trim();
      if (!nm || !kp) { skipped++; return; }
      var date = normDate(o.date) || todayStr();
      var sid = stuByNameSchool[nm + '|' + ((o.school || '').trim())] || stuByName[nm] || '';
      var key = sid + '|' + nm + '|' + date;
      if (!groups[key]) groups[key] = { studentId: sid, studentName: nm, date: date, items: [], seen: {} };
      var r = (o.result || '').trim();
      if (EXIT_RESULTS.indexOf(r) < 0) {
        r = r ? (r.indexOf('未') >= 0 ? '未掌握' : (r.indexOf('巩固') >= 0 || r.indexOf('弱') >= 0 ? '待巩固' : '掌握')) : '掌握';
      }
      var g = groups[key];
      var fpk = fingerprint(kp);
      var ex = g.items.filter(function (it) { return fingerprint(it.kp) === fpk; })[0];
      if (ex) { ex.result = r; ex.note = o.note || ex.note; }
      else { g.items.push({ kp: kp, result: r, note: o.note || '' }); g.seen[fpk] = 1; }
    });
    var arr = Store.state.exitTests;
    Object.keys(groups).forEach(function (key) {
      var g = groups[key];
      var ex = arr.filter(function (t) { return t.studentId === g.studentId && (t.studentName || '') === g.studentName && t.date === g.date; })[0];
      if (ex) { ex.items = g.items; ex.updatedAt = Date.now(); updated++; }
      else { arr.push({ id: uid(), studentId: g.studentId, studentName: g.studentName, date: g.date, items: g.items, note: '', createdAt: Date.now(), updatedAt: Date.now() }); added++; }
    });
    Store.touch('exitTests');
    return { added: added, updated: updated, skipped: skipped };
  }
};

function fingerprint(s) {
  var t = String(s || '').replace(/\s+/g, '').replace(/[，。、；：""''（）()【】\[\]]/g, '').slice(0, 40);
  return hashHex(t || 'x');
}

/* 题库去重键：题号 + 题干（先剥掉题干开头的「来源标注」再取前 40 字）。
   来源标注（如「(25-26高一下·广州市天河外国语学校·期中)」）是导入时给每道题统一加的，
   每道题都一样。若把它算进键里，键前 20 字就全是来源 → 键退化成「只按题号识别」，后果：
     · 批量导入同一份卷子的原卷版 + 解析版时，后一份会被整体判成重复题而全部丢弃；
     · 卷首说明被误抓成「第 2 题」时，它会顶掉真正的第 2 题。
   剥掉后键才真正落在「题号 + 题干」上。 */
function qKeyStem(q) {
  var stem = String((q && q.stem) || '');
  var src = String((q && q.source) || '').trim();
  if (src && stem.indexOf(src) === 0) stem = stem.slice(src.length);
  /* ⟦图12⟧ / ⟦表3⟧ 的编号在同一份卷子的原卷版与解析版里是不一样的（解析版插图更多，
     同一个图的序号会整体后移），它跟题目内容无关，抹掉后同题的两种版本才能对上。 */
  return stem.replace(/⟦[图表]\d+⟧/g, '⟦⟧').replace(/\s+/g, '');
}
function qKey(q) {
  return String((q && q.code) || '').trim() + '|' + qKeyStem(q).slice(0, 40);
}
/* 旧版键（题干带来源标注、只取前 20 字）：只为兼容此前已入库的题目，新逻辑不要再使用 */
function qKeyLegacy(q) {
  return String((q && q.code) || '').trim() + '|' + String((q && q.stem) || '').replace(/\s+/g, '').slice(0, 20);
}
/* 判重时比较「信息丰富程度」：有答案 / 有解析 / 图表的题优先。
   同一份卷子的原卷版与解析版题干相同，去重时必须留下带答案解析的那一份。 */
function wqItemWeight(q) {
  q = q || {};
  return (String(q.answer || '').trim() ? 4 : 0) +
    (String(q.analysis || '').trim() ? 3 : 0) +
    Math.min((q.imgs || []).length, 4) +
    Math.min((q.tables || []).length, 3) * 0.5;
}

function syncChipHTML() {

/* 限时离线倒计时刷新（每 30 秒检查一次） */
function offlineTick() {
  var wasActive = window.__offlineWasActive;
  var nowActive = OfflineMode.active();
  if (wasActive && !nowActive) {
    UI.toast('限时离线已结束，已恢复在线', 'ok');
  } else if (!wasActive && nowActive) {
    /* 进入 */
  }
  window.__offlineWasActive = nowActive;
  if (nowActive) {
    updateSyncChip();
    /* 若当前在设置页，刷新倒计时 */
    var ov = $('#offlineRemainView');
    if (ov) ov.textContent = '剩余 ' + OfflineMode.fmt(OfflineMode.remaining());

    if (oe) oe.textContent = '截止：' + new Date(Store.state.profile.offlineMode.until).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  }
}

/* ---------------- 筛选（不改 DOM 结构，只隐藏） ---------------- */
function applyFilter(sel, q, extra) {
  q = String(q || '').trim().toLowerCase();
  $$(sel + ' > [data-f]').forEach(function (el) {
    var ok = !q || (el.getAttribute('data-f') || '').indexOf(q) >= 0;
    if (ok && extra) ok = extra(el);
    el.classList.toggle('hidden', !ok);
  });
}

/* ---------------- 题库分页核心 ----------------
 * 5500 道题若一次性 arr.map(questionCard).join('') 全量渲染，会拼出十几 MB 的 HTML 字符串
 * 并生成几千个 DOM 节点，浏览器直接内存溢出。改成只渲染「当前页」：
 *   qComputeList —— 按 QFilter(搜索/章节/知识点/题型/难度/编辑态) + QSort 过滤排序出对象数组；
 *   qRenderPage  —— 把当前页的卡片写进 #qList，并刷新计数与分页条；
 *   qRenderPager —— 渲染所有 .qPager 容器（顶部+底部吸顶/吸底）。 */
function qComputeList() {
  var arr = Store.state.questions || [];
  var q = String(QFilter.q || '').trim().toLowerCase();
  var out = arr.filter(function (qq) {
    if (QFilter.edit && qEditState(qq) !== QFilter.edit) return false;
    if (QFilter.chapter && (qq.chapter || '') !== QFilter.chapter) return false;
    if (QFilter.point && (qq.point || '') !== QFilter.point) return false;
    if (QFilter.qtype && (qq.qtype || '') !== QFilter.qtype) return false;
    if (QFilter.level && (qq.level || '') !== QFilter.level) return false;
    if (q) {
      var f = [qq.code, qq.chapter, qq.point, qq.qtype, qq.level, qq.stem, qq.options,
        qq.answer, qq.analysis, (qq.tags || []).join(' '), qq.source].join(' ').toLowerCase();
      if (f.indexOf(q) < 0) return false;
    }
    return true;
  });
  var key = qSortKey(QSort.mode);
  if (key) out.sort(function (a, b) {
    var ka = key(a), kb = key(b);
    if (ka < kb) return -1;
    if (ka > kb) return 1;
    return (b.createdAt || 0) - (a.createdAt || 0);
  });
  QView.list = out;
  QView.total = out.length;
}

function qRenderPager() {
  var pagers = Array.prototype.slice.call(document.querySelectorAll('.qPager'));
  if (!pagers.length) return;
  var totalPages = QView.total ? Math.max(1, Math.ceil(QView.total / QView.pageSize)) : 1;
  if (QView.page < 0) QView.page = 0;
  if (QView.page >= totalPages) QView.page = totalPages - 1;
  var sizes = [50, 100, 200, 500];
  var sizeOpts = sizes.map(function (s) {
    return '<option value="' + s + '"' + (s === QView.pageSize ? ' selected' : '') + '>' + s + ' 条/页</option>';
  }).join('');
  var inner = '<div class="qpager-inner" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;padding:10px;padding-right:56px">' +
    '<button class="btn btn-sm" data-act="q-prev"' + (QView.page <= 0 ? ' disabled' : '') + '>‹ 上一页</button>' +
    '<span class="qpage-info">第 ' + (QView.page + 1) + ' / ' + totalPages + ' 页</span>' +
    '<button class="btn btn-sm" data-act="q-next"' + (QView.page >= totalPages - 1 ? ' disabled' : '') + '>下一页 ›</button>' +
    '<span class="qpage-jump">跳至 <input class="input input-sm" type="number" min="1" max="' + totalPages + '" data-act="q-goto" value="' + (QView.page + 1) + '" style="width:62px"> 页</span>' +
    '<select class="select select-sm" data-act="q-pagesize">' + sizeOpts + '</select>' +
    '<span class="text-xs text-m">每页 ' + QView.pageSize + ' 条 · 共 ' + QView.total + ' 道</span>' +
    '</div>';
  pagers.forEach(function (p) { p.innerHTML = QView.total ? inner : ''; });
}

function qRenderPage() {
  var host = document.getElementById('qList');
  if (!host) return;
  qComputeList();
  var totalPages = QView.total ? Math.max(1, Math.ceil(QView.total / QView.pageSize)) : 1;
  if (QView.page < 0) QView.page = 0;
  if (QView.page >= totalPages) QView.page = totalPages - 1;
  var start = QView.page * QView.pageSize;
  var slice = QView.list.slice(start, start + QView.pageSize);
  host.innerHTML = slice.map(questionCard).join('');
  var qCount = document.getElementById('qCount');
  if (qCount) {
    var all = (Store.state.questions || []).length;
    if (QView.total) {
      var a = start + 1, b = Math.min(start + QView.pageSize, QView.total);
      qCount.textContent = '显示第 ' + a + '–' + b + ' 道 / 共 ' + QView.total + ' 道（题库 ' + all + ' 道）' +
        (QFilter.edit ? '（当前只看「' + (QFilter.edit === 'todo' ? '待编辑' : '已编辑') + '」）' : '');
    } else {
      qCount.textContent = all ? '' : '';
    }
  }
  var empty = document.getElementById('qEmpty');
  if (empty) empty.classList.toggle('hidden', !(QView.total === 0 && (Store.state.questions || []).length > 0));
  qRenderPager();
  qSegSync();
}
