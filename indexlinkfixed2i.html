/* ---------------- 登录 ---------------- */
function doLogin() {
  var u = $('#loginUser').value.trim();
  var c = $('#loginCode').value;
  if (!u) { UI.toast('请填写用户名', 'err'); return; }
  if (!c || c.length < 4) { UI.toast('口令至少 4 位', 'err'); return; }
  Store.open(u, c);
  try {
    if ($('#loginRemember').checked) localStorage.setItem(LS_USER, u);
    else localStorage.removeItem(LS_USER);
  } catch (e) { }
  enterApp();
}

function enterApp() {
  /* 图片的 base64 存在 IndexedDB 里，异步取回后补上并重绘（界面先出，图片晚一拍到） */
  Store.loadImgs().then(function (n) {
    if (n) App.refresh();
    /* 老数据（图片 base64 直接存在 localStorage 里）→ 迁移一次，把配额腾出来 */
    Store.migrate();
  }).catch(function () { });
  /* 删题 / 换题后遗留的孤儿图片，延迟回收一次 */
  setTimeout(function () { ImgDB.gc(Store.state).catch(function () { }); }, 8000);
  var fresh = !Store.state.profile || !Store.state.profile.seeded;
  if (fresh && !Store.state.students.length && !Store.state.calendar.length) seedDemo();
  /* 老数据兼容：若本地已有 scoreSheets 但学生 exitScores 未建，立即补算 */
  if (typeof syncExitScoresToStudents === 'function') syncExitScoresToStudents();
  /* 成绩自动关联到学生档案 */
  if (typeof autoLinkExamsSilent === 'function') autoLinkExamsSilent();
  $('#loginWrap').classList.add('hidden');
  $('#app').classList.remove('hidden');
  if ($('#sideUser')) $('#sideUser').textContent = (Store.state.profile.teacher || Store.user.user) + ' 的空间';
  App.go('home');
  if (Cloud.available() && !OfflineMode.active()) {
    Cloud.pull(true).then(function () { syncExitScoresToStudents(); App.refresh(); Cloud.pushDirty(); });
  } else if (OfflineMode.active()) {
    Cloud.set('offline', '限时离线 · 剩 ' + OfflineMode.fmt(OfflineMode.remaining()));
  }
  /* 限时离线模式倒计时 tick */
  if (window.__offlineTick) clearInterval(window.__offlineTick);
  window.__offlineTick = setInterval(offlineTick, 30000);
  window.__offlineWasActive = OfflineMode.active();
}

/* 学生档案内「考试成绩」弹窗 — 新增一条成绩 */
function saveStudentExam(studentId) {
  var s = byId(Store.state.students, studentId);
  if (!s) return;
  var nm = ($('#semName') ? $('#semName').value : '').trim();
  if (!nm) { UI.toast('请填写考试名称', 'err'); return; }
  var sc = $('#semScore') ? $('#semScore').value.trim() : '';
  if (sc === '') { UI.toast('请填写得分', 'err'); return; }
  Store.add('exams', {
    examName: nm,
    date: ($('#semDate') ? $('#semDate').value : '') || todayStr(),
    subject: ($('#semSubject') ? $('#semSubject').value : '').trim() || '化学',
    studentId: s.id,
    studentName: s.name,
    school: s.school || '',
    grade: s.grade || '',
    score: num(sc),
    full: num($('#semFull') ? $('#semFull').value : 100),
    rank: num($('#semRank') ? $('#semRank').value : 0) || '',
    note: ''
  });
  UI.toast('已保存成绩', 'ok');
  renderStudentExamsModal(studentId);
  App.refresh();
}

function doLogout() {
  UI.confirm('退出登录', '退出后本机保留你的数据，需要用同一组「用户名 + 口令」才能再次看到。<br><b>建议先导出一份 JSON 备份。</b>', function () {
    UI.closeAll();
    $('#app').classList.add('hidden');
    $('#loginWrap').classList.remove('hidden');
    $('#loginCode').value = '';
    Store.state = null;
  }, '退出登录');
}

/* ---------------- 事件绑定 ---------------- */
function bindEvents() {
  /* 直接绑定 */
  $('#btnLogin').addEventListener('click', doLogin);
  $('#loginCode').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  $('#loginUser').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#loginCode').focus(); });
  $('#btnImportBackupAtLogin').addEventListener('click', function () {
    var u = $('#loginUser').value.trim(), c = $('#loginCode').value;
    if (!u || c.length < 4) { UI.toast('请先填写用户名和口令，再导入备份', 'err'); return; }
    Store.open(u, c);
    restoreJSON('replace');
  });
  $('#edSave').addEventListener('click', function () { Editor.save(); });
  $('#edDel').addEventListener('click', function () { Editor.remove(); });
  var pbDelBtn = $('#pbDel');
  if (pbDelBtn) pbDelBtn.addEventListener('click', function () {
    if (!PaperB.id) return;
    var curP = byId(Store.state.papers, PaperB.id);
    UI.confirm('删除试卷', '确定删除试卷《' + esc((curP && curP.title) || '未命名') + '》吗？<b>题库里的题目不会被删除。</b>', function () {
      Store.remove('papers', PaperB.id);
      PaperB.id = '';
      UI.closeAll(); UI.toast('已删除试卷'); App.refresh();
    }, '删除试卷');
  });
  $('#impGo').addEventListener('click', function () { Import.run(); });
  $('#cfOk').addEventListener('click', function () {
    var fn = UI._cfOk; UI.closeMask('#maskConfirm');
    if (typeof fn === 'function') fn();
  });
  $('#btnLogout').addEventListener('click', doLogout);
  $('#btnSideBackup').addEventListener('click', function () { handleAct('backup-json', $('#btnSideBackup'), '', ''); });
  $('#btnTopBackup').addEventListener('click', function () { handleAct('backup-json', $('#btnTopBackup'), '', ''); });
  $('#btnSideSync').addEventListener('click', function () { Cloud.syncNow(); });
  $('#btnTopSync').addEventListener('click', function () { Cloud.syncNow(); });
  $('#fab').addEventListener('click', function () {
    var cur = VIEWS.filter(function (x) { return x.k === App.view; })[0];
    if (App.view === 'exitTests') { renderExitTestForm('', ''); return; }
    if (App.view === 'settings') { App.go('students'); return; }
    if (App.view === 'papers') { PaperB.open(''); return; }
    Editor.open(cur.col, '', App.view === 'home' ? { date: App.calSel || todayStr() } : null);
  });

  /* 遮罩点击关闭 */
  $$('.mask').forEach(function (m) {
    m.addEventListener('click', function (e) { if (e.target === m) UI.closeMask('#' + m.id); });
  });
  $$('[data-close]').forEach(function (b) {
    b.addEventListener('click', function () {
      var m = b.closest('.mask');
      if (m) UI.closeMask('#' + m.id);
    });
  });

  /* 导航 */
  document.addEventListener('click', function (e) {
    var nv = e.target.closest('[data-view]');
    if (nv) {
      var v = nv.getAttribute('data-view');
      if (v === 'more') {
        UI.sheet([
          { key: 'questions', label: '题库', icon: 'i-book', fn: function () { App.go('questions'); } },
          { key: 'papers', label: '组卷', icon: 'i-report', fn: function () { App.go('papers'); } },
          { key: 'review', label: '试卷审核', icon: 'i-check', fn: function () { App.go('review'); } },
          { key: 'exitTests', label: '出门测', icon: 'i-quiz', fn: function () { App.go('exitTests'); } },
          { key: 'diag', label: '诊断考学情分析', icon: 'i-chart', fn: function () { App.go('diag'); } },
          { key: 'settings', label: '设置与数据', icon: 'i-gear', fn: function () { App.go('settings'); } }
        ]);
      } else App.go(v);
      return;
    }
    var sh = e.target.closest('[data-sheet]');
    if (sh) {
      var k = sh.getAttribute('data-sheet');
      UI.closeMask('#maskSheet');
      var f = UI._sheetMap && UI._sheetMap[k];
      if (typeof f === 'function') f();
      return;
    }
  });

  /* 业务动作：统一委托 */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');
    var col = el.getAttribute('data-col');
    handleAct(act, el, id, col, e);
  });

  /* 输入类 */
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (!el.getAttribute) return;
    /* 登分表编辑器：实时回写并重新计算（按 class 捕获，无需 data-act） */
    if (el.classList && el.classList.contains('ss-score')) {
      var _si = +el.getAttribute('data-si'), _qi = +el.getAttribute('data-qi');
      if (ssEdit && ssEdit.students[_si]) { ssEdit.students[_si].scores[_qi] = num(el.value); ssEditRecalc(); }
      return;
    }
    if (el.classList && el.classList.contains('ss-name')) {
      var _si2 = +el.getAttribute('data-si');
      if (ssEdit && ssEdit.students[_si2]) ssEdit.students[_si2].name = el.value;
      return;
    }
    if (el.classList && el.classList.contains('ss-qscore')) {
      var _qi2 = +el.getAttribute('data-qi');
      if (ssEdit && ssEdit.questions[_qi2]) { ssEdit.questions[_qi2].score = num(el.value); ssEditRecalc(); }
      return;
    }
    if (el.classList && el.classList.contains('ss-qkp')) {
      var _qi3 = +el.getAttribute('data-qi');
      if (ssEdit && ssEdit.questions[_qi3]) ssEdit.questions[_qi3].kp = el.value;
      return;
    }
    /* 知识点规则维护：输入即回写草稿，不重渲染（否则每敲一个字就丢焦点） */
    if (el.classList && (el.classList.contains('kp-cat') || el.classList.contains('kp-pt') ||
      el.classList.contains('kp-s') || el.classList.contains('kp-w') ||
      el.classList.contains('kp-num') || el.classList.contains('kp-stop') || el.classList.contains('kp-try'))) {
      KpRules.input(el);
      return;
    }
    var act = el.getAttribute('data-act');
    if (!act) return;
    if (act === 'stu-q') {
      var g = $('[data-act="stu-grade"]');
      applyFilter('#stuList', el.value, function (n) { return !g || !g.value || n.getAttribute('data-grade') === g.value; });
    } else if (act === 'exam-q') applyFilter('#examTbody', el.value, examFilterFn());
    else if (act === 'q-q') {
      QFilter.q = el.value;
      if (QSearchTimer) clearTimeout(QSearchTimer);
      QSearchTimer = setTimeout(function () { QView.page = 0; applyQFilter(); }, 120);
    }
    else if (act === 'paper-q') applyPaperFilter();
    else if (act === 'pb-f-title') PaperB.title = el.value;
    else if (act === 'pb-f-subtitle') PaperB.subtitle = el.value;
    else if (act === 'pb-f-date') PaperB.date = el.value;
    else if (act === 'pb-f-duration') PaperB.duration = el.value;
    else if (act === 'pb-f-kw') { PaperB.filt.kw = el.value; PaperB.renderBank(); }
    else if (act === 'pb-n') PaperB.pickN = num(el.value, 10);
    else if (act === 'pb-lv') { var _i = +el.getAttribute('data-i'); if (!isNaN(_i) && _i >= 0 && _i < LEVELS.length) PaperB.pickLv[_i] = num(el.value); }
    else if (act === 'pb-score') {
      var psi = +el.getAttribute('data-i');
      if (PaperB.items[psi]) { PaperB.items[psi].score = num(el.value); PaperB.syncMeta(); }
    }
    else if (act === 'wq-text') { WordQuiz.pasteText = el.value; }
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el.getAttribute) return;
    var act = el.getAttribute('data-act');
    if (act === 'stu-grade') {
      var q = $('[data-act="stu-q"]');
      applyFilter('#stuList', q ? q.value : '', function (n) { return !el.value || n.getAttribute('data-grade') === el.value; });
    } else if (act === 'exam-name' || act === 'exam-subject') {
      applyFilter('#examTbody', ($('[data-act="exam-q"]') || {}).value || '', examFilterFn());
    } else if (act === 'q-chapter' || act === 'q-point' || act === 'q-qtype' || act === 'q-level') {
      QFilter[act.slice(2)] = el.value;
      QView.page = 0;
      applyQFilter();
    }
    else if (act === 'q-sort') {
      QSort.mode = el.value;
      qApplySort();
      UI.toast(QSort.mode === 'default' ? '已恢复默认顺序' : '已按「' + (QSORT_MODES.filter(function (m) { return m[0] === QSort.mode; })[0] || ['', ''])[1] + '」排序', 'ok', 1200);
    } else if (act === 'q-pagesize') {
      QView.pageSize = parseInt(el.value, 10) || 100;
      QView.page = 0;
      qRenderPage();
    } else if (act === 'q-goto') {
      var gp = parseInt(el.value, 10);
      if (gp >= 1) {
        var gtp = QView.total ? Math.max(1, Math.ceil(QView.total / QView.pageSize)) : 1;
        QView.page = Math.min(gp - 1, gtp - 1);
        qRenderPage();
      }
    } else if (act === 'pb-f-chapter' || act === 'pb-f-point' || act === 'pb-f-qtype' || act === 'pb-f-level') {
      PaperB.filt[act.slice(5)] = el.value;
      PaperB.renderBank();
    } else if (act === 'pb-pagesize') {
      PaperB.bankSize = parseInt(el.value, 10) || 100;
      PaperB.bankPage = 0;
      PaperB.renderBank();
    } else if (act === 'wq-autonum') {
      WQ_AUTO = !!el.checked;
      if (WordQuiz.paras && WordQuiz.paras.length) WordQuiz.reparse();
    } else if (act === 'wq-kpauto') {
      WQ_KP_AUTO = !!el.checked;
      if (WordQuiz.paras && WordQuiz.paras.length) WordQuiz.reparse();
    } else if (act === 'kp-chapter') {
      if (KpRules.draft) KpRules.draft.useChapter = !!el.checked;
    } else if (act === 'wq-sel') { WordQuiz.setSel(+el.getAttribute('data-i'), el.checked); } else if (act === 'trend-who') { App.trendWho = el.value; renderTrend(); }
    else if (act === 'trend-subject') { App.trendSubject = el.value; renderTrend(); }
    else if (act === 'imp-sheet') { Import.sheetIdx = +el.value; Import.guess(); Import.render(); }
    else if (act === 'imp-header') { Import.hasHeader = el.checked; Import.guess(); Import.render(); }
    else if (act === 'imp-map') { Import.map[el.getAttribute('data-key')] = +el.value; }
    else if (el.id === 'offlineDur') {
      var ce = $('#offlineCustom');
      if (ce) ce.disabled = el.value !== 'custom';
    }
  });

  /* 标签输入回车 */
  document.addEventListener('keydown', function (e) {
    var el = e.target;
    if (!el.getAttribute) return;
    var act = el.getAttribute('data-act');
    if ((act === 'tag-input') && e.key === 'Enter') {
      e.preventDefault();
      var k = el.getAttribute('data-k');
      var v = el.value.trim();
      if (v) { (Editor.tags[k] = Editor.tags[k] || []).push(v); el.value = ''; reRenderTagBox(k); }
    }
  });
}

function reRenderTagBox(k) {
  var box = $('[data-tagbox="' + k + '"]');
  if (!box) return;
  var arr = Editor.tags[k] || [];
  box.innerHTML = arr.map(function (t, i) {
    return '<span class="pill">' + esc(t) + '<b data-act="tag-del" data-k="' + k + '" data-i="' + i + '">×</b></span>';
  }).join('') + '<input data-act="tag-input" data-k="' + k + '" placeholder="回车添加">';
  var inp = box.querySelector('input');
  if (inp) inp.focus();
}

function examFilterFn() {
  var en = $('[data-act="exam-name"]'), es = $('[data-act="exam-subject"]');
  return function (tr) {
    if (en && en.value && tr.getAttribute('data-exam') !== en.value) return false;
    if (es && es.value && tr.getAttribute('data-subject') !== es.value) return false;
    return true;
  };
}


/* ---------------- 动作分发 ---------------- */
function handleAct(act, el, id, col, e) {
  var st = Store.state;
  switch (act) {
    /* ---- 通用增删改 ---- */
    case 'new': Editor.open(col, '', el.getAttribute('data-date') ? { date: el.getAttribute('data-date') } : null); return;
    case 'edit': Editor.open(col, id); return;
    case 'del':
      var name = (SCHEMA[col] || {}).title || '记录';
      UI.confirm('删除确认', '确定删除这条<b>' + esc(name) + '</b>记录吗？此操作不可恢复。', function () {
        Store.remove(col, id);
        if (col === 'scoreSheets') syncExitScoresToStudents();
        UI.closeAll(); UI.toast('已删除'); App.refresh();
      }, '删除');
      return;
    case 'tag-del':
      var k = el.getAttribute('data-k'), i = +el.getAttribute('data-i');
      (Editor.tags[k] || []).splice(i, 1); reRenderTagBox(k); return;

    /* ---- 首页 / 日历 ---- */
    case 'toggle-done':
      var c = byId(st.calendar, id);
      if (c) { c.done = !c.done; c.updatedAt = Date.now(); Store.save('calendar'); App.refresh(); }
      return;
    case 'postpone':
      var c2 = byId(st.calendar, id);
      if (c2) { c2.date = todayStr(); c2.updatedAt = Date.now(); Store.save('calendar'); UI.toast('已顺延到今天'); App.refresh(); }
      return;
    case 'postpone-all':
      var n = 0;
      st.calendar.forEach(function (cc) { if (!cc.done && cc.date < todayStr()) { cc.date = todayStr(); cc.updatedAt = Date.now(); n++; } });
      Store.save('calendar'); UI.toast('已顺延 ' + n + ' 项到今天', 'ok'); App.refresh(); return;
    case 'cal-prev': App.calMonth = shiftMonth(App.calMonth, -1); renderCalGrid(); return;
    case 'cal-next': App.calMonth = shiftMonth(App.calMonth, 1); renderCalGrid(); return;
    case 'cal-today': App.calMonth = todayStr().slice(0, 7); App.calSel = todayStr(); App.refresh(); return;
    case 'cal-day':
      App.calSel = el.getAttribute('data-date');
      App.calMonth = App.calSel.slice(0, 7);
      renderCalGrid(); renderSelDate(); return;

    /* ---- 导入导出 ---- */
    case 'import-cal': Import.open('calendar'); return;
    case 'imp-students': Import.open('students'); return;
    case 'imp-exams': Import.open('exams'); return;
    case 'imp-questions': Import.open('questions'); return;
    case 'imp-exitTests': Import.open('exitTests'); return;

    /* ---- 题库：Word 试卷导入 ---- */
    case 'imp-word': WordQuiz.open(); return;
    case 'wq-pick': WordQuiz.pick(); return;
    case 'wq-pick-multi': WordQuiz.pickMulti(); return;
    case 'wq-pick-dir': WordQuiz.pickDir(); return;
    case 'wq-dedup-stem': WordQuiz.clearDupStem(); return;
    case 'wq-paste-toggle': WordQuiz.pasteMode = !WordQuiz.pasteMode; WordQuiz.render(); return;
    case 'wq-parse-text': WordQuiz.usePaste(); return;
    case 'wq-clear':
      WordQuiz.items = []; WordQuiz.sel = {}; WordQuiz.srcName = ''; WordQuiz.err = '';
      WordQuiz.batch = null; WordQuiz.busy = false;
      WordQuiz.render(); return;
    case 'wq-all': case 'wq-none':
      WordQuiz.items.forEach(function (_, i) { WordQuiz.sel[i] = (act === 'wq-all'); });
      WordQuiz.render(); return;
    case 'wq-merge': WordQuiz.merge(+el.getAttribute('data-i')); return;
    case 'wq-kp': WordQuiz.cyclePoint(+el.getAttribute('data-i')); return;
    case 'wq-kp-retag': WordQuiz.retagAll(); return;
    case 'wq-import': WordQuiz.run(); return;

    /* ---- 知识点标签规则（可维护） ---- */
    case 'kp-open': KpRules.open(); return;
    case 'kp-cancel': UI.closeMask('#maskKp'); return;
    case 'kp-toggle':
      /* 点分类标题行折叠/展开；点在输入框或按钮上时不触发折叠 */
      if (e && e.target && e.target.closest && e.target.closest('input,button,textarea')) return;
      KpRules.toggle(+el.getAttribute('data-ci')); return;
    case 'kp-expand': KpRules.expandAll(!!el.getAttribute('data-v')); return;
    case 'kp-add-cat': KpRules.mutate('add-cat'); return;
    case 'kp-del-cat': KpRules.mutate('del-cat', +el.getAttribute('data-ci')); return;
    case 'kp-add-pt': KpRules.mutate('add-pt', +el.getAttribute('data-ci')); return;
    case 'kp-del-pt': KpRules.mutate('del-pt', +el.getAttribute('data-ci'), +el.getAttribute('data-pi')); return;
    case 'kp-up-pt': KpRules.mutate('up-pt', +el.getAttribute('data-ci'), +el.getAttribute('data-pi')); return;
    case 'kp-down-pt': KpRules.mutate('down-pt', +el.getAttribute('data-ci'), +el.getAttribute('data-pi')); return;
    case 'kp-test': KpRules.test(); return;
    case 'kp-clear-try': KpRules.tryText = ''; KpRules.out = ''; KpRules.render(); return;
    case 'kp-save': KpRules.save(); return;
    case 'kp-default': KpRules.restoreDefault(); return;

    /* ---- 组卷 ---- */
    case 'paper-new': PaperB.open(''); return;
    case 'paper-edit': PaperB.open(id); return;
    case 'paper-del': {
      var pd = byId(Store.state.papers, id);
      if (!pd) return;
      UI.confirm('删除试卷', '确定删除试卷《' + esc(pd.title || '未命名') + '》吗？<b>题库里的题目不会被删除。</b>', function () {
        Store.remove('papers', id);
        UI.closeAll(); UI.toast('已删除试卷'); App.refresh();
      }, '删除试卷');
      return;
    }
    case 'paper-prev': {
      var pv1 = byId(Store.state.papers, id);
      if (pv1) PaperB.showPreview(pv1, pv1.showAnswer !== false);
      return;
    }
    case 'paper-print': {
      var pv2 = byId(Store.state.papers, id);
      if (pv2) exportGuard('打印', function () { printHTML(paperPrintHTML(pv2, pv2.showAnswer !== false)); });
      return;
    }
    case 'paper-docx': {
      var pv3 = byId(Store.state.papers, id);
      if (pv3) exportGuard('导出 Word', function () { Files.downloadDocx(paperFileName(pv3), paperDocxBlocks(pv3, pv3.showAnswer !== false)); });
      return;
    }
    case 'paper-copy': {
      var pv4 = byId(Store.state.papers, id);
      if (pv4) copyText(paperToText(pv4, pv4.showAnswer !== false));
      return;
    }
    case 'pb-add': PaperB.toggle(id); return;
    case 'pb-sel-del':
      PaperB.items.splice(+el.getAttribute('data-i'), 1);
      PaperB.renderBank(); PaperB.renderSel(); return;
    case 'pb-sel-up': {
      var iu = +el.getAttribute('data-i');
      if (iu > 0) { var sw1 = PaperB.items[iu - 1]; PaperB.items[iu - 1] = PaperB.items[iu]; PaperB.items[iu] = sw1; }
      PaperB.renderSel(); return;
    }
    case 'pb-sel-down': {
      var idn = +el.getAttribute('data-i');

function shiftMonth(m, d) {
  var y = +m.slice(0, 4), mo = +m.slice(5, 7) + d;
  while (mo < 1) { mo += 12; y--; }
  while (mo > 12) { mo -= 12; y++; }
  return y + '-' + pad2(mo);
}

function copyText(t) {
  if (!t) { UI.toast('没有可复制的内容', 'err'); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(function () { UI.toast('已复制到剪贴板', 'ok'); },
      function () { fallbackCopy(t); });
  } else fallbackCopy(t);
}
function fallbackCopy(t) {
  var ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); UI.toast('已复制到剪贴板', 'ok'); }
  catch (e) { UI.toast('复制失败，请手动选择文本', 'err'); }
  document.body.removeChild(ta);
}

function linkExam(id) {
  var e = byId(Store.state.exams, id);
  if (!e) return;
  var items = Store.state.students.map(function (s) {
    return { key: s.id, label: s.name + (s.school ? '（' + s.school + '）' : ''), icon: 'i-users', fn: function () { doLink(id, s.id, s.name); } };
  });
  if (!items.length) { UI.toast('还没有学生档案，请先导入或新增', 'err'); return; }
  items.push({ key: '__new', label: '用「' + e.studentName + '」新建档案并关联', icon: 'i-plus', fn: function () {
    var s = Store.add('students', { name: e.studentName, school: e.school || '', grade: e.grade || '', _from: '成绩导入' });
    doLink(id, s.id, s.name);
  } });
  UI.sheet(items);
}
function doLink(examId, studentId, studentName) {
  Store.update('exams', examId, { studentId: studentId, studentName: studentName });
  UI.closeAll(); UI.toast('已关联到 ' + studentName, 'ok'); App.refresh();
}
/* 静默自动关联：按「姓名+学校」→「姓名」把 exams 挂到学生档案，不覆盖已有手动关联 */
function autoLinkExamsSilent() {
  var map = {};
  Store.state.students.forEach(function (s) {
    if (!s.name) return;
    var nm = s.name.trim();
    var k = nm + '|' + (s.school || '').trim();
    map[k] = s.id;
    if (!map[nm]) map[nm] = s.id;
    else if (map[nm] !== s.id) map[nm] = '';   /* 同名不唯一，跳过 */
  });
  var n = 0;
  Store.state.exams.forEach(function (e) {
    if (e.studentId) return;
    var sid = map[(e.studentName || '').trim() + '|' + (e.school || '').trim()] || map[(e.studentName || '').trim()];
    if (sid) { e.studentId = sid; n++; }
  });
  if (n) Store.save('exams');
  return n;
}

function autoLink() {
  var n = autoLinkExamsSilent();
  if (n) { UI.toast('已关联 ' + n + ' 条成绩', 'ok'); }
  else UI.toast('没有可自动关联的成绩，请手动关联', 'err');
  App.refresh();
}

function restoreJSON(mode) {
  Files.pick('.json,application/json', function (f) {
    Files.readText(f).then(function (txt) {
      var obj;
      try { obj = JSON.parse(txt); } catch (err) { UI.toast('不是有效的 JSON 备份文件', 'err'); return; }
      Store.importAll(obj, mode);
      UI.toast(mode === 'replace' ? '已用备份覆盖恢复' : '已合并备份数据', 'ok');
      if ($('#app').classList.contains('hidden')) enterApp();
      else App.refresh();
      Cloud.pushDirty();
    }).catch(function () { UI.toast('读取备份失败', 'err'); });
  });
}

var deferredPrompt = null;
function showInstallTip() {
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  var body = standalone ? '你已经把工作台装成应用了，桌面/主屏幕图标打开即可。'
    : (deferredPrompt ? '当前浏览器支持一键安装，点下方按钮即可添加到桌面/主屏幕。'
      : '安装方法：<br><b>安卓 Chrome</b>：右上角菜单 → 添加到主屏幕<br><b>iPhone Safari</b>：底部分享 → 添加到主屏幕<br><b>电脑 Chrome/Edge</b>：地址栏右侧安装图标');
  if (deferredPrompt) {
    UI.confirm('安装工作台', body, function () {
      UI.closeAll();
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function () { deferredPrompt = null; });
    }, '安装');
  } else {
    UI.confirm('安装工作台', body + '<br><br><span class="text-m">提示：安装后断网也能用，数据仍存在本机。</span>', function () { UI.closeAll(); });
  }
}

/* ---------------- 启动 ---------------- */
function boot() {
  Cloud.init();
  Cloud.onStatus = function () { updateSyncChip(); };
  Store.onSync = function (col) {
    updateSyncChip();
    if (Cloud.available()) cloudPushSoon();
  };
  bindEvents();
  try {
    var last = localStorage.getItem(LS_USER);
    if (last) $('#loginUser').value = last;
  } catch (e) { }
  $('#loginEnvTip').textContent = Cloud.available()
    ? '已连接云端同步，数据可在多设备间同步'
    : '独立站点模式：数据保存在本机，可随时导出备份';
  if (window.location.hash) {
    var hv = window.location.hash.replace('#', '');
    if (VIEWS.some(function (v) { return v.k === hv; })) App.view = hv;
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { });
    });
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
  });
}
var cloudPushSoon = debounce(function () { Cloud.pushDirty(); }, 1500);

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>

  /* ---------------- 存取 ---------------- */
  function rd(k, def) {

  }

  var _kp = null;
  function kp() {

    }
    _kp = t;
    return _kp;
  }
  function kpSave(t) { _kp = t; wr(LS_KP, t); }

  var _d = null;
  function D() {
    if (_d) return _d;
    _d = rd(LS_DRAFT, null);
    if (!_d || !_d.items) _d = null;

    ensureShape(_d);

  }
  /* 题量 / 分值 / 版式都不是写死的：cfg 控制配题数量与建议用时，rules 是「题型 → 默认分值」
     映射表（新增题目时按题型自动赋分，之后仍可在题目列表里逐题覆盖），style 控制版式。 */
  function defRules() {
    return [
      { t: '选择题', s: 3 }, { t: '填空题', s: 3 }, { t: '推断题', s: 19 },
      { t: '实验题', s: 19 }, { t: '计算题', s: 19 }, { t: '工艺流程题', s: 19 }, { t: '简答题', s: 19 }
    ];
  }
  function defStyle() {
    return {
      head: 'text',          /* 卷首：「text」纯文字标题（Word 里可直接改）/「shape」logo 图形 + 橙色标题条 */
      qno: 'text',           /* 题号：「text」居中加粗「题N」/「badge」橙色徽章 /「plain」行内「1．」 */
      source: true,          /* 题干前保留来源标签「（25-26高二上·广东深圳·期中）」 */
      nameLine: '姓名：____________　　班级：____________　　得分：__________',
      sub: '查漏补缺',        /* 标题末尾的后缀（文字卷首用） */

  /* 卷首 / 题号样式解析（老数据里只有 logo / badge 布尔值，一律落到安全的文字版） */
  function headMode(s) { return (s && s.head) === 'shape' ? 'shape' : 'text'; }
  function qnoMode(s) {
    var v = (s || {}).qno;
    return (v === 'badge' || v === 'plain' || v === 'text') ? v : 'text';
  }
  function ensureShape(d) {
    if (!d.cfg) d.cfg = {};
    var c = d.cfg;
    if (c.choiceN == null) c.choiceN = 7;
    if (c.choiceScore == null) c.choiceScore = 3;
    if (c.bigN == null) c.bigN = 1;
    if (c.bigScore == null) c.bigScore = 19;
    if (c.duration == null) c.duration = 20;
    if (!c.levels) c.levels = [];
    if (c.avoidUsed == null) c.avoidUsed = true;
    if (!c.rules || !c.rules.length) c.rules = defRules();
    if (!d.style) d.style = defStyle();
    var s = defStyle(), k;
    for (k in s) if (d.style[k] === undefined) d.style[k] = s[k];
    if (d.title == null) d.title = '';
    return d;
  }
  function dSave() { wr(LS_DRAFT, D()); }

  /* 按题型查默认分值：命中 rules 表用表里的值，否则回退到 选择题/大题 分值 */
  function scoreOf(q) {
    var c = D().cfg, rs = c.rules || [], t = q && q.qtype, i;
    for (i = 0; i < rs.length; i++) if (rs[i].t === t) return num(rs[i].s);
    return isChoice(q) ? num(c.choiceScore) : num(c.bigScore);
  }
  /* 中文数字：1→一，10→十，12→十二（用于「第十二讲」） */
  function cnNum(n) {
    n = num(n);
    if (n <= 0) return '';
    var d = '零一二三四五六七八九', u = ['', '十', '百', '千'];
    if (n < 10) return d[n];
    if (n < 20) return '十' + (n % 10 ? d[n % 10] : '');
    if (n < 100) return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
    return String(n);
  }
  /* 卷首橙色标题：第N讲 + 讲次名 + 后缀（如「第二讲 化学反应速率 查漏补缺」） */
  function ecAutoTitle() {
    var l = curLesson();
    var s = D().style || defStyle();
    if (!l) return '';
    return ('第' + cnNum(num(l.no) || 0) + '讲 ' + String(l.title || '').trim() + (s.sub ? ' ' + s.sub : '')).trim();
  }
  function ecTitle() {
    var d = D();
    return String(d.title || '').trim() || ecAutoTitle() || '出门测';
  }

  /* ---------------- 树操作 ---------------- */
  function level(id) {
    var ls = kp().levels, i;
    for (i = 0; i < ls.length; i++) if (ls[i].id === id) return ls[i];
    return ls[0];
  }
  function group(id) {

    for (i = 0; i < gs.length; i++) if (gs[i].id === id) return gs[i];
    return gs[0];
  }

    var ls = group(D().groupId).lessons, i;

  }

  /* ---------------- 题库匹配 ---------------- */
  /* tags 可能是数组（页面默认），也可能是字符串 / 对象（从表格、CSV、旧备份导入后）。
     直接 .join() 会在字符串上抛错，而这里是在「选题出卷」视图渲染时被调用的 ——
     一抛错整个视图就渲染不出来，表现就是点了没反应。统一归一化成文本。 */
  function fieldText(v) {
    if (v == null) return '';
    if (Array.isArray(v)) return v.join(' ');
    if (typeof v === 'object') {
      try { return Object.keys(v).join(' '); } catch (e) { return ''; }
    }
    return String(v);
  }
  function qHay(q) {
    return [fieldText(q.chapter), fieldText(q.point), fieldText(q.tags),

  }
  function scoreQ(q, pts) {

    for (i = 0; i < (pts || []).length; i++) {
      var p = String(pts[i] || '').trim().toLowerCase();
      if (!p) continue;
      if (hay.indexOf(p) >= 0) { if (best < 100) best = 100; continue; }
      if (full.indexOf(p) >= 0) { if (best < 40) best = 40; continue; }
      var toks = p.split(/[与和、，,／\/（）()·：:\s]+/).filter(function (x) { return x.length >= 2; });
      if (!toks.length) continue;
      var hit = 0;
      toks.forEach(function (t) { if (full.indexOf(t) >= 0) hit++; });
      if (hit) { var s2 = 10 + Math.round(30 * hit / toks.length); if (best < s2) best = s2; }
    }
    return best;
  }
  /* ---------------- 学习进度范围（不超纲） ----------------

     同一年级内按「体系组」在大纲里的先后顺序：暑假 → 秋季 → 寒假 → 春季
     （DEFAULT_KP 里各组已按此排列，scopePts 顺着组序遍历）；同一体系组内按讲次号。
     当前讲次及以前 = 已学（可以考），之后 = 未学（不能考）。 */
  function scopePts(d) {

      break;
    }
    if (!pos) return null;                 /* 找不到当前进度就不做限制，保持原行为 */
    var allowed = [], future = [], cur = [], now = [], seenA = {}, seenF = {}, seenC = {};
    for (i = 0; i < ls.length; i++) {
      var gs2 = ls[i].groups || [];
      for (j = 0; j < gs2.length; j++) {
        var lss = gs2[j].lessons || [];
        for (k = 0; k < lss.length; k++) {
          var L = lss[k], before;
          if (i < pos.li) before = true;
          else if (i > pos.li) before = false;
          else if (j < pos.gi) before = true;
          else if (j > pos.gi) before = false;
          else before = num(L.no) <= pos.no;
          var arr = before ? allowed : future, seen = before ? seenA : seenF;
          (L.points || []).forEach(function (p) {
            p = String(p == null ? '' : p).trim();
            if (!p || seen[p]) return;
            seen[p] = 1; arr.push(p);
            /* 同时记一份「本年级已学」：高年级卷子里回头考本年级内容的题，
               靠它来放行，避免一刀切误杀 */
            if (before && i === pos.li && !seenC[p]) { seenC[p] = 1; cur.push(p); }
          });
          /* 本讲自己的知识点：命中它的题一定不算超纲（那正是本讲要考的） */
          if (i === pos.li && j === pos.gi && num(L.no) === pos.no) {
            (L.points || []).forEach(function (p) {
              p = String(p == null ? '' : p).trim();
              if (p && now.indexOf(p) < 0) now.push(p);
            });
          }
        }
      }
    }
    /* 后面讲次里重复出现的知识点，前面已经学过 → 按已学算，不算超纲 */
    future = future.filter(function (p) { return !seenA[p]; });
    return { allowed: allowed, future: future, cur: cur, now: now };
  }
  /* ---------------- 题源学段（不超纲的第二道闸） ----------------
     只靠「命中未学知识点」这道闸漏得厉害：高二上册（选择性必修1 化学反应原理）在大纲里
     根本没有对应讲次，于是这批高二题在黑名单上一道都命中不了，会被选进高一的出门测。
     好在题目自带的「来源 / 章节」里往往就写着年级（导入时生成的来源标签形如
     「24-25高二上·××中学·期末」），这里把它抽出来，做成一道不依赖大纲覆盖度的硬门槛。 */
  var STAGE_RANK = { j3: 0, s1: 1, s2: 2, s3: 3 };   /* s3 = 高三 / 高考，超出高中在校进度 */
  function stageRank(id) { var r = STAGE_RANK[id]; return (r == null) ? -1 : r; }
  /* 年级字段 → 学段。题目自带 grade（来自 GRADES：初三/高一/高二/高三…），优先用它，
     比从来源文字里猜年级稳得多；grade 缺失或不在体系内（如「其他」）才退回文字解析。 */
  var GRADE_STAGE = { '初三':'j3','九年级':'j3','初中':'j3','初一':'j3','初二':'j3',
                      '高一':'s1','高二':'s2','高三':'s3','高考':'s3' };
  function qStage(q) {
    if (!q) return '';
    var g = q.grade != null ? String(q.grade).trim() : '';
    if (GRADE_STAGE[g]) return GRADE_STAGE[g];
    var t = [fieldText(q.source), fieldText(q.chapter), fieldText(q.point),
      fieldText(q.tags), fieldText(q.code)].join(' ');
    if (!t) return '';
    if (/高三|高考/.test(t)) return 's3';
    /* 「选择性必修 / 选必」必须排在「必修」前面判，否则「选择性必修1」会被误判成高一 */
    if (/高二|选择性必修|选\s*必|物质结构与性质|有机化学基础|化学反应原理/.test(t)) return 's2';
    if (/高一|必修\s*(?:第)?\s*[一二三1-4]/.test(t)) return 's1';
    if (/初三|九年级|中考|初中/.test(t)) return 'j3';
    return '';
  }
  /* 这道题是否超出当前进度。返回 '' = 没超纲；非空 = 超纲原因（可直接显示给用户）。
     两道闸：
       1) 命中了「还没学到的知识点」；
       2) 题源学段高于当前学段，又没有明确命中任何已学考点 —— 多半是大纲里没列到的高年级内容。
          高二卷里回头考高一内容的题，只要明确命中了已学考点就放行，不至于误杀。 */
  function overshootQ(q, scope) {
    if (!q) return '';
    /* 本讲考点命中 → 一定不超纲（后面讲次的近似考点会误伤本讲的题，这里先兜住） */
    if (scope && scope.now && scope.now.length && scoreQ(q, scope.now) >= 100) return '';
    if (scope && scope.future.length && scoreQ(q, scope.future) > 0) return '超出本讲进度，后面才学到';
    var cs = stageRank(D().level), qs = qStage(q);
    if (cs < 0 || !qs || stageRank(qs) <= cs) return '';
    if (!scope || !scope.cur || !scope.cur.length) {
      return '题源是' + ({ s3: '高三', s2: '高二', s1: '高一' }[qs] || '更高年级') + '的内容';
    }
    if (scoreQ(q, scope.cur) >= 100) return '';
    return '题源是' + ({ s3: '高三', s2: '高二', s1: '高一' }[qs] || '更高年级') +
      '，本讲及以前没学过它的考点';
  }
  function isChoice(q) { return CHOICE_TYPES.indexOf(q && q.qtype) >= 0; }
  function poolCount(q, pts) {
    return scoreQ(q, pts) > 0;
  }
  /* Store.state 在「未登录 / 数据未加载 / 刚登出」时是 null，
     直接取 .questions 会抛错，把整个出门测视图渲染打断（表现就是点了没反应） */
  function qList() {
    var st = (typeof Store !== 'undefined' && Store.state) || {};
    return st.questions || [];
  }

  function usedMap() { return rd(LS_USED, {}); }
  function markUsed(ids) {
    var m = usedMap(), now = Date.now(), keys = Object.keys(m);
    ids.forEach(function (id) { m[id] = now; });
    keys = Object.keys(m);
    if (keys.length > 400) {
      keys.sort(function (a, b) { return (m[a] || 0) - (m[b] || 0); });
      keys.slice(0, keys.length - 400).forEach(function (k) { delete m[k]; });
    }
    wr(LS_USED, m);
  }

  /* ---------------- 自动配题 ---------------- */
  function ecAuto(keep) {
    var d = D(), cfg = d.cfg;
    var pts = (d.points && d.points.length) ? d.points : ((curLesson() || {}).points || []);
    var inDraft = {};
    d.items.forEach(function (it) { inDraft[it.qid] = 1; });
    var used = cfg.avoidUsed ? usedMap() : {};
    var lvOk = function (q) {
      if (!cfg.levels || !cfg.levels.length) return true;
      return cfg.levels.indexOf(q.level) >= 0;
    };
    /* 不超纲：只从「本讲及以前学过的内容」里选题 */
    var scope = scopePts(d), overCut = 0;
    var scopeOk = function (q) {
      if (!overshootQ(q, scope)) return true;
      overCut++;
      return false;
    };
    var cand = qList().filter(function (q) {
      return q && q.id && !inDraft[q.id] && !used[q.id] && lvOk(q) && scopeOk(q);
    });
    if (!cand.length) {
      if (!keep) { d.items = []; dSave(); }
      UI.toast('题库里没有「本讲及以前学过的内容」能匹配的题目' +
        (overCut ? '（已排除 ' + overCut + ' 道超出本讲进度的题）' : ''), 'err');
      ecRender();
      return;
    }
    var scored = cand.map(function (q) { return { q: q, s: scoreQ(q, pts) }; });
    var hit = scored.filter(function (x) { return x.s > 0; });
    var fallback = false;
    if (!hit.length) { hit = scored.map(function (x) { return { q: x.q, s: 0 }; }); fallback = true; }
    hit.sort(function (a, b) { return b.s - a.s || (Math.random() - 0.5); });

    if (!keep) d.items = [];
    var wantC = num(cfg.choiceN) || 0, wantB = num(cfg.bigN) || 0;
    var gotC = 0, gotB = 0, i, x;
    for (i = 0; i < hit.length && (gotC < wantC || gotB < wantB); i++) {
      x = hit[i];
      if (isChoice(x.q)) {
        if (gotC < wantC) { d.items.push(mkItem(x.q, scoreOf(x.q))); gotC++; }
      } else if (gotB < wantB) { d.items.push(mkItem(x.q, scoreOf(x.q))); gotB++; }
    }
    /* 大题没配够就从非选择题里补，选择题没配够就从选择题里补（放宽知识点限制） */
    if (gotB < wantB) {
      var rest = scored.filter(function (y) { return !isChoice(y.q) && d.items.every(function (it) { return it.qid !== y.q.id; }); });
      rest.sort(function (a, b) { return b.s - a.s || (Math.random() - 0.5); });
      for (i = 0; i < rest.length && gotB < wantB; i++) { d.items.push(mkItem(rest[i].q, scoreOf(rest[i].q))); gotB++; }
    }
    if (gotC < wantC) {
      var rest2 = scored.filter(function (y) { return isChoice(y.q) && d.items.every(function (it) { return it.qid !== y.q.id; }); });
      rest2.sort(function (a, b) { return b.s - a.s || (Math.random() - 0.5); });
      for (i = 0; i < rest2.length && gotC < wantC; i++) { d.items.push(mkItem(rest2[i].q, scoreOf(rest2[i].q))); gotC++; }
    }
    d.items.sort(function (a, b) { return (isChoice(byId(qList(), a.qid)) ? 0 : 1) - (isChoice(byId(qList(), b.qid)) ? 0 : 1); });
    dSave();
    UI.toast(fallback
      ? ('题库里没有按本讲知识点命中的题目，已按题型在本讲以前的范围内抽 ' + d.items.length + ' 题（不会超出进度）')
      : ('已自动配题 ' + d.items.length + ' 题（选择题 ' + gotC + '，大题 ' + gotB + '）' +
         (overCut ? '，已排除 ' + overCut + ' 道超出本讲进度的题' : '')), fallback ? 'err' : 'ok');
    ecRender();
  }

  function mkItem(q, score) {
    return { qid: q.id, score: num(score) || 0, note: '', _t: Date.now() };
  }
  function addQ(q) {
    var d = D();
    if (d.items.some(function (it) { return it.qid === q.id; })) { UI.toast('这道题已经在本次出门测里了'); return false; }

  function b64ToBytes(b64) {

    } catch (e) { return null; }
  }

  /* 来源标签「（25-26高二上·广东深圳·期中）」：题库 source 有值、且题干里还没写，才补在前面 */
  var SRC_RE = /^\s*[（(]\s*\d{2}-\d{2}[^）)]*[）)]/;
  function srcTag(q) {
    if (!(D().style || {}).source) return '';
    var s = String((q && q.source) || '').trim();
    if (!s) return '';
    if (SRC_RE.test(String(q.stem || ''))) return '';      /* 题干已自带，不重复 */
    return '（' + s.replace(/^[（(]\s*/, '').replace(/\s*[）)]$/, '') + '）';
  }

  function ecAnswerSummary() {
    var d = D(), ch = [], big = [];
    d.items.forEach(function (it, i) {
      var q = byId(qList(), it.qid) || {};

      if (isChoice(q)) {

      } else big.push({ no: i + 1, a: a || '（略）' });
    });
    var s = '';
    if (ch.length) s += ch[0].no + (ch.length > 1 ? '-' + ch[ch.length - 1].no : '') + '：' + ch.map(function (x) { return x.a; }).join('');
    big.forEach(function (b) { s += (s ? '　　' : '') + b.no + '．' + b.a; });
    return s;
  }
  function ecDocxBlocks(teacher) {
    var d = D(), out = [], stl = d.style || defStyle();
    var tt = ecTitle();

    /* ① 卷首：默认纯文字标题（居中黑体加粗，Word 里可直接改）；
       「shape」才用样例的 logo 组合图形（图形在 Word 里编辑/保存容易错位） */
    var lb = headMode(stl) === 'shape' ? logoBlock(tt) : null;
    if (lb) out.push(lb);
    else out.push({ text: tt + '（' + (teacher ? '教师版' : '学生版') + '）', align: 'center', bold: true, size: 32, spacing: { after: 80 }, font: '黑体', style: 'PaperTitle' });

    /* ② 姓名行（居中） + 满分/用时（样例版式：五号字，满分行加粗） */
    if (String(stl.nameLine || '').trim()) {

    }
    out.push({
      text: '满分' + totalScore() + '分，建议测试用时' + (num(d.cfg.duration) || 20) + '分钟',
      size: 21, bold: true, spacing: { after: 100 }
    });

    /* ③ 教师版卷首答案汇总 */
    if (teacher) {
      var sum = ecAnswerSummary();
      if (sum) out.push({ text: '答案：' + sum, size: 21, spacing: { after: 120 } });
    }

    /* ④ 题目。题号默认「题N」独立成段、居中加粗（真文字，Word 里可编辑） */
    var qm = qnoMode(stl);
    d.items.forEach(function (it, i) {
      var q = byId(qList(), it.qid);
      var st = out.length;
      var bb = qm === 'badge' ? badgeBlock(i + 1) : null;
      if (bb) out.push(bb);
      else if (qm === 'text') out.push({ text: '题' + (i + 1), align: 'center', bold: true, size: 21, spacing: { before: 60, after: 0 }, style: 'QNo' });
      var lead = (qm === 'plain' ? (i + 1) + '．' : '') +
        (num(it.score) ? '（' + num(it.score) + '分）' : '') +
        (String(it.note || '').trim() ? '（' + String(it.note).trim() + '）' : '');
      if (!q) { out.push({ text: lead + '（原题已从题库删除）', size: 21, spacing: { after: 120 } }); return; }
      docxStem(out, lead + srcTag(q), q, 60);
      var opts = qOpts(q);
      if (opts) docxRich(out, opts, q, 60);
      if (teacher) {
        out.push({ text: '【答案】' + (String(q.answer || '').trim() || '（未填）'), size: 21, spacing: { after: 40 } });
        if (String(q.analysis || '').trim()) docxRich(out, '【解析】' + q.analysis, q, 120);
      }
      for (var b = st; b < out.length - 1; b++) out[b].keepNext = true;

    return out;

      d.points = ((lesson(num(v)) || {}).points || []).slice();
      if (!d.title) { /* 自动给个默认标题 */ }
      dSave(); ecRender(); return;
    }
    if (f === 'title') { d.title = v; dSave(); return; }
    if (f === 'score') { if (d.items[i]) { d.items[i].score = num(v); dSave(); ecRender(); } return; }
    if (f === 'note') { if (d.items[i]) { d.items[i].note = v; dSave(); } return; }
    if (f === 'ruleScore') { if (d.cfg.rules && d.cfg.rules[i]) { d.cfg.rules[i].s = num(v); dSave(); } return; }
    if (f && f.indexOf('style.') === 0) {
      var sk = f.slice(6);
      d.style[sk] = (el.type === 'checkbox') ? !!el.checked : v;
      dSave();
      if (sk === 'logo' || sk === 'badge' || sk === 'source') ecRender();
      return;
    }
    if (f === 'logo-file') { setLogoFile(el.files && el.files[0]); return; }
    if (f && f.indexOf('cfg.') === 0) {
      var k = f.slice(4);
      if (k === 'levels') {
        d.cfg.levels = Array.prototype.slice.call(el.selectedOptions || []).map(function (o) { return o.value; })
          .filter(function (x) { return x; });
      } else if (k === 'avoidUsed') { d.cfg.avoidUsed = !!el.checked; }
      else { d.cfg[k] = num(v); }
      dSave(); ecRender(); return;
    }
    if (f === 'pickType') { pickType = v; renderPick(); return; }
    if (f === 'pickLv') { pickLv = v; renderPick(); return; }
    if (f === 'pickInScope') { pickInScope = !!el.checked; renderPick(); return; }
    if (f === 'kpLevel') {
      var lv3 = null;
      kpEdit.levels.forEach(function (l) { if (l.id === v) lv3 = l; });
      kpEdit._g = lv3 && lv3.groups[0] ? lv3.groups[0].id : '';
      d.level = v;
      var lvM = level(v);
      d.groupId = lvM.groups[0].id;
      d.lessonNo = num(lvM.groups[0].lessons[0] ? lvM.groups[0].lessons[0].no : 0);
      d.points = []; dSave();
      renderKp(); return;
    }
    if (f === 'kpGroup') { kpEdit._g = v; renderKp(); return; }
    if (f === 'kpNo') { kpCur().g.lessons[i].no = num(v); return; }
    if (f === 'kpTitle') { kpCur().g.lessons[i].title = v; return; }
    if (f === 'kpPoints') { kpCur().g.lessons[i].points = v.split('\n').map(function (x) { return x.trim(); }).filter(Boolean); return; }
  });

  document.addEventListener('input', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('[data-ec]') : null;
    if (!el) return;
    if (el.getAttribute('data-ec') === 'pick-q') {
      pickQ = el.value;
      clearTimeout(el._t);
      el._t = setTimeout(renderPick, 220);
      var pos = el.selectionStart;
      setTimeout(function () {
        var n = document.getElementById('ecPickQ');
        if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { } }
      }, 0);
      return;
    }
    if (el.getAttribute('data-ec') === 'chg' && el.tagName === 'INPUT' && el.getAttribute('data-f') === 'title') {
      D().title = el.value; dSave();
    }
  });

  window.EC = {
    kp: function () { return kp(); },
    draft: function () { return D(); },
    reset: function () { _kp = null; wr(LS_KP, DEFAULT_KP); UI.toast('已恢复内置知识点体系', 'ok'); ecRender(); },
    /* 供调试 / 自测 */
    _t: {
      scoreQ: scoreQ, ecAuto: ecAuto, ecDocxBlocks: ecDocxBlocks,
      ecAnswerSummary: ecAnswerSummary, ecHtml: ecHtml, curLesson: curLesson,
      scoreOf: scoreOf, srcTag: srcTag, cnNum: cnNum, ecTitle: ecTitle, ecAutoTitle: ecAutoTitle,
      logoBlock: logoBlock, badgeBlock: badgeBlock, defRules: defRules, ensureShape: ensureShape,
      setLevel: function (lvId) { D().level = lvId; var l = level(lvId); D().groupId = l.groups[0].id; D().lessonNo = num(l.groups[0].lessons[0] ? l.groups[0].lessons[0].no : 0); },
      scopePts: scopePts, overshootQ: overshootQ, qStage: qStage, stageRank: stageRank
    }
  };
})();

</script>

<script data-page-node-id="ecReview" data-pnid-children="ReviewAudit">
/* =========================================================
 * 试卷审核 · 格式规范化
 *   拿一份外面来的 Word 试卷（教研组的、网上下载的、上一届留下的），
 *   按 5 条排版规范过一遍，能自动修的自动修，改不动 / 拿不准的列出来。
 *   ① 括号和标点全用全角（化学式内部除外）
 *   ② 图表居中；表格贴合正文栏宽、单元格文字上下左右居中
 *   ③ 图片放大 / 缩小到「图里的文字与正文文字大小相当」
 *   ④ 正文五号，中文宋体、英文 Times New Roman
 *   ⑤ 图片形式的化学式 → 可编辑的公式文字
 *   改动处一律红色底纹标注，导出「已审核修正版」Word。
 * =======================================================*/
(function () {
  'use strict';

  /* ================= 常量 ================= */
  var PAGE_W = 680;        /* A4 版心宽：18cm ≈ 680px（96dpi）——规则的「正文栏宽」 */
  var INLINE_MAX = 320;    /* 行内图显示宽度上限，避免撑破行 */
  var HL = 'red';          /* Word 突出显示色：红色底纹 = 已修改 */

  /* 半角 → 全角。句点「.」不转：小数、题号「1.」、化学式里的点都要保留。
     化学方程式里的 = + ↑ ↓ → ⇌ 不是标点，也不动。 */
  var PUNCT = { '(': '（', ')': '）', ',': '，', ';': '；', ':': '：', '?': '？', '!': '！' };

  /* 元素符号表（含超铀元素）：用来判断一小段字符是不是化学式。
     只有明确是化学式的片段才豁免标点转换，普通英文里的半角标点照转。 */
  var ELEM_SET = {};
  ('H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn ' +
    'Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd ' +
    'Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra ' +
    'Ac Th Pa U Np Pu').split(' ').forEach(function (e) { ELEM_SET[e] = 1; });

  /* ================= 化学式识别 ================= */

  /* 一小段字符是不是化学式：元素符号（可带下标）+ 可选括号组，末尾可带电荷。
     H2O / NaCl / Ca(OH)2 / (NH4)2SO4 / Fe3+ 都算；Hello / AB 这种不算。
     判定放宽一点没关系 —— 误判成化学式只是「少转换一个半角标点」，
     而它本来就出现在化学式里，正是老师要保留的样子。 */
  function isFormula(tok) {
    if (!tok || tok.length < 2 || tok.length > 60) return false;
    var i = 0, nElem = 0, nParen = 0;

    function isSub(ch) { return (ch >= '0' && ch <= '9') || (ch >= '\u2080' && ch <= '\u2089'); }
    function readSub() { while (i < tok.length && isSub(tok.charAt(i))) i++; }
    function readElem() {
      var c = tok.charAt(i);
      if (c < 'A' || c > 'Z') return false;
      var two = tok.substr(i, 2);
      if (two.length === 2 && ELEM_SET[two]) i += 2;
      else if (ELEM_SET[c]) i += 1;
      else return false;
      nElem++;
      readSub();
      return true;
    }
    function readGroup() {
      if (tok.charAt(i) !== '(') return false;
      i++; nParen++;
      var before = nElem;
      while (i < tok.length && tok.charAt(i) !== ')') {
        if (tok.charAt(i) === '(') { if (!readGroup()) return false; continue; }
        if (!readElem()) return false;
      }
      if (i >= tok.length) return false;      /* 括号没闭合 */
      i++;                                     /* 吃掉 ) */
      if (nElem === before) return false;      /* () 空组 */
      readSub();
      return true;
    }

    while (i < tok.length) {
      var c = tok.charAt(i);
      if (c === '(') { if (!readGroup()) return false; continue; }
      if (c === '+' || c === '-') { i++; continue; }   /* 离子电荷 */
      if (!readElem()) return false;
    }
    /* 含括号组，或至少一个元素符号就算（Na、Fe3+、Cl- 这类单个离子也算化学式）。
       放宽不会误伤：单元素符号内部本来就没有标点，豁免它不会漏掉该转的全角 */
    return nParen > 0 || nElem >= 1;
  }

  /* 候选片段：从大写字母或左括号起，连续的元素 / 数字 / 括号 / 电荷字符。
     单元素也要 2 个字符以上，避免把 "pH" "mL" 里的单位字母当化学式 */
  var RE_TOK = /[A-Z(][A-Za-z0-9()\u2080-\u2089+\-]{1,50}/g;
  /* 物质状态标注 (s) (l) (g) (aq)：跟在化学式后面，一并豁免 */
  var RE_STATE = /\((?:s|l|g|aq)\)/g;

  function mergeRanges(rs) {
    if (!rs.length) return rs;
    rs.sort(function (a, b) { return a[0] - b[0]; });
    var out = [rs[0]];
    for (var i = 1; i < rs.length; i++) {
      var last = out[out.length - 1];
      if (rs[i][0] <= last[1]) last[1] = Math.max(last[1], rs[i][1]);
      else out.push(rs[i]);
    }
    return out;
  }

  /* 文本里所有「不许动」的区间（化学式 + 状态标注） */
  function protRanges(text) {
    var rs = [], m;
    RE_TOK.lastIndex = 0;
    while ((m = RE_TOK.exec(text))) {
      if (isFormula(m[0])) rs.push([m.index, m.index + m[0].length]);
    }
    RE_STATE.lastIndex = 0;
    while ((m = RE_STATE.exec(text))) rs.push([m.index, m.index + m[0].length]);
    return mergeRanges(rs);
  }

  /* ================= 规则 1：标点全角化 ================= */

  /* 把半角标点换成全角，化学式区间内跳过；被换掉的字符单独成段并标记红色。
     返回 [{s:'文字', hl:null|'red'}]，连续同类自动合并 */
  function fullwidthize(text, onHit) {
    var out = [], prots = protRanges(text), pi = 0;
    function push(s, hl) {
      if (!s) return;
      var last = out[out.length - 1];
      if (last && (last.hl || null) === (hl || null)) last.s += s;
      else out.push({ s: s, hl: hl });
    }
    for (var i = 0; i < text.length; i++) {
      while (pi < prots.length && prots[pi][1] <= i) pi++;
      var inP = pi < prots.length && i >= prots[pi][0] && i < prots[pi][1];
      var c = text.charAt(i), rep = inP ? '' : PUNCT[c];
      if (rep) {
        push(rep, HL);
        if (onHit) onHit(c, rep);
      } else {
        push(c, null);
      }
    }
    return out;
  }

  /* ================= 规则 3：图片尺寸 ================= */

  /* 显示宽度（px）：目标是「图里的文字和正文文字大小相当」（和题库的 qImgWidth 同源）。
     独占一行的图：
       · Word 里显示尺寸被压到原像素一半以下（高清截图被外部工具压过）→ 按版心宽重排；
       · 本来就偏小（不足版心 45%）→ 放大到版心 62%，字才看得清；
       · 都不超过版心宽，也不超过原始像素（防虚）。
     行内图：保留原文的图文比例，只做上限 / 下限兜底。 */
  function rvImgWidth(im) {
    if (!im) return 0;
    var nat = num(im.w) || 0, disp = num(im.dispW) || 0;
    var base = disp || nat || 0;
    if (!base) return 0;
    if (qImgBlock(im)) {
      if (nat && disp && disp / nat < 0.55) base = PAGE_W;
      else if (base < PAGE_W * 0.45) base = PAGE_W * 0.62;
      if (base > PAGE_W) base = PAGE_W;
    } else {
      if (base < 90 && nat) base = Math.min(nat, 140);
      if (base > INLINE_MAX) base = INLINE_MAX;
    }
    if (nat) base = Math.min(base, nat);
    return Math.round(Math.max(base, 60));
  }

  /* ================= 规则 5：图片形式的化学式 ================= */

  /* 疑似「图片形式的化学式 / 方程式」：
     · 夹在文字中间的小图 —— 化学式、方程式、取代基几乎都长这样；
     · 独立成行但明显是窄横条（宽高比 ≥ 2.5）—— 整条方程式。
     真正的插图（装置图、流程图、曲线图）不动它。 */
  function guessFormulaImg(im) {
    var w = num(im.dispW) || num(im.w), h = num(im.dispH) || num(im.h);
    if (!w || !h) return false;
    if (!qImgBlock(im)) return true;
    return (w / h) >= 2.5 && w <= 500;
  }

  /* ================= 段落 → Word 块 ================= */

  function locOf(p, pi) {
    if (p && p.num) return '第 ' + p.num + ' 题';
    if (p && p.sub) return '第 ' + p.sub + ' 小问';
    return '第 ' + (pi + 1) + ' 段';
  }

  function newCtx(name) {
    return {
      name: name || '未命名',
      punct: [],      /* 标点替换：{loc, from, to, n} */
      imgs: [],       /* 图片尺寸调整：{n, block, from, to, loc} */
      tables: 0,      /* 表格数（都已居中 + 单元格居中） */
      cellPunct: 0,   /* 表格单元格里换掉的标点数 */
      formulas: 0,    /* 已自动还原成文字的公式数（MathType / 微软公式） */
      lost: 0,        /* 仍解不出来的公式数 */
      skipped: 0,     /* 网页渲染不了的矢量图（EMF/WMF/TIFF，多为公式预览图） */
      formulaImgs: [],/* 疑似图片形式的化学式：{n, w, h, loc, where} */
      paras: 0,
      _imgSeen: {}    /* 图片去重（同一张图多处引用只记一次） */
    };
  }

  function imgBytes(im, cache) {
    if (!im || !im.uri) return null;
    if (cache[im.uri]) return cache[im.uri];
    var d = Files.dataUrlBytes(im.uri);
    cache[im.uri] = d || null;
    return cache[im.uri];
  }

  /* 段落里的图 → 可导出 / 可预览的图片对象 */
  function toImg(im, ctx, cache) {
    if (!im) return null;
    var d = imgBytes(im, cache);
    if (!d) return null;
    var px = rvImgWidth(im);
    var from = num(im.dispW) || num(im.w) || 0;
    /* 同一张图被多处引用时只登记一次，报告里不重复列 */
    if (from && Math.abs(from - px) >= 8 && !ctx._imgSeen[im.n]) {
      ctx._imgSeen[im.n] = 1;
      ctx.imgs.push({ n: im.n, block: qImgBlock(im), from: from, to: px, loc: ctx.cur });
    }
    return { n: im.n, bytes: d.bytes, mime: d.mime, w: num(im.w), h: num(im.h), px: px };
  }

  function findImg(p, n) {
    var list = p.imgs || [];
    for (var i = 0; i < list.length; i++) if (list[i] && list[i].n === n) return list[i];
    return null;
  }

  /* 段落文本 → runs：文字（含全角化与红标）+ 图片 + 换行 */
  function paraRuns(p, ctx) {
    var s = String(p.text == null ? '' : p.text);
    var runs = [], last = 0, m;
    var re = /⟦(图|表|缺)(\d*)⟧/g;

    function pushText(t) {
      if (!t) return;
      fullwidthize(t, function (from, to) {
        ctx.punct.push({ loc: ctx.cur, from: from, to: to });
      }).forEach(function (sg) {
        runs.push({ k: 'tx', s: sg.s, hl: sg.hl || null });
      });
    }

    while ((m = re.exec(s))) {
      if (m.index > last) pushText(s.slice(last, m.index));
      if (m[1] === '图') runs.push({ k: 'img', n: +m[2] || 0 });
      else if (m[1] === '缺') runs.push({ k: 'tx', s: '〔缺公式〕', hl: HL });   /* 标出来好让老师补 */
      last = re.lastIndex;
    }
    if (last < s.length) pushText(s.slice(last));
    return runs;
  }

  /* 表格块：宽度按版心铺满、整表居中、单元格上下左右居中（buildDocx 已实现），
     单元格内的标点同样做全角化（化学式照旧豁免），并保留红色标注 */
  function tblBlock(td, ctx) {
    var rows = ((td && td.rows) || []).map(function (r) {
      return (r || []).map(function (c) {
        var o = { t: '', runs: null, cs: (c && c.cs) || 1, rs: (c && c.rs) || 1, head: !!(c && c.head) };
        if (c && c.vc) o.vc = 1;
        var raw = String((c && c.t) || '');
        if (!raw) return o;
        var segs = fullwidthize(raw, function () { ctx.cellPunct++; });
        var changed = segs.some(function (sg) { return !!sg.hl; });
        o.t = segs.map(function (sg) { return sg.s; }).join('');
        if (changed) {
          o.runs = [];
          segs.forEach(function (sg) {
            String(sg.s).split('\n').forEach(function (ln, li) {
              if (li) o.runs.push({ br: 1 });
              if (ln) o.runs.push({ s: ln, hl: sg.hl || null });
            });
          });
        }
        return o;
      });
    });
    ctx.tables++;
    return { t: 'table', rows: rows };
  }

  /* 段落 → blocks；size：标题保留原字号，正文一律五号（21 半磅 = 10.5pt）。
     块级图（独占一行）会被拆成单独的居中块，不能混在文字行里，
     否则导出 Word 时会被当成行内图缩在字缝里。 */
  function paraBlocks(p, ctx, cache) {
    var out = [];
    if (p.tblData) { out.push(tblBlock(p.tblData, ctx)); return out; }

    var runs = paraRuns(p, ctx);
    if (!runs.length) return out;

    var align = p.align || 'both';

    /* 字号：正文一律五号（21 半磅 = 10.5pt）。
       标题（用了标题样式，或居中的短行 —— 卷名、题型分块这类）保留原字号，
       否则一份卷子的标题会被压成和正文一样大，层次全没了 */
    var isHead = num(p.level) >= 1 ||
      (align === 'center' && String(p.text || '').replace(/⟦[^⟧]*⟧/g, '').trim().length <= 40);
    var size = (isHead && num(p.size) > 21) ? Math.min(num(p.size), 44) : 21;
    var seg = [];

    function flushSeg() {
      var txt = seg.filter(function (r) { return r.k === 'tx'; })
        .map(function (r) { return r.s; }).join('').replace(/\s/g, '');
      var hasImg = seg.some(function (r) { return r.k === 'img'; });
      if (!txt && !hasImg) { seg = []; return; }
      if (!txt && hasImg) {
        /* 整段只有图 → 一张张独占一行、居中（规则 2） */
        seg.forEach(function (r) {
          if (r.k === 'img' && r.img) out.push({ t: 'img', img: r.img, align: 'center' });
        });
      } else {
        out.push({ t: 'para', runs: seg.slice(), align: align, size: size, spacing: { after: 60 } });
      }
      seg = [];
    }

    runs.forEach(function (r) {
      if (r.k === 'tx') { seg.push({ k: 'tx', s: r.s, hl: r.hl }); return; }
      var src = findImg(p, r.n), im = toImg(src, ctx, cache);
      if (!im) { seg.push({ k: 'tx', s: '〔插图〕' }); return; }
      if (qImgBlock(src)) { flushSeg(); out.push({ t: 'img', img: im, align: 'center' }); }
      else seg.push({ k: 'img', img: im });          /* 行内图：和文字排在同一行 */
    });
    flushSeg();
    return out;
  }

  /* ================= 主流程 ================= */

  function auditDoc(parsed, ai) {
    var ctx = newCtx(ai && ai.name);
    var cache = {};
    ctx.formulas = num(parsed.formulas);
    ctx.lost = num(parsed.lost);
    ctx.skipped = num(parsed.skippedImgs);

    var blocks = [], seen = {};
    parsed.forEach(function (p, pi) {
      ctx.paras++;
      ctx.cur = locOf(p, pi);
      /* 段落里引用的图：先登记「疑似图片化学式」 */
      (p.imgs || []).forEach(function (im) {
        if (!im || !im.n || seen[im.n]) return;
        seen[im.n] = 1;
        if (guessFormulaImg(im)) {
          ctx.formulaImgs.push({
            n: im.n, w: num(im.dispW) || num(im.w), h: num(im.dispH) || num(im.h),
            loc: ctx.cur, where: p.tblData ? '表格内' : ''
          });
        }
      });
      paraBlocks(p, ctx, cache).forEach(function (b) { blocks.push(b); });
    });

    return { blocks: blocks, ctx: ctx, name: ctx.name };
  }

  /* ================= 预览 HTML ================= */

  function imgTag(img, tagText) {
    if (!img || !img.bytes) return '';
    var uri = 'data:' + img.mime + ';base64,' + Files.bytesToBase64(img.bytes);
    var h = '<img src="' + uri + '" style="width:' + (img.px || 0) + 'px;max-width:100%;height:auto" alt="插图">';
    return tagText ? '<span class="rvfig">' + h + '<em class="rvtag">' + esc(tagText) + '</em></span>' : h;
  }

  function tblPreview(tb, note) {
    var h = '';
    if (note) h += '<div class="rvtnote"><em class="rvtag">' + esc(note) + '</em></div>';
    h += '<table class="qtbl">';
    (tb.rows || []).forEach(function (r) {
      h += '<tr>';
      (r || []).forEach(function (c) {
        if (c.vc) return;                              /* 纵向合并的续格不渲染 */
        var tag = c.head ? 'th' : 'td';
        var inner;
        if (c.runs) {
          inner = c.runs.map(function (rn) {
            if (rn.br) return '<br>';
            return rn.hl ? '<mark class="rv">' + esc(rn.s) + '</mark>' : esc(rn.s);
          }).join('');
        } else inner = esc(c.t || '');
        h += '<' + tag + (c.cs > 1 ? ' colspan="' + c.cs + '"' : '') +
          (c.rs > 1 ? ' rowspan="' + c.rs + '"' : '') + '>' + inner + '</' + tag + '>';
      });
      h += '</tr>';
    });
    return h + '</table>';
  }

  function previewHtml(res) {
    var h = '';
    (res.blocks || []).forEach(function (b) {
      if (!b) return;
      if (b.t === 'para' && b.runs) {
        var inner = b.runs.map(function (rn) {
          if (rn.k === 'br') return '<br>';
          if (rn.k === 'img') return imgTag(rn.img, '');
          return rn.hl ? '<mark class="rv">' + esc(rn.s) + '</mark>' : esc(rn.s);
        }).join('');
        h += '<p' + (b.align === 'center' ? ' class="c"' : '') + '>' + inner + '</p>';
        return;
      }
      if (b.t === 'img') {
        var note = '';
        for (var i = 0; i < res.ctx.imgs.length; i++) {
          var it = res.ctx.imgs[i];
          if (it.n === b.img.n) note = '图 ' + it.n + ' · 宽 ' + it.from + ' → ' + it.to + ' px';
        }
        h += '<p class="c">' + imgTag(b.img, note) + '</p>';
        return;
      }
      if (b.t === 'table') {
        var tnote = '表 · 已贴合正文栏宽、整表居中、单元格居中';
        h += tblPreview(b, tnote);
        return;
      }
      if (b.text) h += '<p' + (b.align === 'center' ? ' class="c"' : '') + '>' + esc(b.text) + '</p>';
    });
    return h || '<div class="empty">没有可预览的内容</div>';
  }

  /* ================= 审核报告 ================= */

  var RULE_META = [
    { no: 1, name: '括号和符号全用全角', desc: '化学式内部（Ca(OH)₂ 这类）保持原样不动' },
    { no: 2, name: '图表居中、表格贴合正文宽', desc: '整表宽度按版心铺满，单元格文字上下左右居中' },
    { no: 3, name: '图片大小与正文文字相当', desc: '过大的缩、过小的放，图里的字和正文字一样大' },
    { no: 4, name: '正文五号：宋体 + Times New Roman', desc: '等价于 Word 里「全选 → 宋体 → Times New Roman」' },
    { no: 5, name: '图片化学式转成公式文字', desc: 'MathType / 微软公式自动还原；截图只能列出让你手工替换' }
  ];

  function buildReport(res) {
    var c = res.ctx;
    var rules = RULE_META.map(function (m) { return { no: m.no, name: m.name, desc: m.desc, items: [], auto: 0, manual: 0 }; });
    var R = {};
    rules.forEach(function (r) { R[r.no] = r; });

    /* 规则 1：按「原 → 新」归并，同一处只报一次 */
    var tally = {};
    c.punct.forEach(function (h) {
      var k = h.from + '→' + h.to;
      if (!tally[k]) tally[k] = { from: h.from, to: h.to, n: 0, locs: {} };
      tally[k].n++;
      tally[k].locs[h.loc] = 1;
    });
    if (c.cellPunct) {
      tally['单元格'] = { from: '', to: '', n: c.cellPunct, locs: { '表格单元格': 1 } };
    }
    Object.keys(tally).forEach(function (k) {
      var t = tally[k];
      var locs = Object.keys(t.locs);
      R[1].items.push({
        main: t.from ? ('「' + t.from + '」→「' + t.to + '」　共 ' + t.n + ' 处') : ('表格单元格：共 ' + t.n + ' 处'),
        sub: locs.slice(0, 8).join('、') + (locs.length > 8 ? ' 等' : '')
      });
      R[1].auto += t.n;
    });

    /* 规则 2 */
    var blockImgs = c.imgs.filter(function (x) { return x.block; }).length;
    if (c.tables) { R[2].auto += c.tables; R[2].items.push({ main: '表格 ' + c.tables + ' 个：已贴合正文栏宽、整表居中、单元格文字上下左右居中' }); }
    var nImg = 0;
    (res.blocks || []).forEach(function (b) { if (b.t === 'img') nImg++; });
    if (nImg) { R[2].auto += nImg; R[2].items.push({ main: '独占一行的插图 ' + nImg + ' 张：已居中' }); }
    if (!R[2].items.length) R[2].items.push({ main: '文中没有图表，无需处理' });

    /* 规则 3 */
    c.imgs.forEach(function (it) {
      R[3].items.push({
        main: '图 ' + it.n + '（' + (it.block ? '独占一行' : '行内') + '）：宽 ' + it.from + ' → ' + it.to + ' px',
        sub: it.loc
      });
      R[3].auto++;
    });
    if (!R[3].items.length) R[3].items.push({ main: '图片尺寸已经和正文文字相称，无需调整' });

    /* 规则 4：全局统一，不逐处标注 */
    R[4].auto = c.paras;
    R[4].items.push({ main: '全文 ' + c.paras + ' 段正文：中文宋体、英文 Times New Roman、五号（10.5pt）' });
    R[4].items.push({ main: '写法等价于 Word 里「全选 → 宋体 → Times New Roman」', sub: '标题保留原字号，只统一字体' });

    /* 规则 5 */
    if (c.formulas) { R[5].auto = c.formulas; R[5].items.push({ main: '已自动还原 ' + c.formulas + ' 处公式对象（MathType / 微软公式）为可编辑文字' }); }
    c.formulaImgs.forEach(function (it) {
      R[5].items.push({
        main: '疑似图片形式的化学式（图 ' + it.n + '，' + it.w + '×' + it.h + 'px）—— 需手工替换成公式文字',
        sub: it.loc + (it.where ? ' · ' + it.where : '')
      });
      R[5].manual++;
    });
    if (c.lost) {
      R[5].items.push({ main: '有 ' + c.lost + ' 处矢量公式（WMF/EMF）没能自动还原，文档里已标成红色「〔缺公式〕」', sub: '' });
      R[5].manual += c.lost;
    }
    if (c.skipped) R[5].items.push({ main: '另有 ' + c.skipped + ' 张网页渲染不了的矢量图（多为公式预览图），已跳过' });
    if (!R[5].items.length) R[5].items.push({ main: '没有发现图片形式的化学式' });

    return { rules: rules, name: res.name, at: new Date().toISOString().slice(0, 16).replace('T', ' ') };
  }

  /* ================= 视图状态 ================= */
  var RV = { busy: false, cur: null };

  function ruleRow(r) {
    var chip = '';
    if (r.auto && r.manual) chip = '<span class="chip b">自动 ' + r.auto + '</span><span class="chip a">待处理 ' + r.manual + '</span>';
    else if (r.auto) chip = '<span class="chip g">已自动处理 ' + r.auto + '</span>';
    else if (r.manual) chip = '<span class="chip a">待处理 ' + r.manual + '</span>';
    else chip = '<span class="chip">无需处理</span>';
    var items = r.items.map(function (it) {
      return '<div class="rvitem"><b>' + esc(it.main) + '</b>' + (it.sub ? ' <span class="loc">· ' + esc(it.sub) + '</span>' : '') + '</div>';
    }).join('');
    return '<div class="rvrule">' +
      '<div class="no">' + r.no + '</div>' +
      '<div class="bd"><div class="nm">' + esc(r.name) + '</div><div class="ds">' + esc(r.desc) + '</div>' + items + '</div>' +
      '<div class="rt">' + chip + '</div>' +
      '</div>';
  }

  function reportHtml(rep) {
    var manual = 0;
    rep.rules.forEach(function (r) { manual += r.manual; });
    var h = '';
    h += '<div class="card"><div class="card-h"><h3>审核结果</h3><span class="sp"></span>' +
      '<span class="chip b">' + esc(rep.name) + '</span>' +
      (manual ? '<span class="chip a">' + manual + ' 处需人工确认</span>' : '<span class="chip g">全部自动完成</span>') +
      '</div><div class="card-b">' + rep.rules.map(ruleRow).join('') + '</div></div>';
    return h;
  }

  /* ================= 渲染 ================= */
  /* 注意：切走再切回来会重跑这个函数，所以结果要跟着一起渲染，不能只重建上传区 */
  function renderReview() {
    var el = $('#view-review');
    if (!el) return;
    el.innerHTML = reviewHtml() + outHtml();
  }

  function reviewHtml() {
    var h = '';
    h += '<div class="mhead"><div><h2>试卷审核</h2>' +
      '<div class="sub">按 5 条排版规范过一遍 Word 试卷：能自动修的直接修，改不动的列出来。</div></div></div>';

    h += '<div class="card"><div class="card-b">' +
      '<div class="rvdrop" id="rvDrop">' +
      '<svg><use href="#i-file"/></svg>' +
      '<div class="t">拖一份 .docx 试卷到这里</div>' +
      '<div class="s">或者点下面的按钮选文件。审核结果只在本机处理，不会传到别处。</div>' +
      '<div class="mt12"><button class="btn btn-primary" data-rv="pick"><svg><use href="#i-up"/></svg>选择 Word 试卷</button></div>' +
      '</div>' +
      '<div class="note mt12">审核会改动的项：标点全角化、图表居中、图片尺寸、字体统一、公式还原。' +
      '<b>所有改动处导出后都是红色底纹</b>，方便你一眼找到改了什么。</div>' +
      '</div></div>';

    h += '<div id="rvOut"></div>';
    return h;
  }

  function outHtml() {
    if (RV.busy) return '<div class="card"><div class="card-b"><div class="empty">正在审核，请稍候…</div></div></div>';
    if (!RV.cur) return '';
    var res = RV.cur;
    var h = '';
    h += reportHtml(res.report);
    h += '<div class="card"><div class="card-h"><h3>修正效果预览</h3><span class="sp"></span>' +
      '<span class="chip r">红色底纹 = 已修改</span></div>' +
      '<div class="card-b"><div class="rvprev"><div class="doc">' + res.preview + '</div></div></div>' +
      '<div class="modal-f" style="border-top:1px solid var(--line-soft)">' +
      '<button class="btn" data-rv="again">换一份</button>' +
      '<button class="btn btn-primary" data-rv="save"><svg><use href="#i-down"/></svg>下载已审核修正版 Word</button>' +
      '</div></div>';
    return h;
  }

  function refreshOut() {
    var box = $('#rvOut');
    if (box) box.innerHTML = outHtml();
  }

  /* ================= 交互 ================= */
  function pick() {
    Files.pick('.docx', function (f) { run(f); });
  }

  function run(file) {
    if (!file) return;
    if (!/\.docx$/i.test(file.name || '')) {
      UI.toast('请选择 .docx 格式的 Word 试卷', 'err');
      return;
    }
    RV.busy = true; RV.cur = null;
    refreshOut();
    UI.toast('正在审核：' + file.name);

    Files.parseDocx(file).then(function (parsed) {
      var res = auditDoc(parsed, { name: String(file.name || '').replace(/\.docx$/i, '') });
      res.report = buildReport(res);
      res.preview = previewHtml(res);
      res.fileName = file.name;
      RV.cur = res;
      RV.busy = false;
      refreshOut();
      var n = res.ctx.punct.length + res.ctx.imgs.length + res.ctx.tables;
      UI.toast(n ? ('审核完成，共处理 ' + n + ' 处') : '审核完成，格式已经符合规范', 'ok');
    }).catch(function (e) {
      RV.busy = false;
      refreshOut();
      UI.toast('审核失败：' + ((e && e.message) || String(e)), 'err');
    });
  }

  function saveDocx() {
    if (!RV.cur) return;
    try {
      var base = String(RV.cur.name || '试卷').replace(/\.docx$/i, '');
      Files.downloadDocx(base + '-已审核.docx', RV.cur.blocks);
    } catch (e) {
      UI.toast('导出失败：' + ((e && e.message) || String(e)), 'err');
    }
  }

  /* ================= 绑定 ================= */
  function bind() {
    document.addEventListener('click', function (e) {
      var el = e.target.closest ? e.target.closest('[data-rv]') : null;
      if (!el) return;
      var act = el.getAttribute('data-rv');
      if (act === 'pick') { pick(); return; }
      if (act === 'save') { saveDocx(); return; }
      if (act === 'again') { RV.cur = null; refreshOut(); return; }
    });

    /* 拖放上传 */
    document.addEventListener('dragover', function (e) {
      var d = e.target.closest ? e.target.closest('#rvDrop') : null;
      if (!d) return;
      e.preventDefault();
      d.classList.add('on');
    });
    document.addEventListener('dragleave', function (e) {
      var d = e.target.closest ? e.target.closest('#rvDrop') : null;
      if (d) d.classList.remove('on');
    });
    document.addEventListener('drop', function (e) {
      var d = e.target.closest ? e.target.closest('#rvDrop') : null;
      if (!d) return;
      e.preventDefault();
      d.classList.remove('on');
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) run(f);
    });
  }

  /* 注册视图：VIEWS 是主脚本的全局变量，这里补一项 */
  if (typeof VIEWS !== 'undefined' && VIEWS.push) {
    if (!VIEWS.some(function (v) { return v.k === 'review'; })) {
      VIEWS.push({ k: 'review', t: '试卷审核', render: renderReview, col: '' });
    }
  }
  bind();

  /* 供调试 / 自测 */
  window.RV = {
    _t: {
      run: run, auditDoc: auditDoc, buildReport: buildReport, previewHtml: previewHtml,
      fullwidthize: fullwidthize, isFormula: isFormula, protRanges: protRanges, rvImgWidth: rvImgWidth,
      guessFormulaImg: guessFormulaImg
    },
    cur: function () { return RV.cur; }
  };
})();

/* ================= 诊断考学情分析（子功能） ================= */
(function () {
  var DG = { exam: '', totalOverride: '', kps: [], rows: [], result: null };
  var SAMPLE = '姓名\t氧化还原反应\t离子方程式(10)\t化学计算\t物质结构\n' +
    '王梓涵\t18\t9\t12\t15\n李子墨\t15\t7\t8\t11\n陈思远\t20\t10\t14\t17\n' +
    '赵欣怡\t12\t6\t9\t10\n孙宇轩\t17\t8\t11\t14\n周子涵\t19\t10\t13\t16\n' +
    '吴佳怡\t14\t5\t7\t12\n郑浩然\t16\t9\t10\t13';

  function dgFmt(n) { if (n == null || isNaN(n)) return '—'; return Number(n).toFixed(1); }
  function dgPct(n) { return (n * 100).toFixed(1) + '%'; }
  function dgLevelChip(lv) {
    if (lv === '熟练掌握') return 'g';
    if (lv === '薄弱') return 'r';
    if (lv === '基本掌握') return 'b';
    return 'a';
  }
  function dgMastery(rate) {
    if (rate >= 0.85) return { level: '熟练掌握', color: '#3E8E5A', comment: '班级平均得分率 ' + dgPct(rate) + '，绝大多数学生已掌握，可进入拓展提升与综合运用。' };
    if (rate >= 0.75) return { level: '基本掌握', color: '#2F7A6E', comment: '平均得分率 ' + dgPct(rate) + '，整体掌握尚可，建议针对少数失分学生作个别辅导。' };
    if (rate >= 0.60) return { level: '部分掌握', color: '#C8861A', comment: '平均得分率 ' + dgPct(rate) + '，约半数学生存在漏洞，需安排专题巩固训练。' };
    if (rate >= 0.50) return { level: '掌握不牢', color: '#C8631E', comment: '平均得分率 ' + dgPct(rate) + '，多数学生掌握不牢，建议返工重讲并配合变式练习。' };
    return { level: '薄弱', color: '#D2544F', comment: '平均得分率 ' + dgPct(rate) + '，为本次最薄弱点，须重点突破、降阶讲解并反复强化。' };
  }
  function dgBands() {
    return [
      { label: '优秀', min: 0.85, color: '#3E8E5A', count: 0 },
      { label: '良好', min: 0.75, color: '#4FA3D1', count: 0 },
      { label: '中等', min: 0.60, color: '#D99421', count: 0 },
      { label: '及格', min: 0.50, color: '#E09A3C', count: 0 },
      { label: '待提升', min: 0, color: '#D2544F', count: 0 }
    ];
  }
  function dgParse(text) {
    var lines = String(text || '').split(/\r?\n/).map(function (l) { return l.trim(); }).filter(function (l) { return l.length; });
    if (!lines.length) return { error: '请先粘贴登分表' };
    var delim = /\t/.test(lines[0]) ? '\t' : (/,/.test(lines[0]) ? ',' : /\s{2,}/);
    var header = lines[0].split(delim).map(function (s) { return s.trim(); });
    var kpHeaders = header.slice(1);
    if (!kpHeaders.length) return { error: '表头至少需要「学生 + 一个知识点」两列' };
    var kps = kpHeaders.map(function (h) {
      var m = /^(.*?)[\(\（]\s*(\d+(?:\.\d+)?)\s*[\]\)]$/.exec(h);
      return { name: (m ? m[1] : h).trim() || '知识点', full: m ? parseFloat(m[2]) : null };
    });
    var rows = [];
    for (var i = 1; i < lines.length; i++) {
      var cells = lines[i].split(delim).map(function (s) { return s.trim(); });
      var name = (cells[0] || '').replace(/^["']|["']$/g, '');
      if (!name) continue;
      var scores = cells.slice(1).map(function (s) {
        s = String(s).replace(/[%"'\s]/g, '');
        if (s === '' || s === '-' || s === '—' || s === '/' || s === '×') return 0;
        var v = parseFloat(s); return isNaN(v) ? 0 : v;
      });
      while (scores.length < kps.length) scores.push(0);
      scores = scores.slice(0, kps.length);
      rows.push({ name: name, scores: scores });
    }
    if (!rows.length) return { error: '没有读到学生成绩行' };
    kps.forEach(function (kp, j) {
      if (kp.full == null) {
        var mx = 0; rows.forEach(function (r) { if (r.scores[j] > mx) mx = r.scores[j]; });
        kp.full = mx > 0 ? Math.round(mx * 100) / 100 : 10;
      }
    });
    return { kps: kps, rows: rows };
  }
  function dgCompute() {
    var kps = DG.kps, rows = DG.rows;
    if (!kps.length || !rows.length) return { error: '请先粘贴并解析登分表' };
    var totalFull = 0;
    kps.forEach(function (k) { totalFull += (Number(k.full) || 0); });
    if (DG.totalOverride && parseFloat(DG.totalOverride) > 0) totalFull = parseFloat(DG.totalOverride);
    if (totalFull <= 0) return { error: '总分 / 知识点满分必须大于 0' };
    var stu = rows.map(function (r, i) {
      var sum = 0; r.scores.forEach(function (s) { sum += (Number(s) || 0); });
      return { name: r.name || ('学生' + (i + 1)), total: sum, rate: sum / totalFull };
    });
    var avg = stu.reduce(function (a, b) { return a + b.total; }, 0) / stu.length;
    var avgRate = stu.reduce(function (a, b) { return a + b.rate; }, 0) / stu.length;
    var maxS = Math.max.apply(null, stu.map(function (s) { return s.total; }));
    var minS = Math.min.apply(null, stu.map(function (s) { return s.total; }));
    var bands = dgBands();
    stu.forEach(function (s) {
      for (var i = 0; i < bands.length; i++) { if (s.rate >= bands[i].min) { bands[i].count++; break; } }
    });
    var kpStat = kps.map(function (k, j) {
      var sum = 0; rows.forEach(function (r) { sum += (Number(r.scores[j]) || 0); });
      var av = sum / rows.length;
      var rate = (Number(k.full) || 0) > 0 ? av / Number(k.full) : 0;
      var lv = dgMastery(rate);
      return { name: k.name, full: Number(k.full) || 0, avg: av, rate: rate, level: lv.level, color: lv.color, comment: lv.comment };
    });
    var sorted = kpStat.slice().sort(function (a, b) { return b.rate - a.rate; });
    var top = sorted[0], bottom = sorted[sorted.length - 1];
    var overall = dgMastery(avgRate);
    var narrative = dgNarrative({ n: stu.length, avg: avg, totalFull: totalFull, avgRate: avgRate, bands: bands, top: top, bottom: bottom, overall: overall });
    return { exam: DG.exam || '诊断考', n: stu.length, avg: avg, totalFull: totalFull, avgRate: avgRate, maxS: maxS, minS: minS, bands: bands, kpStat: kpStat, top: top, bottom: bottom, overall: overall, narrative: narrative };
  }
  function dgNarrative(d) {
    var dist = d.bands.map(function (b) { return b.label + ' ' + b.count + ' 人'; }).join('、');
    var s = '';

      var di = t.getAttribute('data-in'); if (!di) return;
      var i = +t.getAttribute('data-i'), j = +t.getAttribute('data-j');
      if (di === 'kpName') DG.kps[j].name = t.value;
      else if (di === 'kpFull') DG.kps[j].full = parseFloat(t.value) || 0;
      else if (di === 'stuName') DG.rows[i].name = t.value;
      else if (di === 'score') DG.rows[i].scores[j] = parseFloat(t.value) || 0;
    });
  }
  if (typeof VIEWS !== 'undefined' && VIEWS.push) {
    if (!VIEWS.some(function (v) { return v.k === 'diag'; })) {
      VIEWS.push({ k: 'diag', t: '诊断考学情分析', render: dgRender, col: '' });
    }
  }
  dgBind();
})();
</script>
