/* ============ 化学老师工作台 · 样式 ============ */
:root{
  --bg:#F4F7F9; --card:#FFFFFF; --line:#E6ECF2; --line-soft:#F0F4F8;
  --text:#1E2A36; --muted:#6B7C8E; --faint:#9AA9B8;
  --brand:#2F7A6E; --brand-dark:#245F56; --brand-soft:#E9F3F1; --brand-line:#BFDCD6;
  --warn:#D2544F; --warn-soft:#FDECEB; --ok:#3E8E5A; --ok-soft:#EAF5EE;
  --amber:#D99421; --amber-soft:#FDF4E3;
  --r:14px; --r-sm:10px;
  --sh:0 1px 2px rgba(20,40,60,.05), 0 4px 14px rgba(20,40,60,.05);
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit; font-size:inherit; cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:var(--brand); text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#D3DDE6; border-radius:8px}

/* ---------- 布局 ---------- */
.app{display:flex; min-height:100vh}
.sidebar{
  width:232px; flex:0 0 232px; background:#fff; border-right:1px solid var(--line);
  position:fixed; inset:0 auto 0 0; padding:18px 14px; overflow-y:auto; z-index:30;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 8px 16px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--brand);display:flex;align-items:center;justify-content:center;flex:0 0 34px}
.brand .logo svg{width:20px;height:20px}
.brand b{font-size:15.5px; letter-spacing:.2px; display:block; line-height:1.25}
.brand small{color:var(--faint); font-size:11.5px}
.nav{display:flex; flex-direction:column; gap:2px; margin-top:4px}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
  color:var(--muted); font-size:14.5px; border:0; background:none; width:100%; text-align:left;
}
.nav-item svg{width:18px;height:18px;flex:0 0 18px;opacity:.85}
.nav-item:hover{background:var(--line-soft); color:var(--text)}
.nav-item.on{background:var(--brand-soft); color:var(--brand-dark); font-weight:600}
.nav-item.on svg{opacity:1}
.side-foot{margin-top:16px; padding:12px; border-top:1px solid var(--line-soft); font-size:12px; color:var(--faint)}
.main{flex:1; margin-left:232px; min-width:0; padding:22px 26px 60px}
.wrap{max-width:1120px; margin:0 auto}
.mhead{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap}
.mhead h2{font-size:20px; letter-spacing:.2px}
.mhead .sub{color:var(--muted); font-size:13px; margin-top:2px}

/* ---------- 顶条（移动端） ---------- */
.topbar{
  display:none; position:sticky; top:0; z-index:25; background:rgba(244,247,249,.94);
  backdrop-filter:saturate(160%) blur(8px); border-bottom:1px solid var(--line);
  padding:10px 14px; align-items:center; gap:10px;
}
.topbar .tb-title{font-weight:600; font-size:16px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ---------- 卡片 ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh); margin-bottom:14px}
.card-h{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line-soft); flex-wrap:wrap}
.card-h h3{font-size:15.5px; font-weight:650}
.card-h .sp{flex:1}
.card-b{padding:14px 16px}
.card-b.tight{padding:8px 10px}
.grid{display:grid; gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:38px; padding:0 14px; border-radius:10px; border:1px solid var(--line);
  background:#fff; color:var(--text); font-size:14px; font-weight:500; transition:.15s;
}
.btn:hover{border-color:#CFDAE4; background:#FAFCFD}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--brand); border-color:var(--brand); color:#fff}
.btn-primary:hover{background:var(--brand-dark); border-color:var(--brand-dark); color:#fff}
.btn-ghost{background:transparent; border-color:transparent; color:var(--muted)}
.btn-ghost:hover{background:var(--line-soft)}
.btn-danger{color:var(--warn); border-color:#F0D5D3; background:#fff}
.btn-danger:hover{background:var(--warn-soft)}
.btn-sm{min-height:32px; padding:0 10px; font-size:13px; border-radius:8px}
.btn-sm svg{width:14px;height:14px}
.btn-block{width:100%}
.btn:disabled{opacity:.5; cursor:not-allowed}
.iconbtn{width:36px;height:36px;min-height:36px;padding:0;border-radius:10px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn:hover{background:#FAFCFD;color:var(--text)}
.iconbtn svg{width:17px;height:17px}

/* ---------- 表单 ---------- */
.field{margin-bottom:12px}
.field label{display:block; font-size:13px; color:var(--muted); margin-bottom:5px}
.field .req{color:var(--warn)}
.input,.select,.textarea{
  width:100%; min-height:42px; padding:9px 12px; font-size:16px; color:var(--text);
  border:1px solid var(--line); border-radius:10px; background:#fff; outline:none; transition:.15s;
}
.textarea{min-height:88px; resize:vertical; line-height:1.6}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand-line); box-shadow:0 0 0 3px rgba(47,122,110,.10)}
.select{appearance:none; background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236B7C8E' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E"); background-repeat:no-repeat; background-position:right 11px center; padding-right:32px}
.checkrow{display:flex;align-items:center;gap:8px;font-size:14.5px;cursor:pointer;user-select:none}
.checkrow input{width:19px;height:19px;accent-color:var(--brand)}
.frow{display:grid; gap:10px; grid-template-columns:1fr 1fr}
.taginput{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-height:42px}
.taginput input{border:0;outline:none;flex:1;min-width:90px;font-size:15px;background:transparent}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--brand-soft);color:var(--brand-dark);border-radius:20px;padding:3px 9px;font-size:12.5px}
.pill b{font-weight:600;cursor:pointer;opacity:.6}
.pill b:hover{opacity:1}

/* ---------- 数据展示 ---------- */
.stats{display:grid;gap:10px;grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:650;letter-spacing:.3px;margin-top:2px}
.stat .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.stat.up .v{color:var(--ok)} .stat.down .v{color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--line-soft);color:var(--muted);white-space:nowrap}
.chip.g{background:var(--ok-soft);color:var(--ok)} .chip.r{background:var(--warn-soft);color:var(--warn)}
.chip.a{background:var(--amber-soft);color:var(--amber)} .chip.b{background:var(--brand-soft);color:var(--brand-dark)}
/* 难度 5 档星级配色：lv1 基础(绿) → lv5 压轴(红) */
.chip.lv1{background:#EAF5EE;color:#3E8E5A}
.chip.lv2{background:#E7F1F7;color:#2E7DA8}
.chip.lv3{background:#FDF4E3;color:#C8861A}
.chip.lv4{background:#FCEBDD;color:#C8631E}
.chip.lv5{background:#FDECEB;color:#D2544F}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.row:hover{border-color:#D5E0E9}
.row .main-c{flex:1;min-width:0}
.row .t{font-weight:550;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.over{border-color:#F1CFCB;background:var(--warn-soft)}
.row.done{opacity:.55}
.row.done .t{text-decoration:line-through}
.rowacts{display:flex;gap:4px;flex:0 0 auto}
.empty{text-align:center;padding:34px 16px;color:var(--faint);font-size:14px}
.empty svg{width:40px;height:40px;opacity:.35;margin-bottom:6px}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
table.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FBFCFD}
table.tbl td{padding:10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.tbl tr:hover td{background:#FAFCFD}
table.tbl td.num{font-variant-numeric:tabular-nums}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:0 0 2px}
.tabs .tab{border:0;background:none;padding:10px 16px;font-size:14.5px;color:var(--muted);min-height:40px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit}
.tabs .tab:hover{color:var(--text)}
.tabs .tab.on{color:var(--brand-dark);font-weight:650;border-bottom-color:var(--brand)}
table.ss-table{border-collapse:collapse;font-size:13px;min-width:640px;width:100%}
table.ss-table th,table.ss-table td{border:1px solid var(--line-soft);padding:6px 7px;vertical-align:middle;text-align:center}
table.ss-table th{background:#FBFCFD;font-weight:600;color:var(--muted);white-space:nowrap}
table.ss-table th .input{text-align:center}
table.ss-table td .input{text-align:center;min-width:48px}
table.ss-table .ss-total,table.ss-table .ss-rate{font-weight:650;color:var(--brand-dark)}
table.ss-table tfoot td{background:#F7FAFA;font-weight:600;color:var(--muted)}
.searchbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.searchbar .input{min-height:38px;font-size:15px;flex:1;min-width:150px}
.seg{display:inline-flex;background:var(--line-soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13.5px;color:var(--muted);min-height:32px}
.seg button.on{background:#fff;color:var(--brand-dark);font-weight:600;box-shadow:0 1px 2px rgba(20,40,60,.08)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .select{min-height:36px;font-size:14px;padding:5px 30px 5px 10px;width:auto;min-width:104px}

/* ---------- 日历 ---------- */
.calbar{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.calbar .m{font-weight:650;font-size:15.5px;min-width:118px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:12px;color:var(--faint);padding:4px 0}
.cell{
  position:relative;min-height:62px;border:1px solid var(--line-soft);border-radius:10px;background:#fff;
  padding:4px 5px;cursor:pointer;transition:.12s;overflow:hidden;
}
.cell:hover{border-color:var(--brand-line)}
.cell.out{background:#FBFCFD;color:var(--faint)}
.cell.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.cell.sel{background:var(--brand-soft);border-color:var(--brand-line)}
.cell .d{font-size:12.5px;color:var(--muted);font-weight:600}
.cell.today .d{color:var(--brand-dark)}
.cell .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand);margin-right:2px}
.cell .dot.r{background:var(--warn)} .cell .dot.a{background:var(--amber)} .cell .dot.g{background:var(--ok)}
.cell .ct{font-size:11.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.5}
.cell .more{font-size:11px;color:var(--faint)}

/* ---------- 登录 ---------- */
.loginwrap{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:18px;
  background:linear-gradient(160deg,#EAF3F1 0%,#F4F7F9 45%,#EEF2F7 100%);overflow-y:auto}
.logincard{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(20,40,60,.10);padding:26px 24px}
.logincard .lg{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.logincard .lg .logo{width:38px;height:38px;border-radius:11px;background:var(--brand);display:flex;align-items:center;justify-content:center}
.logincard .lg .logo svg{width:22px;height:22px}
.logincard h1{font-size:19px}
.logincard .tip{color:var(--muted);font-size:13px;margin:6px 0 16px;line-height:1.65}
.note{background:var(--amber-soft);border:1px solid #F3E0B8;color:#8A6410;border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.6}

/* ---------- 弹窗 / 抽屉 ---------- */
.mask{position:fixed;inset:0;background:rgba(20,32,44,.42);z-index:120;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.modal{
  width:100%;max-width:560px;background:#fff;border-radius:16px 16px 0 0;max-height:92vh;display:flex;flex-direction:column;
  animation:up .22s ease; padding-bottom:env(safe-area-inset-bottom);
}
@keyframes up{from{transform:translateY(22px);opacity:.4}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
.modal-h h3{font-size:16px;flex:1}
.modal-b{padding:14px 16px;overflow-y:auto;flex:1}
.modal-f{padding:12px 16px;border-top:1px solid var(--line-soft);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sheet{width:100%;max-width:560px;background:#fff;border-radius:16px 16px 0 0;padding:8px 0 max(8px,env(safe-area-inset-bottom))}
.sheet-i{display:flex;align-items:center;gap:12px;padding:14px 18px;width:100%;border:0;background:none;font-size:15px;color:var(--text)}
.sheet-i:hover{background:var(--line-soft)}
.sheet-i svg{width:19px;height:19px;color:var(--brand)}
@media(min-width:721px){
  .mask{align-items:center}
  .modal{border-radius:16px;max-height:86vh}
  .sheet{border-radius:16px;max-width:360px}
}

/* ---------- 底部导航 ---------- */
.botnav{
  display:none; position:fixed; left:0; right:0; bottom:0; z-index:40; background:rgba(255,255,255,.97);
  backdrop-filter:blur(8px); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.botnav .bn{display:flex}
.botnav button{
  flex:1; border:0; background:none; padding:7px 2px 6px; display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--faint); font-size:11px; min-height:52px;
}
.botnav button svg{width:21px;height:21px}
.botnav button.on{color:var(--brand);font-weight:600}
.fab{
  position:fixed; right:16px; bottom:calc(72px + env(safe-area-inset-bottom)); z-index:35;
  width:52px;height:52px;border-radius:26px;border:0;background:var(--brand);color:#fff;
  display:none;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(47,122,110,.35);
}
.fab svg{width:24px;height:24px}

/* ---------- 回到顶部（题库视图专用，滚动一段距离才浮起） ---------- */
.btotop{
  position:fixed; right:18px; bottom:calc(132px + env(safe-area-inset-bottom));
  z-index:34; width:42px; height:42px; border-radius:21px;
  background:rgba(255,255,255,.95); color:var(--brand-dark);
  border:1px solid var(--line); box-shadow:0 4px 14px rgba(30,42,54,.18);
  display:none; align-items:center; justify-content:center;
  transition:opacity .15s ease, transform .15s ease;
  backdrop-filter:blur(6px);
}
.btotop.show{display:flex}
.btotop:hover{transform:translateY(-2px); background:#fff}
.btotop:active{transform:translateY(0)}
.btotop svg{width:18px;height:18px}
@media (max-width:820px){
  .btotop{bottom:calc(132px + env(safe-area-inset-bottom))}
}
/* 排序标签（filters 行内，挨着排序下拉） */
.sortlabel{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12px;color:var(--muted);white-space:nowrap;
}

/* ---------- 提示 ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.tmsg{background:rgba(30,42,54,.94);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);animation:up .18s ease}
.tmsg.ok{background:#2F7A6E} .tmsg.err{background:#C04A45}
.syncchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);white-space:nowrap}
.syncchip .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.syncchip.ok{border-color:var(--brand-line);color:var(--brand-dark);background:var(--brand-soft)}
.syncchip.ok .dot{background:var(--brand)}
.syncchip.busy .dot{background:var(--amber);animation:pulse 1s infinite}
.syncchip.err{border-color:#F0D5D3;color:var(--warn);background:var(--warn-soft)}
.syncchip.err .dot{background:var(--warn)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--amber-soft);border:1px solid #F3E0B8;color:#7A5A0E;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.banner svg{width:17px;height:17px;flex:0 0 17px;margin-top:2px}
.banner .x{margin-left:auto;background:none;border:0;color:inherit;font-size:18px;line-height:1;padding:0 4px}

/* ---------- 周报 ---------- */
.wk{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;line-height:1.85;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.wk h4{margin:14px 0 4px;font-size:14.5px;color:var(--brand-dark)}
.wk h4:first-child{margin-top:0}
.wk .li{padding-left:2px}
.mini{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line-soft)}
.mini:last-child{border-bottom:0}
.mini .nm{flex:1;font-size:14px}
.mini .vv{font-weight:650;font-variant-numeric:tabular-nums}
.mini .dl{font-size:12px;font-variant-numeric:tabular-nums}
.up{color:var(--ok)} .down{color:var(--warn)} .flat{color:var(--muted)}

/* ---------- 题库正文排版（导入 Word 后统一格式） ---------- */
/* 正文 5 号（10.5pt）：中文宋体、英文 Times New Roman。
   写法等价于 Word 里的「全选 → 宋体 → Times New Roman」——
   Times New Roman 排在前，拉丁字母走它，汉字没有字形就回落到宋体 */
.qtext{font-family:'Times New Roman',SimSun,'宋体','Songti SC',serif;font-size:10.5pt;line-height:1.75;white-space:pre-wrap;word-break:break-word}
/* ---------- 题库插图 / 组卷 ---------- */
.qimg{max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.qimg.qimg-block{display:block;margin:10px auto;max-height:none}
.qimg.qimg-in{display:inline-block;vertical-align:middle;margin:0 3px;max-height:none;width:auto}
/* ---------- 导入的 Word 表格 ---------- */
/* 表格整体居中、宽度贴合正文栏宽；单元格文字上下左右都居中 */
.qtblwrap{margin:10px auto;max-width:100%;overflow-x:auto}
table.qtbl{border-collapse:collapse;width:100%;margin:0 auto;table-layout:auto}
table.qtbl th,table.qtbl td{border:1px solid var(--line);padding:4px 7px;text-align:center;vertical-align:middle;
  line-height:1.6;white-space:pre-wrap;word-break:break-word;font-weight:400;font-size:10.5pt}
table.qtbl th{background:var(--brand-soft);font-weight:600}
table.qtbl .qimg{vertical-align:middle;margin:2px auto}

/* ---------- 试卷审核 ---------- */
.rvdrop{border:1.5px dashed var(--line);border-radius:12px;padding:20px 16px;text-align:center;transition:.15s;background:#fff}
.rvdrop.on{border-color:var(--brand);background:var(--brand-soft)}
.rvdrop svg{width:34px;height:34px;color:var(--brand);opacity:.7}
.rvdrop .t{font-size:15px;font-weight:650;margin-top:8px}
.rvdrop .s{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.65}
.rvrule{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line-soft)}
.rvrule:last-child{border-bottom:0;padding-bottom:0}
.rvrule .no{flex:0 0 26px;height:26px;border-radius:8px;background:var(--brand-soft);color:var(--brand-dark);font-size:12.5px;font-weight:650;display:flex;align-items:center;justify-content:center}
.rvrule .bd{flex:1;min-width:0}
.rvrule .nm{font-size:14px;font-weight:600}
.rvrule .ds{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.6}
.rvrule .rt{flex:0 0 auto;display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.rvitem{font-size:12.5px;line-height:1.7;padding:6px 0 0;color:var(--muted);word-break:break-word}
.rvitem b{color:var(--text);font-weight:600}
.rvitem .loc{color:var(--faint)}
mark.rv{background:#FFD9D6;color:#8C2B26;border-radius:3px;padding:0 2px;font-weight:600}
.rvprev{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;max-height:540px;overflow-y:auto}
.rvprev .doc{font-family:'Times New Roman',SimSun,'宋体','Songti SC',serif;font-size:10.5pt;line-height:1.9;color:var(--text)}
.rvprev .doc p{margin:0 0 7px}
.rvprev .doc p.c{text-align:center}
.rvprev .doc table{border-collapse:collapse;margin:8px auto;width:100%;table-layout:auto}
.rvprev .doc th,.rvprev .doc td{border:1px solid var(--line);padding:3px 7px;text-align:center;vertical-align:middle;font-size:10.5pt;font-weight:400;line-height:1.6}
.rvprev .doc th{background:var(--brand-soft);font-weight:600}
.rvprev .doc img{display:block;margin:8px auto;max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px}
.rvfig{display:inline-block}
.rvtag{display:inline-block;font-size:11px;font-style:normal;color:#8C2B26;background:#FFE3E1;border-radius:4px;padding:1px 6px;line-height:1.7}
.rvtnote{text-align:center;margin:10px 0 2px}

/* ---------- 批量导入（多选 / 拖拽 / 进度） ---------- */
#maskWord.wq-over .modal{outline:2px dashed var(--brand); outline-offset:-8px}
#maskImport.wq-over .modal{outline:2px dashed var(--brand); outline-offset:-8px}
.wqdrop{margin-top:10px; border:1.5px dashed var(--line); border-radius:12px; padding:13px 14px;
  text-align:center; color:var(--muted); font-size:12.5px; line-height:1.7; background:var(--line-soft)}
#maskWord.wq-over .wqdrop{border-color:var(--brand); color:var(--brand-dark); background:var(--brand-soft)}
.wqprog{height:6px; border-radius:99px; background:var(--line); overflow:hidden; margin:12px 0 8px}
.wqprog>i{display:block; height:100%; background:var(--brand); border-radius:99px; transition:width .18s}
.wqsrc{font-size:11px; color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%}
.wqrow{display:flex; align-items:center; gap:6px; padding:5px 8px; border:1px solid var(--line-soft);
  border-radius:8px; font-size:12px; margin-top:5px; background:#fff}
.wqrow .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text)}
.wqrow .st{color:var(--faint); flex:0 0 auto}
.wqrow.err{border-color:#F3C9C9; background:#FFF7F7}
.wqrow.err .nm{color:#B42318}
.qbbar{position:sticky;top:8px;z-index:6;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;margin-bottom:10px;border:1px solid var(--brand-line);border-radius:12px;background:var(--brand-soft);box-shadow:0 4px 14px rgba(16,42,67,.09)}
.qpick{display:flex;gap:8px;align-items:flex-start}
.qpick .ck{width:18px;height:18px;min-height:18px;flex:0 0 auto;margin-top:2px;accent-color:var(--brand)}
.card.qsel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
/* ---------- 题库：待编辑 / 已编辑 分类 ---------- */
.qsegrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.qsegrow .seg button b{font-weight:700;font-variant-numeric:tabular-nums}
.qsegrow .seg button[data-v="todo"].on{color:var(--warn)}
.qsegrow .seg button[data-v="done"].on{color:var(--ok)}
.card.qtodo{border-left:3px solid var(--warn)}
.card.qdone{border-left:3px solid var(--ok)}
.card.qtodo.card-b, .card.qtodo>.card-b{border-radius:0 var(--r) var(--r) 0}
.qstat-todo .v{color:var(--warn)} .qstat-done .v{color:var(--ok)}
.wqthumb{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.wqthumb img{max-width:100%;max-height:110px;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:zoom-in}
.wqprev{margin-top:8px;max-height:260px;overflow:auto;border:1px dashed var(--line);border-radius:8px;padding:6px}
.pgrid{display:grid;gap:12px;grid-template-columns:1fr 1fr;align-items:start}
@media(max-width:820px){.pgrid{grid-template-columns:1fr}}
.picklist{max-height:44vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.pk{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.pk:hover{border-color:var(--brand-line)}
.pk.on{border-color:var(--brand);background:var(--brand-soft)}
.pk .t{flex:1;min-width:0;font-size:13.5px;line-height:1.6;word-break:break-word}
.pk .m{font-size:11.5px;color:var(--muted);margin-top:3px}
.picklist .miniimg{max-width:70px;max-height:52px;border:1px solid var(--line);border-radius:6px;margin-top:4px;display:block}
.selist{display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow-y:auto}
.si{display:flex;gap:8px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:#fff}
.si .n{width:22px;flex:0 0 22px;text-align:center;font-weight:650;color:var(--brand-dark)}
.si .t{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si .input{width:62px;min-height:32px;padding:4px 6px;text-align:center;font-size:13.5px}
.si .mv{display:flex;flex-direction:column;gap:2px}
.si .mv button{width:26px;min-height:20px;padding:0;border:1px solid var(--line);background:#fff;border-radius:6px;color:var(--muted);font-size:10px;line-height:1}
.pprev{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;line-height:1.9;font-size:14.5px}
.pprev h1{font-size:18px;text-align:center;margin-bottom:4px}
.pprev .pm{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:10px}
.pprev .pq{margin:0 0 14px}
.pprev .ph{font-weight:600}
.pprev .po{white-space:pre-wrap;margin-top:3px}
#maskImg{z-index:150}
#maskPaper{z-index:130}
#maskPaperView{z-index:140}
.mask#maskConfirm{z-index:400}
/* ---------- 响应式 ---------- */
@media(max-width:1080px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .stats{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media(max-width:900px){
  .sidebar{display:none}
  .main{margin-left:0; padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
  .topbar{display:flex}
  .qbbar{top:62px}
  .botnav{display:block}
  .fab{display:flex}
  .g2,.g3{grid-template-columns:1fr}
  .mhead h2{font-size:18px}
  .card-h{padding:12px 13px}
  .card-b{padding:12px 13px}
  .frow{grid-template-columns:1fr}
  .cell{min-height:52px;padding:3px 4px}
  .cell .ct{font-size:10.5px}
  .modal-f{justify-content:stretch}
  .modal-f .btn{flex:1}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:400px){ .stats{grid-template-columns:1fr} }
.hidden{display:none !important}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.text-m{color:var(--muted)}.text-s{font-size:13px}.text-xs{font-size:12px}
.right{text-align:right}.center{text-align:center}
.nowrap{white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:6px;background:var(--line-soft);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--brand);border-radius:6px}

/* ---------- 诊断考学情分析 ---------- */
.diag-grid{border-collapse:collapse;font-size:13px;min-width:560px}
.diag-grid th,.diag-grid td{border:1px solid var(--line-soft);padding:5px 6px;vertical-align:middle;text-align:center}
.diag-grid th{background:#FBFCFD;font-weight:600;color:var(--muted)}
.mini-input{width:84px;min-height:32px;padding:5px 7px;border:1px solid var(--line);border-radius:8px;font-size:13px;text-align:center;background:#fff;outline:none}
.mini-input:focus{border-color:var(--brand-line);box-shadow:0 0 0 2px rgba(47,122,110,.10)}
.mini-input.num{font-variant-numeric:tabular-nums}
.kphead{display:flex;flex-direction:column;gap:3px;align-items:center}
.diag-del{width:22px;height:22px;border:0;background:var(--warn-soft);color:var(--warn);border-radius:6px;font-size:15px;line-height:1;cursor:pointer}
.diag-del:hover{background:#F8D9D7}
.diag-pie-row{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.diag-pie-box{flex:0 0 200px;display:flex;justify-content:center}
.diag-legend{flex:1;min-width:240px}
.diag-legend .dotc{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:middle}
.diag-kp td{font-size:13.5px}
.diag-narr{font-size:14px;line-height:1.85;color:#33414F}
.diag-narr br{content:'';display:block;margin:3px 0}

</style>

<script data-page-node-id="lEDOXChOAhqNmy3mEFnAGU" data-pnid-children="4mvqFaW6iflR6CtfBtyATA">
/* ===== 10-core.js ===== */

/* =========================================================
 * 化学老师工作台 · 核心层（工具 / 状态 / 存储 / 弹窗）
 * 单向依赖：core 不调用 render / views
 * =======================================================*/
var APP_VER = '1.0.0';
var LS_USER = 'wbchem.user.v1';

/* ---------------- 基础工具 ---------------- */
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function uid() {
  return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function toDateStr(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayStr() { return toDateStr(new Date()); }
function parseDate(s) {
  if (!s) return null;
  s = String(s).trim();
  var m = /^(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})/.exec(s);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  var d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}
function normDate(s) { var d = parseDate(s); return d ? toDateStr(d) : ''; }
function addDays(s, n) { var d = parseDate(s) || new Date(); d.setDate(d.getDate() + n); return toDateStr(d); }
function diffDays(a, b) { // b - a，单位天
  var x = parseDate(a), y = parseDate(b);
  if (!x || !y) return 0;
  return Math.round((y - x) / 86400000);
}
function weekStartOf(s) { // 周一为一周起点
  var d = parseDate(s) || new Date();
  var w = d.getDay(); // 0=周日
  var back = w === 0 ? 6 : w - 1;
  d.setDate(d.getDate() - back);
  return toDateStr(d);
}
function cnWeek(s) { var d = parseDate(s); return d ? '日一二三四五六'.charAt(d.getDay()) : ''; }
function mdOf(s) { var p = String(s || '').split('-'); return p.length >= 3 ? (+p[1]) + '月' + (+p[2]) + '日' : String(s || ''); }
function num(v, dft) { var n = parseFloat(v); return isNaN(n) ? (dft === undefined ? 0 : dft) : n; }
function hashHex(str) { // FNV-1a 32bit → hex
  var h = 0x811c9dc5;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0; }
  var s = h.toString(16);
  while (s.length < 8) s = '0' + s;
  var h2 = 0x01000193;
  for (var j = 0; j < str.length; j++) { h2 = (h2 * 31 + str.charCodeAt(j)) >>> 0; }
  return s + h2.toString(16);
}
function clone(o) { return JSON.parse(JSON.stringify(o == null ? null : o)); }
function byId(arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i] && arr[i].id === id) return arr[i]; return null; }
function sortBy(arr, key, desc) {
  return arr.slice().sort(function (a, b) {
    var x = a[key], y = b[key];
    if (x == null) x = ''; if (y == null) y = '';
    if (x > y) return desc ? -1 : 1;
    if (x < y) return desc ? 1 : -1;
    return 0;
  });
}
function debounce(fn, ms) {
  var t = null;
  return function () {
    var self = this, args = arguments;
    if (t) clearTimeout(t);
    t = setTimeout(function () { t = null; fn.apply(self, args); }, ms || 300);
  };
}

var QTYPES = ['选择题', '填空题', '推断题', '实验题', '计算题', '工艺流程题', '简答题'];
/* 难度：5 档星级。标签 → 索引/星标/配色统一走下面的 helper */
var LEVELS = ['基础', '较易', '中等', '较难', '压轴'];
/* 难度系数（得分率，0–1）→ 5 档星级标准：数字越小 = 得分率越低 = 越难。
   分档边界参考导入题库的【难度】标注体系（0.4–0.94 分布）：
   ★ 基础 ≥0.9 ｜ ★★ 较易 0.8–0.9 ｜ ★★★ 中等 0.7–0.8 ｜ ★★★★ 较难 0.5–0.7 ｜ ★★★★★ 压轴 <0.5 */
var LEVEL_COEF = [
  { label: '基础', min: 0.9, range: '得分率 ≥0.9' },
  { label: '较易', min: 0.8, range: '得分率 0.8–0.9' },
  { label: '中等', min: 0.7, range: '得分率 0.7–0.8' },
  { label: '较难', min: 0.5, range: '得分率 0.5–0.7' },
  { label: '压轴', min: 0, range: '得分率 <0.5' }
];
/* 得分率数值 → 星级标签（0–1；>1 时按百分数折算，如 85 → 0.85） */
function levelFromCoef(c) {
  c = Number(c);
  if (!isFinite(c)) return '';
  if (c > 1 && c <= 100) c = c / 100;
  if (c < 0 || c > 1) return '';
  for (var i = 0; i < LEVEL_COEF.length; i++) if (c >= LEVEL_COEF[i].min) return LEVEL_COEF[i].label;
  return '';
}
/* 星级标签 → 得分率区间说明（用于悬浮提示与弹窗） */
function levelCoefText(lv) { var i = LEVELS.indexOf(String(lv || '').trim()); return i < 0 ? '' : LEVEL_COEF[i].range; }
/* 难度标签 → 索引（0–4）。兼容旧数据「易/中/难」、纯星标「★★」与数字难度系数「0.85」 */
function levelIndex(lv) {
  lv = String(lv || '').trim();
  var i = LEVELS.indexOf(lv);
  if (i >= 0) return i;
  if (lv === '易') return 0;
  if (lv === '中') return 2;
  if (lv === '难') return 4;
  var s = (lv.match(/★/g) || []).length;
  if (s) return Math.min(s, LEVELS.length) - 1;
  var c = parseFloat(lv);
  if (isFinite(c)) return LEVELS.indexOf(levelFromCoef(c));
  return -1;
}
function levelStars(lv) { var i = levelIndex(lv); return i < 0 ? '' : Array(i + 2).join('★'); }
function levelChip(lv) { var i = levelIndex(lv); return i < 0 ? '' : ('lv' + (i + 1)); }

var FOLLOWUP_TYPES = ['个性化反馈', '电访'];
var FOLLOWUP_CADENCE = { '个性化反馈': 14, '电访': 30 }; /* 天 */
/* 为某学生生成回访计划：个性化反馈每 14 天、电访每 30 天，默认 3 个月 */
function followupPlan(studentId, startStr, months) {
  var out = [];
  var ms = months || 3;
  var end = addDays(startStr, ms * 30);
  var a = startStr;
  while (a <= end) {
    out.push({ id: uid(), studentId: studentId, type: '个性化反馈', date: a, done: false, content: '', createdAt: Date.now(), updatedAt: Date.now() });
    a = addDays(a, FOLLOWUP_CADENCE['个性化反馈']);
  }
  var b = startStr;
  while (b <= end) {
    out.push({ id: uid(), studentId: studentId, type: '电访', date: b, done: false, content: '', createdAt: Date.now(), updatedAt: Date.now() });
    b = addDays(b, FOLLOWUP_CADENCE['电访']);
  }
  return out;
}

/* ---------------- 出门测 / 知识点掌握度 ---------------- */
var EXIT_RESULTS = ['掌握', '待巩固', '未掌握']; /* 一次出门测里某知识点的判定 */
/* 由某学生的全部出门测，汇总「知识点 → 掌握度」：rate≥0.8 掌握 / 0.5~0.8 待巩固 / <0.5 薄弱；掌握=1、待巩固=0.5、未掌握=0 */
function masteryOf(studentId) {
  var map = {};
  Store.state.exitTests.forEach(function (t) {
    if (t.studentId !== studentId) return;
    (t.items || []).forEach(function (it) {
      if (!it || !it.kp) return;
      var v = it.result === '掌握' ? 1 : it.result === '待巩固' ? 0.5 : 0;
      if (!map[it.kp]) map[it.kp] = { kp: it.kp, n: 0, sum: 0 };
      map[it.kp].n++; map[it.kp].sum += v;
    });
  });
  var out = Object.keys(map).map(function (k) {
    var m = map[k], rate = m.n ? m.sum / m.n : 0;
    var level = !m.n ? '待检测' : rate >= 0.8 ? '掌握' : rate >= 0.5 ? '待巩固' : '薄弱';
    return { kp: k, n: m.n, rate: rate, level: level };
  });
  out.sort(function (a, b) { return a.rate - b.rate; });
  return out;
}

/* ---------------- 图片仓库（IndexedDB） ----------------
 * localStorage 只有 5MB 左右配额，而一份化学试卷的插图转 base64 就要 1~2MB，
 * 几份卷子导下来必然写满 → 页面弹「本地存储写入失败，可能空间已满」。
 * 解决办法：图片 base64 单独存 IndexedDB（配额按磁盘剩余空间算，通常几百 MB 起），
 * localStorage 只留题目文本 + 图片引用键 ik（= 图片内容哈希，同图跨卷只存一份）。
 * 内存里 Store.state 的 images[].uri 始终有值，所以渲染 / 导出代码一行都不用改。
 * IndexedDB 不可用（隐私模式等）时自动退回「直接存 localStorage」的老路径。 */
var ImgDB = {
  db: null, ready: false, dead: false, _opening: null,
  NAME: 'wbchem.img', ST: 'uri',

  open: function () {
    var self = ImgDB;
    if (self.ready) return Promise.resolve(true);
    if (self.dead) return Promise.resolve(false);
    if (self._opening) return self._opening;
    if (typeof indexedDB === 'undefined' || !indexedDB) { self.dead = true; return Promise.resolve(false); }
    self._opening = new Promise(function (res) {
      var req;
      try { req = indexedDB.open(self.NAME, 1); }
      catch (e) { self.dead = true; self._opening = null; return res(false); }
      req.onupgradeneeded = function () {
        var d = req.result;
        if (!d.objectStoreNames.contains(self.ST)) d.createObjectStore(self.ST);
      };
      req.onsuccess = function () { self.db = req.result; self.ready = true; self._opening = null; res(true); };
      req.onerror = function () { self.dead = true; self._opening = null; res(false); };
      req.onblocked = function () { self.dead = true; self._opening = null; res(false); };
    });
    return self._opening;
  },

  /* map: {ik: uri} —— 已存在的键内容相同，覆盖写也无妨 */
  put: function (map) {
    return ImgDB.open().then(function (ok) {
      if (!ok) return 0;
      var ks = Object.keys(map || {});
      if (!ks.length) return 0;
      return new Promise(function (res) {
        var tx;
        try { tx = ImgDB.db.transaction(ImgDB.ST, 'readwrite'); }
        catch (e) { return res(0); }
        var st = tx.objectStore(ImgDB.ST);
        ks.forEach(function (k) { try { st.put(map[k], k); } catch (e) { } });
        tx.oncomplete = function () { res(ks.length); };
        tx.onerror = function () { res(0); };
        tx.onabort = function () { res(0); };
      });
    });
  },

  /* keys: [ik] → {ik: uri} */
  get: function (keys) {
    var out = {};
    return ImgDB.open().then(function (ok) {
      if (!ok || !keys || !keys.length) return out;
      return new Promise(function (res) {
        var tx;
        try { tx = ImgDB.db.transaction(ImgDB.ST, 'readonly'); }
        catch (e) { return res(out); }
        var st = tx.objectStore(ImgDB.ST);
        var left = keys.length;
        keys.forEach(function (k) {
          var r;
          try { r = st.get(k); } catch (e) { if (!--left) res(out); return; }
          r.onsuccess = function () { if (r.result) out[k] = r.result; if (!--left) res(out); };
          r.onerror = function () { if (!--left) res(out); };
        });
        if (!left) res(out);
      });
    });
  },

  del: function (keys) {
    return ImgDB.open().then(function (ok) {
      if (!ok || !keys || !keys.length) return 0;
      return new Promise(function (res) {
        var tx;
        try { tx = ImgDB.db.transaction(ImgDB.ST, 'readwrite'); }
        catch (e) { return res(0); }
        var st = tx.objectStore(ImgDB.ST);
        keys.forEach(function (k) { try { st.delete(k); } catch (e) { } });
        tx.oncomplete = function () { res(keys.length); };
        tx.onerror = function () { res(0); };
      });
    });
  },

  /* 删除所有题目都不再引用的图片（换题 / 删题后回收空间） */
  gc: function (state) {
    return ImgDB.open().then(function (ok) {
      if (!ok) return 0;
      return new Promise(function (res) {
        var live = {};
        Store.eachImg(state, function (im) { if (im && im.ik) live[im.ik] = 1; });
        var tx;
        try { tx = ImgDB.db.transaction(ImgDB.ST, 'readwrite'); }
        catch (e) { return res(0); }
        var st = tx.objectStore(ImgDB.ST);
        var dead = [];
        var cur = null;
        try { cur = st.openCursor(); } catch (e) { return res(0); }
        if (!cur) return res(0);
        cur.onsuccess = function () {
          var c = cur.result;
          if (!c) { dead.forEach(function (k) { try { st.delete(k); } catch (e) { } }); return res(dead.length); }
          if (!live[c.key]) dead.push(c.key);
          c.continue();
        };
        cur.onerror = function () { res(0); };
      });
    });
  }
};

/* ---------------- 状态仓库 ---------------- */
var Store = {
  state: null,
  user: null,
  key: '',
  onSync: null,

  emptyState: function () {
    var s = { v: 1, _ts: {}, _dirty: {} };
    COLLECTIONS.forEach(function (c) { s[c] = (c === 'profile') ? {} : []; s._ts[c] = 0; s._dirty[c] = false; });
    return s;
  },

  spaceKey: function (user, code) {
    return 'k' + hashHex(String(user).trim().toLowerCase() + '::' + String(code));
  },

  open: function (user, code) {
    var key = Store.spaceKey(user, code);
    Store.user = { user: String(user).trim(), code: String(code) };
    Store.key = 'wbchem.state.' + key;
    Store.spaceKeyValue = key;
    /* 换空间（换账号 / 换口令）必须重新加载：否则新空间里没有数据时，
       会沿用上一个空间的 state，两个账号的数据串在一起 */
    if (Store._loadedKey && Store._loadedKey !== Store.key) Store.state = null;
    Store._loadedKey = Store.key;
    var raw = null;
    try { raw = localStorage.getItem(Store.key); } catch (e) { raw = null; }
    if (raw) {
      try { Store.state = JSON.parse(raw); } catch (e) { Store.state = null; }
    }
    if (!Store.state || !Store.state._ts) Store.state = Store.emptyState();
    COLLECTIONS.forEach(function (c) {
      if (Store.state[c] === undefined) Store.state[c] = (c === 'profile') ? {} : [];
      if (!Store.state._ts[c]) Store.state._ts[c] = 0;
    });
    if (!Store.state.profile.account) {
      Store.state.profile.account = Store.user.user;
      Store.state.profile.createdAt = Date.now();
    }
    return Store.state;
  },

  /* 图片键 = 内容哈希：同一张图在多份卷子里重复出现时，IndexedDB 里只存一份 */
  imgKey: function (uri) { return 'i' + hashHex(String(uri || '')); },

  /* 遍历 state 里所有图片对象（questions / papers 等的 images、imgs 字段） */
  eachImg: function (state, fn) {
    if (!state) return;
    COLLECTIONS.forEach(function (c) {
      var arr = state[c];
      if (!Array.isArray(arr)) return;
      for (var i = 0; i < arr.length; i++) {
        var rec = arr[i];
        if (!rec) continue;
        ['images', 'imgs'].forEach(function (f) {
          var a = rec[f];
          if (!Array.isArray(a)) return;
          for (var j = 0; j < a.length; j++) if (a[j]) fn(a[j]);
        });
      }
    });
  },

  isBigImg: function (v) {
    return typeof v === 'string' && v.length > 96 && v.indexOf('data:image') === 0;
  },

  /* 给每张图补上引用键 ik，并把 base64 收进 bag。
     注意：ik 必须在 JSON.stringify 之前就写进对象 —— stringify 进入对象时就定好了
     要输出哪些键，replacer 里临时新增的属性不会被序列化。 */
  tagImgs: function (state, bag) {
    Store.eachImg(state, function (im) {
      if (!im || !Store.isBigImg(im.uri)) return;
      if (!im.ik) im.ik = Store.imgKey(im.uri);
      if (bag) bag[im.ik] = im.uri;
    });
  },

  /* 序列化：图片的 base64 抽到 bag（→ IndexedDB），localStorage 里只留 ik。
     keepImgs=true 时不抽（IndexedDB 不可用时的回退路径）。 */
  serialize: function (state, bag, keepImgs) {
    if (!keepImgs) Store.tagImgs(state, bag);
    return JSON.stringify(state, function (k, v) {
      if (!keepImgs && k === 'uri' && Store.isBigImg(v)) return '';
      return v;
    });
  },

  /* 清掉全部历史快照（配额告急时的第一救援手段） */
  dropSnapshots: function () {
    try {
      var idx = JSON.parse(localStorage.getItem('wbchem.snaps') || '[]');
      (idx || []).forEach(function (k) { try { localStorage.removeItem(k); } catch (e) { } });
      localStorage.removeItem('wbchem.snaps');
      return (idx || []).length;
    } catch (e) { return 0; }
  },

  _write: function (json) {
    try { localStorage.setItem(Store.key, json); return true; }
    catch (e) { return false; }
  },

  persist: function () {
    if (!Store.state || !Store.key) return false;
    var bag = {};
    /* 图片永远从 localStorage 剥离（→ IndexedDB）；IndexedDB 用不了时图片存不下，
       但至少题目文字能保住，不至于整份数据写不进去。 */
    var json = Store.serialize(Store.state, bag, false);
    var ok = Store._write(json);
    if (!ok) {
      /* 配额满：多半是历史快照（每份都是全量拷贝）占了地方，先清掉再试 */
      Store.dropSnapshots();
      ok = Store._write(json);
    }
    if (!ok) UI.toast('本地存储写入失败：空间已满。请到「设置与数据」导出 JSON 备份，再清理不再需要的题目。', 'err');

    var n = Object.keys(bag).length;
    if (ok && n) {
      ImgDB.put(bag).then(function (put) {
        if (!put && ImgDB.dead) UI.toast('图片未能保存到本机数据库（浏览器隐私模式？），请改用非隐私窗口打开', 'err');
      });
    }
    return ok;
  },

  /* 老数据迁移：以前图片 base64 直接塞在 localStorage 里，现在改成只留 ik、图片进 IndexedDB。
     启动时发现还有「有 uri 但没 ik」的图片，就重写一次落盘把配额腾出来。 */
  migrate: function () {
    var need = false;
    Store.eachImg(Store.state, function (im) { if (im && im.uri && !im.ik) need = true; });
    if (!need) return false;
    return Store.persist();
  },

  /* 启动时把 IndexedDB 里的图片填回内存（异步），返回本次补回的张数 */
  loadImgs: function () {
    return ImgDB.open().then(function (ok) {
      if (!ok) return 0;
      var need = {}, keys = [];
      Store.eachImg(Store.state, function (im) {
        if (im && im.ik && !im.uri && need[im.ik] === undefined) { need[im.ik] = 1; keys.push(im.ik); }
      });
      if (!keys.length) return 0;
      return ImgDB.get(keys).then(function (map) {
        var got = 0;
        Store.eachImg(Store.state, function (im) {
          if (im && im.ik && !im.uri && map[im.ik]) { im.uri = map[im.ik]; got++; }
        });
        return got;
      });
    });
  },

  touch: function (col) {
    Store.state._ts[col] = Date.now();
    Store.state._dirty[col] = true;
  },

  save: function (col) {
    (col ? [col] : COLLECTIONS).forEach(function (c) { Store.touch(c); });
    Store.persist();
    if (Store.onSync) Store.onSync(col);
  },

  add: function (col, rec) {
    rec.id = rec.id || uid();
    rec.createdAt = rec.createdAt || Date.now();
    rec.updatedAt = Date.now();
    Store.state[col].push(rec);
    Store.save(col);
    return rec;
  },

  update: function (col, id, patch) {
    var r = byId(Store.state[col], id);
    if (!r) return null;
    Object.keys(patch).forEach(function (k) { r[k] = patch[k]; });
    r.updatedAt = Date.now();
    Store.save(col);
    return r;
  },

  remove: function (col, id) {
    var arr = Store.state[col];
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].id === id) { arr.splice(i, 1); Store.save(col); return true; }
    }
    return false;
  },

  replaceAll: function (col, arr) {
    Store.state[col] = arr;
    Store.save(col);
  },

  counts: function () {
    return {
      students: Store.state.students.length,
      exams: Store.state.exams.length,
      questions: Store.state.questions.length,
      papers: Store.state.papers.length,
      materials: Store.state.materials.length,
      calendar: Store.state.calendar.length,
      weekly: Store.state.weekly.length,
      followups: Store.state.followups.length,
      exitTests: Store.state.exitTests.length,
      scoreSheets: Store.state.scoreSheets.length
    };
  },

  /* 整体导出（JSON 备份） */
  exportAll: function () {
    return {
      _app: 'chem-workspace', _ver: APP_VER, _at: new Date().toISOString(),
      account: Store.user ? Store.user.user : '',
      data: clone(Store.state)
    };
  },

  /* 整体导入（JSON 恢复） */
  importAll: function (obj, mode) {
    if (!obj || !obj.data) throw new Error('备份文件格式不正确');
    var d = obj.data;
    if (mode === 'replace') {
      var s = Store.emptyState();
      COLLECTIONS.forEach(function (c) { if (d[c] !== undefined) s[c] = d[c]; s._ts[c] = Date.now(); s._dirty[c] = true; });
      Store.state = s;
    } else {
      LIST_COLLECTIONS.forEach(function (c) {
        if (!Array.isArray(d[c])) return;
        var cur = Store.state[c];
        var idx = {};
        cur.forEach(function (r, i) { idx[r.id] = i; });
        var added = 0, updated = 0;
        d[c].forEach(function (r) {
          if (!r || !r.id) return;
          if (idx[r.id] !== undefined) {
            var a = cur[idx[r.id]], b = r;
            if ((b.updatedAt || 0) >= (a.updatedAt || 0)) { cur[idx[r.id]] = b; updated++; }
          } else { cur.push(r); idx[r.id] = cur.length - 1; added++; }
        });
        if (added || updated) Store.touch(c);
      });
      if (d.profile) { Store.state.profile = Object.assign({}, Store.state.profile, d.profile); Store.touch('profile'); }
    }
    Store.persist();
    return true;
  }
};

/* =========================================================
 * 文件层：ZIP / XLSX / CSV / DOCX 解析 与 导出
 * 零外部依赖，全部基于浏览器内置 API
 * =======================================================*/
/* =========================================================
 * 输出桥接层 OutBox：把「保存到本地 / 打印成 PDF」搬到沙箱外去做
 *
 * 为什么必须有这一层：
 *   本页托管在 WorkBuddy 资料库里时，是渲染在一个 sandbox iframe 中的，
 *   沙箱取值里没有 allow-downloads。缺这一项时，浏览器会把页面内部由
 *   <a download> 触发的下载整个吞掉 —— 不报错、不弹窗、本地一个文件都没有。
 *   （表现就是：点了「导出 Word / 打印 PDF」，界面提示成功，磁盘上却什么都没生成。）
 *   沙箱里同时给了 allow-popups + allow-popups-to-escape-sandbox，
 *   window.open 开出来的新窗口会脱离沙箱、成为普通顶层页面，
 *   在那个窗口里下载和打印都恢复正常。
 *   所以所有「往本地输出文件」的动作统一走这里。
 *
 *   独立打开（浏览器直接访问 / 本地文件）时不套娃，直接用以前的方式原位下载，
 *   行为跟老版本完全一致。
 * =======================================================*/
var OutBox = {
  /* 是否被套在 iframe 里。跨域访问 parent 会抛错，那种情况必定是被套着 */
  embedded: function () {
    try { return !!(window.parent && window.parent !== window); }
    catch (e) { return true; }
  },
  /* 开一个脱离沙箱的「导出窗口」；被弹窗拦截时返回 null，由调用方兜底 */
  open: function () {
    try {
      var w = window.open('', 'wbExportWin');
      if (!w) return null;
      try { w.focus(); } catch (e) { }
      return w;
    } catch (e) { return null; }
  },
  /* 导出窗口的接收端脚本：在这个窗口自己的上下文里造 blob: URL 再下载。
     关键：blob: URL 属于「创建它的那个上下文」，沙箱 iframe 里造的 URL 拿到
     脱离沙箱的窗口去下载会被判成 ERR_FILE_NOT_FOUND，浏览器表现为「网络错误」。
     所以字节必须传过来，URL 必须在这边造。 */
  _recvScript: function () {
    return '(function(){' +
      'var handled=false;' +
      'function ack(ok){try{if(window.opener)window.opener.postMessage({__wbExportAck:1,ok:!!ok},"*");}catch(e){}}' +
      'function tip(t){try{var el=document.getElementById("wbTip");if(el)el.textContent=t;}catch(e){}}' +
      'function b64ToBlob(b64,mime){var bin=atob(b64),u=new Uint8Array(bin.length);' +
      'for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);' +
      'return new Blob([u],{type:mime||"application/octet-stream"});}' +
      'function fire(name,blob,url){try{' +
      'var u=url||URL.createObjectURL(blob);' +
      'var a=document.createElement("a");' +
      'a.href=u;a.download=name;a.style.cssText="position:absolute;left:-9999px";' +
      'document.body.appendChild(a);' +
      'try{a.click();}catch(e){}' +
      'var m=document.getElementById("wbDl");' +
      'if(m)m.addEventListener("click",function(ev){ev.preventDefault();a.click();});' +
      'tip("文件已开始下载；若没反应，点下面的按钮手动保存");' +
      'ack(true);' +
      'setTimeout(function(){if(a.parentNode)a.parentNode.removeChild(a);},60000);' +
      '}catch(e){ack(false);}}' +
      'window.addEventListener("message",function(ev){' +
      'var d=ev.data;if(!d||d.__wbExport!==1||handled)return;handled=true;try{' +
      'if(d.blob){fire(d.filename,d.blob,"");return;}' +
      'if(d.b64){fire(d.filename,b64ToBlob(d.b64,d.mime),"");return;}' +
      'if(d.url){fire(d.filename,null,d.url);return;}' +
      '}catch(e){}handled=false;ack(false);});' +
      '})();';
  },
  /* 下载窗口的页面：除了自动触发下载，再留一个手动链接，防止个别浏览器不响应自动点击 */
  _pageHtml: function (filename, tip) {
    return '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<title>' + String(filename).replace(/[<>&"]/g, '') + '</title><style>' +
      'body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;' +
      'background:#f7f7f8;color:#333;font:14px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}' +
      '.box{background:#fff;border:1px solid #e6e6ea;border-radius:12px;padding:22px 26px;max-width:520px;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.05)}' +
      '.box h1{margin:0 0 6px;font-size:16px;font-weight:600;word-break:break-all}' +
      '.box p{margin:0 0 14px;color:#888;font-size:12.5px}' +
      '.box a{display:inline-block;padding:8px 16px;border-radius:8px;background:#CF6D2A;color:#fff;text-decoration:none;font-size:13.5px}' +
      '.box small{display:block;margin-top:12px;color:#aaa;font-size:12px}' +
      '</style></head><body><div class="box">' +
      '<h1>' + String(filename).replace(/[<>&"]/g, '') + '</h1>' +
      '<p id="wbTip">' + (tip || '文件已开始下载') + '</p>' +
      '<a href="#" id="wbDl">没有自动下载？点这里手动保存</a>' +
      '<small>这个窗口可以关掉</small>' +
      '</div><script>' + this._recvScript() + '<\/script></body></html>';
  },
  /* 在目标窗口里放下载链接并自动点一次（兜底：用的还是 opener 造的 URL） */
  _drop: function (w, filename, url) {
    var d = w.document;
    d.open(); d.write(this._pageHtml(filename, '正在导出，文件会自动保存到浏览器的下载目录')); d.close();
    var a = d.createElement('a');
    a.href = url; a.download = filename;
    a.style.cssText = 'position:absolute;left:-9999px';
    d.body.appendChild(a);
    try { a.click(); } catch (e) { }
    var manual = d.getElementById('wbDl');
    if (manual) manual.addEventListener('click', function (ev) { ev.preventDefault(); a.click(); });
    setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) { } }, 60000);
  },
  /* 原位下载（未被套在 iframe 里时用，和老逻辑一致） */
  _local: function (filename, url) {
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    a.style.cssText = 'position:absolute;left:-9999px';
    document.body.appendChild(a);
    try { a.click(); } catch (e) { }
    /* 文件大时下载是分步进行的，原本 1 秒就 revoke 会让大文件下到一半断掉，显示成网络错误 */
    setTimeout(function () {
      try { if (a.parentNode) a.parentNode.removeChild(a); } catch (e) { }
      try { if (/^blob:/.test(url)) URL.revokeObjectURL(url); } catch (e) { }
    }, 60000);
  },
  /* blob → base64（postMessage 传 Blob 失败时的兜底通道） */
  _toB64: function (blob, cb) {
    try {
      var fr = new FileReader();
      fr.onload = function () {
        var s = String(fr.result || ''), i = s.indexOf(',');
        cb(i >= 0 ? s.slice(i + 1) : '');
      };
      fr.onerror = function () { cb(''); };
      fr.readAsDataURL(blob);
    } catch (e) { cb(''); }
  },
  /* 把 blob 存成本地文件。必须嵌套在 iframe 里时才走弹出窗 */
  saveBlob: function (filename, blob) {
    var self = this;
    var mime = (blob && blob.type) || 'application/octet-stream';
    if (!this.embedded()) { self._local(filename, URL.createObjectURL(blob)); return; }
    var w = this.open();
    if (!w) {
      /* 弹出窗被浏览器拦了：下面的原位下载在沙箱里会被静默吞掉，明说比假装成功好 */
      UI.toast('导出窗口被浏览器拦截了，请允许本页弹出窗口后重试', 'err');
      self._local(filename, URL.createObjectURL(blob));
      return;
    }
    var settled = false;
    var onAck = function (ev) {
      var d = ev.data;
      if (!d || d.__wbExportAck !== 1 || !d.ok) return;
      settled = true;
      window.removeEventListener('message', onAck);
    };
    window.addEventListener('message', onAck);
    var cleanup = function () { window.removeEventListener('message', onAck); };
    /* 兜底 2：回到老办法（opener 造 URL），至少不比改之前差 */
    var tryUrl = function () {
      if (settled) { cleanup(); return; }
      cleanup();
      try { self._drop(w, filename, URL.createObjectURL(blob)); }
      catch (e) { self._local(filename, URL.createObjectURL(blob)); }
    };
    /* 兜底 1：改传 base64 字节 */
    var tryB64 = function () {
      if (settled) { cleanup(); return; }
      self._toB64(blob, function (b64) {
        if (settled) { cleanup(); return; }
        if (!b64) { tryUrl(); return; }
        try { w.postMessage({ __wbExport: 1, filename: filename, b64: b64, mime: mime }, '*'); }
        catch (e) { tryUrl(); return; }
        setTimeout(function () { if (!settled) tryUrl(); else cleanup(); }, 1500);
      });
    };
    try {
      var d = w.document;
      d.open(); d.write(this._pageHtml(filename, '正在准备文件…')); d.close();
      try { w.focus(); } catch (e) { }
      /* 主路：Blob 本体传过去，让弹出窗在自己的上下文里造 URL 再下载 */
      w.postMessage({ __wbExport: 1, filename: filename, blob: blob }, '*');
      setTimeout(function () { if (!settled) tryB64(); else cleanup(); }, 1200);
    } catch (e) {
      cleanup();
      self._local(filename, URL.createObjectURL(blob));
    }
  },
  /* 打印：打印 → 「另存为 PDF」。html 是一份完整文档 */
  printHtml: function (html) {
    if (this.embedded()) {
      var w = this.open();
      if (w) {
        try {
          var d = w.document;
          d.open(); d.write(html); d.close();
          /* 等里面的图片资源解码完再拉起打印，避免首版印出空白 */
          setTimeout(function () {
            try { w.focus(); w.print(); } catch (e) { }
          }, 500);
          return true;
        } catch (e) { /* 退回原来的隐藏 iframe 打印 */ }
      }
    }
    printInFrame(html);
    return false;
  }
};

/* 原来的隐藏 iframe 打印方式（独立打开时保留，不会多开窗口、也更安静） */
function printInFrame(html) {
  var f = document.createElement('iframe');
  f.setAttribute('aria-hidden', 'true');
  f.setAttribute('title', '打印');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  document.body.appendChild(f);
  try {
    var d = f.contentWindow.document;
    d.open(); d.write(html); d.close();
  } catch (e) { UI.toast('打印内容生成失败，可改用「导出 Word」', 'err'); return; }
  setTimeout(function () {
    try { f.contentWindow.focus(); f.contentWindow.print(); }
    catch (e) { UI.toast('打印窗口打开失败，可改用「导出 Word」', 'err'); }
    setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 60000);
  }, 420);
}

var Files = {
  /* ---------- 选择文件 ---------- */
  pick: function (accept, cb) {
    var inp = document.createElement('input');
    inp.type = 'file';
    if (accept) inp.accept = accept;
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0];
      document.body.removeChild(inp);
      if (f) cb(f);
    });
    inp.click();
  },

  /* 多选：一次挑多份 Word（批量导题用）；dir=true 时选整个文件夹 */
  pickMulti: function (accept, cb, dir) {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.multiple = true;
    if (accept) inp.accept = accept;
    if (dir) { inp.webkitdirectory = true; inp.setAttribute('webkitdirectory', ''); inp.setAttribute('directory', ''); }
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', function () {
      var arr = [].slice.call(inp.files || []);
      document.body.removeChild(inp);
      if (arr.length) cb(arr);
    });
    inp.click();
  },

  readBuf: function (file) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(r.result); };
      r.onerror = function () { rej(new Error('文件读取失败')); };
      r.readAsArrayBuffer(file);
    });
  },

  readText: function (file) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(Files.decodeBytes(new Uint8Array(r.result))); };
      r.onerror = function () { rej(new Error('文件读取失败')); };
      r.readAsArrayBuffer(file);
    });
  },

  decodeBytes: function (u8) {
    var txt;
    try { txt = new TextDecoder('utf-8').decode(u8); } catch (e) { txt = ''; }
    if (!txt || txt.indexOf('\uFFFD') >= 0) {
      try { var g = new TextDecoder('gbk').decode(u8); if (g) return g; } catch (e2) { }
    }
    return txt;
  },

  /* ---------- 解压（仅处理 stored / deflate） ---------- */
  inflateRaw: function (u8) {
    if (typeof DecompressionStream === 'undefined') return Promise.reject(new Error('当前浏览器不支持解压，请改用 CSV 或复制粘贴导入'));
    function tryFmt(fmt) {
      var ds;
      try { ds = new DecompressionStream(fmt); } catch (e) { return Promise.reject(e); }
      var stream = new Blob([u8]).stream().pipeThrough(ds);
      return new Response(stream).arrayBuffer().then(function (ab) { return new Uint8Array(ab); });
    }
    return tryFmt('deflate-raw').catch(function () { return tryFmt('deflate'); });
  },

  unzip: function (ab) {
    var u8 = new Uint8Array(ab), dv = new DataView(ab);
    var eocd = -1;
    for (var i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('不是有效的 Office 文件（zip 结构损坏）');
    var count = dv.getUint16(eocd + 10, true);
    var cdOff = dv.getUint32(eocd + 16, true);
    var entries = [], p = cdOff;
    for (var n = 0; n < count; n++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      var method = dv.getUint16(p + 10, true);
      var csize = dv.getUint32(p + 20, true);
      var nlen = dv.getUint16(p + 28, true);
      var elen = dv.getUint16(p + 30, true);
      var clen = dv.getUint16(p + 32, true);
      var lho = dv.getUint32(p + 42, true);

/* =========================================================
 * 云端同步层（WorkBuddy 资料库数据表）
 * 环境不支持时自动降级为纯本地模式
 * =======================================================*/

/* ---------------- 限时离线模式 ---------------- */
var OfflineMode = {
  /* profile.offlineMode = { until, startedAt, durationMs, label } | null */
  active: function () {
    var o = Store.state.profile && Store.state.profile.offlineMode;
    if (!o || !o.until) return false;
    if (Date.now() >= o.until) {
      Store.state.profile.offlineMode = null;
      Store.save('profile');
      return false;
    }
    return true;
  },
  remaining: function () {
    var o = Store.state.profile && Store.state.profile.offlineMode;
    if (!o || !o.until) return 0;
    return Math.max(0, o.until - Date.now());
  },
  start: function (durationMs, label) {
    Store.state.profile.offlineMode = {
      until: Date.now() + durationMs,
      startedAt: Date.now(),
      durationMs: durationMs,
      label: label || ''
    };
    Store.save('profile');
    Cloud.set('offline', '限时离线中');
  },
  stop: function () {
    Store.state.profile.offlineMode = null;
    Store.save('profile');
    if (Cloud.db) Cloud.set('ok', '已恢复在线 · ' + new Date().toTimeString().slice(0, 5));
    else Cloud.set('local', '离线模式（本机存储）');
  },
  fmt: function (ms) {
    var s = Math.floor(ms / 1000);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    if (h > 0) return h + '小时' + m + '分';
    if (m > 0) return m + '分' + sec + '秒';
    return sec + '秒';
  }
};

var Cloud = {
  DB_ID: 'OnAOeKEo4X0kAKcPdwm8GY',
  CHUNK: 3000,
  db: null,
  status: 'off',      // off(未开启) | ok | busy | err | local(离线模式)
  msg: '未开启云同步',
  onStatus: null,
  pushing: false,

  init: function () {
    try {
      var sp = window.__SMART_PAGE__;
      if (sp && sp.database && typeof sp.database.query === 'function') {
        Cloud.db = sp.database;
        Cloud.status = 'ok';
        Cloud.msg = '云端已就绪';
      } else {
        Cloud.db = null;
        Cloud.status = 'local';
        Cloud.msg = '离线模式（本机存储）';
      }
    } catch (e) {
      Cloud.db = null; Cloud.status = 'local'; Cloud.msg = '离线模式（本机存储）';
    }
    Cloud.emit();
      if (Cloud.db && typeof Cloud.db.onUpdated === 'function') {
      try {
        Cloud.db.onUpdated(function (payload) {
          if (OfflineMode.active()) return;
          var ids = (payload && payload.databaseIds) || [];
          if (ids.length && ids.indexOf(Cloud.DB_ID) === -1) return;
          if (window.__chemRemotePulling) return;
          Cloud.debouncedPull();
        });
      } catch (e2) { }
    }
    return Cloud.db;
  },

  emit: function () { if (Cloud.onStatus) Cloud.onStatus(Cloud.status, Cloud.msg); },
  set: function (st, msg) { Cloud.status = st; Cloud.msg = msg; Cloud.emit(); },
  available: function () { return !!Cloud.db; },

  debouncedPull: debounce(function () { Cloud.pull(true); }, 800),

  /* 限时离线：所有云端操作统一在此拦截 */
  _guard: function () {
    if (!OfflineMode.active()) return false;
    var rem = OfflineMode.fmt(OfflineMode.remaining());
    Cloud.set('offline', '限时离线 · 剩 ' + rem);
    return true;
  },

  /* 拉取本空间全部分片 */
  querySpace: function (spaceKey, dataset) {
    var conds = [{ property: { property: '空间键', text: { equals: spaceKey } } }];
    if (dataset) conds.push({ property: { property: '数据集', text: { equals: dataset } } });
    var filter = conds.length > 1 ? { and: conds } : conds[0];
    function page(startCursor, acc, guard) {
      acc = acc || []; guard = guard || 0;
      if (guard > 60) return Promise.resolve(acc);
      var params = { databaseId: Cloud.DB_ID, filter: filter, pageSize: 200 };
      if (startCursor) params.startCursor = startCursor;
      return Cloud.db.query(params).then(function (r) {
        acc = acc.concat(r.results || []);
        var next = r.nextCursor;
        if (r.hasMore && next && next !== startCursor && (r.results || []).length) {
          return page(next, acc, guard + 1);
        }
        return acc;
      });
    }
    return page();
  },

  /* 拉全量并按数据集重组 */
  pull: function (silent) {
    if (!Cloud.db || !Store.spaceKeyValue) return Promise.resolve(null);
    if (Cloud._guard()) return Promise.resolve(null);
    if (!silent) Cloud.set('busy', '同步中…');
    window.__chemRemotePulling = true;
    return Cloud.querySpace(Store.spaceKeyValue).then(function (rows) {
      var groups = {};
      rows.forEach(function (r) {
        var ds = r['数据集'], seq = num(r['分片序号'], 0), txt = r['数据内容'] || '';
        var when = parseDate(r['更新时间']);
        var ms = when ? when.getTime() : 0;
        if (!groups[ds]) groups[ds] = { parts: [], ts: 0 };
        groups[ds].parts.push({ seq: seq, txt: txt });
        if (ms > groups[ds].ts) groups[ds].ts = ms;
      });
      var remote = {};
      Object.keys(groups).forEach(function (ds) {
        var g = groups[ds];
        g.parts.sort(function (a, b) { return a.seq - b.seq; });
        var json = g.parts.map(function (p) { return p.txt; }).join('');
        if (!json) return;
        try { remote[ds] = { data: JSON.parse(json), ts: g.ts }; }
        catch (e) { remote[ds] = null; }
      });
      return remote;
    }).then(function (remote) {
      window.__chemRemotePulling = false;
      if (!remote) return null;
      var changed = [], conflicts = [];
      COLLECTIONS.forEach(function (c) {
        var rm = remote[c];
        if (!rm || !rm.data) return;
        var localTs = Store.state._ts[c] || 0;
        if (rm.ts > localTs + 1500) {
          if (Store.state._dirty[c]) { conflicts.push(c); return; }
          Store.state[c] = rm.data;
          Store.state._ts[c] = rm.ts;
          Store.state._dirty[c] = false;
          changed.push(c);
        }
      });
      if (changed.length) { Store.persist(); if (!silent) Cloud.pushDirty(); }
      Cloud.set('ok', '已同步 · ' + new Date().toTimeString().slice(0, 5));
      if (conflicts.length && !silent) {
        Cloud.set('err', '存在冲突，已保留本地');
        UI.toast('云端有更新但本机也有未同步改动，已保留本机版本。可在「设置与数据」选择强制拉取。', 'err');
      }
      if (!silent) UI.toast('已从云端拉取数据', 'ok');
      return remote;
    }).catch(function (err) {
      window.__chemRemotePulling = false;
      Cloud.set('err', '同步失败，已切离线');
      if (!silent) UI.toast('云端拉取失败：' + (err && err.message ? err.message : '未知错误'), 'err');
      return null;
    });
  },

  /* 推送单个数据集（分片） */
  pushCol: function (col) {
    if (!Cloud.db || !Store.spaceKeyValue) return Promise.resolve(false);
    if (Cloud._guard()) return Promise.resolve(false);
    var json = JSON.stringify(Store.state[col] == null ? null : Store.state[col]);
    var chunks = [];
    for (var i = 0; i < json.length; i += Cloud.CHUNK) chunks.push(json.slice(i, i + Cloud.CHUNK));
    if (!chunks.length) chunks.push('');
    var ts = Store.state._ts[col] || Date.now();
    return Cloud.querySpace(Store.spaceKeyValue, col).then(function (rows) {
      var bySeq = {};
      rows.forEach(function (r) { bySeq[num(r['分片序号'], 0)] = r; });
      var chain = Promise.resolve();
      chunks.forEach(function (txt, idx) {
        chain = chain.then(function () {
          var ex = bySeq[idx];
          if (!ex) {
            return Cloud.db.addRecord({
              databaseId: Cloud.DB_ID,
              properties: {
                '空间键': { text: Store.spaceKeyValue },
                '数据集': { text: col },
                '分片序号': { number: idx },
                '数据内容': { text: txt },
                '更新时间': { date: new Date(ts).toISOString() }
              }
            });
          }
          if (String(ex['数据内容'] || '') !== txt) {
            return Cloud.db.updateRecord({
              databaseId: Cloud.DB_ID, recordId: ex._id,
              properties: { '数据内容': { text: txt }, '更新时间': { date: new Date(ts).toISOString() } }
            });
          }
          return null;
        });
      });
      var extra = [];
      Object.keys(bySeq).forEach(function (k) { if (+k >= chunks.length) extra.push(bySeq[k]); });
      extra.forEach(function (r) {
        chain = chain.then(function () { return Cloud.db.deleteRecord({ databaseId: Cloud.DB_ID, recordId: r._id }); });
      });
      return chain;
    }).then(function () {
      Store.state._dirty[col] = false;
      Store.persist();
      return true;
    });
  },

  pushDirty: function () {
    if (!Cloud.db) return Promise.resolve(false);
    if (Cloud._guard()) return Promise.resolve(false);
    if (Cloud.pushing) return Promise.resolve(false);
    Cloud.pushing = true;
    Cloud.set('busy', '同步中…');
    var cols = COLLECTIONS.filter(function (c) { return Store.state._dirty[c]; });
    if (!cols.length) { Cloud.pushing = false; Cloud.set('ok', '已同步'); return Promise.resolve(false); }
    var chain = Promise.resolve();
    cols.forEach(function (c) { chain = chain.then(function () { return Cloud.pushCol(c); }); });
    return chain.then(function () {
      Cloud.pushing = false;
      Cloud.set('ok', '已同步 · ' + new Date().toTimeString().slice(0, 5));
      return true;
    }).catch(function (err) {
      Cloud.pushing = false;
      Cloud.set('err', '同步失败，稍后重试');
      return false;
    });
  },

  /* 手动同步：先拉后推 */
  syncNow: function () {
    if (!Cloud.db) {
      UI.toast('当前为离线模式，数据保存在本机浏览器', 'err');
      return Promise.resolve(false);
    }
    if (Cloud._guard()) { UI.toast('限时离线中，已跳过同步', 'err'); return Promise.resolve(false); }
    Cloud.set('busy', '同步中…');
    return Cloud.pull(true).then(function () { return Cloud.pushDirty(); }).then(function (ok) {
      if (Cloud.status !== 'err') UI.toast('同步完成', 'ok');
      return ok;
    });
  },

  /* 强制以云端为准（覆盖本地） */
  forcePull: function () {
    if (!Cloud.db) return Promise.resolve(false);
    if (Cloud._guard()) { UI.toast('限时离线中，已跳过强制拉取', 'err'); return Promise.resolve(false); }
    Cloud.set('busy', '同步中…');
    return Cloud.querySpace(Store.spaceKeyValue).then(function (rows) {
      var groups = {};
      rows.forEach(function (r) {
        var ds = r['数据集'], seq = num(r['分片序号'], 0);
        if (!groups[ds]) groups[ds] = [];
        groups[ds].push({ seq: seq, txt: r['数据内容'] || '' });
      });
      var any = false;
      Object.keys(groups).forEach(function (ds) {
        groups[ds].sort(function (a, b) { return a.seq - b.seq; });
        var json = groups[ds].map(function (p) { return p.txt; }).join('');
        if (!json) return;
        try { Store.state[ds] = JSON.parse(json); Store.state._dirty[ds] = false; Store.state._ts[ds] = Date.now(); any = true; } catch (e) { }
      });
      Store.persist();
      Cloud.set('ok', '已以云端为准');
      UI.toast(any ? '已用云端数据覆盖本机' : '云端暂无数据', any ? 'ok' : 'err');
      return any;
    });
  },

  /* 清空云端本空间数据 */
  wipe: function () {
    if (!Cloud.db) return Promise.resolve(true);
    if (Cloud._guard()) return Promise.resolve(false);
    return Cloud.querySpace(Store.spaceKeyValue).then(function (rows) {
      var chain = Promise.resolve();
      rows.forEach(function (r) {
        chain = chain.then(function () { return Cloud.db.deleteRecord({ databaseId: Cloud.DB_ID, recordId: r._id }); });
      });
      return chain;
    });
  }
};

function statCard(k, v, sub, cls, valId) {

/* 简易折线图（内联 SVG） */
function svgLine(points, opt) {
  opt = opt || {};
  var W = 560, H = opt.h || 170, pl = 34, pr = 12, pt = 14, pb = 24;
  var vals = points.map(function (p) { return num(p.value); });
  if (!vals.length) return '';
  var max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
  if (opt.invert) { var t = max; max = min; min = t; }
  if (max === min) { max = max + 1; min = min - 1; }
  var pad = (max - min) * 0.12; max += pad; min -= pad;
  var n = points.length;
  var x = function (i) { return pl + (n === 1 ? (W - pl - pr) / 2 : (W - pl - pr) * i / (n - 1)); };
  var y = function (v) { return pt + (H - pt - pb) * (1 - (v - min) / (max - min)); };
  var g = '';
  for (var k = 0; k <= 3; k++) {
    var vv = min + (max - min) * k / 3, yy = y(vv);
    g += '<line x1="' + pl + '" y1="' + yy + '" x2="' + (W - pr) + '" y2="' + yy + '" stroke="#EEF2F6" stroke-width="1"/>';
    g += '<text x="' + (pl - 6) + '" y="' + (yy + 4) + '" font-size="10" fill="#9AA9B8" text-anchor="end">' + Math.round(vv) + '</text>';
  }
  var path = points.map(function (p, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(num(p.value)).toFixed(1); }).join(' ');
  var area = path + ' L' + x(n - 1).toFixed(1) + ' ' + (H - pb) + ' L' + x(0).toFixed(1) + ' ' + (H - pb) + ' Z';
  var dots = points.map(function (p, i) {
    return '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(num(p.value)).toFixed(1) + '" r="3.4" fill="#fff" stroke="#2F7A6E" stroke-width="2"/>' +
      '<text x="' + x(i).toFixed(1) + '" y="' + (y(num(p.value)) - 9).toFixed(1) + '" font-size="10.5" fill="#1E2A36" text-anchor="middle">' + esc(p.value) + '</text>' +
      '<text x="' + x(i).toFixed(1) + '" y="' + (H - 7) + '" font-size="10" fill="#9AA9B8" text-anchor="middle">' + esc(p.label) + '</text>';
  }).join('');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" preserveAspectRatio="xMidYMid meet" style="max-width:100%">' +
    '<path d="' + area + '" fill="rgba(47,122,110,.08)"/>' + g +
    '<path d="' + path + '" fill="none" stroke="#2F7A6E" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' +
    dots + '</svg>';
}
/* 柱状图 */
function svgBars(items, opt) {
  opt = opt || {};
  var W = 560, H = opt.h || 150, pl = 34, pb = 26, pt = 12;
  if (!items.length) return '';
  var max = Math.max.apply(null, items.map(function (i) { return Math.abs(num(i.value)); })) || 1;
  var n = items.length, bw = (W - pl - 14) / n * 0.62, gap = (W - pl - 14) / n;
  var g = '';
  for (var k = 0; k <= 2; k++) {
    var vv = max * k / 2, yy = pt + (H - pt - pb) * (1 - k / 2);
    g += '<line x1="' + pl + '" y1="' + yy + '" x2="' + (W - 10) + '" y2="' + yy + '" stroke="#EEF2F6"/>' +
      '<text x="' + (pl - 6) + '" y="' + (yy + 4) + '" font-size="10" fill="#9AA9B8" text-anchor="end">' + Math.round(vv) + '</text>';
  }
  var bars = items.map(function (it, i) {
    var h = (H - pt - pb) * (Math.abs(num(it.value)) / max);
    var bx = pl + gap * i + (gap - bw) / 2, by = H - pb - h;
    var color = it.color || (num(it.value) >= 0 ? '#3E8E5A' : '#D2544F');
    return '<rect x="' + bx.toFixed(1) + '" y="' + by.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, h).toFixed(1) + '" rx="3" fill="' + color + '" opacity=".85"/>' +
      '<text x="' + (bx + bw / 2).toFixed(1) + '" y="' + (by - 4).toFixed(1) + '" font-size="10.5" fill="#1E2A36" text-anchor="middle">' + esc(it.value) + '</text>' +
      '<text x="' + (bx + bw / 2).toFixed(1) + '" y="' + (H - 9) + '" font-size="10" fill="#6B7C8E" text-anchor="middle">' + esc(it.label) + '</text>';
  }).join('');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" preserveAspectRatio="xMidYMid meet" style="max-width:100%">' + g + bars + '</svg>';
}
/* 进度环 */
function svgRing(pct, label, size) {

    'stroke-dasharray="' + (c * p).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/>' +
    '<text x="50%" y="50%" text-anchor="middle" dy="2" font-size="' + (size / 4.6).toFixed(0) + '" font-weight="650" fill="#1E2A36">' + esc(label) + '</text></svg>';

function renderCalGrid() {
  var m = App.calMonth || todayStr().slice(0, 7);
  var y = +m.slice(0, 4), mo = +m.slice(5, 7);
  var first = new Date(y, mo - 1, 1);
  var start = new Date(y, mo - 1, 1 - ((first.getDay() + 6) % 7)); // 周一开头
  var today = todayStr();
  $('#calMonth').textContent = y + ' 年 ' + mo + ' 月';
  var map = {};
  Store.state.calendar.forEach(function (c) {
    if (!c.date) return;
    (map[c.date] = map[c.date] || []).push(c);
  });
  var h = ['日', '一', '二', '三', '四', '五', '六'].map(function (w, i) {
    return '<div class="wd">' + ['一', '二', '三', '四', '五', '六', '日'][i] + '</div>';
  }).join('');
  for (var i = 0; i < 42; i++) {
    var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    var ds = toDateStr(d);
    var out = d.getMonth() !== mo - 1;
    var items = map[ds] || [];
    var cls = 'cell' + (out ? ' out' : '') + (ds === today ? ' today' : '') + (ds === App.calSel ? ' sel' : '');
    var inner = '<div class="d">' + d.getDate() + '</div>';
    items.slice(0, 2).forEach(function (c) {
      var dot = c.done ? 'g' : (ds < today ? 'r' : (ds === today ? 'a' : ''));
      inner += '<div class="ct"><span class="dot ' + dot + '"></span>' + esc(c.title) + '</div>';
    });
    if (items.length > 2) inner += '<div class="more">+' + (items.length - 2) + '</div>';
    h += '<div class="' + cls + '" data-act="cal-day" data-date="' + ds + '">' + inner + '</div>';
    if (i >= 34 && d.getMonth() !== mo - 1 && d.getDay() === 0) { /* 末行可省 */ }
  }
  $('#calGrid').innerHTML = h;
}

function renderSelDate() {
