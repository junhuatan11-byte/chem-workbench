}

/* 把题干里的 ⟦图N⟧ 标记渲染成真实图片（找不到对应图片时给个提示占位） */
function qImgObj(q, n) {
  var arr = (q && q.images) || [];
  for (var i = 0; i < arr.length; i++) if (+arr[i].n === +n) return arr[i];
  return null;
}
function qImgUri(q, n) { var im = qImgObj(q, n); return im ? im.uri : ''; }

/* 是否独占一行：Word 里单独成段的插图 → 块级；夹在文字中间的小图 → 行内 */
function qImgBlock(im) {
  if (!im) return true;
  if (im.block !== undefined && im.block !== null) return !!im.block;
  return !(num(im.w) && num(im.w) < 360);
}
/* 正文栏宽（px）：A4 正文宽约 16cm ≈ 605px，取 640 让图内文字在屏幕上也看得清 */
var QW_TEXT_W = 640;
/* 显示宽度（px）：目标是「图里的文字和正文文字大小相当」。
   · 独占一行的图，Word 里的显示尺寸被外部工具改写过（高清截图压到原像素一半以下）时，
     一律按正文栏宽重排，图里的字才看得清；
   · 其余（含行内图）用 Word 里的显示尺寸 —— 那是原文里「图与文字」的比例关系，
     行内图尤其要保留它，否则「A．连接仪器〔图〕」的图会被压得看不清；
   · 不超正文栏宽，也不放大超过原始像素（避免发虚）；太小给 60px 下限。 */
function qImgWidth(im) {
  if (!im) return 0;
  var nat = num(im.w) || 0, disp = num(im.dispW) || 0;
  var base = disp || nat || 0;
  if (!base) return 0;
  if (qImgBlock(im) && nat && disp && disp / nat < 0.55) base = QW_TEXT_W;
  else if (!qImgBlock(im)) base = Math.min(base, 280);   /* 行内图：最多 280px（选择题里常见，避免撑破行） */
  /* 题目卡里图片过多时，整页会被拉得过长。把「独占一行的图」也卡一个上限，
     让几张图叠起来仍然在可视范围内；太小的图（<60px）按 60px 下限走 */
  if (qImgBlock(im)) base = Math.min(base, 380);
  var w = Math.min(base, QW_TEXT_W);
  if (nat) w = Math.min(w, nat);
  return Math.round(Math.max(w, Math.min(nat || 60, 60)));
}
function qImgTag(uri, im, q) {
  var isBlock = qImgBlock(im);
  var w = qImgWidth(im);
  var cls = 'qimg ' + (isBlock ? 'qimg-block' : 'qimg-in');
  var style = w ? ' style="width:' + w + 'px;max-width:100%;height:auto"' : '';
  return '<img class="' + cls + '" src="' + esc(uri) + '" alt="题目插图" loading="lazy"' +
    (im && im.n ? ' data-n="' + esc(im.n) + '"' : '') +
    (q && q.id ? ' data-qid="' + esc(q.id) + '"' : '') +
    ' data-act="q-img"' + style + '>';
}
/* 题干里出现过哪些图号 */
function qImgNums(s) {
  var out = [];
  String(s == null ? '' : s).replace(/⟦图(\d+)⟧/g, function (m, d) { out.push(+d); return m; });
  return out;
}
/* 表格渲染：⟦表N⟧ → 真表格。宽度贴合正文栏宽、整表居中；单元格文字上下左右居中（见 CSS .qtbl） */
function qTblObj(q, n) {
  var arr = (q && q.tables) || [];
  for (var i = 0; i < arr.length; i++) if (+arr[i].n === +n) return arr[i];
  return null;
}
function qTblHtml(q, n, depth) {
  var t = qTblObj(q, n);
  if (!t) return '<span class="chip a">〔表格〕</span>';
  if ((depth || 0) > 2) return '<span class="chip a">〔嵌套表格〕</span>';
  var h = '<div class="qtblwrap"><table class="qtbl">';
  (t.rows || []).forEach(function (r) {
    h += '<tr>';
    (r || []).forEach(function (c) {
      c = c || {};
      if (c.vc) return;                    /* 纵向合并的续格：由起始格的 rowspan 覆盖 */
      var tag = c.head ? 'th' : 'td';
      var at = (c.cs > 1 ? ' colspan="' + c.cs + '"' : '') + (c.rs > 1 ? ' rowspan="' + c.rs + '"' : '');
      h += '<' + tag + at + '>' + qRichText(c.t || '', q, (depth || 0) + 1) + '</' + tag + '>';
    });
    h += '</tr>';
  });
  return h + '</table></div>';
}
/* ============ 题面 → 片段序列（HTML 与 Word 共用同一份「位置 / 顺序 / 尺寸」） ============
   片段三种：{k:'t',s} 文字 ｜ {k:'img',n,im} 插图 ｜ {k:'tbl',n,t} 表格。
   题库卡片、组卷预览、打印 PDF、导出 Word 都基于它渲染，
   图、表出现在哪个位置、多大，四条路完全一致。 */
function qSegs(s, q) {
  var txt = String(s == null ? '' : s);
  var re = /⟦图(\d+)⟧|⟦表(\d+)⟧/g, m, last = 0, out = [];
  while ((m = re.exec(txt))) {
    if (m.index > last) out.push({ k: 't', s: txt.slice(last, m.index) });
    if (m[1] !== undefined) out.push({ k: 'img', n: +m[1], im: qImgObj(q, m[1]) });
    else out.push({ k: 'tbl', n: +m[2], t: qTblObj(q, m[2]) });
    last = re.lastIndex;
  }
  if (last < txt.length) out.push({ k: 't', s: txt.slice(last) });
  return out;
}
/* 题干里没被任何地方引用、但确实属于这道题的图 / 表 → 补在末尾，避免丢图丢表。
   选项 / 答案 / 解析里引用过的也算「已引用」—— 选择题的图常挂在某个选项上
   （如 A．连接仪器⟦图2⟧），只按题干去重的话这些图会被再补一遍，看起来就是「图片重复」。
   同理，表格单元格里引用过的图也算已引用：图会在表格里就地渲染，若不算，
   末尾还会再补一张一模一样的（桂城卷 Q10 / Q15 就是这种情况）。 */
/* 题目里出现过的全部文字：题干 / 选项 / 答案 / 解析 + 所有表格单元格。
   表格单元格里同样会引用插图（⟦图N⟧）和子表格（⟦表N⟧）—— 典型的是「依据下表…」这类
   选择题，图全在表格里。把这些文字一并纳入后，嵌套表格的引用也能被照顾到，
   无需再逐层递归。 */
function qAllTextDeep(q) {
  var out = [(q && q.stem) || '', (q && q.options) || '', (q && q.answer) || '', (q && q.analysis) || ''];
  ((q && q.tables) || []).forEach(function (t) {
    if (!t) return;
    (t.rows || []).forEach(function (r) {
      (r || []).forEach(function (c) { if (c && c.t) out.push(c.t); });
    });
  });
  return out.join('\n');
}
function qExtraFigs(q) {
  var all = qAllTextDeep(q);
  var usedI = qImgNums(all), usedT = [];
  all.replace(/⟦表(\d+)⟧/g, function (m, d) { usedT.push(+d); return m; });
  return {
    imgs: ((q && q.images) || []).filter(function (im) { return im && im.uri && usedI.indexOf(+im.n) < 0; }),
    tbls: ((q && q.tables) || []).filter(function (t) { return usedT.indexOf(+t.n) < 0; })
  };
}
/* 题干 → 片段序列（含未引用图表的兜底补位） */
function qStemSegs(q) {
  var segs = qSegs((q && q.stem) || '', q);
  var ex = qExtraFigs(q);
  ex.imgs.forEach(function (im) { segs.push({ k: 'img', n: im.n, im: im }); });
  ex.tbls.forEach(function (t) { segs.push({ k: 'tbl', n: t.n, t: t }); });
  return segs;
}
/* 片段序列 → HTML */
function qSegsHtml(segs, q, depth) {
  return (segs || []).map(function (sg) {
    if (sg.k === 't') return esc(sg.s);
    if (sg.k === 'tbl') return qTblHtml(q, sg.n, depth || 0);
    if (!sg.im || !sg.im.uri) return '<span class="chip a">〔插图〕</span>';
    return qImgTag(sg.im.uri, sg.im, q);
  }).join('');
}
/* 富文本：把 ⟦图N⟧ / ⟦表N⟧ 标记换成真实图片与表格 */
function qRichText(s, q, depth) { return qSegsHtml(qSegs(s, q), q, depth); }
/* 题干渲染：⟦图N⟧/⟦表N⟧ 就地替换，没被引用到的图表补在末尾，避免丢图丢表 */
function qStemHtml(q) { return qSegsHtml(qStemSegs(q), q); }

/* 题目选项：渲染前再跑一次规范化（手录的题也能统一成「一选项一行、顶格」） */
function qOpts(q) { return wqNormOptions((q && q.options) || ''); }

/* 题卡顶部标记行（单独抽出来，便于「完成编辑」后就地刷新） */
function qChipsInner(q) {
  var imgN = (q.images || []).length;
  var st = qEditState(q);
  var lostN = num(q.lost) || 0;
  return (q.code ? '<span class="chip b">' + esc(q.code) + '</span>' : '') +
    (st === 'todo'
      ? '<span class="chip r" title="' + esc('导入时有 ' + lostN + ' 处公式是 MathType 等矢量图（WMF/EMF），无法自动转文字；补好后点「完成编辑」') + '">' +
        '待编辑' + (lostN ? ' · 缺 ' + esc(lostN) + ' 处公式' : '') + '</span>'
      : (q.doneAt ? '<span class="chip g" title="已确认可直接使用">已编辑</span>' : '')) +
    (q.chapter ? '<span class="chip">' + esc(q.chapter) + '</span>' : '') +
    (q.point
      ? '<span class="chip ' + (q.kpConf === '低' ? 'a' : '') + '"' +
        ((q.kpSrc === 'auto' || q.kpSrc === 'chapter')
          ? ' title="' + esc((q.kpSrc === 'chapter' ? '按章节标题推断' : '自动识别') + ' · 置信度 ' + (q.kpConf || '—') + (q.kpConf === '低' ? '（证据偏弱，建议核对）' : '')) + '"'
          : '') +
        '>' + esc(q.point) + (q.kpSrc === 'chapter' ? ' 章' : '') + '</span>'
      : '') +
    (q.qtype ? '<span class="chip">' + esc(q.qtype) + '</span>' : '') +
    (q.level ? '<span class="chip ' + (levelChip(q.level) || '') + '" title="' + esc(q.level + (levelCoefText(q.level) ? '·' + levelCoefText(q.level) : '') + '（点击切换难度）') + '" data-act="q-level" data-id="' + esc(q.id) + '" style="cursor:pointer">' + esc(levelStars(q.level) || q.level) + '</span>' : '') +
    (imgN ? '<span class="chip a">图 ' + imgN + ' 张</span>' : '') +
    ((q.tables || []).length ? '<span class="chip a">表 ' + q.tables.length + ' 个</span>' : '') +
    (q.source ? '<span class="chip">' + esc(q.source) + '</span>' : '');
}
/* 题卡底部操作行（同上，单独抽出） */
function qFootInner(q) {
  var imgN = (q.images || []).length;

  return (st === 'todo'
    ? '<button class="btn btn-sm btn-primary" data-act="q-done" data-id="' + q.id + '" title="确认这道题已补全、可直接使用；确认后会从「待编辑」移入「已编辑」"><svg><use href="#i-check"/></svg>完成编辑</button>'
    : '') +

    ((q.tables || []).length ? '<button class="btn btn-sm" data-act="q-tbl-del" data-id="' + q.id + '">移除表格</button>' : '') +

    '<span class="text-xs text-m">' + (q.updatedAt ? mdOf(toDateStr(new Date(q.updatedAt))) + ' 更新' : '') + '</span>';
}

function questionCard(q) {
  var f = [q.code, q.chapter, q.point, q.qtype, q.level, q.stem, q.options, q.answer, q.analysis, (q.tags || []).join(' '), q.source].join(' ').toLowerCase();
  var st = qEditState(q);
  var imgN = (q.images || []).length;
  var picked = !!QBatch.sel[q.id];
  var h = '<div class="card ' + (st === 'todo' ? 'qtodo' : 'qdone') + (picked ? ' qsel' : '') + '" style="margin:0" data-f="' + esc(f) + '"' +
    ' data-qid="' + esc(q.id) + '" data-edit="' + st + '"' +
    ' data-chapter="' + esc(q.chapter || '') + '" data-point="' + esc(q.point || '') + '"' +
    ' data-type="' + esc(q.qtype || '') + '" data-level="' + esc(q.level || '') + '"><div class="card-b">';

  h += '<div style="display:flex;align-items:flex-start;gap:10px">' +
    (QBatch.on ? '<label class="qpick"><input class="ck" type="checkbox" data-act="qb-pick" data-id="' + q.id + '"' +
      (picked ? ' checked' : '') + ' aria-label="选择这道题"></label>' : '') +

  h += '<div class="qtext mt8">' +
    (q.stem ? qStemHtml(q) : '<span class="text-m">（未填写题干）</span>') + '</div>';

  var optsHtml = qOpts(q);
  if (optsHtml) h += '<div class="qtext mt8">' + qRichText(optsHtml, q) + '</div>';

  if (q.tags && q.tags.length) h += '<div class="mt8" style="display:flex;gap:4px;flex-wrap:wrap">' +
    q.tags.map(function (t) { return '<span class="chip b">' + esc(t) + '</span>'; }).join('') + '</div>';

  h += '<div id="qm-' + q.id + '" class="hidden mt12" style="background:var(--line-soft);border-radius:10px;padding:10px 12px">' +
    '<div class="text-xs text-m">答案</div><div class="qtext" style="margin-top:3px">' +
    (String(q.answer || '').trim() ? qRichText(q.answer, q) : '<span class="text-s text-m">未填写</span>') + '</div>' +
    '<div class="text-xs text-m mt12">解析</div><div class="qtext" style="margin-top:3px">' +
    (String(q.analysis || '').trim() ? qRichText(q.analysis, q) : '<span class="text-s text-m">未填写</span>') + '</div>' +
    '</div>';

  h += '<div id="qf-' + esc(q.id) + '" class="mt8" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line-soft);padding-top:9px">' +
    qFootInner(q) + '</div></div></div>';
  return h;
}

function applyQFilter() {
  /* 分页后：重算过滤+排序结果并重渲染当前页（保留当前页，不回跳） */
  qRenderPage();
}

/* 拼一条题目为纯文本，便于复制到微信 / 文档 */
function qPlain(s) {
  return String(s == null ? '' : s)
    .replace(/⟦图(\d+)⟧/g, '（见图$1）')
    .replace(/⟦表(\d+)⟧/g, '（见表$1）');
}
/* 纯文本里把表格铺成「单元格 | 单元格」的文字块，复制/导出时表格内容不丢 */
function qTblPlain(q, n) {
  var t = qTblObj(q, n);
  if (!t) return '（表格）';
  return (t.rows || []).map(function (r) {
    return (r || []).map(function (c) {
      if (c && c.vc) return null;          /* 纵向合并的续格不重复输出 */
      return String((c && c.t) || '').replace(/\s+/g, ' ').trim();
    }).filter(function (x) { return x !== null; }).join(' | ');
  }).join('\n');
}
function qPlainQ(s, q) {
  return qPlain(String(s == null ? '' : s).replace(/⟦表(\d+)⟧/g, function (m, d) {
    return '\n' + qTblPlain(q, d) + '\n';
  }));
}
function qText(q) {
  var L = [];
  var head = [q.code, q.chapter, q.point, q.qtype, q.level].filter(function (x) { return String(x || '').trim(); });
  if (head.length) L.push('【' + head.join(' · ') + '】');
  L.push(qPlainQ(q.stem, q).trim());
  var optT = qOpts(q);
  if (optT) { L.push(''); L.push(qPlainQ(optT, q).trim()); }
  if (String(q.answer || '').trim()) { L.push(''); L.push('【答案】' + qPlainQ(q.answer, q).trim()); }
  if (String(q.analysis || '').trim()) { L.push(''); L.push('【解析】' + qPlainQ(q.analysis, q).trim()); }
  if ((q.images || []).length) { L.push(''); L.push('（本题含 ' + q.images.length + ' 张插图，图片请在题库里查看）'); }
  if ((q.tables || []).length) { L.push('（本题含 ' + q.tables.length + ' 个表格，已按上表格式展开）'); }
  return L.join('\n');
}

function copyText(text) {
  function ok() { UI.toast('已复制，可直接粘贴到微信或文档', 'ok'); }
  function fallback() {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var done = document.execCommand('copy');
      document.body.removeChild(ta);
      if (done) ok(); else UI.toast('复制失败，请手动选中后复制', 'err');
    } catch (e) { UI.toast('复制失败', 'err'); }
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, fallback);
      return;
    }
  } catch (e) { }
  fallback();
}

 * 导入时按此库给题目打「分类·考点」标签，例：化学实验·气体制备与净化。
 *
 * 为什么不再用「最长子串命中」：
 *   旧做法只在题干里找命中的关键词、谁字多谁赢，于是「溶液」「用途」「装置」
 *   这类泛词会把不相干的题也标上；而「化学实验」这种粗分类又落不到具体考点。
 *   新做法把特征词分两档、按证据加权打分，证据不够就干脆不标。
 *
 *   strong 强特征词：学科专有名词（原电池 / 阿伏加德罗常数 / 同分异构），基础权重 3
 *   weak   弱特征词：泛词、单字（溶液 / 用途 / 装置 / 醇），基础权重 1
 *
 * 打分 = Σ 权重 × 字段权重 × 频次加成 × 句式加成 + 长度加成
 *   字段权重：题干 1 · 选项 0.6 · 答案 0.5 · 解析 0.4 · 章节 0.4
 *   长度加成：词越长越具体，最多把基础权重放大到 1.9 倍
 *   频次加成：同一字段里重复出现，最多再 ×1.75
 *   句式加成：出现在「关于 / 说法 / 正确的是 / 制备 / 检验」这类提问句里 ×1.12

  t.generic = t.generic.filter(function (x) { if (seenGen[x]) return false; seenGen[x] = 1; return true; });

    if (!cat) return;

}

/* 当前生效的规则库。

var _kpOverride = null;
/* 出门测体系知识点（DEFAULT_KP 的细知识点）并入自动识别词库：
 * 这样「录入题目」时打上的知识点标签直接采用出门测体系同名考点（形如「出门测体系·氧气的化学性质」，
 * 标签里就含着体系里的原名，既方便老师核对，也让出门测选题的「不超纲」闸能据此精确匹配）。
 * 只收像真实考点的条目，跳过「知识梳理 / 结课测 / 期中复习」这类讲次占位词；
 * 纯增量，不删不改原有化学领域分类。 */

  if (!tree || !tree.levels) { _wqEcCatsCache = []; return _wqEcCatsCache; }
  var NOISE = /(知识梳理|结课|期中|期末|复习|测试)|^测$|讲次|^第.讲$/;
  var seen = {}, buf = [];
  tree.levels.forEach(function (lv) {
    (lv.groups || []).forEach(function (g) {

          p = String(p == null ? '' : p).trim();
          if (!p || NOISE.test(p) || seen[p]) return;
          seen[p] = 1; buf.push(p);

      });
    });

  var STEP = 40, cats = [], i;
  for (i = 0; i < buf.length; i += STEP) {

  var base = (r && r.cats && r.cats.length) ? wqKpNormalize(r) : wqKpNormalize(WQ_KP_DEFAULT);
  var ec = wqKpFromEcTree();
  if (!ec.length) return base;

    cats: base.cats.concat(ec) };

/* 特征词索引：把一个词只归到一个「考点」名下（同词取权重最高的归属），
 * 这样「反应历程」这类同时写在多个分类里的词不会被重复计分。 */
function wqKpIndex(tree) {
  var key = '';
  tree.cats.forEach(function (c) {
    c.pts.forEach(function (p) { key += c.cat + '|' + p.k + '|' + p.strong.join(',') + '|' + p.weak.join(','); });
  });
  key += '#' + tree.stop.join(',') + '#' + tree.generic.join(',') + '#' + WQ_KP_DEFAULT.cats.length;
  if (_kpCache.key === key) return _kpCache;
  var index = {}, words = [];
  var stop = {}, generic = {};
  tree.stop.forEach(function (s) { stop[s] = 1; });
  tree.generic.forEach(function (s) { generic[s] = 1; });
  function add(kw, ci, pi, base) {
    var k = String(kw || '').trim();
    if (!k || stop[k]) return;
    var cur = index[k];
    if (!cur) { index[k] = { ci: ci, pi: pi, base: base }; words.push(k); }
    else if (base > cur.base) { cur.ci = ci; cur.pi = pi; cur.base = base; }
  }
  tree.cats.forEach(function (c, ci) {
    c.pts.forEach(function (p, pi) {
      p.strong.forEach(function (kw) { add(kw, ci, pi, 3); });
      p.weak.forEach(function (kw) { add(kw, ci, pi, 1); });

}

/* 提问句式：命中词落在这些词附近时更可信（说明题目就是在考它） */
var WQ_KP_SEEK = /关于|下列|以下|说法|叙述|描述|判断|正确|错误|的是|不属于|属于|解释|原因|如何|怎样|设计|检验|鉴别|制备|性质|目的|作用/;

/* 数一个词在文本里出现的次数（不重叠，最多数 8 次就够用了） */
function wqKpCount(text, kw) {
  var s = String(text || '');
  if (!s || !kw) return 0;
  var n = 0, i;
  /* 纯英数词（NA / Ksp / pH）加边界，免得 NA 命中「CHINA」、Ksp 命中别的组合 */
  if (/^[\x00-\x7F]+$/.test(kw)) {
    var re = new RegExp('(^|[^0-9A-Za-z])' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?=$|[^0-9A-Za-z])', 'g');

    while ((m = re.exec(s)) && n < 8) { n++; if (re.lastIndex <= m.index) re.lastIndex = m.index + 1; }
    return n;
  }
  i = s.indexOf(kw);
  while (i >= 0) { n++; if (n >= 8) break; i = s.indexOf(kw, i + kw.length); }
  return n;

/* 命中词周边的一小段上下文（用于判断是不是在提问句里） */
function wqKpWindow(text, kw, at) {
  var s = String(text || '');
  var i = at >= 0 ? at : s.indexOf(kw);
  if (i < 0) return '';
  return s.slice(Math.max(0, i - 10), i + kw.length + 14);
}

/* 章节兜底：当特征词打分不足以定位（或根本没有任何特征词命中）时，
 * 用「章节标题」整段命中某个分类名做一次粗定位，给一个低置信的粗分类，
 * 避免「题干泛、只有章节」的题被丢成「知识点待定」。
 * 返回填充好的 out 对象；未命中或不满足启用条件时返回 null。 */
function wqChapterFallback(it, tree) {
  if (!(tree && tree.useChapter && it && it.chapter)) return null;
  var chTxt = String(it.chapter);
  var chBest = null;
  tree.cats.forEach(function (c, ci) {
    var nm = String(c.cat || '');
    /* 只接受长度 ≥ 3 的分类名整段命中，避免「铁 / 铜 / 硅」这类字太短、易误命中其他内容；
     * 同时优先选「最长的分类名」命中，避免短名把长名盖掉（如「氮族元素」与「氮族元素及其化合物」）。 */
    if (nm.length >= 3 && chTxt.indexOf(nm) >= 0) {
      if (!chBest || nm.length > chBest.len) chBest = { ci: ci, len: nm.length, score: 1.6 };
    }

  if (!chBest || chBest.score < tree.minLow) return null;
  var chCat = tree.cats[chBest.ci];
  var chPt = (chCat.pts && chCat.pts[0]) ? chCat.pts[0].k : chCat.cat;
  /* 该分类只有一个与分类同名的考点时，只写分类名，避免出现「X·X」这种冗余标签 */
  var point = (chPt === chCat.cat) ? chCat.cat : (chCat.cat + '·' + chPt);
  return {
    point: point, score: chBest.score, why: '依据章节标题「' + chTxt + '」',
    conf: '低', chapterFallback: true, alts: [],
    ranked: [{ label: point, score: chBest.score, why: ['章节'], words: [chCat.cat], stemStrong: false }]

/* ---------- 核心：给一道题打分并产出「分类·考点」标签 ----------
 * it 需要 stem / options / answer / analysis / chapter 字段。
 * 返回 { point, alts, conf, why, score, ranked }
 *   point  主知识点（证据不足时为 ''）
 *   alts   次知识点数组（写进标签用）
 *   conf   置信度「高 / 中 / 低」
 *   why    命中的特征词，用于在预览里告诉老师「凭什么这么标」 */
function wqTagKnowledge(it, opt) {
  var out = { point: '', alts: [], conf: '', why: '', score: 0, ranked: [] };
  if (opt && opt.enabled === false) return out;
  var tree = wqKpTree();
  var cache = wqKpIndex(tree);
  if (!cache.words.length) return out;

  var fields = [];
  if (it) {
    fields.push({ n: 'stem', w: 1, t: String(it.stem || '') });
    fields.push({ n: 'options', w: 0.6, t: String(it.options || '') });
    fields.push({ n: 'answer', w: 0.5, t: String(it.answer || '') });
    fields.push({ n: 'analysis', w: 0.4, t: String(it.analysis || '') });
    if (tree.useChapter) fields.push({ n: 'chapter', w: 0.7, t: String(it.chapter || '') });  /* 章节标题是较强的领域信号，加权提高：让「章节明显但题干特征词少」的题也能被定位，减少待定 */
  }
  fields = fields.filter(function (f) { return !!f.t; });
  if (!fields.length) return out;

  /* 第一遍：按索引里的每个特征词，算它在各字段里的加权得分 */
  var hits = [];
  cache.words.forEach(function (kw) {
    var own = cache.index[kw];
    var base = own.base * (1 + Math.min(0.9, 0.13 * Math.max(0, kw.length - 2)));
    var gain = 0, cnt = 0, onStem = false;
    fields.forEach(function (f) {
      var c = wqKpCount(f.t, kw);
      if (!c) return;
      var g = 1 + 0.25 * Math.min(c - 1, 3);                       /* 频次加成 */
      if (WQ_KP_SEEK.test(wqKpWindow(f.t, kw))) g *= 1.12;          /* 句式加成 */
      gain += base * f.w * g;
      cnt += c;

      if (f.n === 'stem' && own.base >= 3) onStem = true;

    if (!gain) return;

  });

  /* 章节兜底（早期）：题干 / 选项 / 答案 / 解析里完全没有命中任何特征词时，
   * 先尝试用章节标题整段命中分类来定位，避免这类题被过早丢成「待定」。
   * 注意：只有「零特征词命中」才走这里，否则会让章节兜底盖掉本可精确命中考点的 ranked 路径。 */
  if (!hits.length) {
    var chEarly = wqChapterFallback(it, tree);
    if (chEarly) return chEarly;
    return out;
  }

  /* 第二遍：同考点内「长短词去重」——同一个考点里若更长的词已经命中，
   * 它的组成部分就不再计分。既管弱词（「硫」 vs 「二氧化硫」），也管强词
   * （「化学平衡」 vs 「化学平衡状态」），否则一句话会被算两遍、分数虚高，
   * 把本该属于邻近考点的题抢走。 */
  var byPt = {};
  hits.forEach(function (h) {
    var id = h.ci + ':' + h.pi;
    (byPt[id] = byPt[id] || []).push(h);

    var a = agg[id];

      why: a.why.slice(0, 5),
      words: a.words, stemStrong: a.stemStrong

    if (!cache.generic) return true;
    for (var i = 0; i < r.words.length; i++) if (!cache.generic[r.words[i]]) return true;

  /* 封顶：分数按 1 位小数展示，阈值比较用原始分 */
  ranked.forEach(function (r) { r.score = Math.round(r.score * 10) / 10; });

  /* 章节兜底（晚期）：特征词打分不足以定位（topFine 分数为空或低于 minLow）时，
   * 用「章节标题」整段命中分类做一次粗定位，给一个低置信的粗分类而非留空。 */
  var topFine = ranked.length ? ranked[0] : null;

  if (!ranked.length) { out.ranked = []; return out; }

  var top = ranked[0];
  /* 证据不足 → 一个都不标。这条是「不标错」的关键闸门。 */
  if (top.score < tree.minLow) { out.ranked = ranked.slice(0, 3); return out; }

  out.point = top.label;
  out.score = top.score;

       绝对分压得很低，也收作次知识点。典型是工艺流程题最后一问考原电池。 */
    return r.stemStrong && r.score >= tree.minMid;
  }).slice(0, 2).map(function (r) { return r.label; });

}

  sectionChoice: /^\s*[（(]?\s*[一二三四五六七八九十\d]{0,3}\s*[）)]?\s*[、.．]?\s*(?:不?定项|单项|多项)?\s*(?:选择题|单选题|多选题|不定项选择题)/

/* 答案区里的答案表：「一、选择题」下面常挂一张表，第一行是题号、第二行是答案。
   也有竖排的（第一列题号、第二列答案），两种都认。 */
function wqTblAnswers(tbl) {
  var rows = (tbl && tbl.rows) || [];
  if (rows.length < 2) return null;
  var cell = function (c) { return String((c && c.t) || '').replace(/\s|　/g, ''); };
  var isNumRow = function (r) {
    if (!r || !r.length) return false;
    for (var i = 0; i < r.length; i++) { if (!/^\d{1,3}$/.test(cell(r[i]))) return false; }
    return r.length >= 2;
  };
  var out = [], i, j;
  /* 横排：题号行 + 紧随的答案行 */
  for (i = 0; i + 1 < rows.length; i++) {
    if (!isNumRow(rows[i])) continue;
    var ans = rows[i + 1] || [];
    for (j = 0; j < rows[i].length && j < ans.length; j++) {
      var a = cell(ans[j]);
      if (a) out.push({ n: cell(rows[i][j]), a: a });
    }
    if (out.length) return out;
  }
  /* 竖排：第一列题号、第二列答案 */
  for (i = 0; i < rows.length; i++) {
    var r = rows[i] || [];
    if (r.length < 2) continue;
    var n0 = cell(r[0]), a0 = cell(r[1]);
    if (/^\d{1,3}$/.test(n0) && a0) out.push({ n: n0, a: a0 });
  }
  return out.length ? out : null;
}

/* 是不是「答案区」标题行（比 ansHead 宽：整行以「答案」收尾也算） */
function wqIsAnsTitle(t) {
  t = String(t || '').trim();
  if (!t || t.length > 44) return false;
  if (wqMarker(t)) return false;                 /* 带题号的不是标题 */
  /* 每道题自己的标签「【答案】」单独成行（答案内容写在后续行）不是答案区标题 ——
     组卷网 / 题库导出的卷子里极常见；误判成答案区标题会把后面几十道题全吞进答案池。
     只有带「参考 / 标准」前缀的（如「【参考答案】」「参考答案」）才算答案区标题 */
  if (/^[【\[]\s*(?:答案|解析|详解|解答|分析|思路点拨|点拨)\s*[】\]]$/.test(t)) return false;
  return WQ_RE.ansHead.test(t) || WQ_RE.ansTitle.test(t);
}

/* 题号「族」：一份卷子里，大题和小问通常用的是不同族的编号。
   先认出哪一族是大题（顶层），那么「同族相邻两号之间」的内容就都归同一道大题 */
var WQ_FAM = {
  /* 「题1」「题2」… 这种题号。它常常是画在文本框 / 图片式色块里的，
     Word 里会单独占一段；有的卷子里它还和「姓名」挤在同一行（表格单元格），
     所以允许前面带一段 "xxx | " 前缀。放在最前面 = 同 rank 里优先认它 */

  zh:    { rank: 0, re: /^\s{0,8}([一二三四五六七八九十]{1,3})\s*[、.．]\s*(?=\S)/ },   /* 一、 */
  dot:   { rank: 0, re: /^\s{0,8}(\d{1,3})\s*[.．、]\s*(?=[^\s]|$)/ },                /* 1. 1、 */
  ls:    { rank: 0, re: /^\s{0,8}(\d{1,3})\s+(?=[一-鿿])/ },                          /* 16 题（只有空格+汉字） */
  roman: { rank: 1, re: /^\s{0,8}([ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]{1,3}|[IVXivx]{1,4})\s*[.．、]\s*(?=\S)/ }, /* Ⅰ. */
  sub:   { rank: 2, re: /^\s{0,8}(\d{1,2})\s*[.．]\s*(\d{1,2})\s*[.．、]?\s*(?=[^\s]|$)/ }, /* 1.1 */
  par:   { rank: 2, re: /^\s{0,8}[（(]\s*(\d{1,3})\s*[）)]\s*(?=[^\s]|$)/ },          /* （1） */
  rpar:  { rank: 2, re: /^\s{0,8}(\d{1,3})\s*[)）]\s*(?=[^\s]|$)/ },                  /* 1) */
  sp:    { rank: 2, re: /^\s{0,8}(\d{1,3})\s{2,}(?=\S)/ },                            /* 1␣␣ */
  cir:   { rank: 3, re: /^\s{0,8}([\u2460-\u2473])\s*/ }                              /* ① */

var WQ_ZHN = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9, 十: 10 };
function wqZhNum(s) {
  s = String(s || '');
  if (s.length === 1) return WQ_ZHN[s] || 0;
  if (s.indexOf('十') === 0) return 10 + (WQ_ZHN[s.charAt(1)] || 0);
  if (s.indexOf('十') === s.length - 1) return (WQ_ZHN[s.charAt(0)] || 0) * 10;
  return (WQ_ZHN[s.charAt(0)] || 0) * 10 + (WQ_ZHN[s.charAt(2)] || WQ_ZHN[s.charAt(1)] || 0);
}

/* 一行开头是什么编号？返回 {fam, rank, num, code, cut, rest} */
function wqMarker(t) {
  var best = null;
  for (var fam in WQ_FAM) {
    var cfg = WQ_FAM[fam], m = cfg.re.exec(t);
    if (!m) continue;
    var rest = t.slice(m[0].length), num = 0, code = m[1];
    if (fam === 'sub') { num = +m[2]; code = m[1] + '.' + m[2]; }
    else if (fam === 'zh') num = wqZhNum(m[1]);
    else if (fam === 'cir') num = m[1].charCodeAt(0) - 0x2460 + 1;
    else num = +m[1];
    if (!isFinite(num) || num <= 0) continue;
    /* 「一、选择题」这种是板块标题，不是题 */
    if (fam === 'zh' && !wqQuestionish(rest)) continue;
    /* 「1␣␣…」太容易误伤正文，要求后面确实像题干 */
    if (fam === 'sp' && (rest.length < 8 || !wqQuestionish(rest))) continue;
    if (!best || cfg.rank < best.rank) best = { fam: fam, rank: cfg.rank, num: num, code: code, cut: m[0].length, rest: rest };
  }
  return best;
}

/* 哪些题型在分组时算"选择题大组"：本大题下每道题是独立的，不合并小问 */
/* 「单项选择题 / 多项选择题 / 不定项选择题」这类带前缀的写法也要认，
   否则「一、单项选择题：…」会被当成一道题混进题库 */
var WQ_CHOICE_GROUP = /^(?:不?定项|单项|多项)?\s*(?:选择题|单选题|多选题|不定项|选择|多选|单选|客观题)/;

function wqPickTopFam(marks, scoreAt) {
  if (!marks.length) return null;
  var sc = {}, i, f;
  for (i = 0; i < marks.length; i++) {
    var k = marks[i];
    if (!k.score || !k.fam || !WQ_FAM[k.fam]) continue;
    var si = scoreAt && scoreAt[k.i];
    if (!si || si.per <= 0) continue;            /* 「每空2分，共14分」才算大题强信号；
                                                   「每小题3分，共45分」是选择题大组，不算 */
    sc[k.fam] = (sc[k.fam] || 0) + 1;
  }
  var keys = [];
  for (f in sc) keys.push(f);
  if (keys.length) {
    keys.sort(function (a, b) { return (WQ_FAM[a].rank - WQ_FAM[b].rank) || (sc[b] - sc[a]); });
    return keys[0];
  }
  /* 候选族分两批：先挑真正的「顶层编号族」（rank<=1：题N / 一、 / 1. / Ⅰ.），
     再退而求其次用「小问族」（（1）/①，rank>=2）。
     小问标记（（1）①）永远不该作为顶层族 —— 否则大题会被拆成一道道小题、
     主题干又被误塞进「章节/标签」。只有当整份文档压根没有顶层编号时才退化为小问族。 */
  var fams = [];
  for (f in WQ_FAM) fams.push(f);
  fams.sort(function (a, b) { return WQ_FAM[a].rank - WQ_FAM[b].rank; });
  var rank1 = fams.filter(function (x) { return WQ_FAM[x].rank <= 1; });
  var rank2 = fams.filter(function (x) { return WQ_FAM[x].rank >= 2; });
  var passes = [rank1, rank2];
  for (var p = 0; p < passes.length; p++) {
    var pass = passes[p];
    var looseF = null, looseN = 0;
    for (i = 0; i < pass.length; i++) {
      f = pass[i];
      var seq = marks.filter(function (k) { return k.fam === f; });
      if (seq.length < 2) continue;
      if (wqAscending(seq, false)) return f;                       /* 连续递增：最强信号 */
      if (wqAscending(seq, true) && seq.length > looseN) { looseF = f; looseN = seq.length; }
    }
    /* 本批里只要有个「大体递增」的族就选它，不再往下退化。
       否则顶层题号族（1. 2. 3.）只因为漏认了一个号，就会被小问族（1）（2）抢走，
       整组选择题会被并进一道题里。 */
    if (looseF) return looseF;
  }
  return null;
}

/* 分值说明：「（每空2分，共14分）」「（14分）」「（每小题3分，共45分）」 */
function wqScoreInfo(t) {
  t = String(t || '').slice(0, 80);
  var m = /每\s*空\s*(\d+(?:\.\d+)?)\s*分[\s，,、；;]*共\s*(\d+(?:\.\d+)?)\s*分/.exec(t);
  if (m && +m[1] > 0) {
    return { per: +m[1], total: +m[2], blanks: Math.round(+m[2] / +m[1]) };
  }
  m = /[（(]\s*(?:本题)?\s*共?\s*(\d+(?:\.\d+)?)\s*分\s*[）)]/.exec(t);
  if (m) return { per: 0, total: +m[1], blanks: 0 };
  m = /共\s*(\d+(?:\.\d+)?)\s*分/.exec(t);
  if (m) return { per: 0, total: +m[1], blanks: 0 };
  return null;
}
/* 题干里的填空数（连续下划线 / 全角下划线 / 空括号 都算一个空） */
function wqCountBlanks(s) {
  var m = String(s || '').match(/_{3,}|＿+|\[\s{2,}\]|\(\s{2,}\)|（\s{2,}）/g);
  return m ? m.length : 0;
}

/* 1,2,3… 递增（遇到 1 视为新一轮，比如第二道大题里的小问又从（1）开始）
   loose=true 允许跳号：卷子里常有某个题号被插图 / 表格挡住没认出来（如「⟦图7⟧9.…」），
   一跳号就判整个族「不是顶层题号」，会让 topFam 退化到小问族（1）（2）上，
   结果整组选择题被并进一道题里甚至直接吞掉。
   放宽后仍要求「多数相邻步长为 1」，避免把乱序的一堆编号误当成题号序列。 */
function wqAscending(seq, loose) {
  var prev = -1, started = false, ok = 0, tot = 0, run = 0, bestRun = 0;
  for (var i = 0; i < seq.length; i++) {
    var n = +seq[i].num;
    if (!isFinite(n)) return false;
    tot++;
    if (!started || n === 1) { started = true; prev = n; run = 1; ok++; if (run > bestRun) bestRun = run; continue; }
    if (n === prev + 1) { prev = n; ok++; run++; if (run > bestRun) bestRun = run; continue; }
    if (n <= prev) {
      /* 编号重新开始了一轮：卷子末尾的答案区会从 16 再编一遍，
         严格模式照旧判失败，宽松模式把它当作新的一段 */
      if (!loose) return false;
      prev = n; run = 1; ok++;
      if (run > bestRun) bestRun = run;
      continue;
    }
    if (loose && n > prev + 1) { prev = n; run++; if (run > bestRun) bestRun = run; continue; }  /* 跳号：放行但不计分 */
    return false;
  }
  if (!started) return false;
  if (!loose) return tot >= 2;
  return bestRun >= 3 && ok >= Math.ceil(tot * 0.5);
}

/* ---------------- 基础工具 ---------------- */
function wqClean(s) {

/* =========================================================
 * 格式整理：Word 导入的题在进题库前统一版式
 * =======================================================*/
function wqIsCjk(ch) { return /[\u3000-\u303f\u4e00-\u9fff\uff01-\uff60]/.test(String(ch || '')); }

/* 全角化：括号、逗号、分号、冒号、问叹号统一用全角 —— 化学式里的括号除外。
   判据是「括号内容 + 上下文」，而不是见到括号就换：
   · Ca(OH)2、Al2(SO4)3、(NH4)2SO4、CH3(CH2)6CH3 —— 括号里只有元素符号/数字、
     右括号后紧跟数字 → 判定为化学式，保持半角不动
   · (1)（2）这种纯数字小问编号 → 换成全角

      if (c === '(') {

        if (a1 < 0) { end = a2; closeCh = '）'; }
        else if (a2 >= 0 && a2 < a1) { end = a2; closeCh = '）'; }
        else { end = a1; closeCh = ')'; }

        end = str.indexOf('）', i + 1); closeCh = '）';
      }

      var inside = str.slice(i + 1, end);
      var before = str.charAt(i - 1), afterC = str.charAt(end + 1);
      /* 化学式：半角括号 + 括号内全是元素/数字 + 右括号后紧跟数字；

      var chem = (c === '(' && closeCh === ')') && /^[A-Za-z0-9+\-·]{1,12}$/.test(inside) &&

      i++; continue;
    }
    /* 选项标记 A. → A． ：只认「行首 / 空白后的单个大写字母 + 点 + 空白或汉字」，
       小数点（29.0mL）、英文缩写（U.S.A.）都不动 */
    if (c === '.') {
      var o1 = str.charAt(i - 1), o0 = str.charAt(i - 2), o2 = str.charAt(i + 1);
      if (/[A-Z]/.test(o1) && (!o0 || /[\s\u3000]/.test(o0)) && (!o2 || /[\s\u3000\u4e00-\u9fff]/.test(o2))) {
        out += '．'; i++; continue;
      }
    }
    out += c; i++;
  }
  return out;
}

/* 选择题题干末尾统一补「（    ）」（全角括号 + 四个空格）。
   · 题干后面如果跟了 ⟦图N⟧ / ⟦表N⟧ / 句号等，要先把它们摘下来，看正文真正的结尾；
   · 已有的「（    ）」（里面只有空白 / 下划线 / 点）→ 拿掉，结尾再补一个，避免和图片混在一起；
   · 「（填字母）」这种有内容的括号 → 已经有答案了，不动；
   · 没括号 → 补一个。
   关键：**作答括号要紧跟题干正文**。卷面是「题干……（    ）」然后另起一行放图 / 表，
   括号放在图 / 表后面就变成「题干 + 一张表 + （    ）」，跟卷面完全对不上。
   所以只要尾巴里有图 / 表，括号就插在正文末尾、图 / 表之前。 */
function wqChoiceBlank(s) {
  var t = String(s == null ? '' : s);
  if (!t.trim()) return t;
  var tail = '';
  var m = /([\s\u00a0]*(?:⟦[图表]\d+⟧[\s\u00a0]*)*[。．.；;]*)$/.exec(t);
  if (m) { tail = m[1]; t = t.slice(0, m.index).replace(/[ \t\u00a0]+$/, ''); }
  if (!t) return String(s);
  /* 摘掉已有的空括号（里面有空白 / 下划线 / 点）—— 稍后放到正确位置 */
  if (/[（(][\s\u3000_.·]*[）)]$/.test(t)) t = t.replace(/[（(][\s\u3000_.·]*[）)]$/, '');
  /* 尾巴里有图 / 表 → 括号插在图 / 表之前；否则照旧放最后 */
  var figFirst = /⟦[图表]\d+⟧/.test(tail);
  /* 「（填字母）」这种已经有内容的括号 → 保留，位置同作答括号 */
  var hasContentParen = /[（(][^（）()]{1,16}[）)]$/.test(t);
  if (hasContentParen) {
    var parenM = /[（(][^（）()]{1,16}[）)]$/.exec(t);
    var paren = parenM ? parenM[0] : '';
    t = t.slice(0, parenM.index).replace(/[ \t\u00a0]+$/, '');
    return (figFirst ? t + paren + tail : t + tail + paren).replace(/\s+$/, '');
  }
  return (figFirst ? t + '（    ）' + tail : t + tail + '（    ）').replace(/\s+$/, '');
}

/* ===== 来源标注 =====
   照题库文档的惯例：(24-25高一下·广东化州·期中)
   —— 年份 + 年级学期 · 学校 · 考试类型，用「·」分隔，半角括号包起来。
   题目正文里本来就有这种标签的（很多专题练习文档自带）→ 直接沿用，不再叠一个。 */
function wqSrcTagOfStem(stem) {
  var m = /^\s*[(（]\s*((?:20)?\d{2}\s*[-–—~－至]\s*\d{2}[^)）]{0,40})\s*[)）]/.exec(String(stem || ''));
  return m ? String(m[1]).trim() : '';
}
/* 从「试卷标题 + 文件名 + 卷首文字」里拼出来源标注：
   年份 2024-2025 → 24-25；年级学期 高一 + 上学期 → 高一上；
   学校取「…中学 / …学校 / …校」；考试类型取「第一次月考 / 期中 / 期末 / 联考…」。
   缺哪段就省哪段 —— 认不出学校时宁可空着，也不硬编一个学校名。 */
function wqBuildSrcTag(texts) {
  var s = (texts || []).map(function (x) { return String(x || ''); }).join(' ');
  if (!s) return '';
  var year = '';
  var my = /(20\d{2})\s*[-–—~－至]\s*(20\d{2}|\d{2})/.exec(s);
  if (my) year = my[1].slice(2) + '-' + (my[2].length === 4 ? my[2].slice(2) : my[2]);
  else {
    var my2 = /(?:^|[^\d])(\d{2})\s*[-–—~－至]\s*(\d{2})(?:[^\d]|$)/.exec(s);
    if (my2) year = my2[1] + '-' + my2[2];
  }
  var gm = /(高三|高二|高一|初三|九年级|初二|八年级|初一|七年级)/.exec(s);
  var grade = !gm ? '' : ({ '九年级': '初三', '八年级': '初二', '七年级': '初一' }[gm[1]] || gm[1]);
  /* 学期：「高一上学期」→ 上；卷面也常简写成「高一下」 */
  var term = '';
  if (grade) { var mgt = new RegExp(grade + '\\s*([上下])').exec(s); if (mgt) term = mgt[1]; }
  /* 「上学期 / 第一学期」→ 上，「下学期 / 第二学期」→ 下 */
  if (!term) term = /(?:上|第\s*一)\s*学期/.test(s) ? '上' : (/(?:下|第\s*二)\s*学期/.test(s) ? '下' : '');
  var type = '';
  var mt = /第[一二三四五六七八九十\d]\s*次\s*(?:月考|段考|联考|统考|质检|模拟考|模考|周测|月测)/.exec(s);
  if (mt) type = mt[0].replace(/\s+/g, '');
  else {
    var mt2 = /(?:期中|期末|开学|摸底|适应性|会考|中考|高考|联考|统考|质检|月考|段考|周测|月测|模拟)/.exec(s);
    if (mt2) type = mt2[0];
  }
  var school = '';
  var ms = /[\u4e00-\u9fa5]{2,12}(?:中学|学校|书院|[一二三四五六七八九十\d]?校)/.exec(s);
  if (ms) school = ms[0];
  var out = [];
  if (year + grade + term) out.push(year + grade + term);
  if (school) out.push(school);
  if (type) out.push(type);
  return out.join('·');
}

/* 难度：★ 个数 / 文字描述 / 数字得分率（0–1）→ 5 档（基础/较易/中等/较难/压轴） */
function wqLevel(s) {
  s = String(s || '').trim();
  if (!s) return '';
  var stars = (s.match(/★/g) || []).length;
  if (stars) return LEVELS[Math.min(stars, LEVELS.length) - 1] || '';
  /* 数字难度系数（得分率 0–1，越小越难）：如「0.85」「难度系数0.65」「0.65」；
     纯数字（可带 %）才按系数折算，>1 时按百分数处理（85 → 0.85），避免误伤普通题干文字 */
  var sNum = s.replace(/^难度(系数)?\s*[：:]?/, '').replace(/%|\s|分/g, '');
  if (/^\d+(?:\.\d+)?$/.test(sNum)) return levelFromCoef(sNum) || '';
  /* 兼容旧 3 档标签（易/中/难） */
  if (s === '易') return '基础';
  if (s === '中') return '中等';
  if (s === '难') return '压轴';
  if (/基础|简单|容易/.test(s)) return '基础';
  if (/较易|偏易|偏低/.test(s)) return '较易';
  if (/中等|中档|适中|一般|普通/.test(s)) return '中等';
  if (/较难|偏难|困难|拔高|提升/.test(s)) return '较难';
  if (/压轴|极难|难题|最难|竞赛/.test(s)) return '压轴';
  if (new RegExp('^(' + LEVELS.join('|') + ')$').test(s)) return s;
  return '';
}

/* 合并相邻重复的图片 / 表格占位符（同一段里出现两次 ⟦图7⟧⟦图7⟧ 之类），
   避免题面里同一张图渲染两遍 */
function wqDedupMarkers(s) {
  return String(s == null ? '' : s).replace(/(⟦[图表]\d+⟧)(?:\s*\1)+/g, '$1');
}

/* 跨字段去重：同一题里同一张图 / 表格的占位符若在 stem / options / answer / analysis
   多个字段里都出现，渲染时会被重复展示（答案里有一张、解析里又有一张）。
   这里按 stem → options → answer → analysis 的顺序，只保留**第一次**出现的标记，
   后续字段里同样的标记直接抹掉；表格同理。一道题一张图只展示一次。 */
function wqDedupCrossField(items) {
  (items || []).forEach(function (it) {
    if (!it) return;
    var seen = {};
    ['stem', 'options', 'answer', 'analysis'].forEach(function (k) {
      if (!it[k]) return;
      it[k] = String(it[k]).replace(/⟦([图表])(\d+)⟧/g, function (m, ch, n) {
        var key = ch + ':' + n;
        if (seen[key]) return '';
        seen[key] = 1;
        return m;
      });
    });
  });
  return items;
}

/* 导入时自动分级（5 档：基础/较易/中等/较难/压轴）。
   仅作初值，用户可在题卡上手动改。
   分级依据 = 两批人工标注题库（导电性 92 题 + 速率与平衡 57 题）学到的规律：
   ① 考点综合性第一：考点交叉簇越多越难（考点数与得分率相关 -0.41），单一考点定性判断 = 基础/较易；
   ② 定性→定量递进：定性判断最易，平衡常数、转化率等常规计算为中等，
      速率方程/速率常数、反应历程、误差分析、多步定量为最难；
   ③ 情境复杂度次之：题干越长情境越复杂（相关 -0.36）；解析详细程度与难度无关（相关 0.09）；
   ④ 大题按小问逐步给分：空数/小问多但单问常规时，整体得分率并不一定低。 */
function wqAutoLevel(it) {
  var stem = String(it.stem || ''), opts = String(it.options || '');
  var all = stem + '\n' + opts;
  var blanks = wqCountBlanks(all);
  var subs = it.subs || 0;
  /* 综合度 = 题干+选项命中的独立考点簇数量（外因条件 / 平衡移动 / 速率与历程 /
     定量计算 / 理论判据 / 实验测定），命中越多越难 */
  var clusters = [
    /外因|催化剂|活化能|温度对|压强对|浓度对|影响.*速率|影响.*平衡|反应速率的大小/,
    /平衡移动|勒夏特列|平衡状态|平衡的建立/,
    /反应历程|基元反应|速率常数|速率方程/,
    /平衡常数|三段式|转化率|产率|计算|定量/,
    /熵判据|复合判据|盖斯|键能|中和热/,
    /实验|测定|探究|误差分析|实验方案/
  ].filter(function (re) { return re.test(all); }).length;
  var hard = /工艺流程|推断|框图|转化关系|实验设计|探究|实验方案|原因|为什么|制备|合成|电解(?!质)|原电池|电解池|化学平衡|电离|水解|沉淀溶解|滴定|定量|产率|转化率|氧化还原/;
  /* 最难信号（压轴方向）：推断/流程/实验设计、速率方程与历程、误差分析、电解、滴定 */
  var hardest = /工艺流程|推断|框图|转化关系|实验设计|探究|实验方案|速率方程|速率常数|基元反应|误差分析|沉淀溶解|滴定|电解(?!质)/;
  if (/选择题/.test(it.qtype || '')) {
    if (clusters >= 4 || (clusters >= 3 && /计算|定量|平衡常数|转化率/.test(all)) || hardest.test(all)) return '较难';
    if (clusters >= 3 || /图像|曲线|平衡常数|转化率|三段式/.test(all)) return '中等';
    return /探究|推断|计算|工艺流程|实验设计|原因|为什么/.test(stem) ? '较易' : '基础';
  }
  if (subs >= 2 || /工艺流程|推断题|计算题|实验题/.test(it.qtype || '')) {
    if (clusters >= 5 || blanks >= 5 || (hardest.test(stem) && blanks >= 2)) return '压轴';
    if (clusters >= 3 || blanks >= 3 || /探究|推断|原因|为什么|制备|合成|实验设计|平衡常数|三段式|转化率/.test(stem)) return '较难';
    return '中等';
  }
  if (clusters >= 4 || blanks >= 3 || hard.test(stem)) return '较难';
  if (clusters >= 2 || blanks >= 2) return '中等';
  return '基础';
}

/* 来源：[2023·全国甲卷] （2022 湖南卷） → {text, raw} */
function wqSource(s) {
  var m = /([\[【（(])\s*((?:19|20)\d{2})\s*[-—·]?\s*([^\]】）)]{1,24})\s*([\]】）)])/.exec(String(s || ''));
  if (!m) return null;
  var extra = wqClean(m[3]);
  if (!extra) return null;
  return { text: m[2] + '·' + extra, raw: m[0] };
}

/* 标签切片：把一行里的【答案】【解析】答案：… 拆成片段 */
function wqTagSplit(text) {
  var re = /[【\[]\s*(参考答案|答案|解析|详解|解答|分析|思路点拨|点拨|难度|知识点|考点|来源|出处|标签)\s*[】\]]|(参考答案|答案|解析|详解|解答)\s*[：:]/g;
  var marks = [], m;
  while ((m = re.exec(text))) {
    var key = (m[1] || m[2] || '').trim();
    marks.push({ i: m.index, end: m.index + m[0].length, k: WQ_MARK_KEY[key] || 'txt' });
  }
  if (!marks.length) return [{ k: 'txt', text: wqClean(text) }];
  var segs = [];
  if (marks[0].i > 0) segs.push({ k: 'txt', text: wqClean(text.slice(0, marks[0].i)) });
  for (var i = 0; i < marks.length; i++) {
    var s = marks[i].end, e = (i + 1 < marks.length) ? marks[i + 1].i : text.length;
    segs.push({ k: marks[i].k, text: wqClean(text.slice(s, e)) });
  }
  return segs;
}

/* 选项标记候选：字母 + 分隔符（. ． 、 ) ））。
   化学式 / 化学量里的字母**不是**选项标记，必须排除，否则
   「C．图像上任意一点都满足C(A):C(B)=1:3」会被拦腰切断成
   「…满足C(」+「A):C(」+「B)=1:3」—— 选项里带物质代号时最常踩这个坑。
   判据两条（都很局部，不改变正常选项行的行为）：
   · 字母紧前一个字符是**英文字母 / 数字 / 各种左括号** → 在公式内部
     （C(A)、n(B)、α(A)、A(g)、2 B(g)、（A）都命中这一条）；
   · 分隔符是右括号且紧跟 : = → C(A):C(B) 这类表达式。 */
function wqOptCands(line) {
  var cands = [], m;
  WQ_RE.optSplit.lastIndex = 0;
  while ((m = WQ_RE.optSplit.exec(line))) {
    var at = m.index, prev = at > 0 ? line.charAt(at - 1) : '';
    if (prev && /[A-Za-z0-9([{［【｛（]/.test(prev)) continue;
    if (/[)）]/.test(m[0]) && /^[\s\u3000]*[:：=]/.test(line.slice(at + m[0].length))) continue;
    /* 「A、B、C、D 四种物质」这种**枚举**：连着三个「字母+、」且中间一点内容都没有，
       是物质代号列表，不是选项 —— 真正的选项「A、甲」后面跟的是内容不是下一个字母。 */
    if (m[1] === '、' && /^[A-Ha-h]\s*、\s*[A-Ha-h]\s*、\s*[A-Ha-h]\s*、/.test(line.slice(at))) continue;
    cands.push({ i: at, L: m[1].toUpperCase() });
  }
  return cands;
}

/* 一行里最长的那串连续选项：A．…B．…C．… → {first:'A', start, parts:['A．…','B．…',…]} */
function wqOptSeq(line) {
  var cands = wqOptCands(line);
  if (cands.length < 2) return null;
  var best = [];
  for (var a = 0; a < cands.length; a++) {
    var seq = [cands[a]];
    for (var b = a + 1; b < cands.length; b++) {
      var exp = String.fromCharCode(seq[seq.length - 1].L.charCodeAt(0) + 1);
      if (cands[b].L === exp) seq.push(cands[b]);
    }
    if (seq.length > best.length) best = seq;
  }
  if (best.length < 2) return null;
  var parts = [], real = 0;
  for (var k = 0; k < best.length; k++) {
    var s = best[k].i, e = (k + 1 < best.length) ? best[k + 1].i : line.length;
    var one = wqClean(line.slice(s, e));
    /* 字母标记后面还有没有实际内容（「A、」这种是空壳，「A．液态氧气」才有料） */
    if (one.replace(/^[A-Ha-h]\s*[.．、)）]\s*/, '').length >= 1) real++;
    parts.push(one);
  }
  /* 「…根据A、B、C、D、E、F六种初中化学常见的物质的性质…」这种是**枚举**不是选项：
     真正的选项每个 A．/B． 后面都跟内容，枚举则大量是空壳。
     要求至少 2 个有内容，且 2/3 以上有内容，才认作选项组。 */
  if (real < 2 || real * 3 < parts.length * 2) return null;
  return { first: best[0].L, start: best[0].i, parts: parts };
}

/* 行内选项切分：A．… B．… C．… → {stem, options}
   expect：这一行「期望从哪个字母开始」。不传 = 必须是 A（题干后第一次出现选项组）；
   传了则必须是该字母 —— 卷子里常把 C．D． 两个选项挤在同一行（Word 里没敲回车），
   只有允许「从 B 之后的字母开始」才能把它们切开，否则整行会被当成一个选项。 */
function wqSplitOptions(line, expect) {
  var r = wqOptSeq(line);
  if (!r) return null;
  var want = expect ? String(expect).toUpperCase() : 'A';
  if (r.first !== want) return null;
  return { stem: wqClean(line.slice(0, r.start)), options: r.parts.join('\n') };
}

/* 已有选项后面「应该」接哪个字母：A → B → C … 越过 D 就返回 '' */
function wqNextOptLetter(options) {
  var arr = String(options == null ? '' : options).split('\n').filter(function (x) { return String(x).trim(); });
  if (!arr.length) return 'A';
  var m = /^\s*([A-Ha-h])\s*[.．、)）]/.exec(arr[arr.length - 1]);
  if (!m) return '';
  var c = m[1].toUpperCase();
  return c < 'H' ? String.fromCharCode(c.charCodeAt(0) + 1) : '';
}

/* 选项统一格式（导入后 / 渲染前都会跑一遍）：
   · A．B．C．D． 每个选项各自独立成行 —— 同一行挤了多个的按标记拆开；
   · 行首顶格（去掉 Word 带的缩进空格）；
   · 没有字母标记的续行并回上一项，保证「一个选项一行」。 */
function wqNormOptions(s) {
  s = String(s == null ? '' : s);
  if (!s.replace(/[\s\u3000]/g, '')) return '';
  var out = [];
  s.split('\n').forEach(function (ln) {
    var t = String(ln).replace(/^[\s\u3000]+/, '').replace(/[\s\u3000]+$/, '');
    if (!t) return;
    var r = wqOptSeq(t);
    if (r) {
      if (r.start > 0) out.push(t.slice(0, r.start).replace(/[\s\u3000]+$/, ''));
      r.parts.forEach(function (p) { out.push(String(p).replace(/^[\s\u3000]+/, '')); });
      return;
    }
    if (out.length && !/^[A-Ha-h]\s*[.．、)）]/.test(t)) out[out.length - 1] += ' ' + t;
    else out.push(t);
  });
  return out.join('\n');
}

/* 看起来像「题目」而不是「标题」的行 */
function wqQuestionish(t) {
  t = wqClean(t);
  if (!t) return false;
  if (/[?？]\s*$/.test(t)) return true;
  if (/[_＿]{2,}/.test(t)) return true;
  if (/[（(]\s{0,8}[）)]/.test(t)) return true;
  if (/(?:下列|以下|叙述|说法|正确|错误|计算|写出|求|判断|解释|已知|选择|填空|探究|为什么|简述|比较|说明理由|分析|完成|关于|简答|列出|回答|描述|测定|鉴别|分离|提纯|制备|设计|配平|推导|实验|目的|原理|操作|现象|结论|变化|含义|原因|理由|定义|结构|组成|用途|区别|联系|步骤|方法|规律|概念|归纳|总结|概括|提出|研究|认识|理解|阐述|标出|证明|验证|观察|记录|配制|制取|补全)/.test(t)) return true;
  if (WQ_RE.optLine.test(t)) return true;
  if (/[A-H]\s*[.．、)）]\s*\S/.test(t)) return true;
  if (t.length > 22) return true;
  return false;
}

/* 看起来像「板块标题」：短、没有题号、不像题 */
function wqIsHeadingLike(t) {
  t = wqClean(t);
  if (!t) return true;
  if (t.length > 30) return false;
  if (/^\s*(?:第\s*[一二三四五六七八九十百\d]+\s*[讲章节部分单元]|专题|模块|考点|题型|目录|附录|附)\s*[一二三四五六七八九十\d]?/.test(t)) return true;
  if (/(知识梳理|考点精讲|典例精讲|例题精讲|典例分析|方法总结|课堂练习|课后练习|基础练习|巩固练习|随堂练习|培优训练|拓展提升|能力提升|综合训练|真题演练|易错提醒|课堂小结|思维导图|知识清单|学法指导|自我检测|参考答案|答案解析)\s*$/.test(t)) return true;
  if (/^(知识|能力|方法|考点|专题|章节|题型|板块)\S{0,12}$/.test(t)) return true;
  return false;
}

/* 章节 / 分组标题：返回 'chapter'（第X讲·专题）| 'group'（一、选择题）| ''
 * lv = Word 里的标题样式级别（1/2/3），是很强的信号 */
function wqHeadKind(t, lv) {
  t = wqClean(t);
  if (!t) return '';
  /* 「一、选择题(本大题包括15小题，每小题3分，共45分...)」这种长 group 标题，
     即使后面跟着 100 字的说明，整体仍属"一、选择题"组，先按 group 处理 */
  var gLong = /^\s*[（(]?\s*[一二三四五六七八九十]+\s*[）)]?\s*[、.．]\s*(?:不?定项|单项|多项)?\s*(选择题|单选题|多选题|不定项选择题|填空题|实验题|推断题|计算题|简答题|综合能力题|综合题|解答题|判断题|非选择题|客观题|主观题|基础题|提高题|完成下列各题|完成下列各小题|完成下列题)/.exec(t);
  if (gLong) return 'group';

  if (t.length > 34) return '';
  if (/⟦图\d+⟧/.test(t)) return '';          /* 图片占位行不是标题 */
  if (WQ_RE.numDot.test(t) || WQ_RE.numPar.test(t) || WQ_RE.zhang.test(t)) return '';
  if (WQ_RE.tag.test(t) || WQ_RE.tagBare.test(t)) return '';
  if (WQ_RE.ansHead.test(t)) return '';

  /* 一、选择题（本题共 15 小题） —— 分组标题（短文本） */
  var g = /^\s*[（(]?\s*[一二三四五六七八九十]+\s*[）)]?\s*[、.．]\s*(.{0,20})/.exec(t);
  if (g) {
    var tail = wqClean(g[1]);
    if (/^(选择题|单选题|多选题|不定项选择题|填空题|实验题|推断题|计算题|简答题|综合题|解答题|判断题|非选择题|客观题|主观题|基础题|提高题|完成下列各题|完成下列各小题|完成下列题)/.test(tail)) return 'group';
    if (!wqQuestionish(t)) return 'group';
    return '';
  }
  /* 第X讲 / 专题 / 模块 / 第X章 / 考点X / 题型X */
  if (/^\s*(?:第\s*[一二三四五六七八九十百\d]+\s*[讲章节部分单元]|专题|模块|考点|题型|第\s*[一二三四五六七八九十\d]+\s*部分)/.test(t)) return 'chapter';
  /* 常见板块名（整行就是这些词） */
  if (/^[（(]?\s*[一二三四五六七八九十\d]*\s*[）)]?\s*[.．、]?\s*(知识梳理|考点精讲|典例精讲|例题精讲|典例分析|方法总结|课堂练习|课后练习|基础练习|巩固练习|随堂练习|培优训练|拓展提升|能力提升|综合训练|真题演练|易错提醒|课堂小结|思维导图|知识清单|学法指导|自我检测|答案解析|参考答案)\s*$/.test(t)) return 'chapter';
  /* Word 标题样式：短、不像题，就按级别当标题 */
  if (lv > 0 && t.length <= 30 && !wqQuestionish(t)) return lv >= 3 ? 'group' : 'chapter';
  return '';
}

/* 看起来像题干的段落（用于没有题号的文档） */
function wqLooksLikeStem(t, lv) {
  t = wqClean(t);
  if (!t || t.length < 6) return false;
  if (wqIsHeadingLike(t)) return false;
  if (lv > 0) return wqQuestionish(t);
  if (/[_＿]{3,}|[（(]\s*[）)]/.test(t)) return true;
  if (/(下列|叙述|说法|正确|错误|计算|写出|判断|分析|解释|已知|选择|填空|实验|流程|物质|反应)/.test(t)) return true;
  return t.length >= 18;
}

/* 试卷标题（如「2026届XX中学高三第一次月考 化学试卷」）：应写入「来源」，
 * 不是章节，也不当成题。靠「考试场次/届次/校名 + 试卷/试题」这类信号识别，且排除像题的行。 */
function wqIsPaperTitle(t) {
  t = wqClean(t);
  t = t.replace(/⟦[图表]\d+⟧/g, '');            /* 去掉图片占位，避免标题被撑长而漏判 */
  if (!t || t.length > 60) return false;
  /* 标题不会以编号开头、不会是完整句子；这里不再用 wqQuestionish（标题本身也可能较长） */
  if (/^\s*\d+[.．、）)]/.test(t)) return false;          /* 以编号开头的是「注意事项/小题」，不是标题 */
  if (/[。；]/.test(t) || (t.split('，').length - 1) >= 2) return false;  /* 完整句子（带句号/多个逗号）不是标题 */
  /* 考试时间 / 满分 这类元数据行不是标题 */
  if (/^(?:考试时间|考试用时|试卷满分|本卷满分|全卷满分|考试时长|满分|本试卷|全卷)/.test(t)) return false;
  if (/考试(?:时间|用时|时长)[\s：:]*\d|满分[\s：:]*\d|分钟/.test(t) &&
    !/(?:届|中学|学校|学院|大学|教育局|教研室|教科院|考试院|联考|模拟|月考|期中|期末|调研|诊断|适应性|一模|二模|三模|四模|冲刺|密卷|真题|开学|统考|质检|统测|自测|检测|练习|年考)/.test(t)) return false;
  if (/^(?:19|20)\d{2}\s*届/.test(t)) return true;
  /* 强标题信号：届/校名/模拟/期中/期末/月考/联考/真题/一模… 搭配 试卷/试题/模拟卷 */
  if (/(?:届|中学|学校|学院|大学|教育局|教研室|教科院|考试院|联考|模拟|月考|期中|期末|调研|诊断|适应性|一模|二模|三模|四模|冲刺|密卷|真题|开学|统考|质检|统测|自测|检测|练习)\s*(?:高[一二三四]?|化学|物理|数学|生物|英语|语文|政治|历史|地理)?\s*(?:试卷|试题|模拟卷|练习|测试|卷)/.test(t)) return true;
  if (/(?:试卷|试题|模拟卷)$/.test(t)) return true;
  return false;
}

/* 分组标题（如「一、选择题(...)」「二、填空题(...)」）的题型：
   'choice'    = 本组下每道题独立（选择题、单选、多选、不定项）
   'composite' = 本组是 1 道大题，下面是（1）（2）小问（填空、实验、计算、综合…）
   ''          = 不确定，沿用之前的状态 */
function wqGroupKind(t) {
  var g = /^\s*[（(]?\s*[一二三四五六七八九十]+\s*[）)]?\s*[、.．]\s*(.{0,30})/.exec(t);
  if (!g) return '';
  var tail = wqClean(g[1]);
  if (WQ_CHOICE_GROUP.test(tail)) return 'choice';
  if (/^(?:填空题|实验题|推断题|计算题|简答题|综合能力题|综合题|解答题|判断题|非选择题|主观题|基础题|提高题)/.test(tail)) return 'composite';
  return '';
}

/* 题号匹配：返回 {code, rest} */
function wqMatchStart(t) {
  var m;
  if ((m = WQ_RE.tag.exec(t))) return { code: m[1] + m[2], rest: t.slice(m[0].length) };
  if ((m = WQ_RE.tagBare.exec(t))) return { code: m[1] + m[2], rest: t.slice(m[0].length) };
  if ((m = WQ_RE.zhang.exec(t))) return { code: m[1], rest: t.slice(m[0].length), fam: 'dot', rank: 0, num: +m[1] };
  if ((m = WQ_RE.numSub.exec(t))) return { code: m[1] + '.' + m[2], rest: t.slice(m[0].length), fam: 'sub', rank: 2, num: +m[2] };
  var k = wqMarker(t);
  if (k) return { code: k.code, rest: k.rest, fam: k.fam, rank: k.rank, num: k.num };
  return null;
}

/* 暂存的选项行结算：题干中间出现的选项行（如大题第②问的 a. b. c. d.）必须留在
 * 题干原位，只有「题目末尾连续出现的选项行」才是这道真正的选项。
 * 做法：选项行先进 _optPend 挂起；一旦后面又来了正文行，说明这些选项在题干中间，
 * 就 _optLock 并把挂起的选项按顺序回填进题干（顺序不能乱）。 */
function wqOptsFlush(cur) {
  if (!cur || !cur._optPend || !cur._optPend.length) return;
  var pend = cur._optPend;
  cur._optPend = [];
  if (!cur._optLock) {
    pend.forEach(function (x) { cur.options = wqJoin(cur.options, x); });
    return;
  }
  pend.forEach(function (x) { cur.stem = wqJoin(cur.stem, wqNormOptions(x) || x); });
}
/* 来了正文行 → 之前挂起的选项行作废，退回题干 */
function wqOptsLock(cur) {
  if (!cur || !cur._optPend || !cur._optPend.length) return;
  cur._optLock = 1;
  wqOptsFlush(cur);
}

/* 普通内容行 → 按当前活动字段归类 */
function wqFeedPlain(cur, text) {
  text = wqClean(text);
  if (!text) return;
  var act = cur._act === 'analysis' ? 'analysis' : (cur._act === 'answer' ? 'answer' : 'stem');
  if (act === 'stem') {
    /* 允许「接续行」：已经切到 B，这一行从 C 开始也算选项（卷子里 C．D． 常挤在一行） */
    var nextL = wqNextOptLetter(cur.options);
    var sp = (nextL && nextL !== 'A') ? (wqSplitOptions(text, nextL) || wqSplitOptions(text)) : wqSplitOptions(text);
    if (sp && (sp.stem || String(cur.options || '').trim())) {
      if (sp.stem) cur.stem = wqJoin(cur.stem, sp.stem);
      cur.options = wqJoin(cur.options, sp.options);
      return;
    }
    if (WQ_RE.optLine.test(text)) {
      if (!cur._optLock) { (cur._optPend || (cur._optPend = [])).push(text); return; }  /* 先挂起，等结尾再定 */
      cur.stem = wqJoin(cur.stem, wqNormOptions(text) || text); return;
    }
    var src = wqSource(text);
    if (src) {
      var rest = wqClean(text.replace(src.raw, '')).replace(/[\[【（(]\s*[\]】）)]/g, '').replace(/[：:．.、,，；;]/g, '');
      if (rest.length <= 1) { cur.source = wqJoin(cur.source, src.text); return; }
    }
    wqOptsLock(cur);                    /* 正文行：把挂起的选项行退回题干 */
  }
  cur[act] = wqJoin(cur[act], text);
}

/* 一整行（可能含多个标记）→ 归类到题干 / 选项 / 答案 / 解析 / 难度 / 知识点 / 来源 */
function wqFeed(cur, text) {
  text = wqClean(text);
  if (!text) return;
  var segs = wqTagSplit(text);
  var hasMark = segs.length > 1 || (segs.length === 1 && segs[0].k !== 'txt');
  if (!hasMark) {
    if (/^[★☆\s]+$/.test(text)) { cur.level = wqLevel(text); return; }
    wqFeedPlain(cur, text);
    return;
  }
  segs.forEach(function (sg) {
    if (sg.k === 'txt') { wqFeedPlain(cur, sg.text); return; }
    if (sg.k === 'answer') { cur.answer = wqJoin(cur.answer, sg.text); cur._act = 'answer'; return; }
    if (sg.k === 'analysis') { cur.analysis = wqJoin(cur.analysis, sg.text); cur._act = 'analysis'; return; }
    if (sg.k === 'level') { cur.level = wqLevel(sg.text) || cur.level; return; }
    if (sg.k === 'point') { cur.point = wqJoin(cur.point, sg.text); return; }
    if (sg.k === 'source') { cur.source = wqJoin(cur.source, sg.text); return; }
    if (sg.k === 'tags') {
      String(sg.text).split(/[,，、;；\s]+/).forEach(function (x) { if (x) cur.tags.push(x); });
    }
  });
}

/* 答案区的一行 → 答案池条目 */
function wqFeedAnswer(p, text) {
  text = wqClean(text);
  if (!text) return;
  var segs = wqTagSplit(text);
  var hasMark = segs.length > 1 || (segs.length === 1 && segs[0].k !== 'txt');
  if (!hasMark) {
    if (p._act === 'analysis') p.analysis = wqJoin(p.analysis, text);
    else p.answer = wqJoin(p.answer, text);
    return;
  }
  var mode = 'answer';
  segs.forEach(function (sg) {
    if (sg.k === 'analysis') { mode = 'analysis'; if (sg.text) p.analysis = wqJoin(p.analysis, sg.text); }
    else if (sg.k === 'answer') { mode = 'answer'; if (sg.text) p.answer = wqJoin(p.answer, sg.text); }
    else if (sg.k === 'txt' && sg.text) {
      if (mode === 'analysis') p.analysis = wqJoin(p.analysis, sg.text);
      else p.answer = wqJoin(p.answer, sg.text);
    }
  });
  p._act = mode;
}

function wqGuessQType(it) {
  var s = String(it.stem || '');
  /* 真正带小问的大题（（1）（2）…）即使正文里混进了 A．B．C． 选项，也不该判成「选择题」——
     那些选项属于其中某个小问，整道大题还是综合/填空/实验题。
     只认 _subQ（（1）/1.1 这类），不看 _subs —— ①② 常常只是反应式列表，不算小问 */
  var composite = (it._subQ || 0) > 0;
  if (!composite && String(it.options || '').trim()) return '选择题';
  for (var i = 0; i < WQ_QTYPE_RULES.length; i++) {
    if (WQ_QTYPE_RULES[i][1].test(s)) return WQ_QTYPE_RULES[i][0];
  }
  if (composite) return wqCountBlanks(s) > 0 ? '填空题' : '简答题';
  return '简答题';
}

/* 知识点匹配（兼容旧调用）：只给一段文本时，按同一套规则打分取主知识点。
 * 例：制备氯气的实验题 →「化学实验·气体制备与净化」；原电池题 →「电化学·原电池」。 */
function wqGuessPoint(text) {
  return wqTagKnowledge({ stem: String(text || '') }).point;
}

/* 题号写法归一 —— 只调顺序、不删内容：
   · 有些卷子把分值写在分隔符前面：「18（10分）．阅读下面的材料」，题号正则认不出来
   · 有些把插图占位符顶在题号左边：「⟦图7⟧9.500℃时…」
   这两种不归一，整道题就丢了（第 9 题、第 18 题就是这样没的）。 */
function wqNormHead(s) {
  var t = String(s == null ? '' : s);
  /* 「18（10分）．」→「18．（10分）」 */
  t = t.replace(/^(\s{0,8}\d{1,3})\s*([（(]\s*\d{1,3}(?:\.\d+)?\s*分\s*[）)])\s*([.．、])/, '$1$3$2');
  /* 「⟦图7⟧9.」→「9.⟦图7⟧」：图挪到题号之后，图不丢，题号也能认出来 */
  t = t.replace(/^\s*((?:⟦[图表]\d+⟧\s*)+)(\d{1,3}\s*[.．、])/, '$2$1');
  return t;
}

/* =========================================================
 * 主切分：段落数组 → 题目数组
 * =======================================================*/
function wqParsePaper(paras, srcName) {
  var lines = [];
  (paras || []).forEach(function (p) {
    if (!p || !p.text) return;
    var lv = p.level || 0;
    String(p.text).split(/\r?\n/).forEach(function (seg) {
      seg = wqClean(seg);
      seg = wqNormHead(seg);
      if (seg) lines.push({ t: seg, lv: lv, onlyImg: !!p.onlyImg, num: p.num || 0, sub: p.sub || 0, tbl: p.tblData || null });
    });
  });

  /* ---- 第一遍：先认出「哪一族编号是大题」，再决定每一段归到哪里 ----
     规则：同族相邻两个号之间的内容都属于同一道大题；
           带「（每空2分，共14分）」这类分值说明的行，基本就是大题开头 */
  var marks = [], scoreAt = {}, hasScore = 0;
  lines.forEach(function (ln, i) {
    var si = wqScoreInfo(ln.t);
    if (si) { scoreAt[i] = si; hasScore++; }
    /* 「一、选择题(...)」/「二、填空题(...)」这种分组标题不是真正的题号，
       跳过；否则它们会污染顶层族的判定，让「一、」反而抢走「1.」的位置 */
    if (wqGroupKind(ln.t)) return;
    /* 卷首/页眉页脚的噪声行（含「N.选择题必须…」「N.本试卷…」这类带编号的说明）
       也会命中题号正则，必须先剔除，否则会污染顶层编号族、导致题号错位 */
    var _tb = ln.t.replace(/^\s*(?:\d{1,3}\s*[.．、)]?|[\u2460-\u2473]|[（(]\s*\d{1,3}\s*[）)]\s*)/, '').replace(/^\s+/, '');
    if ((WQ_NOISE.test(ln.t) || WQ_NOISE.test(_tb) || WQ_PREAMBLE.test(ln.t) || WQ_PAGEHEAD.test(ln.t)) && ln.t.length < 140) return;
    var k = wqMarker(ln.t);
    if (!k) return;
    if (si) k.score = 1;
    k.i = i;
    marks.push(k);
  });
  var topFam = wqPickTopFam(marks, scoreAt);
  var topRank = topFam ? WQ_FAM[topFam].rank : 99;

  /* 练习册 / 卷子常把第 1 题的「1.」省掉（第一题默认不编号，直接从 2. 写起）。
     这时第一个顶层题号是 2、3…，前面那道无编号的题干就整段丢了。
     把第一题之前「像题干」的行补回来，最多补 3 道。 */
  if (topFam) {
    var fIdx = -1, fNum = 0;
    for (var _mi = 0; _mi < marks.length; _mi++) {
      if (marks[_mi].fam !== topFam) continue;
      fIdx = marks[_mi].i; fNum = +marks[_mi].num; break;
    }
    if (fIdx > 0 && fNum > 1) {
      var _cand = [];
      for (var _ci = 0; _ci < fIdx; _ci++) {
        var _lt = lines[_ci].t;
        if (!_lt || _lt.length < 8) continue;
        if (wqGroupKind(_lt) || wqHeadKind(_lt, lines[_ci].lv)) continue;

  items.forEach(function (it, i) {
    /* MathType 之类的矢量公式读不出来，解析时留了 ⟦缺⟧ 占位：
       先按题计数（好告诉老师是哪几道题缺公式），再把占位符抹掉，题干保持干净 */
    var lostN = 0;
    ['stem', 'options', 'answer', 'analysis'].forEach(function (k) {
      if (!it[k]) return;
      var s = String(it[k]);
      var n = (s.match(/⟦缺⟧/g) || []).length;
      if (n) { lostN += n; s = s.replace(/⟦缺⟧/g, ''); }
      it[k] = wqDedupMarkers(s);          /* 合并相邻重复的 ⟦图N⟧⟦图N⟧，避免同一张图渲染两遍 */
    });
    if (lostN) it.lost = lostN;
    /* 格式整理①：括号与符号统一全角（化学式里的括号保持半角） */
    ['stem', 'options', 'answer', 'analysis'].forEach(function (k) {
      if (it[k]) it[k] = wqFullPunct(it[k]);
    });
    /* 格式整理②：选项统一成「A．B．C．D．各占一行、顶格对齐」 */
    if (it.options) it.options = wqNormOptions(it.options);
    if (!it.code) it.code = String(i + 1);
    if (!it.qtype) it.qtype = wqGuessQType(it);
    /* 选项藏在表格里的选择题：题干末尾带 ⟦表N⟧ 但选项为空 → 从表里挖 A./B./C./D.，
       顺便识别为选择题（让下面的 wqChoiceBlank 给题干补括号 + 改对 qtype）。
       表内选项两种写法都支持：(1) 首格写「A.内容」   (2) 首格仅「A」、内容在同行其他格。
       仅限非「大题」（composite）：大题里某个小问带 a/b/c/d 选项时不应误判。 */
    /* 只对「短题干」挖表格选项：大题正文里的数据表（溶解度表、数据表）也会被记成 ⟦表N⟧，
       拿它去匹配 A./B./C./D. 既挖不出选项，又会把整道大题误判成选择题，还会让解析陷入
       病理性回溯而卡死（这份卷子就是如此）。选择题题干一般不超过几百字，用它做门槛。 */
    if (it.qtype !== '选择题' && !it._subQ && String(it.stem || '').length < 400 &&
      /⟦表\d+⟧/.test(String(it.stem)) && !String(it.options || '').trim()) {
      var _tnum = +(/⟦表(\d+)⟧/.exec(String(it.stem))[1]);
      var _tbl = null;
      (paras || []).forEach(function (p) { if (!_tbl && p && p.tblData && p.tblData.n === _tnum) _tbl = p.tblData; });
      if (_tbl && _tbl.rows) {
        var _opts = [];
        _tbl.rows.forEach(function (row) {
          if (!row || !row.length) return;
          /* 形式 1：同行 1 个单元格装「A. 内容」(Q1/Q9)，或每个选项占一格 */
          for (var _ci = 0; _ci < row.length; _ci++) {
            var _c = String((row[_ci] && row[_ci].t) || '').replace(/[\s\u3000]+/g, ' ').trim();
            if (!_c) continue;
            var _m1 = /^([A-Da-d])\s*[.．、)）]\s*(.+)$/.exec(_c);
            if (_m1) {
              var _L = _m1[1].toUpperCase();
              if (_L.charCodeAt(0) - 65 === _opts.length) _opts.push(_L + '．' + _m1[2].trim());
            }
          }
          /* 形式 2：首格仅字母、内容在同行其他格 (Q8/Q13：选项|客观事实|原理解释 模式) */
          var _fc = String((row[0] && row[0].t) || '').replace(/[\s\u3000]+/g, ' ').trim();
          var _m2 = /^([A-Da-d])\s*$/.exec(_fc);
          if (_m2 && row.length >= 2) {
            var _L2 = _m2[1].toUpperCase();
            if (_L2.charCodeAt(0) - 65 === _opts.length) {
              var _rest = row.slice(1).map(function (c) { return String((c && c.t) || '').trim(); }).filter(Boolean).join(' ');
              if (_rest) _opts.push(_L2 + '．' + _rest);
            }
          }
        });
        if (_opts.length >= 2) {
          it.options = _opts.join('\n');
          it.qtype = '选择题';
        }
      }
    }
    /* 选项齐全（A~D 至少出现 3 个）但没识别成选择题 → 修正题型，保证末尾补作答括号。
       仅限非「大题」（composite）：大题里某个小问带 a/b/c/d 选项时，不应把整道大题误判成选择题 */
    if (it.qtype !== '选择题' && !it._subQ) {
      var optLines = String(it.options || '').split('\n').filter(function (x) { return /^[A-Da-d]\s*[.．、)）]/.test(x.trim()); });
      if (optLines.length >= 3 && /^[A-Da-d]\s*[.．、)）]/.test(optLines[0] || '')) it.qtype = '选择题';
    }
    /* 格式整理③：选择题题干末尾统一为全角作答括号「（    ）」 */
    if (it.qtype === '选择题') it.stem = wqChoiceBlank(it.stem);
    /* 知识点：按规则库给整道题打分（题干 / 选项 / 答案 / 解析 / 章节都看），
       主知识点写 point，次知识点追加到标签，并记下置信度与命中依据供导入预览核对。
       证据不足时 point 留空 —— 宁可空着让老师手填，也不给一个错的知识点。 */
    if (WQ_KP_AUTO) {
      var _kp = wqTagKnowledge(it);
      if (!String(it.point || '').trim() && _kp.point) it.point = _kp.point;
      /* 题目自带「知识点：…」时以它为准，不覆盖，也不再叠我们的置信度 */
      if (it.point === _kp.point) {
        it.kpConf = _kp.conf; it.kpWhy = _kp.why; it.kpAlts = (_kp.alts || []).slice();
        it.kpSrc = _kp.chapterFallback ? 'chapter' : 'auto';
      }
    }
    /* 难度：导入时自动分级（5 档），用户可在题卡上手动改 */
    if (!it.level) it.level = wqAutoLevel(it);
    /* 标签：移除无辨识度的「考试时间 / 试卷满分」等，缺标签时补上本题知识点 */
    it.tags = (it.tags || []).filter(function (tg) {
      return tg && !/^(?:考试时间|考试用时|试卷满分|本卷满分|全卷满分|考试时长|满分|本试卷|全卷|注意事项|测试范围|难度系数)$/.test(wqClean(tg));
    });
    if (!it.tags.length && it.point) it.tags = [it.point];
    /* 次知识点并入标签：主知识点在「知识点」列，次知识点在这里，都可检索可筛选。
       同时记下「是我们自动写进去的」，老师之后在预览里改知识点时才撤得干净。 */
    (it.kpAlts || []).forEach(function (a) {
      if (it.tags.indexOf(a) < 0) { it.tags.push(a); it.kpAdded = (it.kpAdded || []).concat([a]); }
    });
    if (!it.source) { var src = wqSource(it.stem); if (src) it.source = src.text; }
    /* 来源标注：题目自带「(24-25高一下·广东化州·期中)」这类标签 → 沿用；
       没有的话（比如大题下的 ①②③ 小问）继承文档顺序里上一题的标签；
       再没有才用整份卷子拼出来的标签。统一加在题干最前面。 */
    var _own = wqSrcTagOfStem(it.stem);
    if (_own) lastTag = _own;
    var _tg = _own || lastTag || srcTag;
    if (_tg) {
      if (!_own) it.stem = '(' + _tg + ')' + it.stem;
      it.source = '(' + _tg + ')';
    }
    /* 没有更具体的「[年份·卷]」来源时，用试卷标题作为来源 */
    if (!it.source && paperTitle) it.source = paperTitle;
    /* 分值 / 空数：来自「（每空2分，共14分）」，顺便校验空数对不对 */
    if (it._score && !it.score) it.score = it._score;
    it.subs = it._subs || 0;
    it.blanks = wqCountBlanks(it.stem + '\n' + it.options);
    if (it._want && it.blanks && it.blanks !== it._want) it.blankWarn = it._want;
    delete it._act;
    delete it._auto;
    delete it._score; delete it._per; delete it._want; delete it._subs; delete it._subQ;
  });
  /* 整段只有一个读不出来的公式时会剩下一道空题：丢掉 */
  items = items.filter(function (it) {
    return String(it.stem || '').trim() || String(it.options || '').trim() ||
      (it.imgs || []).length || (it.tables || []).length;
  });

  /* 跨字段去重：同一道题里同一张图 / 表格的占位符如果同时出现在答案和解析里，
     渲染时会被重复展示，这里按 stem → options → answer → analysis 顺序只留首次出现 */
  wqDedupCrossField(items);

  /* 总题数校验：卷首常写「本题共16个小题」「共4题」「共X道大题」，据此核对输出题数。
     把各段标注的题数相加与识别结果比较（一道大题 + 若干选择小题 = 总题数，分卷标注时相加才对得上） */
  var totalSum = 0, totalParts = [];
  lines.forEach(function (ln) {
    /* 「共计10小题」「本题包括5小题」「共 5 题」都要算进来，
       只认「共N题」的话，分组标题里的题数会被漏掉，核对结果就对不上 */
    var all = String(ln.t || '').match(/(?:共计?|包括|含)\s*(\d{1,3})\s*(?:个|道)?\s*(?:小)?\s*题/g) || [];
    all.forEach(function (mm) {
      var num = +(/(\d{1,3})/.exec(mm)[1]);
      if (num > 0) { totalSum += num; totalParts.push(num); }
    });
  });
  var totalNote = '';
  if (totalParts.length) {
    if (totalSum !== items.length) {
      totalNote = '卷首标注题数：' + totalParts.join(' + ') + ' = ' + totalSum + ' 题；本次识别 ' + items.length +
        ' 题。两者不一致，请检查是否存在漏题、或题目被错误拆分/合并。';
    } else {
      totalNote = '题数核对通过：卷首标注 ' + totalSum + ' 题，本次识别 ' + items.length + ' 题。';
    }
  }
  items.__totalNote = totalNote;

  return items;
}

/* 把题目里引用的图片按编号挂到 it.imgs（纯函数，便于单独测试） */
function wqAttachImgs(items, pool) {
  var byN = {};
  (pool || []).forEach(function (p) { byN[p.n] = p; });
  (items || []).forEach(function (it) {
    var seen = {};
    String([it.stem, it.options, it.answer, it.analysis, wqTblText(it)].join('\n')).replace(/⟦图(\d+)⟧/g, function (m, d) {
      seen[+d] = 1; return m;
    });
    it.imgs = Object.keys(seen).map(Number).sort(function (a, b) { return a - b; })
      .map(function (n) {
        if (!byN[n]) return null;
        return {
          n: n, uri: byN[n].uri, w: byN[n].w || 0, h: byN[n].h || 0,
          dispW: num(byN[n].dispW) || 0, dispH: num(byN[n].dispH) || 0,
          block: byN[n].block
        };
      })
      .filter(Boolean);
  });
  return items;
}

/* 题目的表格单元格里的全部文字（用来找单元格里引用的图片） */
function wqTblText(it) {
  var s = '';
  (it && it.tables || []).forEach(function (t) {
    (t.rows || []).forEach(function (r) {
      (r || []).forEach(function (c) { if (c && c.t) s += '\n' + c.t; });
    });
  });
  return s;
}

/* 选项放在表格里的选择题（表格首列是 A、B、C、D…），判据：
     · 题干末尾带着作答括号（选择题的典型写法）
     · 题干引用的第一张表里，首列收集到的字母正好是 A 起的连续序列，且覆盖绝大部分行
   表头行（如「选项 | 方程式 | 结论」）不参与判断，天然跳过 */
function wqTblLooksLikeOptions(it) {
  var t = (it.tables || [])[0];
  if (!t || !t.rows || t.rows.length < 3 || t.rows.length > 11) return false;
  var stemNoMark = String(it.stem || '').replace(/⟦[图表]\d+⟧/g, '').trim();
  if (!/[（(]\s{0,6}[）)]$/.test(stemNoMark)) return false;
  var letters = [];
  t.rows.forEach(function (r) {
    var s = String((((r || [])[0]) || {}).t || '').trim();
    if (/^[A-H]$/.test(s)) letters.push(s);
  });
  if (letters.length < 2 || letters.length < t.rows.length - 2) return false;
  for (var i = 0; i < letters.length; i++) {
    if (letters[i].charCodeAt(0) - 65 !== i) return false;
  }
  return true;
}

/* 「A．A / B．B / C．C / D．D」这种只有字母、没有任何内容的"选项"：
   卷面上是作答栏的占位（真正的选项在表格里，首列就是 A/B/C/D）。
   留着它只会让人误以为选项没导入成功，而且组卷 / 导出 Word 会输出一串无意义的「A．A」。 */
function wqOptsEmptyStub(s) {
  var lines = String(s || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
  if (lines.length < 2) return false;
  for (var i = 0; i < lines.length; i++) {
    if (!/^([A-Ha-h])\s*[.．、)）]\s*\1$/.test(lines[i])) return false;
  }
  return true;
}
/* 把题目里引用的表格按编号挂到 it.tables（与图片同一套 ⟦图N⟧ / ⟦表N⟧ 机制） */
function wqAttachTbls(items, paras) {
  var byN = {};
  (paras || []).forEach(function (p) {
    if (!p || !p.tblData) return;
    var m = /⟦表(\d+)⟧/.exec(p.text || '');
    if (m) byN[+m[1]] = p.tblData;
  });
  (items || []).forEach(function (it) {
    var seen = {};
    String([it.stem, it.options, it.answer, it.analysis].join('\n'))
      .replace(/⟦表(\d+)⟧/g, function (m, d) { seen[+d] = 1; return m; });
    it.tables = Object.keys(seen).map(Number).sort(function (a, b) { return a - b; })
      .map(function (n) {
        var t = byN[n];
        return t ? { n: n, rows: t.rows } : null;
      })
      .filter(Boolean);
  });
  /* 选项在表格里的题（首列是 A/B/C/D）补判成选择题，并把题干末尾括号归一成标准写法 */
  (items || []).forEach(function (it) {
    /* 选项是「A．A / B．B / C．C / D．D」这种只有字母、没有内容的空壳：
       真正的选项在这道题挂的表格里（首列是 A/B/C/D，或选项文字/图片就在单元格里）。
       空壳留着只会让人以为「选择题没导入成功」，组卷和导出 Word 还会输出一串无意义的「A．A」。 */
    if (wqOptsEmptyStub(it.options) && (it.tables || []).length) it.options = '';
    if (it.qtype === '选择题' || !wqTblLooksLikeOptions(it)) return;
    it.qtype = '选择题';
    it.stem = wqChoiceBlank(it.stem);
    it.blanks = wqCountBlanks(it.stem + '\n' + it.options);
  });
  return items;
}
